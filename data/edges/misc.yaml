# BinAtlas 关系边

- from: tech:malware-static-triage
  to: art:pe32
  kind: applies_to
  weight: 0.95
  rationale: PE32 是恶意样本研判的主力载体：DOS/NT 头、导入表、节区熵与资源段本身就是初判信号，加壳后这几处最先失真，正是研判要判断"哪些字段还可信"的地方。
- from: tech:executable-unpacking
  to: art:pe64
  kind: applies_to
  weight: 0.9
  rationale: 64 位样本的壳与 32 位同源但指针宽度不同，内联补丁与地址计算不能照搬 32 位经验，转储后的重定位修复必须按 PE32+ 的可选头与基址重来一遍。
- from: tool:capa
  to: art:pe-dotnet
  kind: applies_to
  weight: 0.7
  rationale: .NET 样本的真实逻辑在 CIL 与元数据表里，capa 能对托管程序集做能力匹配（API 组合落在 IL 层的调用点上），这是它对原生
    PE 能力的补充面。
- from: tool:ghidra
  to: art:elf64
  kind: applies_to
  weight: 0.8
  rationale: 大型 ELF64 是 Ghidra 的主场：处理器模块覆盖到位、headless 可批量加载，GOT/PLT 与重定位的自动解析能把间接调用还原成可读的交叉引用。
- from: tool:binary-ninja
  to: art:mach-o
  kind: applies_to
  weight: 0.7
  rationale: Mach-O 的段与加载命令结构在 Binary Ninja 里会被展开成可读布局，ObjC 元数据解析直接给出类与方法表，iOS 侧静态分析少一层手工还原。
- from: tool:burp-suite
  to: art:apk
  kind: applies_to
  weight: 0.6
  rationale: 移动应用的接口分析多数以 APK 为起点，先确认目标是否走系统信任链、有没有自带证书，再决定代理证书是否能被接受，这一步直接决定抓包能否成立。
- from: tool:unicorn
  to: art:shellcode
  kind: applies_to
  weight: 0.9
  rationale: Shellcode 没有文件格式也没有导入表，正需要一个只提供 CPU 语义的仿真器：给它分配一段内存、设好寄存器就能单步执行，API 解析逻辑由分析者自己打桩还原。
- from: tech:executable-unpacking
  to: art:shellcode
  kind: applies_to
  weight: 0.55
  rationale: 加壳样本最终常把 shellcode 释放进内存执行，脱壳的终点之一就是从内存里抠出这段位置无关代码，再交给仿真器或调试器单独分析。
- from: tech:behavioral-dynamic-analysis
  to: art:pe32
  kind: applies_to
  weight: 0.9
  rationale: PE32 样本在隔离环境里跑起来才会暴露持久化、提权与外联动作；静态看不到的延时触发与二次载荷下载，都靠这一类载体在运行时观察。
- from: tool:radare2
  to: art:firmware-image
  kind: applies_to
  weight: 0.65
  rationale: 固件镜像没有标准容器，r2 可直接把整包当原始二进制打开，用 magic 搜索与偏移跳转定位可疑段，不必先猜厂商封装格式；这正是它在嵌入式场景的价值。
- from: tool:qemu
  to: art:firmware-image
  kind: applies_to
  weight: 0.7
  rationale: 系统模式下 QEMU 能把固件镜像当整机启动，用来验证启动链与外设初始化到哪里断掉；这一步失败往往就是仿真卡死的起点，需要据输出逐个补桩。
- from: tool:aflpp
  to: art:firmware-image
  kind: applies_to
  weight: 0.65
  rationale: 无源码固件是 AFL++ QEMU 模式最典型的输入：解包出的服务二进制直接在其上做覆盖引导变异，不必先拿到可插桩的构建环境，这是嵌入式漏洞挖掘里最省前置条件的一条路。
- from: tool:volatility3
  to: art:memory-dump
  kind: applies_to
  weight: 0.95
  rationale: 内存镜像没有格式信息，符号与结构全靠按特征重新定位；Volatility 靠目标系统的符号表（ISF）重建进程与模块结构，符号不匹配时多数插件直接失效。
- from: tech:behavioral-dynamic-analysis
  to: art:memory-dump
  kind: applies_to
  weight: 0.7
  rationale: 样本退出或被反调试终止后，内存镜像里仍留着已解密的代码段、注入痕迹与凭据残留，是"运行结束后"这段观察唯一还可取证的对象。
- from: tool:wireshark
  to: art:pcap
  kind: applies_to
  weight: 0.95
  rationale: pcap 是唯一能还原协议字段边界的证据形态：流重组、显示过滤器与 TLS 解密把行为串成会话，加密流量下至少还剩连接时序与 SNI 一类元数据可用。
- from: tech:malware-static-triage
  to: art:document
  kind: applies_to
  weight: 0.8
  rationale: 带主动内容的文档本体是结构化容器而非可执行文件，研判要看的是自动执行触发链与外联行为，所以分析路径与 PE 完全不同，不能按文件头结构套。
- from: tool:cyberchef
  to: art:script
  kind: applies_to
  weight: 0.75
  rationale: 脚本样本的可执行内容就是源文本，混淆手段集中在编码与拼接套娃上；CyberChef 的操作链正好逐层剥开，并把还原步骤固化成可复现的交付物。
- from: tech:detection-signature-authoring
  to: art:document
  kind: applies_to
  weight: 0.6
  rationale: 文档类威胁的特征不能只看宏代码文本，还要约束容器结构（OLE 流名、嵌入对象与触发关系），否则规则会被正常的带宏文档大面积误报。
