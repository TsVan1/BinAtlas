# BinAtlas 关系边

- from: tech:malware-static-triage
  to: tool:detect-it-easy
  kind: uses
  weight: 0.95
  rationale: 样本到手第一问是"加没加壳、什么编译器写的"，DIE 用签名库直接给出壳与语言判定并附带节区熵，这个结论决定后续静态信号是否还值得信，是研判流程的入口判别器。
- from: tech:malware-static-triage
  to: tool:capa
  kind: uses
  weight: 0.9
  rationale: 逐条读汇编数能力太慢，capa 用 API 组合与字符串规则把样本映射成"具备进程注入、持久化、反调试"一类高层能力标签，直接产出可复核的能力清单与家族线索。
- from: tech:malware-static-triage
  to: tool:cyberchef
  kind: uses
  weight: 0.7
  rationale: 脚本与文档样本的可疑片段常是 Base64/异或/压缩多层套娃，CyberChef 把变换拖成操作链边看中间产物边试，能在不写临时脚本的前提下剥开混淆层级并固化成可交付的解密链。
- from: tech:malware-static-triage
  to: tool:yara
  kind: uses
  weight: 0.6
  rationale: 研判结论要与历史样本比对才能出家族线索，用 YARA 规则扫样本库是最直接的方式；反过来，研判产出的稳定字节串也在这一步被写成初版规则供批扫验证。
- from: tech:behavioral-dynamic-analysis
  to: tool:x64dbg
  kind: uses
  weight: 0.85
  rationale: 样本行为要能停下来看：x64dbg 在主进程里设条件断点、观察内存布局与调用栈，边跑边验证"这一步到底改了什么"，是行为时序与持久化动作逐条确认的操作台。
- from: tech:behavioral-dynamic-analysis
  to: tool:wireshark
  kind: uses
  weight: 0.9
  rationale: 网络行为是动态分析最硬的证据，Wireshark/tshark 把抓包展开到协议字段层，给出 C2 域名、心跳间隔与上传内容，加密流量下至少还能拿到连接时序与
    SNI，用来产出网络 IOC。
- from: tech:behavioral-dynamic-analysis
  to: tool:volatility3
  kind: uses
  weight: 0.7
  rationale: 样本退出后内存里的进程、模块与网络连接结构是唯一还留着的现场，Volatility 3 从内存镜像重建这些结构，能捞出注入痕迹与已解密的载荷，补上"运行结束后"这一段观察。
- from: tech:behavioral-dynamic-analysis
  to: tool:windbg
  kind: uses
  weight: 0.55
  rationale: 样本是驱动或带内核组件的加载器时，用户态调试器根本看不到其行为：WinDbg 能下内核断点、看驱动对象与回调注册，把 rootkit 类样本的挂钩动作纳入行为记录。
- from: tech:behavioral-dynamic-analysis
  to: tool:frida
  kind: uses
  weight: 0.7
  rationale: 需要在不重打包的前提下挂钩样本的 API 调用并打印真实参数时，Frida 的进程内注入比反复重启调试器轻得多，特别适合记录解密函数与网络库的入参出参。
- from: tech:executable-unpacking
  to: tool:x64dbg
  kind: uses
  weight: 0.9
  rationale: 脱壳的核心动作是在壳的自解密循环结束后定位原始入口点并转储进程内存，x64dbg 的硬件断点、内存断点与自带转储能一次性完成"停住→dump→修
    IAT"这套操作。
- from: tech:executable-unpacking
  to: tool:detect-it-easy
  kind: uses
  weight: 0.65
  rationale: 脱壳路径取决于壳的类型：先用 DIE 判定是 UPX 这类一键脱的、还是自研壳或虚拟化壳，再决定走自动脱壳、手工找 OEP 还是直接放弃静态路线，判定错了后面全是白工。
- from: tech:executable-unpacking
  to: tool:ida-pro
  kind: uses
  weight: 0.55
  rationale: 自研壳的跳转常被花指令与间接寻址打散，先在 IDA 里静态跟出解压循环与 OEP 候选点，再回调试器下断点，比纯动态逐指令试探省数倍时间。
- from: tech:executable-unpacking
  to: tool:unicorn
  kind: uses
  weight: 0.6
  rationale: 只做解密的壳不必把整个样本跑起来：把解密循环那段机器码抠进 Unicorn 裸执行，精确控制每步寄存器与内存，可安全地批量试出密钥与明文段，绕开反调试与环境检测。
- from: tech:executable-unpacking
  to: tool:angr
  kind: uses
  weight: 0.45
  rationale: 自研壳若把密钥藏在无系统调用的纯算术校验里，符号执行可把密文段当符号变量反推密钥与明文段，省掉逐指令单步。成立条件苛刻——循环复杂或一碰系统调用就算不动，因此只作辅助路径。
- from: tech:detection-signature-authoring
  to: tool:yara
  kind: uses
  weight: 0.95
  rationale: 把分析结论固化成可批量扫描的特征，落点就是 YARA 规则：字节串、节区约束与条件组合写成一个文件即可扫磁盘文件、进程内存与流量载荷，是这类交付物的标准载体。
- from: tech:detection-signature-authoring
  to: tool:capa
  kind: uses
  weight: 0.55
  rationale: 行为级特征比字节串更耐版本更新，capa 的规则以 YARA 语法描述 API 组合，可直接作为"写行为特征"的模板与回归工具：新规则写完用良性与同族样本跑一遍命中差异。
- from: tech:malware-family-attribution
  to: tool:capa
  kind: uses
  weight: 0.65
  rationale: 家族聚类需要一个稳定的能力指纹，capa 输出的能力标签不随壳与编译差异剧烈波动，把批量样本的能力集合做相似度比对，比直接比字节串更能扛住版本更新。
- from: tech:malware-family-attribution
  to: tool:yara
  kind: uses
  weight: 0.6
  rationale: 同源证据要用规则双向验证：先用候选家族共享的字节串写 YARA 扫全样本库，看命中集是否与聚类结果一致；命中分散往往说明特征是通用库代码而非家族指纹，这正是"相似不等于同源"的检验手段。
