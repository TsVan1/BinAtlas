# BinAtlas 知识库 · 技术 · dom:re-decompile
# 规范：03-DATA-SCHEMA.md §2.2

- id: tech:decompiler-output-validation
  name: 反编译结果可信度校验
  name_en: Decompiler Output Validation
  domain:
  - dom:re-decompile
  parent: dom:re-decompile
  def: 把伪代码当假设而非事实，逐条用汇编、运行数据与行为回证。难点是反编译器会为对齐而虚构类型与参数，错误输出看起来同样自洽。
  detail: 场景是拿到伪代码后先当假设而不是结论：要判断一段类型、参数或分支到底是不是编译器为对齐而虚构的，以及某条结论能否写进报告。与类型与结构体还原的区别是那里负责建出类型，这里负责判断建出来的类型是否为幻觉；与控制流结构化折叠的区别是那里产出可读视图，这里给该视图定可信度。注意点：伪代码形态随优化级别剧烈变化，-O2
    起大量变量被复用以至同一变量名对应多个语义；实验性反编译器对复杂函数会退化成一串
    goto，这种输出不能用作证据；整数溢出与越界读写属于未定义行为，不同反编译器会给出互相矛盾的推断，只能以真实执行结果为准。
  principle: 反编译是从指令到高级结构的单向近似：类型宽度、变量复用、分支合并这三类重建都由启发式打分选择，错误输出与正确输出在形态上同样自洽，所以无法用伪代码自身验证伪代码。可用的独立证据只有两类，指令字节与真实执行结果——前者就是最终产物本身，不受推断影响；后者反映实际行为路径。两套反编译器结论一致也不构成证明：它们共用相似的编译器
    idiom 识别库，同一处误解会系统性地重复出现，一致性只降低偶发错误概率，不排除共因错误。
  difficulty: 3
  prerequisites:
  - tech:function-boundary-identification
  - tech:compiler-provenance-identification
  artifacts:
  - art:pe64
  - art:elf64
  - art:mach-o
  - art:pe-dotnet
  outputs:
  - 待验证假设清单
  - 伪代码与汇编的差异点
  - 已回证与已推翻的结论表
  - 结论可信度分级
  cost: medium
  false_positive_risk: high
  commands:
  - cmd: radare2 -q -c "aaa; pdc @ sym.main" {{binary}}
    note: 换另一套反编译器交叉对比同一函数，不一致处就是必须回证的疑点
  - cmd: objdump -d {{binary}}
    note: 伪代码与指令对不上时，以指令为准重读该段
  - cmd: r2 -q -c "aaa; pdf @ sym.main" {{binary}}
    note: 反汇编视图保留真实宽度与偏移，用来核对伪代码推断的类型宽度
  procedure:
  - 先用 radare2 -q -c "aaa; pdc @ sym.main" 出一版伪代码，同时取同一函数的指令清单，两份材料按地址对齐再往下读。
  - 对每处可疑类型逐条回到 objdump 与 pdf 指令视图核对访存宽度与固定偏移，不以伪代码标注的类型为准。
  - 记录伪代码与指令在分支数、循环次数、参数个数上的差异，形成疑点清单而不是结论清单。
  - 换另一套反编译器复跑同一函数，只把不一致处升级为必证项，一致处也不直接采信。
  - 对每个疑点在运行环境中实测一次，观察寄存器与内存的真实值，能回证的标已回证，矛盾的标已推翻。
  - 按证据强度分级：指令可见、运行可见、仅推断，仅推断项不得写入最终报告。
  pitfalls:
  - 反编译器的类型是推断出来的，指针与整数可互换显示，别拿类型当真
  - 两套反编译器结论一致也可能同错，一致性不等于正确性
  - 优化后的伪代码会把两个分支合成一行三元表达式，看起来像单一逻辑
  - 变量名是自动生成，不能作为语义依据
- id: tech:calling-convention-recovery
  name: 调用约定与参数还原
  name_en: Calling Convention Recovery
  domain:
  - dom:re-decompile
  parent: dom:re-decompile
  def: 由调用点与被调点的寄存器与栈使用反推参数顺序、个数与返回值位置。难点是同一函数可能被不同约定调用，可变参数又让参数个数不固定。
  detail: 场景是要给函数签名、写 hook
    或跨模块追参数时，先确定参数如何传、返回值放在哪、谁清理栈。与栈帧还原的区别是那里关心局部变量与帧大小，这里只关心参数与返回值的传递通道；与类型还原的区别是这里先定通道再定类型。注意点：x86-64
    SysV 前六个整数参数走 rdi/rsi/rdx/rcx/r8/r9，浮点走 xmm 且独立计数；Win64 只用四个寄存器并强制调用者预留 32
    字节影子空间，把影子空间数成参数是最高频错误；32 位 cdecl 由调用者 add esp,N 清栈，stdcall 由被调者 ret N
    清栈，混判会让后续所有栈偏移整体错位；优化后参数可能直接进寄存器使用而不落栈。
  principle: 调用约定是 ABI 契约，编译器必须让调用点与被调点对同一份契约做镜像实现，这正是恢复的依据：栈清理的字节数只出现一次，cdecl 在调用点表现为 add
    esp,N，stdcall 在被调点表现为 ret N，两端的 N
    必须相等，量到它就等于量到参数总字节数。寄存器约定下没有栈清理可看，改看调用前被写入、且在函数入口处被最先读取的那组寄存器。证据的弱点也来自同一处：契约两端只要一端被优化掉，例如尾调用、内联或跨模块调用，就只剩单侧证据，此时结论只能标为待定。
  difficulty: 3
  prerequisites:
  - tech:decompiler-output-validation
  - tech:stack-frame-recovery
  artifacts:
  - art:pe64
  - art:elf64
  - art:elf32
  - art:mach-o
  outputs:
  - 函数签名与参数顺序
  - 返回值与寄存器占用约定
  - 可变参数函数识别结论
  - 调用点与被调点不一致的问题清单
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: objdump -d --no-show-raw-insn {{binary}}
    note: 看调用前后寄存器装载与栈清理方向，判断约定与参数个数
  - cmd: gdb -q -batch -ex "break *main" -ex "run" -ex "info registers rdi rsi rdx"
      {{binary}}
    note: 在真实调用点读参数寄存器，比静态猜更可靠
  - cmd: r2 -q -c "aaa; afcf @ sym.imp.printf" {{binary}}
    note: 让工具推断某函数的调用约定作为参照，仍需人工核对
  procedure:
  - 先用 objdump -d --no-show-raw-insn 定位调用点，读出 call 之前写入了哪几个寄存器、压了哪些栈参数。
  - 再到被调函数尾部看栈清理形态是 add esp,N 还是带立即数的 ret N，据此判定由调用者还是被调者清栈。
  - 用 gdb 断在调用点后执行 info registers rdi rsi rdx，把真实参数值与静态推断逐个对照。
  - 用 r2 的 afcf 取工具推断的约定作参照，只在与前述两端证据一致时采用。
  - 对可变参数函数核对寄存器保存区与向量参数计数，确认有没有少读或多读参数。
  - 每个函数把签名与证据等级一起记录，尾调用与跨模块无法两端核对的标为待定。
  pitfalls:
  - 64 位 Windows 的前四参数走寄存器且调用者分配影子空间，容易把影子空间数成参数
  - 可变参数函数用寄存器传向量参数个数，忽略这点会少读参数
  - 尾调用优化后调用点消失，按调用点统计参数会得到空集
  - 32 位约定里栈清理方不同，混判会让所有栈偏移错位
- id: tech:type-and-struct-recovery
  name: 类型与结构体还原
  name_en: Type & Struct Recovery
  domain:
  - dom:re-decompile
  parent: dom:re-decompile
  def: 由访问偏移与宽度推断聚合类型，重建结构体成员布局。难点是填充字节与柔性数组无法被直接观测，同一偏移在不同路径下形态还可能不一致。
  detail: 场景是重建自建的聚合类型：解析内存转储、复现协议结构、在反汇编器里建结构体定义，把固定的偏移访问变成有名字的字段。与调用约定还原的区别是那里定参数通道，这里定数据布局；与模板与容器识别的区别是那里识别布局已知的标准库容器，这里处理没有先例的自定义结构。注意点：对齐填充不产生任何访存，代码里永远看不到，只能按
    ABI 规则补；-O2
    会把相邻小成员合成一次宽访存，按单条指令判宽度会错；柔性数组与位域分别表现为尾部的不定长与移位加掩码；同一偏移在不同路径被写成不同形态，可能是联合体而非观察失误；有调试信息时以真实类型为准，无符号时一切推断都要标不确定。
  principle: 布局能从偏移反推，是因为成员偏移由声明顺序与对齐规则唯一决定：每个成员被放在向上对齐到自身对齐值的位置，编译器为它生成固定偏移、固定宽度的访存，所以按基址寄存器归集所有固定偏移访问就得到布局骨架。对齐填充既不产生访存也无法观测，只能按
    ABI
    规则补，这是推断而非证据。主要误差来自编译器的自由度：它可以把相邻成员合并成一次宽读，也可以用寄存器宽度掩盖真实宽度，因此必须读完整访存序列而不是单条指令；同一偏移出现多种形态，则说明该位置是联合体或存在类型双关。
  difficulty: 4
  prerequisites:
  - tech:stack-frame-recovery
  - tech:calling-convention-recovery
  artifacts:
  - art:pe64
  - art:elf64
  - art:so
  - art:pe-dotnet
  outputs:
  - 结构体成员偏移与宽度表
  - 填充与对齐推断
  - 聚合类型的使用点清单
  - 类型不确定项标记
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: r2 -q -c "aaa; aft @ sym.main" {{binary}}
    note: 输出工具推断的类型与结构，作为初稿再逐项人工校正
  - cmd: objdump -d --no-show-raw-insn {{binary}}
    note: 逐个核对访存宽度与固定偏移，宽度错一位结论就全变
  - cmd: gdb -q -batch -ex "ptype struct" {{binary}}
    note: 有调试信息时直接拿真实类型对照，无符号则跳过
  procedure:
  - 先用 r2 的 aft 取工具推断的结构体与类型初稿，只当假设而不当结论。
  - 在指令清单里归集同一基址寄存器上的全部固定偏移访问，按偏移排序写成表。
  - 每条访问记录读写方向与宽度，宽度互相矛盾的偏移单独列出待查。
  - 按 ABI 对齐规则补上不产生访存的填充，得到候选布局。
  - 发现严格等差步长时判定为结构体数组而非重复成员，用步长反推元素大小。
  - 有调试信息时用 ptype 直接对照真实类型，无调试信息则跳过此步并标注。
  - 把访存已证实的成员与仅由对齐规则推出的成员分栏标记，后者不写进最终结论。
  pitfalls:
  - 用 4 字节读一个 8 字节字段的一半是常见误判，必须看完整访存序列
  - 结构体数组会被误认成结构体内的重复成员，步长是判别关键
  - 对齐填充不产生访存，永远看不到，只能按 ABI 规则补而不是按没访问就没有
  - 同一偏移在不同分支被解释成不同类型，可能是联合体或类型混淆，别强行统一
- id: tech:cxx-vtable-recovery
  name: C++ 虚表与虚调用还原
  name_en: C++ Vtable & Virtual Call Recovery
  domain:
  - dom:re-decompile
  parent: dom:re-decompile
  def: 定位虚表指针、还原虚函数顺序与继承层次，把间接调用还原成具体目标。难点是多继承与虚继承下虚表被拆成多段并附带偏移修正。
  detail: 场景是把 C++ 二进制里的间接调用还原成具体目标，并据此恢复继承层次与虚函数顺序，让 call rax
    变成有名字的调用。与类型与结构体还原的区别是那里看数据成员偏移，这里看只读段里的函数指针表与
    RTTI；与内联与尾调用识别的区别是那里判断某次调用是否还存在，这里判断间接调用能收敛到哪些目标。注意点：Itanium ABI 的虚表前两项是 offset-to-top 与
    typeinfo 指针，从第一项起算索引会整体偏移；MSVC 的表首项是 RTTI
    定位器，布局与前者不同，跨平台套用会全错；构造与析构过程中虚表指针会被改写成基类表；多继承下每个基类子对象各有虚表指针，thunk 负责 this
    调整；内联去虚拟化后看到直接调用，不代表没有虚函数。
  principle: 虚表能还原，是因为多态对象的头部被构造函数写入一个指向只读段函数指针数组的指针，同一个表地址会同时被两处引用：只读数据里的连续代码指针块，以及构造函数里对该地址的存储。两个独立信号重合，就唯一确定一个类的虚函数槽位顺序，不必运行程序。表头长度由
    ABI 固定，Itanium 是 offset-to-top 加 typeinfo（未剥离时 typeinfo 里带类名），MSVC
    是定位器指针，跳过表头才能正确编号。多继承下每个基类子对象有独立虚表指针，调整 this 的 thunk 带固定偏移，这正是按单一虚表还原会整体错位的原因。
  difficulty: 4
  prerequisites:
  - tech:type-and-struct-recovery
  artifacts:
  - art:elf64
  - art:pe64
  - art:so
  - art:mach-o
  outputs:
  - 虚表到函数的映射表
  - 类继承层次推断
  - 间接调用点的候选目标集
  - 多继承偏移修正说明
  cost: high
  false_positive_risk: medium
  commands:
  - cmd: readelf -S {{binary}}
    note: 先找只读数据段，虚表通常成组落在那里
  - cmd: objdump -s -j .rodata {{binary}}
    note: 直接看只读数据里的函数指针序列，识别连续的虚表块
  - cmd: r2 -q -c "aaa; axt @ 0x0" {{binary}}
    note: 反查引用虚表地址的构造点，构造函数里的写入可确认虚表归属
  procedure:
  - 先用 readelf -S 找出只读数据段的地址范围，虚表通常成组落在那里。
  - 再用 objdump -s -j .rodata 浏览该段，标记连续的代码指针序列作为候选虚表。
  - 用 r2 的 axt 在候选表地址上反查引用，定位写入它的构造函数。
  - 在构造函数里确认被写入的表地址与对象头部偏移，判定虚表归属并量出表头长度。
  - 跳过表头后从第一个真正的槽位开始编号，逐项记录槽位到函数的映射。
  - 逐个候选目标核对是否带 this 调整的 thunk，有则记下偏移修正。
  - 把每个间接调用点能收敛到单一目标的标为确定，多目标只给候选集并说明原因。
  pitfalls:
  - 多继承下第二条基类虚表前带指针偏移修正，按单一虚表还原会整体错位
  - 虚表首项常与析构或运行时信息相关，从第一项起算函数索引会偏移
  - 构造与析构过程中虚表指针会被改写，运行期读到的未必是最终虚表
  - 内联后虚调用可能被去虚拟化，看到直接调用不等于没有虚函数
- id: tech:template-and-stl-recognition
  name: 模板与容器特征识别
  name_en: Template & Container Recognition
  domain:
  - dom:re-decompile
  parent: dom:re-decompile
  def: 识别被展开成内联代码的标准库模板实例，把裸内存操作还原成容器语义。难点是实例化后类型信息全丢，只能靠分配、扩容与迭代模式辨认。
  detail: 场景是面对 C++
    二进制时把分配、逐元素搬移与指针三元组这类裸操作还原成容器语义，从而读懂数据流，判断某块内存到底是可增长数组、字符串还是有序映射。与类型与结构体还原的区别是那里推断自定义布局，这里匹配已知实现的形态特征；与内联与尾调用识别的区别是那里判断函数是否被展开，这里判断展开后的代码属于哪个模板实例。注意点：常见三家标准库实现的容器布局互不相同，三指针的字段顺序与小字符串阈值都不同，跨实现套用结论必错；小字符串优化让短串根本不碰堆，按必有分配去推会漏；异常消息与类型名残留是最省力的佐证，但只在未被剥离时存在。
  principle: 模板在编译期实例化，类型参数被擦除成固定宽度的元素指针，语义只剩下操作模式，而标准库实现的模式高度固定：三指针不变量让元素个数与容量都能由指针差算出，扩容必须是申请新块、逐元素搬移、释放旧块，新容量按固定倍数增长。这套序列在手写代码里没有出现的必要，因此是强相关特征，但不是唯一解释——手写动态数组同样维护三指针，仅凭布局认定标准容器会误判。小字符串优化则把对象内的一小段空间当缓冲区用，表现为尺寸小的串从不调用分配器，这既是看不到分配的原因，也是识别它的依据。
  difficulty: 4
  prerequisites:
  - tech:type-and-struct-recovery
  artifacts:
  - art:elf64
  - art:pe64
  - art:so
  - art:elf32
  outputs:
  - 容器类型与元素类型推断
  - 迭代器与扩容逻辑标注
  - 模板实例与源码形态对照
  - 误判风险说明
  cost: high
  false_positive_risk: high
  commands:
  - cmd: nm -C {{binary}} | grep -Ei "std::|basic_string|vector"
    note: 未被完全内联的实例会带修饰名出现，先拿确凿的容器清单
  - cmd: objdump -d --no-show-raw-insn {{binary}}
    note: 核对三指针布局与容量倍增逻辑，这是容器最稳定的形态特征
  - cmd: strings -a {{binary}} | grep -Ei "basic_string|length_error"
    note: 异常消息与类型名残留可佐证模板实例存在
  procedure:
  - 先用 nm -C 配合 grep 过滤出未被内联的模板实例与异常类型名，取得确凿清单。
  - 对可疑对象在 objdump 的指令里找三个相邻指针字段的初始化，确认是否构成起始、结束、容量三元组。
  - 定位扩容路径，看到一次分配、逐元素搬移、一次释放且新容量为原容量倍数，才判定为可增长序列容器。
  - 检查小对象是否完全不经过分配器，是则说明存在对象内缓冲，按该实现的阈值解释其长度。
  - 用 strings -a 搜 basic_string 与 length_error 一类残留消息，与符号清单互相印证。
  - 手写数组与标准容器确实无法区分时，明确标注为高不确定，不写死类型名。
  pitfalls:
  - 三指针布局也出现在手写动态数组上，仅凭布局认定标准容器会误判
  - 短字符串优化让小块字符串不出现在堆上，按一定分配过去推必漏
  - 不同标准库实现布局不同，跨平台套用同一结论会错
  - 内联后容器操作与业务逻辑混杂，边界靠猜，必须标注为高不确定
- id: tech:control-flow-structuring
  name: 控制流结构化折叠
  name_en: Control Flow Structuring
  domain:
  - dom:re-decompile
  parent: dom:re-decompile
  def: 把基本块图折叠成条件与循环等高级结构，恢复可读的控制逻辑。难点是不可归约图与混淆产生的多入口区域无法用单层结构表达。
  detail: 场景是把基本块图折叠成条件与循环这类可读结构，得到能给人看的伪代码，它也是后续一切语义阅读的入口。与控制流图还原的区别是那里只产出块与边，结构化负责把边折叠成语法；与反编译结果可信度校验的区别是那里判断输出是否为真，这里负责让输出读得懂。注意点：不可归约图，也就是存在多入口区间的跳转，无法用任何单层嵌套语法等价表达，工具只能插标签或复制代码；优化会把分支改成条件移动、把循环旋转成先判断后体、把稀疏的分派改成比较树，折叠结果与源码形态因此不是一一对应；.NET
    的 IL 自带结构化元数据，但 try 区间仍要从异常表读。
  principle: 结构化失败有确定的机制：折叠的前提是图可归约，即每个循环只有唯一入口、不存在多入口区间。编译器为共享尾块、错误处理与状态机生成的跳转会破坏这个前提，而 C
    系语言的单层嵌套语句无法等价表达不可归约图，工具于是退化成插入标签或复制代码，产出语法通过但语义不等价的伪代码。另一半原因在优化：条件移动把分支变成无分支代码，循环旋转改变判断位置，跳转表把多路比较变成一次查表，语法结构与源码结构因此不再同构，折叠结果必须回到控制流图与指令层核对后才能采信。
  difficulty: 4
  prerequisites:
  - tech:control-flow-graph-recovery
  artifacts:
  - art:pe64
  - art:elf64
  - art:mach-o
  - art:pe-dotnet
  outputs:
  - 结构化后的伪代码
  - 无法结构化的区块清单
  - 循环类型与退出条件
  - 与原始控制流图的一致性核对
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: radare2 -q -c "aaa; pdc @ sym.main" {{binary}}
    note: 拿一版结构化输出，重点看它把哪些区域退化成无条件跳转
  - cmd: r2 -q -c "aaa; agfj @ sym.main" {{binary}}
    note: 与控制流图对照，跳转密集处往往就是不可归约区
  - cmd: objdump -d --no-show-raw-insn {{binary}}
    note: 对折叠结果有疑问时回落指令层确认跳转方向
  procedure:
  - 先用 r2 的 agfj 取控制流图，记下回边、多入口区域与跳转密集的块。
  - 再用 radare2 的 pdc 拿结构化结果，逐段对照控制流图看回边是否被折成循环。
  - 标出被工具退化成无条件跳转或标签的区域，这些就是不可归约区。
  - 对每个可疑分支回到 objdump 读跳转条件与方向，确认折叠出的分支数是否正确。
  - 发现循环多出一个前置判断时，先按循环旋转解释，不要当成源码里的双分支。
  - 确认分派形态：密集连续值是跳转表，稀疏值是比较树，两者语义相同但折叠结果不同。
  - 把无法结构化的区块单列清单，附原始指令地址范围与理由。
  pitfalls:
  - 控制流平坦化的分发循环折叠后看起来像多分支语句，认错会让整段语义全错
  - 不可归约图强行结构化会产生语法通过但语义不等价的伪代码
  - 编译器做的循环旋转会多出一个前置判断，不代表源码里是两个分支
  - 结构化工具对间接跳转的保守处理会凭空插入跳转标签，块越多越明显
- id: tech:exception-recovery
  name: 异常处理结构还原
  name_en: Exception Handling Recovery
  domain:
  - dom:re-decompile
  parent: dom:re-decompile
  def: 还原捕获与清理路径：定位异常表、识别落地块与栈展开逻辑。难点是异常表在部分二进制里被剥离，只剩调用约定与清理代码可循。
  detail: 场景是还原捕获与清理路径：某个抛出点会被谁捕获、哪些析构先跑、崩溃时的栈展开按什么规则走。与控制流结构化折叠的区别是异常边不进入普通的块图折叠，必须另读异常表；与内联与尾调用识别的区别是那里修正调用关系，这里修正非局部的控制转移。注意点：Itanium
    ABI 用展开帧与语言相关的异常表描述 try 区间、落地块与可捕获类型，Windows x64
    用函数表记录展开信息，两者格式完全不同；关闭异常或部分剥离会让表不存在；表被剥离后，没有异常与表被删除在静态上不可区分，只能靠运行时调用的痕迹给替代判据；多个捕获块按顺序匹配，静态看到的顺序未必是生效顺序。
  principle: 异常路径能还原，靠的是 ABI 的查表设计：抛出点不知道谁会捕获，因此编译器必须把 try
    区间、落地块偏移与可捕获类型写进与代码并行的元数据，栈展开器查表后才知道跳到哪、先跑哪些析构。这套表是编译器产物而非推断，读它就等于读真实语义，所以比从控制流猜可靠得多。表被剥离后仍留下两类硬痕迹：抛出之后调用图必须连到某个捕获入口，落地块内必然出现开始捕获与清理调用。但缺失的表与从未存在的表无法区分，所以这时的结论只能用替代判据表达，不能当作已证。
  difficulty: 4
  prerequisites:
  - tech:control-flow-structuring
  artifacts:
  - art:pe64
  - art:elf64
  - art:mach-o
  - art:so
  outputs:
  - 异常处理表与捕获范围
  - 清理路径与析构调用点
  - 异常类型到处理块的映射
  - 表缺失时的替代判据
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: readelf --debug-dump=frames {{binary}}
    note: 从异常帧信息拿栈展开规则，异常路径多半与之一致
  - cmd: objdump -d {{binary}} | grep -nE "__cxa_(throw|begin_catch|end_catch)"
    note: 运行时调用点是异常块最硬的证据，比猜控制流可靠
  - cmd: r2 -q -c "aaa; afl~personality" {{binary}}
    note: 查个性化处理函数相关符号，辅助定位异常表
  procedure:
  - 先用 readelf --debug-dump=frames 确认存在展开信息并读出规则，没有则转查运行时调用点。
  - 在 objdump 的输出里过滤抛出、开始捕获、结束捕获这三个运行时函数，标出所有抛出点与捕获点。
  - 从每个开始捕获所在块反推处理块边界，把其覆盖的 try 区间划出来。
  - 检查处理块内是否同时存在析构调用，确认清理路径确实在展开途中执行。
  - 表存在时读取捕获类型与区间偏移，与静态划出的区间逐条比对。
  - 用个性例程相关符号辅助定位异常表，表缺失时作为旁证。
  - 表缺失且无法交叉印证时，把未观察到与确实没有分开记录，不合并成结论。
  pitfalls:
  - 异常表被剥离后，没有异常与表被删除这两件事无法从静态区分
  - 析构清理路径与正常返回路径共享尾部代码，按单一出口统计会漏路径
  - 是否生成展开表受编译选项影响，同一源码不同选项结果不同
  - 多个捕获块按顺序匹配，静态看到的顺序未必是生效顺序
- id: tech:inline-and-tailcall-recognition
  name: 内联与尾调用识别
  name_en: Inline & Tail Call Recognition
  domain:
  - dom:re-decompile
  parent: dom:re-decompile
  def: 辨认被展开进调用者的函数体与被改写成跳转的尾调用，还原真实调用关系。难点是内联后原函数可能完全消失，调用图直接缺节点。
  detail: 场景是修正调用图，判断某段逻辑到底是被内联掉了还是真的不存在，以及把一个跳转认成函数入口是否会造成并不存在的边。与函数边界识别的区别是那里负责切出函数，这里负责判断切出来的边哪些不属于真实调用；与模板识别的区别是那里判断代码属于哪个模板实例，这里判断代码属于哪个函数。注意点：高优化与链接期优化会大规模内联，静态链接的小函数可能完全消失；尾调用把调用加返回压成一条跳转，指令层与普通跳转不可区分，只能靠上下文；同一段代码在多个调用点重复出现，按地址聚类会切出多个假函数；符号表缺失也可能是剥离造成的，不能单独作为内联证据。
  principle: 内联与尾调用是同一类优化的两面，机制都来自栈帧与返回值不再需要。尾调用时被调者的返回值就是调用者的返回值，调用者不必保留自己的栈帧，编译器先恢复栈与寄存器再把调用加返回折叠成一条跳转，所以它在指令形态上等同普通跳转，唯一区别在上下文：前面出现了本函数的尾声还原，目标是另一个函数的入口。内联则把被调者函数体复制进调用点再做常量折叠，原函数可能被彻底删除，符号与地址一起消失。因此单看符号缺失无法区分内联、死代码删除与剥离，必须有调用图缺边与同构代码块这两个独立信号同时成立。
  difficulty: 4
  prerequisites:
  - tech:function-boundary-identification
  - tech:control-flow-structuring
  artifacts:
  - art:pe64
  - art:elf64
  - art:so
  - art:mach-o
  outputs:
  - 内联点与推断的被内联函数
  - 修正后的调用关系图
  - 疑似消失的函数清单
  - 与符号表的对照结果
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: nm -C {{binary}}
    note: 被完全内联的函数不留符号，符号缺失与调用图缺失交叉验证才构成证据
  - cmd: objdump -d --no-show-raw-insn {{binary}}
    note: 尾调用表现为先清栈再跳转，与普通调用后返回的形态不同
  - cmd: r2 -q -c "aaa; afo @ sym.main" {{binary}}
    note: 看工具列出的调用与跳转关系，其中相当一部分跳转是尾调用
  procedure:
  - 先用 nm -C 列出全部符号，把缺失但被字符串或文档提及的函数名列为候选。
  - 在指令层看可疑调用点是否有先做栈还原再直接跳转的形态，有则记为尾调用而非新入口。
  - 用 r2 的 afo 列出工具给出的调用与跳转关系，逐条复核其中哪些跳转其实是尾调用。
  - 定位函数体内重复出现的同构指令块，若多处出现且引用不同常量，判定为内联副本。
  - 符号缺失、调用图缺边、同构代码块三者同时成立的项才记为已内联。
  - 修正调用图后重跑同一组命令，确认没有把尾调用重复计入入口。
  pitfalls:
  - 把尾调用当成独立函数入口，会给调用图补出一条并不存在的边
  - 内联后同一段代码在多个调用点重复出现，按地址聚类会误判成多个函数
  - 静态链接的小函数大量内联，符号表为空不代表这些逻辑不存在
  - 尾调用与普通跳转在指令层完全一样，只能靠上下文区分
