# BinAtlas 知识库 · 技术 · dom:re-protocol
# 规范：03-DATA-SCHEMA.md §2.2

- id: tech:traffic-session-reassembly
  name: 流量会话重组
  name_en: Traffic Session Reassembly
  domain:
  - dom:re-protocol
  parent: dom:re-protocol
  def: 把抓包还原成双向会话与消息序列，为字段分析准备干净输入。难点是分片、重传与长连接并发会让消息边界无法从包边界直接读出。
  detail: 场景是拿到 pcap 后的第一件事：把包还原成双向会话与消息序列，之后无论字段推断还是状态机归纳都在这个干净输入上做。与协议字段边界推断的区别是这里只管边界与配对、不判语义；与协议状态机还原的区别是那条要的正是顺序信息，本条先把连接与消息切对。注意点：抓包时 snaplen 被截断会让长包只剩头部，重组出的载荷缺尾，字段长度立刻对不上；抓包点若在 NAT 或负载均衡之前，同一逻辑会话会散在多条连接里；tshark 的 follow 模式要按流号挑，流号错一位就拼出另一条会话的字节。
  principle: 重组之所以成立，是因为 TCP 对应用层只是字节流、本身不含消息边界，但它给了序号这把尺子：同一方向的每个字节都带 seq，乱序由接收方按 seq 重排，重传与重发的片段与已见区间重叠，按 seq 去重再把区间拼起来，得到的字节序与抓包时刻、抓包顺序都无关。消息边界则来自上层自描述：长度字段或记录头一旦找到，就能从流里切出整条消息，而这条消息可能横跨多个段、甚至跨多个包。这也是为什么判顺序只看 seq 不看时间戳——时间序会被乱序与重传打乱，seq 不会。
  difficulty: 2
  prerequisites:
  - tech:binary-triage-metadata
  artifacts:
  - art:pcap
  - art:elf64
  - art:apk
  outputs:
  - 双向会话清单与消息序列
  - 按连接切分的原始载荷
  - 重传与分片等异常流量清单
  - 待深挖的会话列表
  cost: low
  false_positive_risk: low
  commands:
  - cmd: tshark -r {{pcap}} -q -z io,phs
    note: 先看协议层次统计，判断哪种协议承载了业务流量
  - cmd: tshark -r {{pcap}} -q -z follow,tcp,raw,0
    note: 按流向拼出完整会话载荷，比逐包读更有用
  - cmd: tcpdump -r {{pcap}} -nn -X -c 20
    note: 抽前若干包看十六进制形态，快速判断文本还是二进制协议
  - cmd: rabin2 -zz {{binary}} | grep -Ei "content-type|application/json" | head
    note: 在客户端里找协议关键字，先确认接口的编码形态再谈重组
  procedure:
  - 先用 tshark -r {{pcap}} -q -z io,phs 看协议层次统计，确认业务流量落在哪种协议上，别急着拆包。
  - 对承载业务的连接，用 tshark -r {{pcap}} -q -z follow,tcp,raw,N 按流号 N 导出双向原始载荷，得到候选会话。
  - 若载荷形态不明，用 tcpdump -r {{pcap}} -nn -X -c 20 抽前若干包看十六进制，先判文本还是二进制协议。
  - 在客户端里用 rabin2 -zz {{binary}} 搜 content-type、application/json 一类关键字，确认接口编码形态再定切分策略。
  - 按 seq 区间去重并拼装，把重传与分片造成的重复片段剔掉，核对拼接后的总长与各段长度之和一致。
  - 用长度字段或记录头切出消息，检查首条消息的尾字节是否正好对齐下一条的消息头。
  - 把连接清单、消息序列、异常流量（重传、分片、截断）三类结果落盘，作为后续步骤的输入。
  pitfalls:
  - 只看单个包会把跨包消息当成多次独立请求，字段边界全错
  - 长连接上并发多条请求，仅靠包顺序无法还原请求响应配对
  - 加密流量的载荷不可读，会话重组只能给出时序与长度
  - 重传与分片产生重复片段，直接拼接会插入重复字节
- id: tech:field-boundary-inference
  name: 协议字段边界推断
  name_en: Protocol Field Boundary Inference
  domain:
  - dom:re-protocol
  parent: dom:re-protocol
  def: 通过同类消息的差分与长度关联，推断未知协议的字段切分与语义。难点是可变长字段与填充使位置不固定，单条样本无法确定边界。
  detail: 场景是在已重组的明文载荷上，把一串字节切成有名字的字段，给出每个字段的偏移、长度来源与语义候选。与二进制序列化逆推的区别是那条先判框架与编码规则、再看字段编号，本条不预设任何框架，纯靠同类样本差分与长度关联；与加密参数还原的区别是本条只处理明文，载荷若不可读应先回去确认是否被加密或压缩。注意点：可变长字段一出现，它之后的所有偏移都会漂移，拿一条样本的固定偏移去套另一条必然错；定长填充区在不同版本长度可能不同；只有一条样本时不存在边界推断，至少要三条同结构样本才能排除巧合。
  principle: 有效的前提是结构在字节上可分：同一协议里长度字段决定后续偏移，一旦找到某个值恰好等于本帧剩余字节数、或等于到下一条记录固定签名之间的距离的字段，整帧就变成自描述的，可以自己算着往前走，不再依赖人工偏移表。差分则利用同类消息的公共骨架：把多条样本逐字节对齐，恒定处是结构与标签，变化处才是取值。固定偏移之所以不可靠，正是因为变长字段会把后面的一切整体右移，而长度字段本身把这个漂移量显式写在了报文里。
  difficulty: 4
  prerequisites:
  - tech:traffic-session-reassembly
  artifacts:
  - art:pcap
  - art:apk
  - art:elf64
  - art:so
  outputs:
  - 字段切分表与偏移
  - 各字段候选语义
  - 变长字段的长度来源
  - 未定边界区间说明
  cost: medium
  false_positive_risk: high
  note: 与既有 tech:network-traffic-interception 的边界：那条以拦截与证书固定绕过为主，字段推断只是其附带输出；本条专做明文载荷的字段切分与语义推断，不涉及拦截环境搭建。
  commands:
  - cmd: tshark -r {{pcap}} -T fields -e tcp.payload
    note: 只导载荷做批量对比，去掉包结构干扰
  - cmd: python3 -c "import sys;a=open(sys.argv[1],\"rb\").read();print([(i,hex(b))
      for i,b in enumerate(a[:64])])" {{out}}
    note: 把待比对载荷按字节展开，用于对齐多个样本找公共前缀
  - cmd: protoc --decode_raw < {{out}}
    note: 先验证是否属于已知序列化格式，能解析出字段号就有现成结构线索
  - cmd: rabin2 -zz {{binary}} | grep -Ei "malformed|too short|invalid length" | head
    note: 解析器的错误文案常暴露字段名与长度约束，可直接印证边界推断
  procedure:
  - 先用 tshark -r {{pcap}} -T fields -e tcp.payload 只导载荷，去掉以太网与 IP 头，避免包层字段混进结构里。
  - 用 python3 把载荷按字节展开（前 64 字节逐个打印偏移与值），取三条以上同结构样本并排对齐。
  - 逐偏移分成三类：全样本相同、全样本不同、部分相同；相同处先当骨架，不同处记为候选字段。
  - 对每段候选变长区，回看它前面哪个字段的值与它的长度或后续偏移相关，把长度来源指认出来。
  - 用 protoc --decode_raw 过一遍载荷，若能解出字段号，说明可能属于已知序列化格式，转序列化逆推处理。
  - 在客户端二进制里用 rabin2 -zz {{binary}} 搜 malformed、too short、invalid length 一类解析器错误文案，用文案里的约束印证边界切分。
  - 把字段切分表、语义候选、变长来源与未定区间一起落盘，未定的写明区间而不是硬填语义。
  pitfalls:
  - 字段值恰好等于长度或序号时两种解释都自洽，必须用更多样本排除
  - 定长填充区在不同版本长度可能变化，按固定偏移硬切换版本就全错
  - 加密或压缩载荷的字节差分毫无意义，先确认载荷是否明文
  - 只有一条样本时不存在边界推断，任何切分都只是猜想
- id: tech:binary-serialization-inference
  name: 二进制序列化逆推
  name_en: Binary Serialization Inference
  domain:
  - dom:re-protocol
  parent: dom:re-protocol
  def: 判定私有载荷采用的序列化框架并还原字段编号与类型。难点是常见框架都有多种编码变体，没有描述文件时类型只能靠值域推断。
  detail: 场景是判定一段私有载荷用了哪种序列化框架，再在没有描述文件的前提下把字段号、类型与值域还原出来，让后续的校验字段与加密字段能挂到具体字段上。与协议字段边界推断的区别是那条不预设框架、只切字节，本条先判框架再按该框架的编码规则解码，两者顺序相反、结论互相印证。注意点：protoc --decode_raw 只认 protobuf 的线格式，对 msgpack、thrift 一类只能当排除法用；变长整数编码的字节数随值变化，按定长解析会让后面全部错位；压缩后再序列化会把结构彻底盖住，必须先解开压缩层再谈框架判定。
  principle: 能无描述文件解码，靠的是这类框架把结构信息写进了字节本身：每个字段前缀是一个标签，由字段号左移三位再或上线类型构成，线类型直接告诉你后面是定长值、变长整数还是带长度的嵌套块；变长整数则用最高位的续位标志自定界，读到最高位为 0 就结束一个整数，因此解析器可以一路走下去而不需要任何外部结构。判定框架本质上是按某套规则走一遍、看能否恰好走到末尾且类型自洽——走得通说明编码规则对得上，走不通就换下一套规则。
  difficulty: 4
  prerequisites:
  - tech:field-boundary-inference
  artifacts:
  - art:pcap
  - art:so
  - art:apk
  - art:jar
  outputs:
  - 序列化框架判定
  - 字段编号与标签字节含义
  - 类型推断与值域约束
  - 待验证字段清单
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: protoc --decode_raw < {{out}}
    note: 无描述符时也能按线格式解出字段号与值，是最快的判定手段
  - cmd: python3 -c "import sys;d=open(sys.argv[1],\"rb\").read();print(d[:16].hex())"
      {{out}}
    note: 看前若干字节的变长整数与标签，判断是否符合同一编码规则
  - cmd: strings -a {{binary}} | grep -Ei "protobuf|thrift|msgpack|flatbuf" | head
    note: 在客户端二进制里找框架依赖，比盲猜载荷更直接
  procedure:
  - 先用 strings -a {{binary}} 搜 protobuf、thrift、msgpack、flatbuf 一类框架名，先在客户端依赖里找线索。
  - 用 python3 打印载荷前 16 字节的十六进制，看首字节低三位是否落在合法的线类型集合内。
  - 用 protoc --decode_raw 整段解码，观察是否解出连续且类型自洽的字段号；能解出即高度疑似 protobuf。
  - 若直接解码失败或明显乱序，改用 msgpack、thrift 的解析器各试一遍，按能自洽解出的字段数择优。
  - 对判定的框架，把每个字段的偏移、线类型与观测值域记成表，标出缺省与零值无法区分的项。
  - 检查载荷前部是否存在压缩签名，若有则先解压再回到整段解码那一步，不要把压缩流当编码乱解。
  - 把框架判定、字段编号表与待验证字段清单落盘，并注明判定置信度与备选框架。
  pitfalls:
  - 变长整数编码的字节数随值变化，按固定长度解析会让后续字段全部错位
  - 同一条消息里字段可乱序或缺省，缺省字段与零值字段在编码上无法区分
  - 压缩后再序列化会掩盖所有结构，必须先解开压缩层
  - 框架版本差异带来编码细节变化，判定框架不等于能正确解码
- id: tech:protocol-state-machine-recovery
  name: 协议状态机还原
  name_en: Protocol State Machine Recovery
  domain:
  - dom:re-protocol
  parent: dom:re-protocol
  def: 从会话序列归纳合法状态与迁移条件，解释为何某些请求只在特定顺序下生效。难点是状态隐含在服务端，客户端只看到被允许与拒绝的结果。
  detail: 场景是要解释同一条请求为什么先发就失败、后发就成功，把会话序列抽象成状态与迁移条件，得到可重放的顺序约束。与流量会话重组的区别是那条产出有序消息序列，本条在序列之上加状态与边；与加密参数还原的区别是本条不看载荷内容，只看消息种类与应答结果。注意点：被动抓包只能覆盖真实走过的路径，没走到的迁移推不出来，别把推断图当成完整状态机；服务端状态可能按会话存放、也可能按账号存放，两者混看会把状态错挂；负载均衡后同一逻辑会话可能落到不同后端，状态会看起来不停地跳。
  principle: 状态虽在服务端，但它的作用必然表现为同样的请求在不同上下文里得到不同结果：把每条请求的结果按连接内的顺序切开，某个请求从被拒变成被接受的那一点，就标出了一个迁移的边界，把该点之前已经成功执行过的消息取成交集，就是这条边的前置条件。状态只对同一逻辑会话有意义，所以判顺序必须在单条连接内做；跨连接混排会把不同会话的状态揉在一起，得到看似矛盾实则成立的迁移。之所以要按连接切而不是按时间切，也是因为并发与重试会把真实顺序打乱。
  difficulty: 4
  prerequisites:
  - tech:traffic-session-reassembly
  artifacts:
  - art:pcap
  - art:apk
  - art:elf64
  outputs:
  - 状态与迁移图
  - 触发条件与前置消息
  - 被拒绝顺序的异常路径记录
  - 状态判定依据
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: tshark -r {{pcap}} -T fields -e tcp.stream -e tcp.payload
    note: 按流导出载荷并按连接聚合，先看每条连接的消息顺序
  - cmd: tshark -r {{pcap}} -q -z conv,tcp
    note: 看连接建立与结束分布，长连接里的顺序信息才有状态意义
  - cmd: rabin2 -zz {{binary}} | grep -Ei "not_logged_in|invalid_state|please login"
      | head
    note: 服务端的拒绝文案常被固化进客户端，可反推哪些顺序约束是硬性的
  - cmd: python3 -c "import sys;d=open(sys.argv[1],\"rb\").read();print(len(d))" {{out}}
    note: 核对导出载荷总量，确认导出环节没丢掉整段会话
  procedure:
  - 先用 tshark -r {{pcap}} -q -z conv,tcp 看连接建立与结束分布，确认哪些是长连接、哪条连接承载了完整流程。
  - 用 tshark -r {{pcap}} -T fields -e tcp.stream -e tcp.payload 按流导出载荷，把每条连接内的消息按序排好。
  - 用 python3 核对导出的载荷总量，确认这次导出没有漏掉整段会话，再往下归纳状态。
  - 给每条消息打上消息种类与应答结果两个标签，把拒绝类应答单独标出来。
  - 在同一连接内找同一请求结果由拒绝转为接受的位置，取它前面已成功执行的消息集合作为该迁移的前置条件。
  - 在客户端二进制里用 rabin2 -zz {{binary}} 搜 not_logged_in、invalid_state、please login 一类文案，用这些硬性约束校验归纳出的边。
  - 画出状态与迁移图，对没被观测到的分支明确标注为不可推断，而不是补一条想当然的边。
  pitfalls:
  - 被动抓包只能看到走过的路径，没走到的迁移无法被推断出来
  - 重放单条请求成功不代表状态无关，服务端可能刚被前一条请求改了状态
  - 客户端重试与并发会打乱真实顺序，别把并发当成顺序状态
  - 负载均衡后同一会话可能落到不同后端，状态表现不一致
- id: tech:crypto-callsite-location
  name: 加密调用点定位
  name_en: Crypto Callsite Location
  domain:
  - dom:re-protocol
  parent: dom:re-protocol
  def: 在客户端程序中定位执行加解密的具体位置，把协议字段与代码逻辑对上。难点是封装层次多，最终调用可能穿透数层转发才落到加密实现。
  detail: 场景是已经确认载荷被加密，需要在客户端里找到真正执行加解密的那几处代码，把协议字段与代码逻辑对上。与加密参数与密钥流还原的区别是那条要定算法、模式与密钥来源，本条只负责找到调用点与调用链，是它的前置；与载荷编码链还原的区别是编码只是可逆的字节变换、不会留下算法常量的痕迹，能定位到常量与调用序列才说明真的是加密。注意点：自研或内联的加密实现不经过任何标准接口，只挂标准导出表会一个都拦不到；加密库被静态链接并剥离符号后，按导入表找会一无所获，得改为扫描置换表与轮常量；同名接口常被多处调用，命中不等于命中目标。
  principle: 定位成立的基础是密码学原语本身无法被自由改写：算法规定了分组大小、S 盒与轮常量的具体取值，这些表以数据形式必然出现在映像或内存里；同时编译器对外的调用约定是固定的，入参按位置排列为明文指针、长度、密钥指针。于是只要在这一次原语调用上设一个断点，无论上层包了几层转发、改了几次名字，执行流都必然经过它，栈回溯就能一路走回协议字段的来源。这也解释了自研实现为何仍可定位：它可以不叫 EVP_EncryptUpdate，但那几张常量表省不掉。
  difficulty: 3
  prerequisites:
  - tech:field-boundary-inference
  artifacts:
  - art:so
  - art:apk
  - art:elf64
  - art:pe64
  outputs:
  - 加密调用点地址与调用链
  - 入参与出参的实测样本
  - 上层封装与封装参数说明
  - 未覆盖的加密路径
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: frida-trace -p {{pid}} -i "AES_*" -i "EVP_*" -i "SHA256_*"
    note: 挂标准加密接口，先看目标到底用了哪些算法
  - cmd: r2 -q -c "aaa; axt @ sym.imp.EVP_EncryptUpdate" {{binary}}
    note: 静态反查谁调用了加密库，得到上层封装的位置
  - cmd: gdb -q -batch -ex "break EVP_EncryptInit_ex" -ex "run" -ex "bt" {{binary}}
    note: 在真实调用点停下看栈，可验证静态推断的调用链
  procedure:
  - 先用 frida-trace -p {{pid}} -i AES_* -i EVP_* -i SHA256_* 挂一批标准接口，看目标到底调不调标准实现。
  - 若一个都没命中，转静态：用 r2 -c 的 axt @ sym.imp.EVP_EncryptUpdate 反查谁在调用加密库，拿到上层封装位置。
  - 对反查到的封装，用 gdb -q -batch -ex break EVP_EncryptInit_ex -ex run -ex bt 在真实调用点停下看栈。
  - 顺着栈回溯逐层确认哪一层持有协议字段，把入参指针对回消息里的具体偏移。
  - 记录调用点地址、入参与出参的实测样本、以及上层封装的参数，形成调用链清单。
  - 把没命中的加密路径（自研实现、静态链接、JNI 转发）单列出来，标明尚未覆盖，不要当成不存在。
  pitfalls:
  - 自研或内联的加密实现完全不经过标准接口，挂标准接口一个都拦不到
  - 加密库可能被静态链接并去掉符号，按导入表找会一无所获
  - 同名接口在多处被调用，命中的未必是处理目标字段的那一处
  - 上层封装的模式与填充在调用点看不出，需回看上一层的准备代码
- id: tech:crypto-parameter-recovery
  name: 加密参数与密钥流还原
  name_en: Crypto Parameter Recovery
  domain:
  - dom:re-protocol
  parent: dom:re-protocol
  def: 定位协议里的加密环节并还原算法、模式、密钥与初始向量的来源及派生方式。难点是密钥常由多字段拼接派生，静态与动态各只能看到一半。
  detail: 场景是在已找到加密调用点之后，把算法、模式、密钥与初始向量连同它们的派生方式一起还原，直到能把真实报文解成明文。与加密调用点定位的区别是那条负责找到位置与调用链，本条负责在该位置读出参数并把密钥来源追到底；与校验与签名字段还原的区别是本条处理加密字段，完整性字段虽常相邻且长度相近但算法与覆盖范围另算。注意点：密钥可能由服务端下发的会话字段派生，只在客户端里找永远找不全；密钥也可能由多个字段拼接后再经摘要导出，静态只能看到拼接顺序、动态只能看到结果；同名算法的不同模式输出长度与结构不同。
  principle: 参数之所以能被定出来，是因为分组密码在固定密钥下是一个确定的映射，而模式决定了这个映射怎么被串起来：同一明文在相同密钥与初始向量下必然得到相同密文，所以拿一条已知明文对同位置的重复报文做比较，ECB 下相同分组整块相同，CBC 且初始向量固定则只有首块相同、后续块被前块牵连，初始向量随机时连首块也不同——这个差异格局本身就指出了模式。密钥一侧同理：若某次调用后密钥区随会话字段变化，就能把派生路径反推成哪些字段、什么顺序、经过了哪种摘要。
  difficulty: 5
  prerequisites:
  - tech:field-boundary-inference
  - tech:crypto-callsite-location
  artifacts:
  - art:pcap
  - art:so
  - art:apk
  - art:elf64
  outputs:
  - 算法与模式判定
  - 密钥与初始向量的派生路径
  - 明文与密文对照样本
  - 未确定参数及影响范围
  cost: high
  false_positive_risk: medium
  commands:
  - cmd: rabin2 -zz {{binary}} | grep -Ei "aes|hmac|sha256|md5" | head
    note: 先看算法常量与查表数据，标准算法的置换表是极强指纹
  - cmd: ltrace -f -e "EVP_*" -o {{out}} {{binary}}
    note: 观察加密库调用与参数，确认算法与模式选择
  - cmd: openssl dgst -sha256 {{out}}
    note: 对怀疑是摘要的字段做对照计算，验证它是不是哈希而非密文
  procedure:
  - 先用 rabin2 -zz {{binary}} 搜 aes、hmac、sha256、md5 与查表数据，用置换表与轮常量把算法范围收窄。
  - 用 ltrace -f -e EVP_* -o {{out}} {{binary}} 观察加密库的调用序列与实参，定位算法与模式的选择点。
  - 在调用点上取一组明文已知、密钥相同的重复样本，比较密文分组是否整块重复，据此先判 ECB 还是 CBC。
  - 若分组表现不一致，改变初始向量再观察首块：首块不变说明初始向量固定，首块随报文变化说明它在报文里随行。
  - 对怀疑是摘要而非密文的字段，用 openssl dgst -sha256 {{out}} 对候选输入做对照计算来验证。
  - 跟踪密钥区的来源：回看它是常量、配置，还是由会话字段拼接后再派生，把字段顺序与派生算法记下来。
  - 用还原出的参数批量解密，明文能过解析器即闭环；不能则回到分组比较那一步换模式假设。
  pitfalls:
  - 密钥可能来自服务端下发的会话字段，只在客户端里找永远找不全
  - 同一算法不同模式的输出长度与结构差异明显，但都叫同一个算法名
  - 完整性校验字段与加密字段常相邻且长度相近，混判会解不出明文
  - 把编码当成加密是最常见的浪费时间的误判
- id: tech:checksum-field-recovery
  name: 校验与签名字段还原
  name_en: Checksum Field Recovery
  domain:
  - dom:re-protocol
  parent: dom:re-protocol
  def: 定位协议中的校验与完整性字段，还原其计算范围与算法。难点是覆盖范围可能排除自身与某些保留位，范围错一位结果就完全不同。
  detail: 场景是要改动或重放协议字段时，先搞清报文里的校验与签名字段按什么范围、用什么算法算出来，否则改一个字节整条报文就被判非法。与加密参数与密钥流还原的区别是那条处理加密字段，本条处理完整性字段；与协议字段边界推断的区别是那条只给位置与长度候选，本条要定出覆盖范围与算法参数。注意点：覆盖范围常排除校验字段自身，也可能排除若干保留位，差一位结果就完全不同；同类算法有初值、反射与输出异或的多种组合，光看算法名不够；校验字段本身也可能被加密一并覆盖，那样必须先解密再计算。
  principle: 还原之所以可能，是因为校验把任意长度输入压成固定几位，这个投影只有在算法、覆盖范围、初值与反射参数三者同时猜对时，才会在多条样本上同时复现观测值；范围错一位或初值不同，输出就跟观测值毫无相似性，不存在接近这种中间状态，所以对错在几条样本上非常干脆。搜索空间也因此很小：算法是有限的几种，覆盖范围由字段边界给出若干候选，初值、反射与输出异或各只有几个取值，穷举即可。范围要排除校验字段自身，是因为它被定义成输入的函数，含入自身就变成一个解不出的不动点等式。
  difficulty: 4
  prerequisites:
  - tech:field-boundary-inference
  artifacts:
  - art:pcap
  - art:so
  - art:elf64
  - art:jar
  outputs:
  - 校验字段位置与长度
  - 参与计算的字节范围
  - 算法与初值参数判定
  - 验证结果与失败样本
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: python3 -c "import binascii,sys;d=open(sys.argv[1],\"rb\").read();print(hex(binascii.crc32(d)))"
      {{out}}
    note: 先用最常见的校验算法试；对不上再换其它变体
  - cmd: tshark -r {{pcap}} -T fields -e tcp.payload
    note: 取多条同结构消息，比较哪几个字节随内容变化且位置固定
  - cmd: rabin2 -zz {{binary}} | grep -Ei "crc|checksum|signature" | head
    note: 算法名与查表常量在客户端里通常留有痕迹
  procedure:
  - 先用 tshark -r {{pcap}} -T fields -e tcp.payload 取多条同结构报文，对齐出哪几个字节位置固定且随内容改动。
  - 用 python3 对候选字段逐条试 crc32，与观测值比对；全样本都对上即锁定算法，对不上再换其它变体。
  - 在客户端二进制里用 rabin2 -zz {{binary}} 搜 crc、checksum、signature，把算法名与查表常量当作交叉证据。
  - 用字段边界表列出覆盖范围的候选区间，逐个区间重算并统计命中率，命中率最高的区间即覆盖范围。
  - 固定范围后再扫初值、反射与输出异或的组合，直到所有样本同时复现观测值。
  - 改动一个字节做验证：重算后与服务端实际接受的新报文比对，确认范围与算法都没错。
  - 把字段位置、覆盖范围与参数记成可复用模板，并注明它是否被加密层一并覆盖。
  pitfalls:
  - 同类校验算法有初值、反射与输出异或的多种变体，参数不对时结果毫无相似性
  - 校验范围常排除校验字段自身，含入计算就永远对不上
  - 校验字段可能被加密一并覆盖，先解密再算才有意义
  - 字节序混淆会让结果稳定错，且看起来像是用了另一种算法
- id: tech:payload-encoding-chain-recovery
  name: 载荷编码链还原
  name_en: Payload Encoding Chain Recovery
  domain:
  - dom:re-protocol
  parent: dom:re-protocol
  def: 逐层剥开载荷上的编码与压缩，恢复到可读明文。难点是层序未知，每一层都要靠数据特征试出来，而不是从结构里直接读出来。
  detail: 场景是载荷既不像明文也不像密文，而是多层编码与压缩叠在一起，需要一层层剥到明文再谈字段。与二进制序列化逆推的区别是那条判定框架与字段编码，本条处理框架之外的外壳层，顺序上先剥外壳再谈序列化；与加密参数还原的区别是本条各层都是可逆的公开变换、不需要密钥，真遇到解不开的层才转加密路线。注意点：层序未知时两种顺序都可能跑出长度正确但全是乱码的结果，必须靠每层的合法性检查来判而不是靠猜；压缩率极低的一层往往是编码而不是压缩；URL 安全字母表与去填充的变体会让标准表解不出来。
  principle: 逐层剥离之所以可行，是因为每一层都在字节上留下只有它才有的痕迹：文本编码的字符集有限、长度满足模 4 或补位规则；压缩流的头部有固定魔数与标志位，且压缩后的长度与熵同明文的量级对不上；解压后再做变换，熵只会继续下降而不会升高。这些痕迹同时充当判据与校验：顺序猜错时，变换要么直接失败（字符表外的字节、非法头部），要么产出一段看似合法但熵与长度都不合理的数据，因此解完熵该降这一条比解完不报错更能定位真实层序。自定义字符表破坏了字母表判据，只能先做频率统计。
  difficulty: 3
  prerequisites:
  - tech:field-boundary-inference
  - tech:binary-serialization-inference
  artifacts:
  - art:pcap
  - art:apk
  - art:so
  - art:script
  outputs:
  - 编码与压缩的层序
  - 每层的识别依据
  - 还原后的明文字段
  - 无法还原的层及原因
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: python3 -c "import base64,sys;d=open(sys.argv[1],\"rb\").read();print(base64.b64decode(d+b\"==\")[:64])"
      {{out}}
    note: 试文本编码一层；长度不是 4 的倍数时需先补齐
  - cmd: binwalk {{out}}
    note: 按签名扫内嵌的压缩流与归档，快速判断下一层是什么
  - cmd: python3 -c "import zlib,sys;d=open(sys.argv[1],\"rb\").read();print(zlib.decompress(d)[:64])"
      {{out}}
    note: 试通用压缩解压；失败说明不是裸压缩流或还隔着别的层
  procedure:
  - 先取一段载荷做字符统计，看是否全落在可打印范围、长度是否为 4 的倍数，判断第一层是不是文本编码。
  - 用 python3 试 base64 解码（长度不是 4 的倍数先补齐），看结果是否落入压缩魔数或可打印区间。
  - 用 binwalk {{out}} 按签名扫内嵌的压缩流与归档，把下一层的候选列出来。
  - 用 python3 试 zlib 解压；失败说明不是裸压缩流，或中间还隔着一层编码，回上一步换候选。
  - 记录每层的识别依据（魔数、长度规则、熵值），用解完熵必须下降来复核层序是否成立。
  - 若某层始终解不出且字符分布异常，按自定义字符表处理：先做频率统计再与已知明文对照。
  - 把层序、每层依据与还原后的明文字段落盘，无法还原的层写明卡在哪一步。
  pitfalls:
  - 层序错了会得到看似随机但长度正确的字节，容易被误判成已加密
  - 压缩率极低的层其实是编码而非压缩，用解压去试会一直失败
  - 同类编码的变体（URL 安全、去填充）用标准表解不出来
  - 自定义字符表置换是最常见的障碍，先做频率统计再谈解码
