# BinAtlas 知识库 · 技术 · dom:wk-driver
# 规范：03-DATA-SCHEMA.md §2.2

- id: tech:driver-toolchain-setup
  name: 驱动开发环境搭建
  name_en: Driver Development Environment Setup
  domain:
  - dom:wk-driver
  parent: dom:wk-driver
  def: 搭出可编译、可部署、可回滚的内核驱动开发环境：编译链与头库版本对齐、目标机快照、测试签名与加载开关。难点是签名与加载策略随系统版本和启动配置变化，环境没搭对时错误会伪装成代码缺陷。
  detail: 场景是把一台空环境推到能反复编译、加载、卸载内核驱动的状态：编译链与头库就位、目标机可回滚、签名与加载开关可用。与签名加载策略的区别是这里只搭建并验证环境本身，不判定某个具体驱动能否加载；与调试环境搭建的区别是不涉及符号与断点，只关心加载与卸载能否稳定复现。
    注意点：编译器产出的位数必须与目标系统一致，混用往往不是编译报错而是加载期失败；测试签名属于启动配置，改完必须重启并回读确认；目标机快照要覆盖改动前的状态，环境改坏时能整体回退。
  principle: 驱动是内核映像，由系统的内核加载器映射，而不是普通进程加载器：它不解析用户态依赖，只按映像头把节区放进内核地址空间，再把导入表里引用的内核导出逐个解析成真实地址。所以头库与目标系统的导出集合必须对得上，对不上时问题发生在加载期的导入解析那一步，表现为加载失败而不是编译错误。测试签名开关改的是加载器对签名链的判定分支：开关打开时自签映像被放行，关闭时同一份映像在映射前就被拒。环境对齐的本质，是让编译产物与加载器的判定条件同时成立。
  difficulty: 4
  prerequisites: []
  artifacts:
  - art:driver
  - art:pe64
  outputs:
  - 可编译的驱动工程骨架
  - 可回滚的目标机快照与加载配置
  - 测试签名链路
  - 环境参数核对清单
  cost: medium
  false_positive_risk: low
  commands:
  - cmd: bcdedit /set testsigning on
    note: 打开测试签名以加载自签名驱动；需重启生效，开启后桌面会保留测试模式标记
  - cmd: bcdedit /enum {current}
    note: 读取当前启动项的签名与调试开关，确认改动落在实际生效的那一项上
  - cmd: signtool sign /fd sha256 /f <pfx 路径> /p <口令> {{driver}}
    note: 用自签名证书签驱动仅供本机开发；对外分发必须走官方硬件门户，不能靠自签
  - cmd: sc create <服务名> type= kernel binPath= {{driver}}
    note: 注册为内核服务以便加载；type= 与 binPath= 后面的空格是语法要求，不是排版
  procedure:
  - 先建目标机快照再动启动配置，保证任何时候都能整体回退到改动前。
  - 跑 bcdedit /enum {current} 记下当前启动项的签名与调试开关，作为改动前的基线。
  - 用 bcdedit /set testsigning on 打开测试签名，重启后回读同一项确认开关真的生效。
  - 用 signtool sign 给驱动签上自签名证书，再把同一个文件交给下一步注册服务。
  - 跑 sc create 把驱动注册成内核服务，先启动一次确认能加载，再开始写业务代码。
  - 把编译器、头库与目标系统的组合写进项目文档，换机器时按这份记录重建环境。
  pitfalls:
  - 开了安全启动或内存完整性时测试签名策略可能不生效，先确认这两项状态再怀疑代码
  - 编译器、头库与目标系统版本不对齐时能编译通过但加载失败，务必把版本组合写进项目文档
  - 共用调试机上改启动配置会影响所有人，改动前先留下回滚命令
- id: tech:driver-signing-policy
  name: 驱动签名与加载策略
  name_en: Driver Signing & Load Policy
  domain:
  - dom:wk-driver
  parent: dom:wk-driver
  def: 判定一个驱动在当前系统上能否加载：签名链完整性、签署者身份、目录文件与启动配置里的强制项。难点是策略随系统版本和硬件安全功能变化，同一份驱动在两台机器上结论可以相反。
  detail: 场景是判断一份现成驱动在当前机器上到底能不能加载：签署者是谁、签名链是否完整、系统目录里是否收录、启动配置里的强制项有没有打开。与单纯验签的区别是文件签名有效只是必要条件，真正放行还要过目录与启动策略；与环境搭建的区别是这里只做判定，不动任何环境。
    注意点：文件签名与目录收录是两层校验，目录里没有时签名有效也会被拒；硬件相关的安全功能会让测试签名策略整体失效；结论必须连系统的补丁与配置一起记录，脱离环境单独记「能加载」没有意义。
  principle: 加载器在映射映像前先走签名链校验：从签署证书逐级校验到受信任根，检查证书用途与吊销状态，链完整才有信任依据。这只过了第一关——系统还维护一张已批准驱动的目录文件，加载器按映像算出的哈希到目录里查收录情况，这一关问的是「谁批准过这个文件」而不是「文件有没有签名」，所以文件签名有效而目录未收录时照样被拒。启动配置与安全启动则在更早阶段改写判定的严格程度，某些模式下测试签名分支被直接跳过，同一个开关在两台机器上就会得出相反结论。
  difficulty: 4
  prerequisites:
  - tech:driver-toolchain-setup
  artifacts:
  - art:driver
  - art:pe64
  outputs:
  - 驱动可加载性判定
  - 签名链与签署者核对结果
  - 影响加载的策略项清单
  cost: low
  false_positive_risk: medium
  commands:
  - cmd: signtool verify /pa /v {{driver}}
    note: 按 Authenticode 策略校验签名链并打印证书主体；只覆盖文件签名，不等于内核加载判定
  - cmd: Get-AuthenticodeSignature {{driver}}
    note: 快速查看签名状态与签署者，同样只覆盖文件本身
  - cmd: bcdedit /enum {current}
    note: 核对签名强制与测试模式开关，判断本机是否允许未签名驱动
  procedure:
  - 先用 Get-AuthenticodeSignature 看文件本身的签名状态与签署者，确认有没有签名、链是否完整。
  - 再用 signtool verify /pa /v 走一遍完整策略校验，读证书主体与链上各级，确认不是自签也不是已吊销证书。
  - 跑 bcdedit /enum {current} 核对签名强制与测试模式开关，确认本机当前允许哪一档签名。
  - 检查硬件相关的安全功能状态，这两项打开时测试签名策略可能整体失效。
  - 若文件签名通过但仍加载失败，转而核对目录收录，这一层才是拒绝点。
  - 把系统补丁与配置连同判定结论一起记档，同一份驱动换环境要重新判定。
  pitfalls:
  - 只查文件签名不查加载策略，会在启用安全启动或内存完整性的机器上误判为可加载
  - 目录文件与文件签名是两层校验，忽略目录会出现签名有效但加载失败
  - 签名策略随系统更新变化，结论必须连系统版本与配置一起记录
- id: tech:driver-entry-device-object
  name: 驱动入口与设备对象
  name_en: Driver Entry & Device Objects
  domain:
  - dom:wk-driver
  parent: dom:wk-driver
  def: 实现驱动入口，创建设备对象与符号链接，把分发例程挂到驱动对象上，使用户态能打开设备。难点是设备对象、符号链接与分发表的生命周期必须与卸载路径严格对称，错一步就留下悬空引用。
  detail: 场景是让用户态能定位并打开自己的设备：在入口例程里创建设备对象、给出符号链接、把分发例程填进驱动对象。与 IRP 分发的区别是这里只负责对象与入口的建立和拆除，单次请求怎么处理属于下一层；与框架对象模型的区别是全程自己管生命周期，没有框架代管引用。
    注意点：设备对象与符号链接是两步创建，任一步失败都要按逆序拆掉已建部分；名字要预留多实例，硬编码单名第二次加载就会冲突；入口里的初始化顺序决定卸载路径能否严格对称。
  principle: 映像被映射完成后，内核加载器按映像头里的入口点调用驱动导出的初始化例程，这是驱动唯一的初始化机会——此后没有任何用户态入口会再进到驱动。它拿到的第一个参数是对象管理器创建的驱动对象，分发例程表就在这个对象里；把函数指针写进表，I/O 管理器投递请求时才知道该往哪调。设备对象是请求的投递目标，符号链接是用户态可见的名字，两者在对象管理器命名空间里各占一个条目，因此拆除时必须各自删除。入口返回失败时加载器会解除映像映射，所以失败路径要么完全清理，要么干脆不建任何对象。
  difficulty: 4
  prerequisites:
  - tech:driver-toolchain-setup
  - tech:driver-signing-policy
  artifacts:
  - art:driver
  - art:pe64
  - art:kernel-module
  outputs:
  - 可加载并创建设备的驱动
  - 分发例程表
  - 设备与符号链接命名方案
  cost: medium
  false_positive_risk: low
  commands:
  - cmd: '!drvobj \Driver\{{module}} 2'
    note: 在调试器命令窗口执行，查看驱动对象与分发例程表，确认挂载是否生效
  - cmd: '!object \Device'
    note: 列出设备命名空间，判断设备对象是否真的创建成功
  - cmd: sc start <服务名>
    note: 以服务方式启动驱动；返回码能直接区分签名失败与入口例程返回失败
  procedure:
  - 在入口例程里先填驱动对象的分发例程表，再创建设备对象，避免设备已可见而请求无人处理。
  - 为设备对象取一个带实例区分的名字，创建后立刻检查返回状态，失败就直接返回。
  - 创建指向该设备对象的符号链接，链接名与设备名成套命名，不要只建其中一个。
  - 用 !object \Device 确认命名空间里真的出现了设备与链接，别只看代码返回成功。
  - 以服务方式启动驱动，再用 !drvobj \Driver\{{module}} 2 核对分发例程表是否按预期挂上。
  - 卸载路径上按创建的逆序先删链接再删设备，最后清空分发表。
  pitfalls:
  - 先建设备再建符号链接的顺序不能反，链接失败时只删链接不删设备会残留对象
  - 分发例程表里没覆盖的主功能码必须显式返回不支持并自行完成 IRP，交由系统处理会走未定义路径
  - 设备名与符号链接名要考虑多实例，硬编码单名在第二次加载时直接冲突
- id: tech:driver-irp-dispatch
  name: IRP 分发与完成例程
  name_en: IRP Dispatch & Completion
  domain:
  - dom:wk-driver
  parent: dom:wk-driver
  def: 按主功能码分发 IRP，并决定同步完成、挂起到队列还是转发下层。难点是完成例程的返回值语义与中断级别约束：声明继续处理时不得提前完成，挂起后还必须实现取消路径。
  detail: 场景是请求进来之后怎么走：按主功能码选分支、决定当场完成还是排队、以及转发给下层时怎么接管完成。与设备对象建立的区别是那一步只把函数指针挂上表，这里负责每个分支的语义；与控制码接口的区别是控制码只是其中一类主功能码的参数解析。
    注意点：挂起的请求必须配取消路径，否则进程退出后请求永久悬挂；完成例程的返回值决定是否继续向上传，返回继续却还调用完成就是重复完成；中断级别越高可用操作越少，高等级上访问可分页内存会随机蓝屏。
  principle: 请求不会直接调用驱动函数，而是由 I/O 管理器封装成一个 IRP：一个请求对象加一串栈位置，每个栈位置对应设备栈里的一层，各层只能读自己那一格的参数。投递时管理器沿栈逐层调用该层设备对象分发表中对应主功能码的函数指针——这就是分发例程必须存在的原因，它是唯一会被调用的入口，表里没覆盖的分支请求就无人处理。例程可以当场完成、留待稍后或转发下层；转发时把完成例程挂进当前栈位置，下层完成后管理器从下往上一层层回调，所以完成例程属于哪一格决定了它在什么时机执行。
  difficulty: 5
  prerequisites:
  - tech:driver-entry-device-object
  artifacts:
  - art:driver
  - art:pe64
  - art:kernel-module
  outputs:
  - 分发例程实现
  - 挂起队列与取消路径
  - IRP 生命周期核对结论
  cost: high
  false_positive_risk: medium
  commands:
  - cmd: '!irpfind'
    note: 在调试器里枚举当前所有 IRP，用于定位泄漏或被挂死后不再完成的请求
  - cmd: dt nt!_IO_STACK_LOCATION
    note: 查看 I/O 栈位置类型定义，确认该读哪个联合成员；不要凭外部资料猜偏移
  - cmd: '!irp <IRP 地址>'
    note: 展开单个 IRP 的栈位置与状态，地址取自上一步枚举输出
  procedure:
  - 先按主功能码把分支列出来，明确支持哪些、拒绝哪些，拒绝的分支必须自行完成请求。
  - 只读参数的请求当场处理并完成；需要等待的请求挂到自己的队列里，不要在内核里阻塞线程。
  - 挂起前实现取消例程并把请求标记成可取消，用户态退出时才有人回收。
  - 转发下层时在调用前设置完成例程，并在完成例程里按返回语义决定是否继续向上传。
  - 用 dt nt!_IO_STACK_LOCATION 确认当前栈位置该读哪个成员，不要凭外部资料猜布局。
  - 用 !irpfind 找长期不完成的请求，再用 !irp 展开它的栈位置，定位卡在哪一层。
  pitfalls:
  - 完成例程返回继续处理却又调用了完成例程，属重复完成，现象通常是访问已释放内存
  - 挂起 IRP 后不实现取消例程，用户态进程一退出请求就永久悬挂并拖住线程
  - 在过高的中断级别上访问可分页内存会随机蓝屏，且只在压力下复现
- id: tech:driver-ioctl-interface
  name: IOCTL 接口与输入校验
  name_en: IOCTL Interface & Input Validation
  domain:
  - dom:wk-driver
  parent: dom:wk-driver
  def: 定义设备控制码与用户态通信协议，按缓冲方式把请求数据搬进内核并逐项校验。难点是不信任任何输入：长度、输出缓冲、调用者权限与并发重入都得自己挡，漏一处就是内核内存破坏。
  detail: 场景是把一个自定义能力暴露给用户态：定义控制码、约定缓冲方式、把参数搬进内核再逐项校验。与 IRP 分发的区别是分发例程只决定往哪个函数走，这里负责那个函数内部的协议与校验；与框架驱动的区别是缓冲方式与校验全要自己写，没有框架兜底。
    注意点：控制码里的设备类型、功能号、访问权限与缓冲方式要成套定义，改一位就变成另一个请求；长度与指针来自不可信来源，必须在异常保护里访问并自查范围；同一控制码可能并发进入，共享状态要么加锁要么做成无状态。
  principle: 控制码自身编码了三件事：设备类型、功能号与访问权限，而缓冲方式写在功能号那一段里，所以一个控制码同时告诉管理器这个请求该带多大缓冲、谁能发。管理器按缓冲方式把用户态缓冲搬进内核——复制方式给的是内核可直接读写的副本，直接方式给的是描述用户页的链表，两条路都不保证长度合法。校验之所以必须自己做，是因为管理器只搬不判语义：它不知道你要多长的输入、输出能写多少，长度字段完全由调用者填写。校验的核心，是把长度与指针换算成可信范围，再在异常保护里访问。
  difficulty: 5
  prerequisites:
  - tech:driver-irp-dispatch
  artifacts:
  - art:driver
  - art:pe64
  outputs:
  - 控制码定义表
  - 输入与输出校验清单
  - 用户态调用样例
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: x {{module}}!*Dispatch*
    note: 在调试器里列出可疑的分发例程符号，确认控制码真正落在哪个函数
  - cmd: dt nt!_IO_STACK_LOCATION
    note: 确认设备控制相关参数成员的布局，再决定取哪几个字段
  - cmd: dumpbin /headers {{driver}}
    note: 静态确认映像是内核驱动而不是用户态 DLL，避免审错对象
  procedure:
  - 先把设备类型、功能号、访问权限与缓冲方式成套定义成控制码表，一个功能只留一个入口。
  - 用 dumpbin /headers {{driver}} 确认审的是内核映像，避免把用户态模块当成驱动。
  - 用 x {{module}}!*Dispatch* 定位控制码真正落在哪个分发例程，别按符号名猜。
  - 取参数前用 dt nt!_IO_STACK_LOCATION 确认控制相关成员的布局，再决定读哪几个字段。
  - 先校验长度与缓冲方式是否匹配，再把访问不可信指针的代码放进异常保护里。
  - 判定调用者权限，管理员专用的控制码必须显式检查，不能靠「用户态拿不到句柄」兜底。
  - 并发路径上把共享状态加锁或做成无状态，再压测看重入行为是否符合设计。
  pitfalls:
  - 直接信任用户态传入的长度或指针等于把任意写交给调用者，必须自行校验范围并放在异常保护里访问
  - 缓冲方式与长度字段语义不匹配时输出会越界，且只在特定对齐或长度下触发
  - 缺调用者权限判定时普通用户即可触达本应管理员专用的控制码
- id: tech:driver-kmdf-framework
  name: 框架驱动对象模型
  name_en: KMDF Object Model
  domain:
  - dom:wk-driver
  parent: dom:wk-driver
  def: 用框架提供的对象、队列与上下文模型实现驱动，把 I/O 请求与电源事件交给框架调度。难点是框架状态机的契约：回调里能做什么、引用怎么取、何时可以阻塞，理解错通常表现为挂起而非蓝屏。
  detail: 场景是用框架的对象模型实现驱动：设备、队列、上下文与电源回调由框架调度，开发者只填回调。与裸 WDM 写法的区别是对象生命周期与引用计数由框架代管，代价是必须守住框架状态机的契约；与控制码接口的区别是这里关心回调时机而不是协议本身。
    注意点：回调里不能阻塞等待一个没有别处会满足的条件；上下文清理回调执行时设备对象可能已进入拆除阶段；队列的请求处置策略决定并发与顺序语义，选错常要压测才暴露。
  principle: 框架在驱动与系统之间加了一层对象与引用：设备、队列、请求都是框架对象，各带引用计数，框架在对象真正释放前保证它的回调不会在悬空状态下执行。请求不直接投给回调，而是先进队列，由队列的处置策略决定立刻交给回调还是排队、能否并行，所以并发语义由队列配置决定而不是回调内部。电源与即插即用事件由框架按状态机顺序驱动，回调只在状态允许时被调用。卸载时框架先等对象引用归零再调清理回调，因此在回调里持有一个不该持有的引用，会让卸载永远等下去。
  difficulty: 4
  prerequisites:
  - tech:driver-entry-device-object
  artifacts:
  - art:driver
  - art:pe64
  - art:kernel-module
  outputs:
  - 框架驱动骨架
  - 队列与上下文设计
  - 电源与即插即用回调清单
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: '!wdfkd.wdfdriverinfo {{module}}'
    note: 用调试器框架扩展查看驱动与框架对象状态；扩展不可用就退回 !drvobj 与 !object
  - cmd: sc query <服务名>
    note: 确认服务状态与退出码，框架初始化失败常在这里给出可读错误码
  procedure:
  - 先用框架的对象类型把设备、队列与上下文规划成树，明确谁持有谁、谁负责释放。
  - 入口只做框架初始化与对象创建，失败就按逆序销毁已建对象，不留半成品。
  - 队列按需要的并发与顺序语义选处置策略，不要用默认值兜住所有场景。
  - 电源与即插即用回调只做状态切换必须做的事，耗时工作丢到工作项里。
  - 用 sc query 读服务状态与退出码，框架初始化失败通常在这里给出可读原因。
  - 用 !wdfkd.wdfdriverinfo {{module}} 看框架对象与句柄状态，扩展不可用就退回 !drvobj 与 !object。
  - 卸载前确认对象引用已归零，再让框架按顺序销毁设备。
  pitfalls:
  - 在框架回调里阻塞等待一个没有别处会满足的条件，表现是超时或整机挂起
  - 上下文清理回调里再访问设备对象，卸载路径上极易踩到已释放内存
  - 队列的请求处置策略选错会让并发行为与设计不符，通常压测才暴露
- id: tech:driver-verifier-testing
  name: 驱动验证与压力测试
  name_en: Driver Verifier Stress Testing
  domain:
  - dom:wk-driver
  parent: dom:wk-driver
  def: 打开内核验证选项并施加压力，把潜伏的池越界、中断级别违规与资源泄漏提前暴露。难点是开启验证后分配布局与时序都变了，复现条件随之改变，必须先定位到具体被触发的检查项。
  detail: 场景是交付前把潜伏的内核缺陷逼出来：池越界、中断级别违规、句柄与引用泄漏，这些东西在正常运行时大多不报错。与代码审计的区别是它按运行时真实行为判定，不依赖能不能读懂代码；与崩溃分析的区别是这里主动制造暴露条件而不是等事故。
    注意点：验证器改变分配布局与时序，原本稳定复现的缺陷可能消失，必须按被触发的检查项反复试验；只给自家驱动挂选项，全量挂会让系统极慢甚至起不来；挂上要重启才生效，务必保留能回退的启动方式。
  principle: 验证器不做静态检查，而是把自己插进内核的几个公共入口：分配内存时在块的前后加不可访问的保护区，并把释放后的内容填成固定模式，于是越界写与释放后使用会在下一次访问时立刻触发，而不是悄悄污染别人的数据；分配池内存时记录当时的中断级别与可分页属性，随后检查是否出现过高中断级别上访问这些内存的行为；驱动卸载时扫描它留下的对象、句柄与未完成请求。这些动作都改动了池布局与时序，缺陷的可见性随之改变——这就是同一个缺陷在有验证与无验证时表现不同的原因。
  difficulty: 4
  prerequisites:
  - tech:driver-toolchain-setup
  - tech:driver-irp-dispatch
  artifacts:
  - art:driver
  - art:kernel-module
  - art:memory-dump
  outputs:
  - 验证选项配置与复现步骤
  - 被触发的检查项清单
  - 崩溃转储与归因结论
  cost: high
  false_positive_risk: low
  commands:
  - cmd: verifier /standard /driver {{driver}}
    note: 给指定驱动挂上标准验证项，重启后生效；只挂自家驱动，别全量挂
  - cmd: verifier /querysettings
    note: 确认当前真正生效的验证选项，避免以为开了其实没开
  - cmd: '!verifier'
    note: 在调试器里查看验证器统计与最近一次违规信息
  - cmd: verifier /reset
    note: 关闭全部验证并清除设置，系统起不来时的兜底动作
  procedure:
  - 先用快照保住能进系统的启动方式，再给单个驱动挂上标准验证项。
  - 用 verifier /standard /driver {{driver}} 限定到自家驱动，不要全量挂。
  - 重启后用 verifier /querysettings 回读生效选项，确认挂上的是你以为的那几项。
  - 按真实使用路径施加压力并记录复现步骤，先抓住第一个被报告的事件。
  - 触发崩溃后收集转储，用 !verifier 看最近一次违规与统计，确认被触发的具体检查项。
  - 按检查项回代码里找对应写法，改完重跑同一组压力，确认不再复现。
  - 用 verifier /reset 清空设置恢复机器，不要把验证状态留在交付环境里。
  pitfalls:
  - 全量挂验证会让系统极慢甚至无法启动，务必限定到单个驱动并预留快照
  - 验证器报的第一现场未必是根因，池越界常常在释放时才被检出
  - 开特殊池后内存布局改变，原本稳定复现的路径会消失，需要降压力重试
- id: tech:driver-unload-cleanup
  name: 卸载路径与资源回收
  name_en: Unload Path & Resource Reclaim
  domain:
  - dom:wk-driver
  parent: dom:wk-driver
  def: 在卸载例程里逆序释放设备、符号链接、队列、定时器与回调注册，确保没有残留引用。难点是卸载后仍有回调或工作项在跑，问题往往到重启或再次加载时才以访问已释放内存的形式出现。
  detail: 场景是让驱动能干净地停下来：把设备、符号链接、队列、定时器与已注册的回调按逆序拆掉，确保没有遗留引用。与入口建立的区别是这里只做拆除、且顺序与建立严格相反；与验证测试的区别是那边靠工具把缺陷逼出来，这边靠代码路径本身不产生缺陷。
    注意点：卸载后仍有回调或工作项在跑时，问题常常延迟到再次加载或关机才以访问已释放内存的形式出现；只标记删除不等待完成是最典型的卸载后执行；判定稳定要反复加载卸载很多次，单次成功没有说服力。
  principle: 卸载例程被调用时映像仍在内核地址空间里，但它一返回，加载器就会解除映射——此后任何指向该映像代码的指针都落在失效的页上。系统不会替驱动清理它登记到全局结构里的东西：回调注册表、定时器、工作项、设备对象都持有驱动代码地址，不注销它们就会在卸载后继续被别的上下文调用。所以卸载例程的本质，是让系统的其它部分不再持有指向本映像的指针，而等待机制是为了确保在途工作项真的跑完再解除映射。任何遗漏都表现为卸载后执行，而不是卸载当场失败。
  difficulty: 4
  prerequisites:
  - tech:driver-irp-dispatch
  - tech:driver-verifier-testing
  artifacts:
  - art:driver
  - art:kernel-module
  - art:memory-dump
  outputs:
  - 卸载顺序清单
  - 残留引用与泄漏核对结果
  - 反复加载卸载的稳定性结论
  cost: medium
  false_positive_risk: low
  commands:
  - cmd: sc stop <服务名>
    note: 触发卸载；返回码能区分还有引用无法卸载与卸载例程返回失败
  - cmd: '!poolused 2'
    note: 按标签统计池占用，反复加载卸载后对比就能看出泄漏
  - cmd: lm
    note: 确认模块是否真的从模块列表消失，残留说明卸载没走完
  procedure:
  - 先停掉新请求的入口，让设备不再接受新的打开与控制调用。
  - 用 sc stop <服务名> 触发卸载，先读返回码区分还有引用与卸载例程返回失败。
  - 注销所有已注册的回调，注销后确认没有在途回调再继续下一步。
  - 删除定时器与工作项并等待它们真正结束，只标记删除等于把它们留给卸载后。
  - 关闭队列、删除符号链接、最后删除设备对象，顺序与创建严格相反。
  - 用 lm 确认模块已从模块列表消失，用 !poolused 2 对比多次加载卸载前后的池占用。
  - 反复加载卸载几十次再判定稳定，出现残留就回到上一步定位未释放的对象。
  pitfalls:
  - 卸载前不注销已注册的回调，回调指针会指向已卸载代码，之后任何触发都直接蓝屏
  - 定时器与工作项只标记删除不等待完成，是典型的卸载后执行
  - 反复加载卸载几十次再判定稳定，单次卸载成功说明不了问题
