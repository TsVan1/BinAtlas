# BinAtlas 知识库 · 技术 · dom:av-evasion-edr
# 规范：03-DATA-SCHEMA.md §2.2

- id: tech:security-product-inventory
  name: 安全产品清单测绘
  name_en: Security Product Inventory
  domain:
  - dom:av-evasion-edr
  parent: dom:av-evasion-edr
  def: 先枚举目标机上实际存在的安全产品、驱动与文件系统过滤器，确定面对的是哪几套检测面与版本。难点是没有统一注册位置，产品常以服务、驱动、管理接口三种形态同时存在。
  detail: 场景是在动手前确认面对的是哪几套检测面，同一台机器装了多个产品时，先分清谁在拦、谁只负责记录。与遥测面测绘的区别是本条只回答有谁，不回答采什么；与驱动与内存完整性核查的区别是那条看策略是否允许某类手法，这条只看组件在不在。注意安全中心命名空间在服务器版系统上常常不存在，容器与云主机里本机枚举会得到空结果；过滤器与驱动查询都需要管理员权限，权限不足时拿到的空清单不能当作不存在。
  principle: 有效性来自三条枚举路径各自读取一套互不重叠的注册面：安全中心的管理类只收录主动向系统注册的产品；过滤器工具读的是文件系统过滤管理器维护的挂载链与高度，只有过滤驱动型产品才在里面；驱动查询读的是服务控制管理器的驱动数据库，覆盖有驱动但无界面的、纯内核组件的产品。产品实现形态决定它落在哪一层，因此任何一层缺失都不能推出产品不存在，三层叠加才构成必要条件。
  difficulty: 1
  prerequisites: []
  artifacts:
  - art:pe32
  - art:pe64
  outputs:
  - 产品清单与版本
  - 驱动与过滤器挂载情况
  - 检测面归属表
  cost: low
  false_positive_risk: low
  commands:
  - cmd: Get-CimInstance -Namespace root\SecurityCenter2 -ClassName AntiVirusProduct
    note: 查安全中心注册的产品；注意未注册的产品照样在跑，这份清单只是必要条件。
  - cmd: fltmc filters
    note: 列文件系统微过滤驱动与高度，判断文件与注册表访问由谁接管、谁优先级更高。
  - cmd: sc query type= driver state= all
    note: 列全部驱动服务；注意等号后必须有空格，这是该命令的固定写法。
  procedure:
  - 先查安全中心登记的产品清单，若返回命名空间不存在就跳过这一层，记为环境限制而不是结论。
  - 用过滤器查询读挂载链与高度，记下每个过滤器的名字和顺序，顺序决定谁先看到文件操作。
  - 再用驱动查询列全部驱动服务，注意等号后必须有空格，否则命令会报参数错误。
  - 把三份结果按厂商与安装路径归并，只出现在某一层的条目要单独标出，它们通常是没有注册的产品或残留驱动。
  - 对每个确认存在的产品补版本号，从服务可执行文件或安装目录的文件版本字段取，不靠产品名猜。
  - 最后记下枚举时的权限与会话类型，容器与云主机标注为宿主机侧不可见。
  pitfalls:
  - 安全中心里没有不等于不存在，很多产品不注册或注册项被清理。
  - 产品版本直接决定检测能力，拿不到版本号的结论都不可靠。
  - 容器与云主机里防护常在宿主机侧，本机枚举结果会完全为空。
- id: tech:telemetry-surface-mapping
  name: 遥测面测绘
  name_en: Telemetry Surface Mapping
  domain:
  - dom:av-evasion-edr
  parent: dom:av-evasion-edr
  def: 把产品可能采集的事件类别（进程、映像、句柄、注册表、网络、脚本）逐类列出，标出触发条件与字段。难点是采集点随版本变化且大多不在公开文档里，只能靠驱动与日志实证。
  detail: 场景是把产品可能采集的事件类别逐类落到具体通道上，为钩子、事件跟踪与脚本扫描这几条后续条目提供输入。与安全产品清单测绘的区别是那条只列产品，本条要落到事件类别与字段；与事件跟踪覆盖分析的区别是本条铺全面，那条只挖内核威胁情报一类提供者。注意跟踪会话存在不等于事件被消费，通道存在也不等于有人在读；事件字段集合随版本变化，按旧版字段解析会静默丢数据；内核缓冲仍可被产品读取，关掉日志通道并不等于停止采集。
  principle: 采集点几乎都通过三类系统机制之一落地，所以枚举这三面能覆盖大多数通道：跟踪会话由事件跟踪控制器集中维护，内核会话与自动记录器都挂在其中，因此能查出谁在订阅什么；事件日志通道是注册在系统里的元数据，能查出哪些通道存在；文件与注册表访问必须经过输入输出管理器，而过滤驱动挂在它的高度链上，因此实例能反推记录覆盖了哪些卷。覆盖不到的是产品驱动内部的私有缓冲区，那部分只能靠反汇编，不能靠枚举。
  difficulty: 3
  prerequisites:
  - tech:security-product-inventory
  artifacts:
  - art:pe32
  - art:pe64
  outputs:
  - 事件类别与触发条件表
  - 字段可用性核对结果
  - 文档缺口清单
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: logman query -ets
    note: 列已启用的跟踪会话，先看哪些采集通道真的开着，而不是按文档假设。
  - cmd: wevtutil el
    note: 列全部事件通道；通道存在不代表有事件，也不代表产品在消费它。
  - cmd: fltmc filters
    note: 从过滤器挂载情况反推文件与注册表访问是否被拦截记录。
  procedure:
  - 先列已启用的跟踪会话，把每个会话的名字记下来，作为后续对照的基线。
  - 再列全部事件通道，名字里带厂商名或威胁字样的通道优先处理。
  - 用过滤器列表确认文件与注册表访问是否被接管，以及接管覆盖的是全盘还是特定卷。
  - 把会话、通道、过滤器三份结果交叉，按事件类别整理成表，每类标注触发条件与字段。
  - 对每个声称被采集的类别，换一台同版本机器复测一次，确认不是单机配置差异。
  - 最后把文档与实测对不上的地方列成缺口清单，标明是未验证还是已确认不存在。
  pitfalls:
  - 会话存在不代表事件被消费，记录与上报是两件事。
  - 事件字段集合随版本变化，按旧版字段解析会静默丢数据而不是报错。
  - 关掉日志通道不等于停止采集，内核缓冲仍可能被产品读取并上报。
- id: tech:userland-hook-mapping
  name: 用户态钩子测绘
  name_en: Userland Hook Mapping
  domain:
  - dom:av-evasion-edr
  parent: dom:av-evasion-edr
  def: 对比磁盘与内存中的系统库代码，定位被改写的函数入口与跳转补丁，判断哪些调用被接管。难点是版本差异与重定位造成的合法字节差异会大量误报，必须与同版本干净样本对照。
  detail: 场景是在被监控进程内部确认哪些系统调用被接管，进而判断哪条调用路径还在产品视野里。与内核回调盲区分析的区别是钩子在进程内、看得到参数，回调在内核里、只看得到事件；与脚本扫描边界的区别是那条针对某一类接口，本条针对整个导出面。注意三十二位进程加载的是另一套目录下的同名模块，拿六十四位基线去比会全错；累积更新与系统热补丁本身就会改函数体，必须用同版本干净副本对照；导出表里带转发标记的项没有函数体，不能当比对基线。
  principle: 用户态拦截要在调用发生前拿到参数，唯一可行的位置就是被监控进程里的系统库，产品把导出函数的入口改成一条跳转指令指向自己的模块，这正是钩子能被差分出来的根本原因：磁盘副本是原始字节，内存副本已被改写。覆盖边界同样清楚——只有经过被改写入口的调用才被拦，直接执行系统调用指令、或先把函数体复制出去再自己调用的代码都不经过该入口，所以测绘结果同时也是绕行路径的清单。误报高的原因是入口字节随版本与热补丁变化。
  difficulty: 3
  prerequisites:
  - tech:telemetry-surface-mapping
  artifacts:
  - art:pe32
  - art:pe64
  outputs:
  - 被接管函数清单
  - 补丁字节与跳转目标
  - 误报排除依据
  cost: medium
  false_positive_risk: high
  commands:
  - cmd: dumpbin /exports C:\Windows\System32\ntdll.dll
    note: 建立导出基线，确认要对照的函数确实由该模块导出，且没有转发到别处。
  - cmd: pe-sieve64.exe /pid {{pid}}
    note: 扫进程模块与内存异常，缩到少数几个可疑模块再逐个手工比对。
  - cmd: Get-FileHash -Algorithm SHA256 C:\Windows\System32\ntdll.dll
    note: 磁盘副本哈希作为基准，同名模块内存副本不一致时要先排除版本差异再下结论。
  procedure:
  - 先用导出列表建立基线，确认要对照的函数确实由该模块导出，带转发标记的项直接排除。
  - 记录磁盘副本的哈希与文件版本，并确认目标进程位数，三十二位进程要换另一套目录下的同名文件当基线。
  - 用内存扫描工具按进程标识扫一遍，把可疑模块缩到少数几个，它的输出只当候选不当结论。
  - 对每个候选模块，取对应导出函数在内存与磁盘两份副本里的起始字节比对，差异不足一条跳转指令长度的先跳过。
  - 反汇编差异处与跳转目标，确认落点在产品模块而不是系统模块，才判定为接管。
  - 换一台同版本的干净机器重复一次，两次结论不一致就标为未验证，不要用单机结果外推。
  pitfalls:
  - 只比函数首字节会把系统热补丁与编译器差异误判成钩子。
  - 32 位进程加载的是另一套目录下的副本，路径不同，拿 64 位基线比会全错。
  - 系统自带热补丁与安全产品的钩子在形态上高度相似，必须交叉验证。
- id: tech:kernel-callback-blindspot
  name: 内核回调盲区分析
  name_en: Kernel Callback Blindspot Analysis
  domain:
  - dom:av-evasion-edr
  parent: dom:av-evasion-edr
  def: 梳理产品依赖的内核通知回调类型与注册方式，判断哪些行为在回调视角下看不到或只能看到一部分。难点是回调项不导出、相关对象未文档化，注册顺序还决定谁先看到事件。
  detail: 场景是判断哪些行为在内核回调视角下看不到，通常用来评估依赖驱动监控的产品还剩多少盲区。与用户态钩子测绘的区别是回调拿到的是事件而不是调用现场，参数更少；与事件跟踪覆盖分析的区别是那条看事件提供者，本条看注册在驱动里的回调项。注意回调项不经过导出表，只能从驱动里找注册点或靠公开符号定位；同一类回调的注册顺序决定谁先看到事件；测试签名与完整性开关决定自研驱动能否加载，读不到这个状态就无从谈盲区。
  principle: 盲区来自回调机制本身的形状，不是产品实现得差：回调是事件发生后才被同步调用的代码，只拿到该事件声明的几个参数，调用者意图、缓冲区内容与原调用栈都不在其中，所以超出事件类型与参数范围的判断都做不了。其次回调按事件类型注册，只有进程、线程、映像加载、注册表与对象句柄这几类有通知点，不产生这些事件的路径天然不可见，例如直接访问卷设备对象就绕开了输入输出管理器的高度链。第三回调槽位固定，注册顺序决定先手。
  difficulty: 5
  prerequisites:
  - tech:security-product-inventory
  artifacts:
  - art:driver
  - art:pe64
  outputs:
  - 回调类型与注册者清单
  - 各类回调的可见范围边界
  - 未被覆盖的行为点
  cost: high
  false_positive_risk: medium
  commands:
  - cmd: driverquery /v /fo list
    note: 列驱动状态与文件路径，先认出哪些是产品的内核组件。
  - cmd: fltmc instances
    note: 列过滤器实例与挂载卷，判断拦截覆盖的是全盘还是特定卷。
  - cmd: bcdedit /enum {current}
    note: 查测试签名、调试与完整性相关开关，这些直接决定内核组件能否加载。
  procedure:
  - 先用驱动查询确认产品的内核组件有哪些，记下路径与运行状态。
  - 用过滤器实例看每类过滤器挂在哪些卷上，判断文件与注册表覆盖是全盘还是局部。
  - 查启动配置里的测试签名与调试开关，先确定自研驱动在这个环境能不能加载。
  - 从识别出的驱动模块里找回调注册的调用点，整理成回调类型与注册者的对照表。
  - 对每一类回调写出两列：能看到哪些参数，哪些实现路径不产生该事件。
  - 挑一条最容易验证的路径做实测，例如绕过过滤器直接访问卷，确认确实没有事件。
  - 换一次加载顺序复测，结论随顺序变化的部分要标为未验证。
  pitfalls:
  - 回调注册顺序决定谁先看到事件，换一个加载顺序结论就变了。
  - 部分回调只在特定对象类型上触发，按「全覆盖」假设会误判盲区。
  - 内核态看不到的行为，用户态也可能看不到，两边都要实测。
- id: tech:etw-ti-coverage-analysis
  name: ETW-TI 覆盖分析
  name_en: ETW-TI Coverage Analysis
  domain:
  - dom:av-evasion-edr
  parent: dom:av-evasion-edr
  def: 分析内核威胁情报类提供者覆盖的事件（内存分配、映像加载、句柄操作），判断哪些操作必然留痕。难点是订阅需要高权限，事件量巨大且字段语义在版本之间会变化。
  detail: 场景是评估在不装钩子的情况下还有哪些操作必然留痕，常用于判断某条路径值不值得走。与遥测面测绘的区别是本条只挖内核威胁情报这一类提供者，字段与触发条件要精确到事件；与内核回调盲区的区别是那条看回调，本条看事件流。注意提供者存在不代表默认会记录，没有订阅就没有事件；启用这类会话的权限门槛高于普通管理员，被测环境多半拿不到，结论只能标未验证；事件在多核上可能乱序，按时间戳直接串因果会得到错误链条。
  principle: 这类事件在核心态生成，检查点落在内核既有的处理路径上而不是用户态接口，所以不受调用方式影响：直接执行系统调用、复制系统库函数体、反射加载映像，最终都要经过内核那几处例程，事件在那一刻产生，即使用户态钩子被摘掉也不影响。盲区同样在这里——事件只记录内核例程的结果，例如哪块内存被分配、哪个映像被加载，不含调用者的完整上下文；而且没有订阅者时内核直接跳过事件生成，所以断掉订阅比绕过检测省事得多，代价只是需要先拿到足够高的权限。
  difficulty: 4
  prerequisites:
  - tech:telemetry-surface-mapping
  artifacts:
  - art:pe64
  - art:driver
  outputs:
  - 事件类型与触发条件清单
  - 必然留痕的操作集合
  - 订阅权限与可用性结论
  cost: high
  false_positive_risk: medium
  commands:
  - cmd: logman query providers | findstr /i "Threat-Intelligence"
    note: 确认该提供者在目标系统上是否存在及其 GUID，不存在就不必再往下查。
  - cmd: logman query -ets
    note: 看有没有已启用的会话在订阅它；提供者存在但没人订阅时不会产生任何事件。
  procedure:
  - 先确认该提供者在目标系统上存在，记下名字与标识；不存在就写为不可用，不再往下查。
  - 列已启用的跟踪会话，检查有没有会话在订阅它；提供者存在但无人订阅时一条事件都不会有。
  - 以当前权限尝试启用一次会话，记录是否被拒绝，被拒绝就按未验证处理。
  - 有事件的前提下，按内存、映像、句柄三类各抓一段基线，把字段名抄下来。
  - 同一个动作分别走常规接口与直接系统调用各做一次，比对事件条数差。
  - 用事件里的进程与线程标识归并乱序事件，再谈时间先后。
  pitfalls:
  - 提供者存在不代表默认会话会记录，没有订阅就没有事件。
  - 订阅需要高权限，在被测环境中往往拿不到，结论只能标注为未验证。
  - 多核下事件顺序可能倒序，按时间戳直接串因果会得到错误链条。
- id: tech:amsi-scan-boundary
  name: 脚本扫描边界
  name_en: Script Scan Boundary Analysis
  domain:
  - dom:av-evasion-edr
  parent: dom:av-evasion-edr
  def: 弄清脚本引擎与运行时在哪些时点把内容提交给扫描接口，哪些执行路径根本不经过它。难点是不同引擎与版本的调用点不同，且扫描结果存在缓存，重复提交不再触发。
  detail: 场景是弄清脚本内容在什么时点被交给扫描接口，以及哪些执行路径根本不经过它。与用户态钩子测绘的区别是本条盯的是一类内容提交接口，不是整个导出面；与遥测面测绘的区别是那条列事件类别，本条要给出提交点与缓存行为的实测。注意扫描结果会按提交内容缓存，同一段脚本第二次运行时行为完全不同，容易得出反向结论；不经扫描接口的路径仍受行为监控覆盖，绕过扫描不等于绕过检测；直接关掉防护组件比任何脚本行为都显眼，收益与代价严重不对称。
  principle: 这个接口是脚本引擎主动调用的用户态出口，不是内核过滤：引擎在把一段内容编译执行前把缓冲区交出去，第三方产品注册为提供者后就能在这条链上看到即将执行的明文。这解释了为什么编码或压缩后再解码执行依旧会被抓——扫描发生在解码之后、交给引擎那一步，明文必然出现一次。反过来说，某条路径的引擎不调用这个接口，内容就不经过它；把内容做成已编译的中间码或机器码再交付，扫描面就退化成文件特征。缓存按提交内容索引，是最常见的误判来源。
  difficulty: 3
  prerequisites:
  - tech:telemetry-surface-mapping
  artifacts:
  - art:script
  - art:pe-dotnet
  - art:pe64
  outputs:
  - 提交点清单与触发条件
  - 不经过扫描的执行路径
  - 缓存行为实测记录
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: Get-MpComputerStatus
    note: 查防护组件状态；实时防护关闭时扫描接口的行为与开启时完全不同，基线必须记录。
  - cmd: wevtutil el | findstr /i "Defender"
    note: 找检测相关的事件通道，用日志确认某次提交到底有没有被扫描。
  procedure:
  - 先记录防护组件状态作为基线，实时防护关闭时后面的所有结论都不可用。
  - 找到与检测相关的事件通道，确认能读到内容被判这一类记录。
  - 用一段明文脚本跑一次，确认日志里出现对应事件；没有事件说明该路径不提交或有缓存。
  - 改动一个字节后重跑同一段内容，以排除缓存干扰，确认是缓存而不是没有扫描。
  - 换另一条执行路径跑同一内容，记录哪些路径完全没有事件。
  - 对没有事件的那条路径再查行为监控，确认是否另有记录，避免把没有扫描当成没有检测。
  - 把提交点、不提交路径与缓存键整理成三列结论，未验证的标注清楚。
  pitfalls:
  - 扫描结果有缓存，第二次测试的行为会完全不同，容易得出反向结论。
  - 不经过扫描接口的路径依然被行为监控覆盖，绕过扫描不等于绕过检测。
  - 直接关掉扫描接口比任何正常脚本行为都显眼，收益与代价严重不对称。
- id: tech:driver-and-memory-integrity-check
  name: 驱动与内存完整性核查
  name_en: Driver and Memory Integrity Check
  domain:
  - dom:av-evasion-edr
  parent: dom:av-evasion-edr
  def: 评估目标环境的驱动签名强制、虚拟化安全与内存完整性策略，判断哪些需要内核态或可执行内存的手法在此环境不可用。难点是策略状态要从多个接口交叉确认，不同镜像默认值差异很大。
  detail: 场景是在选手法之前先确定哪些类别在这个环境根本不可用，例如未签名驱动、可执行内存、跨进程代码写入。与安全产品清单测绘的区别是那条列组件，本条读强制策略；与内核回调盲区的区别是那条看监控范围，本条看执行约束。注意配置值与运行值必须分开看，界面上常见已配置未运行的中间态，此时策略并不生效；本地读数可能被组策略覆盖，来源要一起记；服务器版与客户端的默认值不同，同一份脚本在两处可能得到相反结论。
  principle: 这些开关不是策略提示，而是由虚拟化层与内核强制的执行约束：内存完整性让内核代码运行在虚拟化层维护的第二层地址转换下，可写页不再可执行，于是先分配可写可执行内存再写入代码这套做法在内核态直接不成立；驱动签名强制在内核加载映像时校验签名，绕过它需要先有内核执行权，构成循环依赖；控制流保护在间接调用点校验目标。约束落在加载器与被调用方这一侧，所以读状态就能判定整类手法是否可行，不必逐个尝试。
  difficulty: 2
  prerequisites:
  - tech:security-product-inventory
  artifacts:
  - art:driver
  - art:pe64
  outputs:
  - 策略状态与生效范围
  - 不可用手法清单
  - 交叉确认记录
  cost: low
  false_positive_risk: low
  commands:
  - cmd: Get-CimInstance -ClassName Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard
    note: 查虚拟化安全与内存完整性的运行状态，重点看是「已配置」还是「正在运行」。
  - cmd: bcdedit /enum {current}
    note: 查启动配置里的测试签名与调试开关，这些开关决定未签名内核组件能否加载。
  - cmd: Get-ProcessMitigation -System
    note: 查系统级漏洞缓解默认值，判断目标进程会不会被强制加上控制流保护。
  procedure:
  - 先查启动配置里的测试签名与完整性开关，这两个没开，未签名驱动连加载机会都没有。
  - 读虚拟化安全的运行状态与两个服务字段，把已配置与正在运行分成两列记录。
  - 对每个处于已配置未运行的服务单独标注，不要把它当成已生效。
  - 读系统级缓解默认值，区分系统默认与按进程强制，两者生效范围不同。
  - 把未签名驱动、可执行内存、跨进程写入三类手法逐个对着上面读数标注可用或不可用。
  - 用一条最小验证动作复核，例如试着申请一次可写可执行内存，结果比读数更可靠。
  pitfalls:
  - 内存完整性开启时未签名驱动无法加载，但界面上常显示为「已开启未重启」这类中间态。
  - 本地读数可能被组策略覆盖，配置值与实际生效值必须分开记录。
  - 开启了内存完整性的环境里，可执行内存的分配行为与普通环境差别很大。
- id: tech:detection-rule-differential
  name: 检测规则差分
  name_en: Detection Rule Differential
  domain:
  - dom:av-evasion-edr
  parent: dom:av-evasion-edr
  def: 用公开规则集与多引擎结论做差分，逐步收窄到命中的具体字节、字符串或结构特征。难点是引擎只回结论不回证据，收敛只能靠单变量改动与重复扫描，改动之间还会相互影响。
  detail: 场景是样本已被判却不知道命中哪一条特征时，用黑盒差分把范围收窄到具体字节或结构。与静态特征面测绘的区别是那条自查五条判据面，本条是在已知被判的前提下反推归因；与遥测面测绘的区别是那条看运行时，本条只看文件侧结论。注意单变量是归因的前提，一次改多处结论就无法归因；规则集版本必须固定，跨版本比较没有意义；任何字节改动都会让签名失效，别把签名状态变化当成检测结论变化。
  principle: 检测引擎只回结论不回证据，判定是多个判据的加权或布尔组合，而且不告诉你哪一项贡献了分数，所以只能反向做黑盒差分：其余输入全部冻结、只动一个特征，如果结论翻转，说明该特征落在这条判定链的某个必要位置。可归因的前提是同一输入在同一规则集版本上必须给出同一结论，而缓存、多引擎差异与签名状态都会破坏这个前提，所以每轮都要先重算哈希、固定规则集版本，再用同一组命令复测，否则翻转可能来自环境而不是改动。
  difficulty: 3
  prerequisites:
  - tech:static-detection-surface-recon
  - tech:telemetry-surface-mapping
  artifacts:
  - art:pe32
  - art:pe64
  - art:shellcode
  - art:script
  outputs:
  - 命中的规则与偏移
  - 单变量改动与结论对应表
  - 收敛后的最小特征集
  cost: medium
  false_positive_risk: high
  commands:
  - cmd: yara -r {{out}} {{binary}}
    note: 让 {{out}} 指向本地规则目录，逐条命中能定位到具体规则族与偏移。
  - cmd: capa -v {{binary}}
    note: 看能力匹配的详细命中位置，判断命中的是导入、字符串还是指令组合。
  - cmd: sigcheck -a -h -nobanner {{binary}}
    note: 每次改动后重算哈希与签名状态，避免把改动带来的签名失效误当成检测变化。
  procedure:
  - 先记下原始样本的哈希与签名状态，作为后续每一轮的对照基准。
  - 用固定版本的规则目录递归扫一遍，把命中的规则名与偏移抄下来。
  - 再看能力匹配的详细位置，判断命中的是导入、字符串还是指令组合。
  - 挑一个命中项做单点改动，其余一律不动，改完重算哈希确认文件真的变了。
  - 重跑同一组命令比对结论，翻转即归因，没翻转就换下一条继续。
  - 每轮把改动点与结论写进对照表，最后取所有翻转项的合集作为最小特征集。
  - 换一组规则集版本复测一次，标注哪些结论依赖版本。
  pitfalls:
  - 一次改多个点会导致结论无法归因，必须保持单变量。
  - 规则集版本不同结论就不同，比较前先固定规则集版本。
  - 多引擎的「未检出」只说明当时没命中，不代表该特征没被记录。
