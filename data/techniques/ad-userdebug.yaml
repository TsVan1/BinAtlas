# BinAtlas 知识库 · 技术 · dom:ad-userdebug
# 规范：03-DATA-SCHEMA.md §2.2

- id: tech:user-mode-attach-freeze
  name: 用户态附加与冻结
  name_en: User-Mode Attach and Freeze
  domain:
  - dom:ad-userdebug
  parent: dom:ad-userdebug
  def: 把调试器挂到已运行进程并暂停其线程，获得可控的静止现场。难点是附加窗口与目标的反调试初始化竞争，慢一步现场就已被改写。
  detail: 场景是目标已经跑起来、关键校验或崩溃已经发生，要在它继续改写状态之前抢到一个静止现场。与运行时模块映射的区别是附加只负责停下、不负责看懂，停稳之后才有基址与内存可谈；与多线程断点同步的区别是附加只是一次性的进入动作，之后的线程调度交给断点与单步各自处理。注意点：Linux 是否允许附加由系统参数 ptrace_scope 决定，发行版常把它设成只允许附加自己的后代进程，对陌生 PID 直接附加会得到权限拒绝而不是毫无反应；已被别的调试器跟踪的进程再次附加必然失败，TracerPid 非 0 就是回执；附加靠向目标投递停止信号实现，目标处于不可中断睡眠时附加会一直等下去；附加时机直接改变结论，跑完关键校验再附加看到的路径可能完全不同。
  principle: 冻结来自停止信号的投递语义：Linux 的附加会把停止信号投给整个线程组，组内线程一起进入组停止，调试器再逐个接管，所以拿到的是同一时刻的像而不是逐个线程陆续停下的拼图；Windows 的调试附加则先挂起目标全部线程，之后每次继续只恢复报告了调试事件的那一个线程，其余保持挂起，这是同一种语义的另一种实现。反调试之所以能抢在前面，是因为附加只能发生在进程建立之后：目标在初始化时读自身的跟踪状态、或对自身发起跟踪，那时调试器还没到场，读到的是「无人跟踪」，之后的附加改变不了这个已经做出的判断。
  difficulty: 2
  prerequisites: []
  artifacts:
  - art:pe64
  - art:elf64
  outputs:
  - 附加成功后的线程与寄存器快照
  - 目标当前的挂起范围
  - 附加被拒绝的原因判定
  cost: low
  false_positive_risk: low
  commands:
  - cmd: gdb -q -batch -p {{pid}} -ex "info threads" -ex "thread apply all bt"
    note: 按 PID 附加后一次性打印全部线程与栈，批处理模式便于脚本化
  - cmd: cat /proc/{{pid}}/status | grep -E "^(State|TracerPid)"
    note: 确认进程是否已被其他调试器占用，TracerPid 非 0 表示已被跟踪
  procedure:
  - 先读目标的进程状态，看跟踪者标识是否为 0，非 0 说明已有调试器占着，此时附加只会失败。
  - 若状态是 D（不可中断睡眠），等它回到可中断状态再动手；此时强行附加表现为长时间阻塞而不是报错。
  - 执行按 PID 附加并一次性打印线程与栈的批处理命令，输出里列出了目标线程与各线程栈才算附加成功、现场已冻结。
  - 附加成功后立刻复核跟踪者标识，看到它变成调试器的 PID，才算拿到了控制权。
  - 记下这一刻的线程数与线程清单，之后出现新线程就说明有线程在窗口内被创建过。
  - 需要一并观察子进程时打开跟进子进程的选项，否则父进程冻结而子进程照跑，现场并不完整。
  - 收尾必须先分离再退出调试器；直接结束调试器进程时目标可能仍停在停止状态，需要另行恢复。
  pitfalls:
  - 目标处于不可中断睡眠状态时 ptrace 附加会失败或长时间阻塞，需先让目标退出该状态
  - 附加后目标 fork 出的子进程默认不被跟进，父进程冻结时子进程仍在运行，现场并不完整
- id: tech:runtime-module-mapping
  name: 运行时模块映射
  name_en: Runtime Module Mapping
  domain:
  - dom:ad-userdebug
  parent: dom:ad-userdebug
  def: 枚举目标已加载模块与段的实际基址，把静态地址换算成运行时地址。难点是地址随机化与重定位让同一函数每次落点不同，符号还常被剥离。
  detail: 场景是手里只有静态地址（反汇编里的函数、脚本里的偏移），要在活进程里下断点或读内存，就得先知道它这一次落在哪。与用户态附加的区别是附加只给出「停住」，这一步给出「在哪」；与运行时内存读写的区别是本步只做地址算术，不碰任何字节。注意点：基址要取该文件偏移为 0 的那段映射的起点（通常是最低地址），同一模块会被拆成可执行、只读、可写等多段，随手挑一个可执行段算出来的基址会整体偏移；位置无关映像用基址加偏移，非位置无关映像直接用静态虚拟地址，两种情形混用会把调用点算错；Windows 上要看装载器实际给的基址，文件头里的建议值只是链接期约定；映射表会随延迟加载变化，分析前与分析中要各取一次。
  principle: 为什么必须换算：链接期写进指令与数据的是按文件假想基址编出来的地址，位置无关映像里这些是相对基址的偏移，非位置无关映像里是相对建议基址的值外加若干需要重定位修正的绝对地址；而装载器把模块放在哪由地址随机化与当时的地址空间占用决定，同一模块两次启动可以落在完全不同的地址，偏移却不变。调试器做换算的依据是装载器维护的模块链表，它记录每个模块本次进程的装载基址与路径，映射表与共享库列表不过是同一份事实的两种视角。所以运行时地址 = 模块基址 + 文件内偏移，这个加法在模块被换掉或重新加载后立刻失效，这也是为什么要记下当次基址而不是只记结果。
  difficulty: 2
  prerequisites:
  - tech:user-mode-attach-freeze
  artifacts:
  - art:pe64
  - art:elf64
  - art:so
  outputs:
  - 模块基址与大小表
  - 静态地址到运行时地址的换算表
  - 关键函数在内存中的落点
  cost: low
  false_positive_risk: low
  commands:
  - cmd: cat /proc/{{pid}}/maps | grep -E "r-xp"
    note: 取可执行映射区间，基址取文件偏移为 0 的那段映射的起点（通常是最低地址，往往是只读段），首个 r-xp 段不一定是基址
  - cmd: gdb -q -batch -p {{pid}} -ex "info sharedlibrary"
    note: 列出共享库及加载地址，输出里的起始地址列即基址
  - cmd: readelf -l {{binary}} | grep -A1 LOAD
    note: 静态查看段的虚拟地址与文件偏移，用于基址换算与映射对照
  procedure:
  - 先取目标映射表并只留可执行映射，确认目标确实加载了你要看的模块，没出现就别往下算。
  - 找出该模块文件偏移为 0 的那一段映射并记下起点，这才是基址；同一模块有多段时可执行段起点不一定是最低的。
  - 用调试器列一次共享库与加载地址，与上一步的基址交叉核对，两处一致再拿去做减法。
  - 静态侧读段表，确认目标符号落在哪个段、该段虚拟地址与文件偏移差多少，避免把文件偏移当虚拟地址用。
  - 按情形换算：位置无关映像用基址加偏移，非位置无关直接用静态虚拟地址；算完回读该地址头几个字节，像指令才算命中。
  - 把本次基址与换算结果一起记下，模块重新加载后同一偏移会落到新基址，旧地址作废。
  pitfalls:
  - 同一模块会出现在多个映射区间（可执行、只读、可写各一段），拿错区间起点算出的基址会整体偏移
  - 位置无关映像要拿符号地址加基址，非位置无关可直接用静态虚拟地址，两种情形混用会把调用点算错
- id: tech:memory-read-write-patch
  name: 运行时内存读写
  name_en: Runtime Memory Read/Write and Patching
  domain:
  - dom:ad-userdebug
  parent: dom:ad-userdebug
  def: 在目标地址空间读结构体、改指令字节，验证对数据布局与分支条件的假设。难点是页权限与写时复制：只读页直接写会崩，改完还要处理校验。
  detail: 场景是把结构体当场摊开与代码里的字段对照、把一条跳转改成空操作来验证分支作用，或在内存里造一个本该很晚才出现的状态。与运行时模块映射的区别是那一步解决「地址对不对」，这一步才真正读字节；与条件断点的区别是这里会改目标内存，一旦落笔目标行为就变了，观察者身份随之变成参与者。注意点：可执行页默认只读，用户态直接写是访问违例而不是写入失败；调试器代写的字节通常落在该进程的私有副本上，磁盘文件不受影响，所以重启后目标会「自愈」；ARM 上的指令缓存与数据缓存不保证一致，改完代码要显式刷指令缓存，x86 不需要；落笔前必须把原始字节记下来，否则无法还原，代码段校验也会立刻命中。
  principle: 为什么直接写会失败：页的保护位由页表承载，写入是否允许在硬件层面裁决，用户态写只读页会触发故障，被内核翻译成访问违例；要让写成功只有两条路，一是先改页保护，二是让内核替你做这次写。调试器一般走后者：写内存请求由内核完成拷贝，走的是允许落到私有只读写时复制页的路径，因此往共享库的代码页下软件断点不必先改权限，改的也只是该进程的私有副本。代码完整性校验之所以还能发现它，是因为补丁要么改掉了映像页的字节，要么把只读文件映射变成了私有可写页，两个痕迹都留在页与内容上，比对一次就暴露。
  difficulty: 3
  prerequisites:
  - tech:runtime-module-mapping
  artifacts:
  - art:pe64
  - art:elf64
  - art:memory-dump
  outputs:
  - 关键结构体的内存快照
  - 已验证的指令级补丁
  - 页权限变更记录
  cost: low
  false_positive_risk: medium
  commands:
  - cmd: gdb -q -batch -p {{pid}} -ex "x/16gx $rsp" -ex "info proc mappings"
    note: 从栈指针附近读内存并对照映射，确认读的是有效页而不是野地址
  - cmd: gdb -q -batch -p {{pid}} -ex "set *(unsigned char *)$rip = 0x90"
    note: 把当前指令首字节改成空操作；写只读代码页前要先改页权限才能落笔
  - cmd: objdump -d -M intel {{binary}} | head -50
    note: 静态对照反汇编确认补丁点原始指令，避免改错字节位置
  procedure:
  - 先用映射表确认目标地址落在哪个区间、什么权限，确认是有效页再读，否则读到的是空洞或野地址。
  - 从寄存器或结构体指针出发按宽度读出内存，与已知常量、指针范围对照，确认读到的确实是目标结构。
  - 在静态反汇编里找到要改的指令，把原始字节与文件偏移记下来，这是之后还原的唯一依据。
  - 经调试器写入新字节（例如把指令首字节改成空操作），写完立刻回读同一地址，字节变了才算落笔。
  - 让目标继续执行并观察行为是否按预期改变；没变化说明改错位置或那条指令并不决定分支。
  - 需要还原时按记下的原始字节写回并回读核对；在 ARM 上改过代码还要刷指令缓存，否则执行的可能仍是旧指令。
  pitfalls:
  - 直接向可执行页写入会触发访问违例，Linux 下需借 ptrace 写入或先改保护，Windows 下需先改成可写
  - 补丁不记录原始字节会导致无法还原，也会让按节区取校验和的检测立刻命中
- id: tech:single-step-execution
  name: 单步执行跟踪
  name_en: Single-Step Execution Tracing
  domain:
  - dom:ad-userdebug
  parent: dom:ad-userdebug
  def: 逐条执行指令并读寄存器与标志位，把模糊的控制流变成可核对的序列。难点是陷阱标志可被目标检测，单步开销还会让带超时的目标提前退出。
  detail: 场景是分支条件看不明白、或某个值在第几条指令上被写坏，需要把推断换成逐条看到。与断点的区别是断点只在指定位置停，单步不预设位置、代价是每条指令都要付一次停下的开销；与栈回溯的区别是单步给出时间序列，回溯只给某一刻的调用链。注意点：单步的粒度是指令而不是源码行，优化过的代码一行可对应多条指令；进入系统调用会整体执行到返回，想看内核侧要换系统调用追踪；单步是数量级的开销放大，带超时或计时反调试的目标会因此提前退出；跳转密集的代码上，一次间接跳转就能把你带到完全无关的模块。
  principle: 为什么逐条能停住：这不是调试器自己在算，而是处理器的调试设施——标志寄存器里的陷阱标志置位后，CPU 每执行完一条指令就产生一次调试异常，内核再把它转成停止事件交给调试器，所以粒度天然是指令级且不需要往代码里插字节。代价也在这里：每条指令都要经过一次异常、一次内核处理、一次与调试器往返，热循环里几百万条指令的单步在实践中不可行。每次停止之后陷阱标志会失效、需要重新置位，这解释了为什么「设一次就持续单步」的期待会落空；同理，目标只要读一次标志位或度量指令间的耗时，就能察觉自己正在被单步。
  difficulty: 2
  prerequisites:
  - tech:memory-read-write-patch
  artifacts:
  - art:pe64
  - art:elf64
  outputs:
  - 逐指令执行轨迹
  - 关键寄存器变化记录
  - 条件分支的实际走向
  cost: low
  false_positive_risk: medium
  commands:
  - cmd: gdb -q -batch {{binary}} -ex "set disassemble-next-line on" -ex "starti"
      -ex "stepi 5" -ex "info registers rip rax"
    note: 从入口单步五条指令并打印寄存器，适合脚本化确认入口分支条件
  - cmd: gdb -q -batch -p {{pid}} -ex "si" -ex "x/i $pc"
    note: 对已运行进程单步一条，并显示下一条待执行指令
  procedure:
  - 先让目标停在入口或某个已知位置，确认指令指针指向的是要观察的代码，而不是装载器或运行时初始化。
  - 打开下一条指令的显示再执行若干条单步，看每步打印的指令是否按静态反汇编的顺序推进。
  - 每步对照寄存器与标志位，把比较结果与实际走向记下来；走向与比较结果吻合才算看懂了这条分支。
  - 遇到调用或跳转先判断要不要跟进去：不跟进则整段被当作一条指令执行完，跟进去就会离开当前函数。
  - 走到可疑处读一次下一条待执行指令，与静态反汇编对照；地址对不上说明执行流已经跳到别处。
  - 单步到系统调用附近就改用系统调用追踪，继续单步只会直接跨到返回之后，看不到内核侧动作。
  pitfalls:
  - 单步遇到系统调用会直接执行到返回而不进入内核，想看内核侧行为必须改用系统调用追踪
  - 每次停止都会清掉陷阱标志，连续单步要逐步重新进入，不能指望设置一次就一直生效
- id: tech:call-stack-unwinding
  name: 运行时栈回溯
  name_en: Runtime Call Stack Unwinding
  domain:
  - dom:ad-userdebug
  parent: dom:ad-userdebug
  def: 由栈内容与展开信息还原调用链，定位是哪个调用点触发了敏感操作。难点是优化后的代码没有帧指针，异常帧与尾调用会打断链条。
  detail: 场景是要回答「这段敏感操作到底是谁调的」：在断点命中处往上翻调用链，比读反汇编逆推调用者快得多。与单步的区别是回溯不改变执行、只解释已有的栈；与异常分发追踪的区别是这里看的是正常调用路径，异常与信号处理帧要另看。注意点：优化编译常省略帧指针，按帧链硬走会得到错位的调用链，此时必须靠展开表；被剥离符号的二进制只给裸地址，要先补模块基址再对符号；栈迁移或伪造帧能让回溯给出看似合理却完全虚假的链；异常帧与信号帧的栈布局与普通调用不同，混在一条链上会断。
  principle: 为什么能从栈里读出调用关系：调用指令在进入被调函数前把返回地址压栈，函数再用固定序言保存旧的帧指针，内存里于是形成一条「帧指针指上一帧、帧内固定位置存返回地址」的链，沿链走就能还原调用序列，前提是代码真的按这个约定生成。优化常省略帧指针以多出一个寄存器，链就断了，编译器因此在展开表里记录每个指令地址处栈指针如何变化、返回地址存在哪里，展开器按当前指令地址查表即可算出一帧，无需帧指针——异常能穿过没有帧指针的代码也是靠这张表。栈扫描式回溯则靠「栈上的值恰好落在可执行区间」这一启发，残留的旧返回地址会让它多报出不存在的帧。
  difficulty: 3
  prerequisites:
  - tech:runtime-module-mapping
  artifacts:
  - art:pe64
  - art:elf64
  - art:memory-dump
  outputs:
  - 调用链与返回地址列表
  - 可疑调用点定位
  - 栈布局推断
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: gdb -q -batch -p {{pid}} -ex "bt full"
    note: 展开完整调用栈并打印局部变量，符号缺失时只能看到裸地址
  - cmd: eu-stack -p {{pid}}
    note: 用 elfutils 从 procfs 读栈并展开，适合目标没有调试符号的场景
  procedure:
  - 在命中处先取一次完整回溯，看是否有函数名；全是裸地址说明缺符号，先补符号再谈结论。
  - 检查相邻两帧的返回地址是否都落在可执行映射区间内，落不进去的那一帧就是错的。
  - 若某帧之后链突然断裂或跳进不相关模块，改用按展开表实现的回溯工具，两者结果一致才可信。
  - 逐帧核对调用点：返回地址是调用指令的下一条，减去调用指令长度才对应源码里的那一行。
  - 盯住敏感操作那一帧的直接调用者，它才是触发者，更上层只是恰好经过。
  - 栈看起来合理但业务上讲不通时，怀疑栈被伪造或迁移过，回到内存视图核对栈指针与帧指针的实际关系。
  pitfalls:
  - 代码以省略帧指针方式编译时，按栈基址链回溯会得到错位的调用链，需靠展开信息或栈扫描校正
  - 栈上残留的旧返回地址会被误判成帧，深栈回溯必须与代码段地址范围交叉验证
- id: tech:exception-dispatch-tracing
  name: 异常分发追踪
  name_en: Exception Dispatch Tracing
  domain:
  - dom:ad-userdebug
  parent: dom:ad-userdebug
  def: 观察异常从产生到被处理器接管的路径，识别靠异常做控制流或做自检的代码。难点是首次与二次异常机会、信号传递与继续执行的语义各不相同。
  detail: 场景是目标大量用异常或信号做控制流（校验失败触发异常、再在处理器里改道），或崩溃点与真正的出错点不在同一处。与单步的区别是单步只跟正常路径，异常路径要在分发环节拦；与栈回溯的区别是回溯只看调用链，不看这次是谁接管了异常。注意点：Windows 上异常先报给调试器（首次机会），调试器放行后才轮到进程内处理器，一味放行就会漏掉触发点；Linux 的同步错误由内核合成信号，处理器正常返回会重新执行出错指令，不改上下文就会反复触发；被屏蔽的同步信号在 Linux 上不会挂起等待，而是按默认动作终止进程；C++ 与 Rust 的展开也用异常机制，不要把每一次都当成对抗。
  principle: 为什么异常能被当成控制流：异常与信号不是语言构造，而是处理器在内核指令出错或主动陷入时生成的事件，它绕过正常返回路径，把控制权直接交给一张按优先级排列的处理器表；处理器可以改掉保存的上下文再返回，于是原本要失败的指令被跳过或被改成成功——这条路径在静态视图里只剩一段没人直接调用的代码，所以只能动态看。调试器能看到它，是因为分发链的第一站通常是调试器：Windows 的首次机会异常先报给调试器再由调试器决定是否放行，Linux 的同步信号同样先以停止事件形式报给跟踪者。放行与否本身就是「看见触发点」与「让目标自愈」的取舍。
  difficulty: 4
  prerequisites:
  - tech:call-stack-unwinding
  artifacts:
  - art:pe64
  - art:elf64
  outputs:
  - 异常类型与触发指令
  - 处理器链与接管顺序
  - 控制流是否被异常改写
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: gdb -q -batch {{binary}} -ex "handle SIGSEGV stop print pass" -ex run
    note: 在段错误处停下但仍把信号传给目标，用于区分异常控制流与真实崩溃
  - cmd: cat /proc/{{pid}}/status | grep -E "^(SigCgt|SigBlk)"
    note: 查看目标捕获与屏蔽的信号位图，未捕获的同步信号会直接终止进程
  procedure:
  - 先给目标信号设成停下但继续传递给目标，这样既保留触发点，又不打断它自己的处理器。
  - 跑到触发处，记下异常类型与出错指令地址，这是区分真崩溃与有意为之的起点。
  - 读目标捕获与屏蔽的信号位图：没被捕获的同步信号会直接终止进程，捕获了才说明有人准备接管。
  - 确认接管者是谁：调试器放行之后接管的是进程内处理器，接管顺序决定改道的最终效果。
  - 让处理器返回并观察后续：同一地址再次触发说明它没改上下文，只是靠重试，控制流并未真正改道。
  - 结论要与真实崩溃区分：只在特定输入下出现、且之后执行恢复正常，才算有意的异常控制流。
  pitfalls:
  - 把信号设成不停止会让调试器错过异常点，而靠异常做控制流的代码正需要调试器看不见
  - Windows 首次异常交给进程内处理器后不再上报调试器，只断在第二次机会会漏掉真正的触发点
- id: tech:multithread-breakpoint-sync
  name: 多线程断点同步
  name_en: Multithread Breakpoint Synchronization
  domain:
  - dom:ad-userdebug
  parent: dom:ad-userdebug
  def: 在断点命中时冻结全部线程并在恢复时重新布点，避免只停一个线程导致状态被并发改写。难点是线程创建与销毁时机不固定，新线程会漏掉断点。
  detail: 场景是多个线程并发跑同一段逻辑，断点一停别的线程还在改数据，读到的结构体是拼接出来的。与用户态附加的区别是附加只停一次，这里关心每次停下与恢复时线程集合是否一致；与条件断点的区别是这里解决「谁在跑」，条件断点解决「什么时候停」。注意点：不同调试器的默认停止范围不同，有的只停命中线程、有的停全部，实测一次线程清单比看文档可靠；运行期新建的线程默认不在跟踪范围内，必须在创建事件里补上，否则它踩到断点字节时会因无人接管而把进程带崩；全停还会引入死锁风险——持锁线程被停、其他线程等它，观察窗口本身改变了程序行为。
  principle: 为什么必须全停：停止与恢复是逐线程的，硬件断点的状态按线程上下文保存，软件断点虽然写在共享代码页上对全体可见，但谁在跑、谁被停是每个线程各自的调度状态；只停命中线程时，其余线程仍在同一段临界区推进，而你的几次独立读之间没有原子快照，结构体因此会撕裂。恢复时还要先踢掉断点、单步执行原始指令、再把断点装回，这个窗口里若有别的线程路过同一地址，就会踩在已恢复成原指令的位置上漏掉断点。新线程之所以漏跟踪，是因为跟踪关系是建立时逐个指定的，线程创建事件不会继承已有的断点与暂停状态，必须显式补设。
  difficulty: 3
  prerequisites:
  - tech:user-mode-attach-freeze
  artifacts:
  - art:pe64
  - art:elf64
  outputs:
  - 全线程停止点与栈快照
  - 并发状态一致性判定
  - 新建线程的断点补设记录
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: gdb -q -batch -p {{pid}} -ex "set scheduler-locking on" -ex continue
    note: 只让当前线程推进、其余线程保持停止，观察窗口内不会被并发改写
  - cmd: gdb -q -batch -p {{pid}} -ex "info threads" -ex "thread apply all bt"
    note: 命中后一次性抓全部线程栈，确认是否有线程在窗口内继续推进
  procedure:
  - 命中后先取全部线程清单与栈，看到多条线程各自停在不同位置才算全停；只列出一条说明别的线程还在跑。
  - 对当前线程打开调度锁再继续，让其余线程保持停止，窗口内的进展就只来自被观察线程。
  - 在窗口内多次读同一结构体，取值稳定说明没有并发写入；前后不一致就说明还有线程在跑。
  - 盯住线程数是否变化，出现新线程说明它在窗口内被创建，需要为它补设断点与暂停。
  - 恢复前确认断点处原始指令已执行过一次、断点已重新装回，否则恢复后第一次经过会漏停。
  - 判断死锁风险时检查被停住的线程是否持有别人正在等的锁，必要时换成只停当前线程的方式观察。
  pitfalls:
  - 只停住命中线程时其余线程会继续改被观察的数据，结构体可能读到撕裂状态
  - 运行期新建的线程不会继承断点与暂停状态，必须在创建后补设，否则会漏跟踪
- id: tech:conditional-breakpoint-watch
  name: 条件断点与数据观察
  name_en: Conditional Breakpoints and Data Watchpoints
  domain:
  - dom:ad-userdebug
  parent: dom:ad-userdebug
  def: 只在条件成立或某块内存被访问时中断，避免在热路径上反复停住。难点是条件表达式在目标上下文求值，写错会改状态或让目标卡死。
  detail: 场景是热函数被调用几百万次而只有某次参数特殊，或要抓出「这块内存是谁改的」。与普通断点的区别是普通断点每次命中都停，条件断点把筛选搬到调试器一侧；与内存读写的区别是这里只观察、默认不改目标。注意点：条件表达式在目标上下文里求值，里面一旦出现函数调用就会真的执行目标代码，副作用与死锁都可能发生；条件里引用寄存器要按当前架构命名，跨架构照抄会静默失效；硬件观察点数量受处理器调试寄存器个数限制，监视长度只能是 1、2、4、8 字节之一，跨边界要拆成多个；软件观察点靠单步实现，命中频繁时会把执行拖到不可用。
  principle: 为什么条件断点会变慢：条件并不在目标代码里，每次命中都先把目标停下来、把控制权交给调试器，由调试器在目标上下文里求值这个表达式，成立才通知你、不成立就悄悄继续——于是每次路过断点都要付一次「停止、求值、恢复」的完整代价，命中率越高这份固定开销累积得越可怕，热循环里甚至比逐条单步还慢，因为单步至少没有反复改写与恢复字节的额外往返。观察点的机制完全不同：它把地址与访问长度写进处理器的调试寄存器，由硬件在每次访存时比较，未命中的访问几乎零成本，只有命中才陷入；代价是这类寄存器只有几个，用完之后调试器只能退化成单步比较，也就回到了最慢的情形。
  difficulty: 3
  prerequisites:
  - tech:single-step-execution
  - tech:memory-read-write-patch
  artifacts:
  - art:pe64
  - art:elf64
  outputs:
  - 命中条件与命中次数
  - 数据读写点与访问指令
  - 关键变量的取值变化
  cost: medium
  false_positive_risk: low
  commands:
  - cmd: gdb -q -batch {{binary}} -ex "break main if $rdi != 0" -ex run -ex "info
      registers"
    note: 条件断点示例，只有条件成立才停，条件在目标上下文里求值
  - cmd: gdb -q -batch -p {{pid}} -ex "watch -l *(long *)$rsp" -ex continue
    note: 对被监视地址设写观察点，按地址定位而不是每次重新求值表达式
  procedure:
  - 先确认断点位置确实是要观察的地方：读一次该地址的指令，与静态反汇编一致再下断。
  - 写条件时只用寄存器与内存读取，不调用函数；写好后先在不该命中的场景跑一次，确认它没改变目标状态。
  - 从简单条件起步（参数非空、长度超过某值），看在预期次数内停下；停得太频繁说明条件没起到筛选作用。
  - 抓「谁改了内存」时改用观察点，按地址监视而不是按表达式监视，避免每次命中重新求值。
  - 观察点设好后让目标继续，停下的地方就是访问点，检查那条指令是否真的在写这块内存。
  - 命中次数很多时换硬件观察点或缩小监视宽度，软件观察点在高频写入下会把目标拖到超时。
  - 结论连同命中条件与命中次数一起记录，只有「条件成立且确实停下」的次数能支撑后续推断。
  pitfalls:
  - 条件里调用函数会改变目标状态甚至再次触发被观察事件，条件应只读寄存器和内存
  - 软件观察点靠单步实现，热路径上会把执行拖到超时，命中次数高时应改用硬件观察点
