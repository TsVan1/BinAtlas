# BinAtlas 知识库 · 技术 · dom:wk-objects
# 规范：03-DATA-SCHEMA.md §2.2

- id: tech:object-manager-namespace
  name: 对象命名空间分析
  name_en: Object Namespace Analysis
  domain:
  - dom:wk-objects
  parent: dom:wk-objects
  def: 沿对象管理器的目录树定位设备、驱动、回调等命名对象，理解符号链接如何把路径映射到真实对象。难点是同一对象可能有多个名字入口，判断谁在用它必须回到对象头的引用与句柄。
  detail: 场景是拿到一份转储或一台活体机器，要先按名字定位设备、驱动、回调这类命名对象时用；也用于解释某条路径为什么打开失败或指向了别处。与句柄表遍历的区别是那条从持有者出发列出对象，这条从名字出发找到对象，同一条路径可以有多个名字入口，符号链接只是入口之一而非实例本身；与引用计数追踪的区别是名字存在不代表有人在用，谁在引用要回到对象头与句柄。注意点是未命名对象根本不出现在命名空间里，只按名字枚举会漏掉大量真实存在的对象；会话隔离下同类目录有多份，看到第一个不能当成全部；路径分隔符与大小写在不同工具里表现不同，一律按输出原样记录。
  principle: 为什么名字能定位到对象：对象管理器维护一棵目录树，对象在创建时把自己的名字登记进父目录的目录项，查找就是从根出发逐层比对名字、最后拿到对象头里的指针。成立的关键是登记与查找用的是同一份目录结构，所以增删名字会立刻反映在枚举结果上；符号链接也可由此解释——目录项可以指向另一条路径而不是实例本身。边界同样清楚：不登记名字的对象只在句柄里可见，目录树里永远找不到它，所以名字层的清单只是对象总体的一部分。
  difficulty: 4
  prerequisites:
  - tech:kernel-symbol-management
  artifacts:
  - art:memory-dump
  - art:kernel-module
  outputs:
  - 命名路径与对象对应表
  - 符号链接映射关系
  - 对象引用来源清单
  cost: low
  false_positive_risk: medium
  commands:
  - cmd: '!object \'
    note: 从命名空间根开始逐层展开；路径分隔符与大小写要与输出保持一致
  - cmd: '!object \ObjectTypes'
    note: 列出对象类型与数量，用于判断某类对象是否异常增多
  - cmd: '!drvobj \Driver\{{module}} 2'
    note: 由名字定位驱动对象并展开分发例程表
  procedure:
  - 从命名空间根逐层展开，先确认层级与路径写法，分隔符与大小写照输出原样记录。
  - 看到名字下还有子项就继续下探到最末一层，中间层是目录，最末一层才是实例对象。
  - 对可疑目录列一次对象类型，看该类对象的总量与分布，判断是整体增多还是单点异常。
  - 由名字定位到驱动对象并展开分发例程表，确认这条路径背后是谁在处理请求。
  - 遇到符号链接先追到目标路径再判断，别把链接本身当成实例。
  - 把名字与对象地址记成对照表，再回到句柄与引用计数确认谁真的在持有它。
  pitfalls:
  - 把符号链接名当成真实对象名，会在错误层级找不到对象
  - 未命名对象不出现在命名空间里，只按名字枚举会漏掉大量真实对象
  - 同名设备在不同会话或不同实例下可以有多个，看到第一个就下结论容易错
- id: tech:eprocess-field-recovery
  name: 进程结构字段还原
  name_en: EPROCESS Field Recovery
  domain:
  - dom:wk-objects
  parent: dom:wk-objects
  def: 在进程结构中定位名称、父进程、令牌、线程链与保护状态等字段，并给每个字段找到可验证的证据。难点是字段随版本增删重排，硬编码偏移只在单一构建上成立，跨版本必须重新确认。
  detail: 场景是需要在进程结构上按字段取值——名称、父进程、令牌指针、线程链、保护状态——而不是照着外部资料里的偏移去猜。与未公开结构布局还原的区别是这里符号里有完整的类型定义，任务是把字段名与实例值对上；那条是在没有类型信息时靠访问模式反推布局。与令牌与特权检查的区别是那条解释令牌内容，这条只负责把令牌指针这一环取对。注意点是结构随内核功能增删而重排，同一字段在不同构建上位置不同，跨版本必须重新按符号确认；联合成员在不同配置下复用同一段空间，读到的值可能是另一种解释；私有符号与目标二进制错配时，字段名看起来合理却指向错的成员。
  principle: 为什么偏移会变：结构体成员按当前内核的功能集合与对齐规则排布，某次增删字段后其后成员的位置整体重算，而访问位移在编译时就被写进指令，所以外部资料里的偏移只对应某一个构建。为什么符号可靠：符号文件保存当前构建的成员表与相对位置，调试器按这张表解释原始内存，字段名就是真实位置，不需要自己推算。这也解释了错配时的行为——旧表仍能解释出一组自洽的字段，只是指向了别的成员，所以字段名对得上并不等于取的是你以为的那一项。
  difficulty: 4
  prerequisites:
  - tech:object-manager-namespace
  - tech:kernel-symbol-management
  artifacts:
  - art:memory-dump
  - art:kernel-module
  outputs:
  - 字段与偏移映射表
  - 每个字段的验证方式
  - 跨版本差异记录
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: dt nt!_EPROCESS
    note: 把符号给出的类型定义作为唯一偏移来源，不要用外部资料里的旧偏移
  - cmd: '!process 0 0'
    note: 取得进程结构地址，再配合类型化视图观察具体实例
  - cmd: dt nt!_EPROCESS <地址>
    note: 打印实例字段值，用名称或父进程这类可比对项验证解读是否正确
  procedure:
  - 先打印类型定义，拿到当前符号下的成员名与布局，把它当作唯一偏移来源。
  - 在定义里先认名称、父进程、令牌、线程链这几个入口字段，确认它们当前叫什么名字。
  - 列出全部进程取得结构地址，这一步只取地址，不作为结论。
  - 用类型化打印读单个实例，先把名称与父进程这两项可独立验证的字段对上，确认解读方向正确。
  - 入口字段确认后再按字段里的指针追下一层结构，每追一层都重新按符号确认，不要顺推。
  - 换另一个实例交叉比对，同一字段至少在一项上能对上才写进映射表。
  - 映射表里注明每个字段的验证方式，并标明结论只对该符号版本成立。
  pitfalls:
  - 抄一份网上的偏移表直接用，构建号一变就全错，而且错得很安静
  - 字段存在不代表语义如你所想，必须用行为或已知值做交叉验证
  - 结构内的联合成员在不同配置下复用同一空间，读到的值可能是另一种解释
- id: tech:handle-table-walk
  name: 句柄表遍历
  name_en: Handle Table Walk
  domain:
  - dom:wk-objects
  parent: dom:wk-objects
  def: 从进程的句柄表还原句柄值到对象的映射，判断某进程实际持有哪些内核资源。难点是句柄表分层且句柄值经过编码，句柄存在也不等于对象可被不受限地使用。
  detail: 场景是要回答某进程实际持有哪些内核资源、它有没有打开别的进程或文件、某个可疑对象被谁握着时用。与命名空间分析的区别是那条从名字找对象，这条从持有者列对象，未命名对象只有句柄这一条线索；与引用计数追踪的区别是这里只回答有没有、给了什么权限，增减来源由那条负责。注意点是句柄值不是对象地址而是表索引，直接当地址解引用必然读错；句柄存在不等于可以不受限地使用，授予的访问权限位决定能对它做什么；进程正在退出时句柄表一边拆一边读，此时遍历会得到自相矛盾的结果，这类样本要单独标记。
  principle: 为什么句柄能反查进程：句柄表是内核为每个进程维护的索引表，句柄值只是表项编号，用户态拿到的从来不是对象地址，所以句柄本身不泄漏任何内核信息。为什么是分层：表项多到一张表放不下时内核用多层表扩展，编号仍按统一规则编址，因此遍历要顺着层级走，不能当地址数组平扫。为什么存在不等于能用：表项里同时存着授予的访问权限，访问检查在这一层做，句柄存在但权限受限时，动作会在对象入口被拒。
  difficulty: 4
  prerequisites:
  - tech:eprocess-field-recovery
  artifacts:
  - art:memory-dump
  - art:kernel-module
  outputs:
  - 句柄与对象类型对照表
  - 授予权限位解读
  - 可疑句柄清单
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: '!handle 0 f Process'
    note: 列出所有进程类句柄及引用计数，先看总量再看单点
  - cmd: '!object \ObjectTypes'
    note: 确认对象类型名，避免把类型索引当成类型名
  - cmd: dt nt!_HANDLE_TABLE
    note: 查看句柄表结构定义，分层与编码方式以符号输出为准
  procedure:
  - 先按类型筛出目标进程的句柄，先看总量再看单条，总量异常的进程优先查。
  - 逐条对照授予的访问权限位标注它能做什么，只数数量会把受限句柄当成完全控制。
  - 用对象类型目录确认每个句柄指向的类型名，类型索引本身不是类型名。
  - 打印句柄表结构定义，按符号确认层级与表项字段，不要按数组下标推算位置。
  - 从表项取出对象地址后再回到命名空间或对象视图确认对象是谁，句柄值不能当地址用。
  - 挑可疑句柄单独看引用计数与类型，判断是自身打开还是从别处继承。
  - 结论里把持有与有权使用分成两行写，正在退出的进程样本单列，不作为依据。
  pitfalls:
  - 只统计句柄数量不看授予的访问权限，会把受限句柄误判为完全控制
  - 句柄值不是数组下标，按偏移直接寻址会读到无关对象
  - 进程退出过程中句柄表正在拆解，此时遍历会得到自相矛盾的结果
- id: tech:object-reference-tracking
  name: 对象引用计数追踪
  name_en: Object Reference Tracking
  domain:
  - dom:wk-objects
  parent: dom:wk-objects
  def: 追踪内核对象引用计数的增减来源，判断是引用泄漏还是正常缓存。难点是增减点分散在系统与第三方驱动里，泄漏要到对象耗尽才暴露，事后回溯需要完整时间线而非单点快照。
  detail: 场景是对象数量或池占用随某组操作单调增长，要先分清是引用泄漏还是正常缓存时用；也用于把一次内存耗尽定位到具体对象类型。与句柄表遍历的区别是那条只取一张持有关系快照，这条要在重复操作之间比较同一对象的计数变化；与池标签归属分析的区别是标签归因回答谁在分配，计数追踪回答为什么释放不掉，两者常常一前一后配合。注意点是引用归零后的内存仍可读一段时间，这时读到的正常内容会让人误判对象还活着；临时持有在正常路径上同样存在，必须看多次操作后的净增长；追踪能力要在问题发生前开启，事后补不开历史增减点，只能看当前计数。
  principle: 为什么计数能定位泄漏：内核对象靠引用计数决定生命周期，只有最后一个引用释放时才走析构并归还底层分配，任何一个持有者没放手计数就不归零，对象连同附属内存一起留在池里，所以净增长是泄漏的必要条件。为什么单次快照不够：正常路径也会短暂持有引用，只有同一类对象在重复操作后计数持续抬升、又找不到对应的回落点，才能与缓存区分开。这也说明计数与句柄是两套账——句柄只是持有方式之一，句柄数不涨的对象照样可能被引用抬住。
  difficulty: 5
  prerequisites:
  - tech:object-manager-namespace
  - tech:handle-table-walk
  artifacts:
  - art:memory-dump
  - art:kernel-module
  outputs:
  - 引用增减点清单
  - 泄漏归因结论
  - 观测与复现方案
  cost: high
  false_positive_risk: high
  commands:
  - cmd: '!object <对象地址>'
    note: 查看对象的类型、名称与引用相关信息，地址来自命名空间或池枚举
  - cmd: '!poolfind <标签>'
    note: 找出同标签对象块，批量对比能看出数量是否随操作单调增长
  - cmd: '!poolused 2'
    note: 观察对象相关池占用的增长趋势，判断是泄漏还是缓存
  procedure:
  - 先用池占用视图看总量趋势，确认增长是整体抬升还是集中在少数标签。
  - 对可疑标签枚举全部区块并记下数量与地址，作为第一份快照。
  - 挑几个地址用对象视图看类型与名称，确认这些块确实是同一类对象。
  - 重复执行引发问题的操作，再取一次同样的枚举，只比较两次的净增长。
  - 对持续增长的对象单独看引用相关信息，确认计数是否随操作单调抬升。
  - 把每个增长点与操作时刻对齐，写清从哪一步之后开始不回落。
  - 结论区分泄漏与缓存，并给出能复现净增长的观测条件，不能复现的不写成结论。
  pitfalls:
  - 引用归零后的对象仍可能可读一段时间，读到看起来正常的内容会误导判断
  - 把临时持有当泄漏，必须看多次操作后的净增长而不是单次快照
  - 引用追踪需要提前开启，问题发生后再想补开拿不到历史增减点
- id: tech:undocumented-layout-recovery
  name: 未公开结构布局还原
  name_en: Undocumented Layout Recovery
  domain:
  - dom:wk-objects
  parent: dom:wk-objects
  def: 在只有部分类型信息时还原结构布局：靠字段访问模式、常量比对与对齐规则推断成员位置与大小。难点是每种假设都必须能被证伪，单看一处访问模式很容易把填充或复用空间当成真成员。
  detail: 场景是符号缺失或只给出部分类型，需要把某个私有结构的成员位置与大小还原出来时用；也用于校验某条字段推断是否自洽。与进程结构字段还原的区别是那条在符号齐备时按名取值，这条要在没有成员表的情况下靠访问模式反推；与内核地址空间布局的区别是那条判断地址属于哪个区域，这条判断结构内部各成员落在哪。注意点是编译器插入的对齐填充极易被当成成员，一处错位会让后续偏移整体串位；结构常被内联或整体复制进别的结构，只在一种上下文验证会得出片面结论；推断只对产生它的那个构建成立，草案必须标注适用范围，未验证的假设不能写成结论。
  principle: 为什么访问模式能反推布局：编译器按成员类型与对齐规则生成固定位移，同一结构的每次访问都落在相同位置，反汇编里反复出现的位移集合就是成员候选；对齐规则又要求成员落在自身大小的整数倍上，这条约束能把填充从候选里筛掉。为什么必须可证伪：几个不同位移也可能只是同一成员的重复访问，只有找到一个能让两种假设给出不同结果的实例，推断才算成立。缺少这一步时，得到的布局往往内部自洽却在跨实例时整体错位。
  difficulty: 5
  prerequisites:
  - tech:eprocess-field-recovery
  artifacts:
  - art:memory-dump
  - art:pe64
  - art:kernel-module
  outputs:
  - 结构布局草案
  - 每个成员的证据
  - 待验证假设清单
  cost: high
  false_positive_risk: high
  commands:
  - cmd: dt nt!_EPROCESS
    note: 先用已知结构建立基线，再对照未知结构的访问模式
  - cmd: x nt!*Eprocess*
    note: 列出相关符号；未导出例程的符号有时能反推成员用途
  - cmd: dps <地址> L40
    note: 观察指针密集区域，判断哪些位置确实存放地址
  procedure:
  - 先用已知结构打印一份定义，建立位移与成员类型的对照基线。
  - 列出相关符号，看有没有残留的例程名或变量名能提示成员用途。
  - 在目标函数里收集反复出现的位移，把位移集合当作候选成员表。
  - 对每个候选按对齐规则筛一遍，落在非法对齐位置的先剔掉。
  - 用指针扫描看某段区域是否密集存放地址，把指针成员与整型成员分开。
  - 为每个候选写一条能被推翻的假设，并给出区分这两种解释的观测方式。
  - 在两个不同实例上验证同一成员的取值变化符合预期，通过后才写进布局草案。
  - 草案里标注适用范围与待验证项，未验证的部分单独列出，不写成结论。
  pitfalls:
  - 把对齐填充当成字段，会让后续所有偏移推断整体串位
  - 结构常被内联或复制进别的结构，只在一种上下文验证会得出片面结论
  - 单版本推断出的布局不能跨构建复用，必须标注适用版本
- id: tech:pool-tag-attribution
  name: 池标签归属分析
  name_en: Pool Tag Attribution
  domain:
  - dom:wk-objects
  parent: dom:wk-objects
  def: 用池标签把内核分配归到具体组件，判断内存增长来自哪一方。难点是标签由分配方自定义且常被复用，归属只能当线索，最终仍要靠调用栈或模块范围确认。
  detail: 场景是内核内存增长需要先判断来自哪一方、手上只有总量或几份转储时用，它是把范围缩到候选模块最省力的一步。与引用计数追踪的区别是那条回答为什么释放不掉，这条回答是谁在分配；与命名空间分析的区别是名字只覆盖已登记的对象，池标签覆盖全部内核分配，包括从未命名的。注意点是标签由分配方自己填，可以被复用也可以被借用，单独一个标签不足以定案；统计里包含已释放但未归还的区块，标签占用增长不等于泄漏；开启验证选项后区块布局会改变，转储里记录的大小要重新解释。
  principle: 为什么标签能定位分配方：每次内核分配都要在块头写入四字符标签，由调用方自己填，释放时按同一标签记账，于是按标签汇总等于按调用方汇总，它能把可疑范围从全部内核分配缩到几组标签。为什么不能直接定案：标签只是字符串常量，多个组件可以填同一个，驱动也能借用别人的标签掩盖来源，所以标签只给出候选集合。统计口径还落在块而不是对象上，一个对象可能对应多次分配，标签数量与对象数量本就对不齐。
  difficulty: 3
  prerequisites:
  - tech:kernel-pool-forensics
  artifacts:
  - art:memory-dump
  - art:kernel-module
  outputs:
  - 标签到组件的候选映射
  - 增长异常的标签清单
  - 归属确认证据
  cost: low
  false_positive_risk: high
  commands:
  - cmd: '!poolused 2'
    note: 按标签排序查看池占用，先锁定异常放大的标签
  - cmd: '!poolfind <标签>'
    note: 枚举该标签下全部池块；四字符且区分大小写
  - cmd: lm
    note: 结合已加载模块范围判断标签可能属于谁
  procedure:
  - 先按标签汇总池占用并排序，锁定占用异常放大的标签作为怀疑起点。
  - 枚举该标签下全部区块，标签要写满四个字符且区分大小写，写错只会得到空结果。
  - 记下区块地址与大小，挑几个看相邻区块，先判断是越界还是已被释放。
  - 列出模块范围，看候选模块能否与标签所属组件对上。
  - 对不上就说明标签被复用或被改写，回到汇总换标签重来，不要硬解释。
  - 结论里把标签直接支持的归属与需要调用栈补充的归属分成两类写。
  pitfalls:
  - 同一标签常被多个组件使用，按标签直接指认元凶会误伤
  - 标签统计包含已释放未归还的区块，增长不等于泄漏
  - 开验证选项后区块布局改变，文件里记录的大小需要重算
- id: tech:token-privilege-inspection
  name: 令牌与特权检查
  name_en: Token Privilege Inspection
  domain:
  - dom:wk-objects
  parent: dom:wk-objects
  def: 读取进程或线程令牌里的身份、组成员、特权位与完整性级别，判断实际权限而不是账户名。难点是进程与线程各持一份令牌，特权还有已授予与已启用之分，看错一项结论就反了。
  detail: 场景是要判断某个进程实际能做什么，而不是它的账户名属于哪个组；也用于解释一次访问被拒到底缺哪一项。与进程结构字段还原的区别是那条负责正确取到令牌指针，这条负责解释令牌里的内容；与句柄表遍历的区别是句柄说明能对哪些对象动手，令牌说明以什么身份动手。注意点是进程与线程各持一份令牌，线程可以临时替换自己那份，只读进程令牌会漏掉正在生效的那一份；特权分已授予与已启用，只看授予会把没启用的能力当成正在生效；组成员之外还有完整性级别，受限的管理员并不是完全权限。进程结构里的令牌指针带引用计数编码，直接当地址解引用会失败。
  principle: 为什么令牌比账户名可靠：访问检查发生在打开对象那一刻，系统拿调用者令牌里的身份、组、特权与完整性级别去和对象的安全描述符逐项比较，账户名不参与比较，参与的是令牌这份快照，所以结论必须落在令牌上。为什么进程与线程要分开：线程可以临时换上一份令牌执行，此时生效的是线程那份，这正是同一进程里有的线程能过、有的过不去的原因。为什么特权要分授予与启用：只有启用位代表当前真的能调起那项能力。
  difficulty: 4
  prerequisites:
  - tech:eprocess-field-recovery
  artifacts:
  - art:memory-dump
  - art:kernel-module
  outputs:
  - 令牌内容解读
  - 特权启用状态结论
  - 实际权限边界判定
  cost: low
  false_positive_risk: medium
  commands:
  - cmd: '!token'
    note: 不带参数时显示当前进程令牌；重点看特权是已授予还是已启用
  - cmd: dt nt!_TOKEN
    note: 查看令牌结构定义，确认特权与完整性级别字段的当前命名
  - cmd: whoami /priv
    note: 在目标系统上取用户态视角的特权列表，与内核侧解读互相印证
  procedure:
  - 先在目标进程上取令牌，确认拿到的是哪一份，并留意线程侧可能另有一份。
  - 打印令牌结构定义，确认当前符号下特权与完整性级别字段的名字。
  - 按字段逐项读身份、组与完整性级别，不要只看组列表就下结论。
  - 把特权逐条标成已授予与已启用，只有已启用的算正在生效。
  - 在目标系统上取用户态视角的特权列表，与内核侧读数互相印证。
  - 两侧不一致时先怀疑令牌选错（进程那份还是线程那份），再怀疑字段读错。
  - 结论写实际权限边界，不写账户所属角色，两者不能互相替代。
  pitfalls:
  - 只看组成员不看完整性级别，会把受限的管理员当成完全权限
  - 特权已授予不等于已启用，提权判断必须看启用位
  - 线程可以临时替换令牌，只读进程令牌会漏掉正在生效的那一份
- id: tech:kernel-address-space-mapping
  name: 内核地址空间布局
  name_en: Kernel Address Space Layout
  domain:
  - dom:wk-objects
  parent: dom:wk-objects
  def: 确定内核各区域的实际范围与映射关系：映像区、池区、页表与超空间，判断某个地址属于哪一类。难点是基址每次启动随机化、区域边界随架构与启动配置变化，只能实测不能背固定值。
  detail: 场景是拿到一个地址后要先判断它属于映像、池、页表还是别的区域，再决定用什么命令去解释它；也用于解释某次读取为什么在内核侧失败。与未公开结构布局还原的区别是那条处理结构内部的成员位置，这条处理区域之间的归属；与句柄表遍历的区别是对象地址真假要先靠区域归属来判断。注意点是内核映像的加载基址每次启动随机化，背下来的基址重启即失效；区域边界随架构、启动配置与内存大小变化，不能跨机器套用；映射有效与对象存活是两件事，页表项只说这段地址能访问，不说里面还有没有东西。
  principle: 为什么区域边界只能实测：内核映像在启动时被加载到随机化基址，映像、池、页表与超空间这些区域的边界由架构、启动配置与物理内存大小共同决定，任何写死的区间只对一种配置成立。为什么页表能判归属：虚拟地址必须经页表转换才能被访问，查页表项能读到这段地址是否有效映射、映射到哪类页以及页级权限，这是内存管理单元的实际状态而不是推断，所以它能给区域归属充当最终依据。地址同一份、映射不同上下文时结果会变，因此判断前要先钉住当前上下文。
  difficulty: 4
  prerequisites:
  - tech:undocumented-layout-recovery
  artifacts:
  - art:memory-dump
  - art:kernel-module
  outputs:
  - 地址区间划分结论
  - 关键基址与模块范围
  - 地址归属判定方法
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: lm
    note: 列出已加载模块的起止范围，先建立映像区的事实基线
  - cmd: '!vm'
    note: 查看内核虚拟内存各分区统计，区域划分以该输出为准
  - cmd: '!pte <地址>'
    note: 查地址对应的页表项，判断是否有效映射及其权限
  procedure:
  - 先列出已加载模块的起止范围，把映像区的事实基线建起来，之后所有地址先跟它比。
  - 查看内核虚拟内存的分区统计，按这份输出划分区域，不要用记忆里的区间。
  - 要判断的地址先看是否落在某个模块范围内，落进去就是映像里的位置。
  - 不落在模块范围内就按分区统计给的边界继续归类，判断是池还是其他区域。
  - 用页表查询确认该地址是否有效映射与页级权限，映射无效时后续读取结论都不可信。
  - 映射有效的地址再单独确认对象是否存活，两个结论不能互相替代。
  - 结论里写清依据来自哪一步实测，基址相关内容一律不写成常量。
  pitfalls:
  - 背下某个版本的内核基址当常量，重启一次就失效
  - 用用户态地址范围的经验去判断内核地址，会把超空间区域误判成异常
  - 地址有效不代表对象存活，映射存在与内容未释放是两件事
