# BinAtlas 知识库 · 技术 · dom:av-evasion-dynamic
# 规范：03-DATA-SCHEMA.md §2.2

- id: tech:userland-hook-removal
  name: 用户态钩子还原
  name_en: Userland Hook Removal
  domain:
  - dom:av-evasion-dynamic
  parent: dom:av-evasion-dynamic
  def: 用磁盘副本覆盖进程内被安全产品改写过的系统库代码，让敏感调用回到原始路径。难点是覆盖动作本身涉及内存写与页权限切换，产生的遥测比被绕过的调用更显眼。
  detail: 场景是进程内系统库的函数入口已被安全产品改写、敏感调用被导进产品模块时，把调用路径拉回原始状态；也用于验证某次告警究竟来自用户态钩子还是内核回调。与直接系统调用的区别是不换调用方式，只把被改的字节恢复，调用仍走系统库；与导入隐藏的区别是那些解决「调用谁」，这里解决「调用路径被改写」。注意点：只对用户态改写有效，内核态回调与内核侧遥测不受影响；部分产品会周期重新挂钩，干净窗口很短；覆盖动作要切页权限，产生的遥测比被绕过的调用更显眼。
  principle: 用户态钩子的做法是在函数入口写入跳转或改导入地址，让调用先进入产品的检查模块再继续。把磁盘副本的原始字节按节拷回内存后，函数入口恢复为原始指令流，调用直接按原路径进内核，检查模块失去了插入点。有效性完全依赖「检查挂在调用路径上」这一前提：路径被换回，用户态这一层的判断点就消失。但钩子只存在于被改写的模块内，内核回调与驱动层检查不经过这条路径，所以还原只解除一层。
  difficulty: 4
  prerequisites:
  - tech:userland-hook-mapping
  artifacts:
  - art:pe32
  - art:pe64
  outputs:
  - 被改写函数清单与改写字节
  - 还原前后的调用行为差异
  - 还原动作自身的可观测事件
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: dumpbin /exports C:\Windows\System32\ntdll.dll
    note: 以磁盘副本建立导出基线，确认目标函数确实由这个模块导出。
  - cmd: Get-FileHash -Algorithm SHA256 C:\Windows\System32\ntdll.dll
    note: 磁盘副本哈希；与内存副本比对时，不一致说明内存里的代码被改过。
  - cmd: pe-sieve64.exe /pid {{pid}}
    note: 扫描目标进程的模块与内存异常，看覆盖动作是否留下不寻常的页或模块状态。
  procedure:
  - 先用 dumpbin /exports 对磁盘副本建立导出基线，确认待还原的函数确实由该模块导出。
  - 用 Get-FileHash 记下磁盘副本的哈希，把它当作「原始字节」的唯一对照基准。
  - 再用 pe-sieve64.exe /pid 扫进程，逐个比对函数入口与磁盘是否一致，整理出被改写清单。
  - 按清单把磁盘对应节的原始字节写回内存，从最小函数集开始，不要一次全量覆盖。
  - 覆盖前把目标页改为可写、覆盖后立即恢复原属性，避免留下长期可写页。
  - 重跑那组调用确认已不再经过产品模块，再复扫一次看还原动作自身留下了什么痕迹。
  - 隔一段时间再复扫，若入口又出现跳转，说明产品在周期重新挂钩，只能抓住窗口期。
  pitfalls:
  - 内核态回调与内核侧遥测不受用户态代码覆盖影响。
  - 部分产品会周期性重新挂钩，还原后的干净窗口很短，时序不稳就会失败。
  - 还原后模块内存与磁盘完全一致，这件事本身就是与常规进程的差异。
- id: tech:direct-system-call
  name: 直接系统调用
  name_en: Direct System Call
  domain:
  - dom:av-evasion-dynamic
  parent: dom:av-evasion-dynamic
  def: 不经过系统库包装层，按目标系统对应的系统调用编号直接进内核，跳过用户态钩子与提供者埋点。难点是编号随系统版本变化，且调用来自非模块内存本身即是强异常特征。
  detail: 场景是系统库入口已被挂钩、或需要判断某次拦截发生在用户态还是内核侧时使用；也用于评估「只换调用方式能否消掉这条告警」。与钩子还原的区别是那条把被改字节恢复、仍走系统库，这条完全不经过系统库、自己给出编号；与位置无关桩的区别是桩解决地址无关，这里解决绕开中间层。注意点：编号随系统版本变化，硬编码必然错位，必须先固定目标系统的精确版本；返回后若落回非模块内存，栈回溯仍会指出来源；部分产品已把「编号与函数不匹配」单列告警。
  principle: 用户态钩子与提供者埋点都挂在系统库的函数入口，调用必须先穿过这一层才能进内核。系统调用指令本身不含任何用户态检查逻辑，只要寄存器里放对编号与参数就直接进内核，被挂钩的函数体根本没被执行，钩子因此失效。有效性来自「检查点与调用点重合」：挂在包装层上的判断，只能在该层被经过时触发。代价是编号成了硬依赖——它由系统版本决定，版本一变编号错位，调用会走到别的服务而不是干净报错。
  difficulty: 4
  prerequisites:
  - tech:userland-hook-removal
  - tech:export-hash-resolution
  artifacts:
  - art:pe32
  - art:pe64
  - art:shellcode
  outputs:
  - 系统调用编号与导出名映射表
  - 目标系统版本核对记录
  - 非模块内存调用的可观测性评估
  cost: medium
  false_positive_risk: low
  commands:
  - cmd: dumpbin /exports C:\Windows\System32\ntdll.dll
    note: 确认目标函数存在，并核对它在导出名表里的相对顺序；编号与顺序强相关。
  - cmd: Get-CimInstance Win32_OperatingSystem | Select-Object Version,BuildNumber
    note: 记录目标系统的精确版本；编号表按版本变化，跨版本硬编码必然错位。
  procedure:
  - 先用 dumpbin /exports 读导出表，确认目标函数存在并记下它在导出序列中的相对位置。
  - 用 Get-CimInstance 读 Version 与 BuildNumber，把系统版本固定下来，编号表只对该版本成立。
  - 按相对位置推出编号后，先在目标版本上做一次最小调用，验证能返回而不是直接崩。
  - 最小调用通过再接入完整链路，接入时仍然只验证「调用能正常返回」这一个指标。
  - 换版本时重新取 BuildNumber 与导出表重推编号，绝不复用旧表。
  - 观察调用返回后落回哪个区段，若落在非模块内存，再决定是否需要额外的栈处理。
  - 最后看行为侧事件：告警仍在说明拦截在内核侧，换调用方式不会有效。
  pitfalls:
  - 编号硬编码在跨版本运行时必然错位，表现是直接崩溃而不是功能异常。
  - 返回地址落在非模块内存会被栈回溯发现，绕过包装层不等于隐去来源。
  - 部分产品已把「调用编号与函数不匹配」作为独立告警项，比原始调用更醒目。
- id: tech:memory-permission-sequencing
  name: 内存权限时序控制
  name_en: Memory Permission Sequencing
  domain:
  - dom:av-evasion-dynamic
  parent: dom:av-evasion-dynamic
  def: 把一次性申请可读可写可执行拆成多次权限变更，缩短同一页同时可写可执行的时间窗口。难点是页属性变更序列与调用栈仍可关联还原，拆得越细调用越多也越显眼。
  detail: 场景是一次性申请可写可执行页本身进入行为打分、需要把权限变更拆成「先写后执行」的时序时使用；也用于判断告警到底来自属性组合还是页的来源。与加密驻留的区别是那条解决「内容看得见」，这条解决「属性像不像正常内存」；与反射加载的区别是那只解决映射，不解决页属性。注意点：拆分只改顺序不改总量，中间态的可写私有页在统计上依然突出；改页权限会按频率被聚合，调用越多越显眼；页大小随架构变化，按固定页假设处理大页环境会越界或漏页。
  principle: 打分看的是「同一页在同一时刻是否既可写又可执行」，以及「私有提交内存里是否出现可执行页」，一次性申请可写可执行把两个强特征同时点亮。拆成多次变更后，任一时刻只命中其中一半，按周期采样的规则可能采不到组合态，评分被摊薄。关键在于采样是离散的：窗口短于采样间隔才有意义。但页的最终归属不变——执行前它必须变成可执行，而且仍是私有提交而非映像映射，所以这条只弱化时序证据，消不掉内存来源这一维。
  difficulty: 3
  prerequisites:
  - tech:self-decrypting-stub
  artifacts:
  - art:pe32
  - art:pe64
  - art:shellcode
  - art:memory-dump
  outputs:
  - 页属性变更序列
  - 同时可写可执行的时间窗口测量
  - 私有提交内存的统计特征
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: pe-sieve64.exe /pid {{pid}}
    note: 扫描进程内存里的可疑页与模块，看时序拆分后是否仍被标出可执行私有内存。
  - cmd: procdump -ma {{pid}} {{out}}
    note: 抓全量转储，用来复核内存里是否残留可执行页与解密后的明文。
  - cmd: vol -f {{out}} windows.malfind
    note: 从转储里反查可执行私有页；时序拆分不会改变这些页最终仍需可执行。
  procedure:
  - 先用 pe-sieve64.exe /pid 扫一次基线，记下改动前哪些页被标成可执行私有内存。
  - 把一次性申请拆成「先可写、写入、再可执行」，每次只给当前阶段需要的权限。
  - 写入完成后尽快切到可执行，把可写可执行的重叠窗口压到采样间隔以下。
  - 用 procdump 抓全量转储，确认拆分后内存里是否仍留下未回收的可执行页。
  - 再用 vol 的 malfind 从转储反查可执行私有页，比对改动前后被标出的页数。
  - 页数没变说明检测点在内存来源而非时序，此时应换方向而不是继续拆细。
  - 在大页环境下重跑一次，确认没有因页大小假设而漏标或越界。
  pitfalls:
  - 中间态的可写私有页在统计上依然突出，拆分只改变顺序不改变总量。
  - 频繁改页权限会按频率被聚合，调用次数越多越容易被单独判定。
  - 页大小随架构变化，按 4KB 假设处理大页环境会越界或漏页。
- id: tech:call-stack-spoofing
  name: 调用栈伪装
  name_en: Call Stack Spoofing
  domain:
  - dom:av-evasion-dynamic
  parent: dom:av-evasion-dynamic
  def: 让敏感调用的栈帧中返回地址指向合法模块，使基于栈回溯的行为归因失效。难点是各版本的栈展开结构与控制流保护检查不同，一处帧不合规即可被完整回溯推翻。
  detail: 场景是检测方靠栈回溯判断「这个调用从哪来」、调用来自非模块内存被直接标出，需要把归因链改指到合法模块时使用。与直接系统调用的区别是那只解决调用方式，返回地址仍暴露来源，这条专门处理返回地址那一环；与钩子还原的区别是这里不动被调用方，只动调用方的栈。注意点：开启控制流保护时，伪造的间接跳转目标若不合法会直接终止进程；展开信息与真实栈不匹配的后果是崩溃，而不是「看起来像合法调用」；各架构返回地址的保存方式不同，跨架构照搬必然失败。
  principle: 栈回溯靠返回地址链还原来源：检测方读栈上的返回地址，判断它落在哪个模块，落在非模块内存即是强异常。伪装的做法是在真正发起调用前替换该帧的返回地址，指向合法模块里的位置，并让展开信息与之一致，回溯读到的是合法地址，归因链在此断开。有效性来自「归因只依赖栈内容」这一假设：栈自洽就给不出真实来源。但它经不起一致性校验——展开信息与指令流对不上、或间接跳转目标不在合法集合内，校验侧会直接判定失败，而不是接受这个结果。
  difficulty: 5
  prerequisites:
  - tech:direct-system-call
  artifacts:
  - art:pe32
  - art:pe64
  outputs:
  - 栈帧布局与展开信息核对表
  - 控制流保护状态
  - 回溯结果与实际调用的偏离点
  cost: high
  false_positive_risk: low
  commands:
  - cmd: dumpbin /headers {{binary}}
    note: 查 DllCharacteristics 里的控制流保护与高熵地址标志，决定伪造帧能否通过检查。
  - cmd: Get-ProcessMitigation -System
    note: 查系统级控制流保护默认策略，判断目标环境是否强制校验间接跳转目标。
  procedure:
  - 先用 dumpbin /headers 读 DllCharacteristics，确认目标映像是否开启控制流保护与高熵地址标志。
  - 用 Get-ProcessMitigation -System 看系统级默认策略，判断环境是否强制校验间接跳转目标。
  - 若强制校验，先确定合法跳转目标集合，再选伪造帧的落点，不要用任意地址。
  - 按该架构的帧布局构造返回地址与展开信息，先只做一层，验证回溯是否被改指。
  - 从调试侧触发一次回溯，看输出的调用来源是否已从非模块内存变成合法模块。
  - 逐层增加，每加一层都复测一次，出现无栈崩溃就退回上一层。
  - 换架构或换版本时重做帧布局核对，不沿用上一版的偏移与展开信息。
  pitfalls:
  - 开启控制流保护时，跳到非合法目标的间接调用会直接终止进程。
  - 展开信息与真实栈不匹配的后果是崩溃，而不是「看起来像合法调用」。
  - x64 与 ARM64 的栈布局与返回地址保存方式不通用，跨架构照搬必然失败。
- id: tech:behavior-chain-splitting
  name: 行为链拆分
  name_en: Behavior Chain Splitting
  domain:
  - dom:av-evasion-dynamic
  parent: dom:av-evasion-dynamic
  def: 把一条完整行为链拆到不同进程、不同时间窗甚至不同主机上，使单点遥测看不到前后因果。难点是父进程关系、句柄继承与网络五元组仍能把拆开的片段重新串起来。
  detail: 场景是单点遥测已把「写内存、建线程、外联」串成一条链、需要把链条切开时使用；也用于评估某段行为拆分后是否仍能被重新关联。与跨进程执行的区别是那只换执行上下文，父进程关系仍然清晰；与网络分阶段加载的区别是那只切分阶段，不改变行为之间的因果顺序。注意点：拆完每段行为都更短促，反而更符合「高度异常进程」的画像；跨进程的句柄传递会留下可追踪来源，拆分点本身就是线索；父进程链一旦断裂或伪造，比原始行为更容易被单独标出。
  principle: 多数判定规则要求在一个有限时间窗内同时看到多个行为，例如进程创建之后紧接内存写入、再紧接外联。拆分的做法是把这些行为分散到不同进程、不同时间窗甚至不同主机，使任何单一事件源在自己的窗口内只看到一段；既然规则按窗口取数，跨出窗口的两段在规则层面就不同时存在。有效性来自窗口有限。但关联不止时间一维：父进程关系、句柄继承与网络五元组是跨事件持久存在的标识，标识还在就能重拼，所以不处理标识只是把链拉长。
  difficulty: 4
  prerequisites:
  - tech:telemetry-baseline-measurement
  artifacts:
  - art:pe32
  - art:pe64
  - art:pcap
  outputs:
  - 拆分后的片段与各自的可观测事件
  - 跨片段关联线索清单
  - 单点视角与全局视角的差异说明
  cost: high
  false_positive_risk: medium
  commands:
  - cmd: wevtutil qe Microsoft-Windows-Sysmon/Operational /q:"*[System[(EventID=1)]]"
      /c:10 /rd:true /f:text
    note: 拉最近的进程创建事件，检查父进程链是否已把拆开的片段重新串起来。
  - cmd: wevtutil qe Microsoft-Windows-Sysmon/Operational /q:"*[System[(EventID=3)]]"
      /c:10 /rd:true /f:text
    note: 看网络连接事件里的源进程，跨主机的片段常在这里重新对上号。
  procedure:
  - 先定一条待拆的完整行为链，标出链上每一步分别由哪类事件记录。
  - 用 wevtutil 拉进程创建事件，看当前父进程链是否已把这些步骤串在一起。
  - 用 wevtutil 拉网络连接事件，确认外联由哪个进程发起、是否已与前面的片段对上号。
  - 按事件类别把步骤分到不同时间窗，每段只保留一个可解释的行为，避免同类事件扎堆。
  - 逐段落地后重拉同一组事件，确认单点视角里每段都缺失前因后果。
  - 再按父进程与句柄关系人工串联一遍，能串起来说明拆分点选错了。
  - 换一台主机重放，确认跨主机的片段不会因为五元组再次被关联。
  pitfalls:
  - 拆完每段行为都更短促，反而更符合「高度异常进程」的画像。
  - 跨进程的句柄传递会留下可追踪的来源，拆分点本身就是线索。
  - 父进程链一旦断裂或伪造，比原始行为更容易被单独标出。
- id: tech:etw-provider-suppression
  name: ETW 提供者抑制
  name_en: ETW Provider Suppression
  domain:
  - dom:av-evasion-dynamic
  parent: dom:av-evasion-dynamic
  def: 在进程内让脚本与运行时相关的提供者停止上报，抹掉内存与脚本内容事件。难点是提供者状态变更自身会触发告警，且内核态会话不受进程内改动的任何影响。
  detail: 场景是脚本与运行时相关的提供者会把内存与脚本内容事件上报、需要让这部分停止上报时使用；也用于判断某条事件到底由哪个提供者产生。与遥测基线测量的区别是那个只读、这条改状态；与行为链拆分的区别是这里不改变行为本身，只减少上报。注意点：提供者状态变更往往被单独埋点，抑制动作比原始事件更醒目；内核态采集器运行在进程之外，进程内改动对它完全无效；部分事件只进跟踪会话、不落可查日志通道，抑制前后的日志量对比会失真。
  principle: ETW 的采集分两侧：提供者在进程内按会话开关决定是否写出事件，会话由采集方在进程外启停。进程内能改的只是本进程提供者与回调的启用状态，于是本进程产生的事件在到达会话之前就被丢弃，采集方收不到。有效性来自开关在提供者这一侧。边界同样清楚：开关只作用于当前进程的提供者实例，内核侧会话采集的事件根本不经过它；而且「谁在关开关」本身是可观测的状态变化，规则通常针对这个动作而不是被关掉的内容。
  difficulty: 4
  prerequisites:
  - tech:telemetry-baseline-measurement
  artifacts:
  - art:pe-dotnet
  - art:script
  - art:pe64
  outputs:
  - 提供者清单与默认启用状态
  - 抑制前后的日志量对比
  - 状态变更本身产生的告警记录
  cost: medium
  false_positive_risk: low
  commands:
  - cmd: logman query providers | findstr /i "DotNET"
    note: 列出运行时相关提供者及其 GUID，先确认目标事件由哪个提供者上报；这条只能列全部再筛，不能按名字单查。
  - cmd: logman query -ets
    note: 列当前已启用的跟踪会话，确认有没有内核侧会话在采集；抑制动作对这类会话无效。
  - cmd: wevtutil el
    note: 列事件通道，判断事件是只进跟踪会话，还是同时落进可查的日志通道。
  procedure:
  - 先用 logman query providers 列出全部提供者再筛 DotNET，确定目标事件由哪个提供者上报。
  - 用 logman query -ets 列当前启用的跟踪会话，确认有没有内核侧会话正在采集。
  - 用 wevtutil el 列事件通道，判断该事件只进跟踪会话还是同时落进日志通道。
  - 在进程内关闭目标提供者后重跑一次原操作，观察事件是否真的不再出现。
  - 对比抑制前后的日志量，总量几乎没变说明该事件还有别的来源。
  - 复核状态变更自身的记录，确认抑制动作没有留下比原事件更醒目的痕迹。
  - 对内核侧会话保持默认，进程内手段在那里本来就不起作用，不要指望它。
  pitfalls:
  - 关闭提供者的调用点与正常程序的行为分布格格不入，容易被单点命中。
  - 内核态采集器运行在进程之外，进程内改动对它完全无效。
  - 提供者状态变化往往被单独埋点，抑制动作比原始事件更醒目。
- id: tech:callback-based-execution
  name: 回调机制执行
  name_en: Callback-Based Execution
  domain:
  - dom:av-evasion-dynamic
  parent: dom:av-evasion-dynamic
  def: 把执行入口挂到系统既有的回调与线程池机制上，避免显式的远程线程创建动作。难点是回调注册的函数组合已被行为规则覆盖，且回调来源模块与注册栈会暴露加载路径。
  detail: 场景是显式远程线程创建会被直接记录、需要把执行入口挂到系统既有回调或线程池上时使用；也用于评估换掉线程创建后还剩哪些暴露点。与跨进程执行的区别是那只讲「写进别的进程」，这条讲「用谁的入口触发」；与模块映像覆盖的区别是这里不改写已有模块的内容。注意点：回调触发时机不可控，参数与上下文常常不是想要的，失败率高于显式线程；注册即代表载荷已进入目标进程，前置写入仍是暴露点；线程池回调可能延迟才执行，调试时极易误判成加载失败。
  principle: 远程线程创建是一条语义极强的事件——它出现本身就等于声明「有人往别的进程放了代码并让它跑」，所以规则几乎不做上下文判断就告警。回调机制绕开这条事件：载荷先写入目标进程，再由系统既有的触发路径在既有线程里调用到它，产生的是常规回调或线程池活动，不带「新建线程」语义。有效性来自事件语义而不是行为被消除——执行照旧发生，但记录它的字段变了。代价是触发时机交给系统，且写入阶段的事件一条不少。
  difficulty: 4
  prerequisites:
  - tech:cross-process-execution
  artifacts:
  - art:pe32
  - art:pe64
  - art:shellcode
  outputs:
  - 回调注册点与触发条件
  - 触发延迟与参数可用性评估
  - 对应遥测事件清单
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: wevtutil qe Microsoft-Windows-Sysmon/Operational /q:"*[System[(EventID=8)]]"
      /c:10 /rd:true /f:text
    note: 查远程线程创建事件；改用回调后这类事件应当消失，可用来验证是否真的绕开了。
  - cmd: wevtutil qe Microsoft-Windows-Sysmon/Operational /q:"*[System[(EventID=10)]]"
      /c:20 /rd:true /f:text
    note: 查进程句柄访问事件，注册回调前必须先拿到目标进程，这一步无法省掉。
  procedure:
  - 先用 wevtutil 拉线程创建事件，确认当前手法确实产生远程线程记录，作为对照基线。
  - 用 wevtutil 拉进程句柄访问事件，确认拿到目标进程这一步已经发生并且被记录。
  - 选定目标进程里本就存在、且会周期性触发的回调来源，再准备注册。
  - 把载荷写入目标进程后注册回调，注册完立刻观察执行迹象，不要等结果再判断。
  - 重拉线程创建事件，确认这类记录已经消失；仍在说明还有别的线程在创建。
  - 长时间无迹象时先分清是回调未触发还是加载失败，再决定是否换来源。
  - 记录回调来源与注册栈的可观测项，判断暴露点是否已从创建线程转到写入。
  pitfalls:
  - 回调触发的时机不可控，参数与上下文常常不是想要的，失败率比显式线程高。
  - 注册即代表载荷已进入目标进程，前置的写入步骤仍然是暴露点。
  - 线程池回调可能延迟数秒才执行，调试时极易误判成加载失败。
- id: tech:telemetry-baseline-measurement
  name: 遥测基线测量
  name_en: Telemetry Baseline Measurement
  domain:
  - dom:av-evasion-dynamic
  parent: dom:av-evasion-dynamic
  def: 先在可控实验机上记录系统自带遥测能看到哪些事件与字段，再据此量化每种手法的可观测性。难点是采集器配置会改变系统行为，基线也无法跨机器与跨版本迁移。
  detail: 场景是动手改任何东西之前，先量出这台机器的采集器能看到哪些事件与字段，作为后续所有可观测性判断的对照；也用于比较两种手法在同一环境里谁的痕迹更多。区别于其余条目：这里不做绕过只做测量，结论是后面每一条的评分依据。注意点：开着完整审计的机器与被测机器不是一个环境，基线不能混用；采集器配置本身会改变系统行为，测完要留配置快照；时间戳精度与队列丢弃会让因果顺序错乱；基线只覆盖系统自带日志，产品侧遥测不可见，评分会系统性偏高。
  principle: 可观测性不是手法的固有属性，而是「手法乘采集配置」的结果：同一动作在没有开启相应会话的机器上不产生事件，在开启的机器上可能留下多条。所以必须先固定采集面——哪些会话在跑、哪些通道开着、字段是否齐全——后续结论才可比较。有效性来自对照：只有同一采集配置下测前后两次，差异才能归因到手法本身，否则测到的是配置差异。这个前提也划出边界：基线只覆盖系统自带事件源，按它算出的可观测性只是下界。
  difficulty: 2
  prerequisites: []
  artifacts:
  - art:pcap
  - art:memory-dump
  - art:pe64
  outputs:
  - 事件类别与字段清单
  - 每种手法的可观测性评分
  - 基线环境配置快照
  cost: low
  false_positive_risk: medium
  commands:
  - cmd: logman query -ets
    note: 列当前运行的跟踪会话；基线必须记录这一点，否则不同次测量不可比。
  - cmd: wevtutil el
    note: 列全部日志通道，先确认哪些通道默认开启、哪些需要手工打开。
  - cmd: Get-WinEvent -LogName Microsoft-Windows-Sysmon/Operational -MaxEvents 20
    note: 抽样读少量事件，确认字段是否齐全；字段缺失时后续所有归因都会错。
  procedure:
  - 先用 logman query -ets 记录当前所有跟踪会话，这份列表就是本次测量的采集面。
  - 用 wevtutil el 列全部日志通道，标出哪些默认开启、哪些需要手工打开。
  - 用 Get-WinEvent 抽样读少量事件，确认字段齐全；字段缺失的通道不能用于归因。
  - 把采集面、字段清单与一份配置快照一起存档，后续每次测量都以它为对照。
  - 执行待评估的手法，再按同一采集面重读事件，逐类记录产生的条目。
  - 对比两次结果给出该手法的可观测性评分，并注明哪些类别根本不可见。
  - 换机器或换版本时重建基线，不复用旧基线下得出的评分。
  pitfalls:
  - 开着完整审计的机器与被测机器不是一个环境，基线不能混用。
  - 事件时间戳精度与队列丢弃会让因果顺序错乱，跨进程关联尤其明显。
  - 基线只覆盖系统自带日志，产品侧遥测完全不可见，评分会系统性偏高。
