# BinAtlas 知识库 · 技术 · dom:re-static
# 规范：03-DATA-SCHEMA.md §2.2

- id: tech:binary-triage-metadata
  name: 二进制元信息研判
  name_en: Binary Triage & Metadata Review
  domain:
  - dom:re-static
  parent: dom:re-static
  def: 读头部、节区、加载命令与依赖表，先判断架构、位数、链接方式与保护项，再决定后续路线。难点是加壳或篡改头部后元信息会主动骗人，必须交叉核验。
  detail: 场景是拿到陌生样本的第一步，任何深挖之前都要先确定架构、位数、链接方式与保护项。与反汇编的区别是这一层只读元数据，不解释任何指令；与加壳检测的区别是这里只按结构给出可疑信号，并不等于确认加壳。注意点：加壳或篡改头部后元信息会主动骗人；PE 看可选头、ELF 看程序头、Mach-O 看加载命令，混用会得出错误结论；带合法签名也不等于未加壳，strip 之后动态符号通常仍可用。
  principle: 元信息有效的前提是加载器必须按头部字段工作：机器类型决定解码器，程序头与节表决定内存映射和权限，PIE 标志决定它是否按位置无关方式装载，所以这些字段在程序能被正常加载的前提下不能完全撒谎。熵是对字节分布均匀程度的统计，压缩或加密会把它推高，因此高熵段只是可能被压缩的信号，不是加壳证据；反过来未压缩代码也可能落在低熵区。头部可被伪造，所以结论要靠多条命令交叉核验。
  difficulty: 2
  prerequisites: []
  artifacts:
  - art:pe64
  - art:elf64
  - art:elf32
  - art:mach-o
  outputs:
  - 架构位数与链接方式结论
  - 保护机制清单
  - 值得深挖的节区与导入表
  - 后续分析路线建议
  cost: low
  false_positive_risk: low
  commands:
  - cmd: file {{binary}}
    note: 先拿架构与位数；被混淆的样本会在此处给出误导性的可执行类型说明
  - cmd: readelf -h -l {{binary}}
    note: ELF 侧看入口、程序头与段权限；PIE 与 RELRO 状态在这里能直接读到
  - cmd: rabin2 -I {{binary}}
    note: 一次取架构位数、加固项与签名信息，PE/ELF/Mach-O 通用
  - cmd: python3 -c "import pefile,sys; pe=pefile.PE(sys.argv[1]); [print(s.Name,
      round(float(s.get_entropy()),2)) for s in pe.sections]" {{binary}}
    note: 按节区熵筛可疑区段；PE 专用，ELF 侧只能靠经验比对
  procedure:
  - 先跑 file {{binary}} 定架构与位数，输出是脚本或 data 时说明还有包装层，先解包再谈静态分析。
  - 对 ELF 跑 readelf -h -l {{binary}} 读入口、程序头与段权限，确认 PIE 与 RELRO 状态。
  - 用 rabin2 -I {{binary}} 交叉核对架构、加固项与签名，三者一致才把元信息当可信输入。
  - PE 样本再用 pefile 逐节区打印熵，只挑出高熵段作为后续校验对象，不单凭熵判定加壳。
  - 把结论落成路线：保护项多就走脱壳与反混淆，符号齐全则直接进入反汇编。
  pitfalls:
  - 节区名可被伪造，把高熵代码段命名为 .rdata 就能骗过按名字判断的人
  - 32 位与 64 位混判会让后续所有地址计算偏移，PE32+ 的可选头大小不同，别照搬 32 位经验
  - 带合法签名的程序也可能含高熵段，熵高不必然等于加壳
  - 剥离符号不等于加壳，strip 之后动态符号表通常仍可用
- id: tech:disassembly
  name: 反汇编
  name_en: Disassembly
  domain:
  - dom:re-static
  parent: dom:re-static
  def: 把机器码还原为汇编指令并划分指令与数据边界，是所有静态工作的地基。难点是代码与数据混排、变长指令与花指令会让线性扫描错位，凭空生成假指令。
  detail: 场景是无源码时确认某段字节到底是不是指令、入口处有没有解壳桩，也是函数边界识别与反编译的共同输入。与反编译的区别是反汇编只忠实于指令，不引入类型与控制流的猜测；与动态跟踪的区别是这里不执行，看到的路径可能不完整。注意点：x86 变长指令对起始偏移极敏感；ARM 与 MIPS 必须显式指定指令集与字节序，选错时输出全错却不报错；不同工具默认的加载基址与段映射不同，比对前先统一基址。
  principle: 反汇编有效的前提是指令编码的确定性：给定架构、起始地址与字节，指令长度与语义唯一，因此从真实入口线性扫一遍必然复现程序要执行的指令流。错位来自前提被破坏：嵌在代码段里的数据也会被当成指令解码，x86 变长编码让错误起点连锁偏移。递归下降更准，是因为它从入口与已知调用点出发，只解码可达字节，用控制流约束起点；代价是间接跳转目标缺失时整段不可达。因此两种视图必须对照。
  difficulty: 3
  prerequisites:
  - tech:binary-triage-metadata
  artifacts:
  - art:pe64
  - art:elf64
  - art:elf32
  - art:mach-o
  - art:shellcode
  outputs:
  - 带指令与数据判定的汇编清单
  - 花指令与错位位置标注
  - 可复现的段映射与加载基址
  - 从真实入口重扫的结果
  cost: low
  false_positive_risk: medium
  commands:
  - cmd: objdump -d --no-show-raw-insn {{binary}}
    note: 线性扫描的基线输出；含嵌入数据时会出现假指令，只作参照
  - cmd: r2 -q -c "aa; afl" {{binary}}
    note: 递归下降加函数级切分，比线性扫描更贴近真实边界
  - cmd: radare2 -q -c "pd 40 @ entry0" {{binary}}
    note: 从入口反汇编固定条数，用于人工确认入口处的解壳桩形态
  procedure:
  - 先用 objdump -d --no-show-raw-insn {{binary}} 拿线性扫描基线，把输出当参考而不是真值。
  - 看入口附近是否有压栈后立即 call 或 pop 的异常序列，有就先怀疑解壳桩。
  - 对入口用 radare2 -q -c "pd 40 @ entry0" {{binary}} 只解固定条数，人工确认解壳桩的形态。
  - 对可疑区域改用 r2 -q -c "aa; afl" {{binary}} 的递归下降结果，与线性结果比对，差异处就是数据或错位候选。
  - ARM 与 MIPS 先在工具里指定指令集与字节序再重跑，输出全错且无报错时首先查这里。
  - 把虚拟地址与文件偏移按段换算对齐后，再交给函数边界识别。
  pitfalls:
  - 线性扫描会把嵌入数据当指令解，多出来的指令不是函数体，别直接采信
  - x86 变长指令从错误偏移起步会连锁错位，必须从真实入口或调用点重扫
  - 反汇编给出的是虚拟地址，与文件偏移不是一回事，对齐换算后才对得上
  - ARM 与 MIPS 需显式指定指令集与字节序，选错时输出全错且不会报错
- id: tech:function-boundary-identification
  name: 函数边界识别
  name_en: Function Boundary Identification
  domain:
  - dom:re-static
  parent: dom:re-static
  def: 判定哪些字节属于同一函数，在符号被剥离后尤其关键。难点是尾调用、内联、热冷分区与跳板会让边界不再连续，单靠调用图必然漏函数。
  detail: 场景是无符号或符号被剥离时，先切出函数才能做交叉引用、栈帧与调用图；有符号时也要校正编译器拆分。与反汇编的区别是反汇编回答这串字节是什么指令，边界识别回答这些指令属于谁；与控制流图重建的区别是后者在函数内部建基本块，这里先定函数的外部轮廓。注意点：尾调用、内联、热冷分区让同一函数在文件里不再连续；异常表能给出可信范围；CET 的 endbr64 只覆盖启用 IBT 的构建，跨架构时别把 x86 的序言模板直接套到 ARM。
  principle: 模式识别之所以奏效，是因为编译器生成的栈帧建立与收尾序列高度规整：标准序言保存帧指针并调整栈指针，收尾成对恢复后返回，扫描这些序列就能给出候选边界。但优化会系统性破坏边界连续这个假设：尾调用把 jmp 当返回用，内联把被调函数体摊平进调用者，热冷分区把冷段搬到独立节区，链接器还会把相邻函数相同的收尾代码合并。因此单靠返回指令切分必然出错，必须用异常表、动态符号与入口标记交叉验证。
  difficulty: 3
  prerequisites:
  - tech:disassembly
  artifacts:
  - art:pe64
  - art:elf64
  - art:elf32
  - art:so
  outputs:
  - 函数起止地址表
  - 函数调用关系图
  - 内联与尾调用候选点
  - 无法归属的代码区间清单
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: r2 -q -c "aa; afl" {{binary}}
    note: 先拿一版递归下降的函数表，作为人工校正的起点
  - cmd: objdump -d {{binary}} | grep -n "endbr64" | head -40
    note: 存在 CET 标记时 endbr64 常落在函数入口，可作边界校验锚点
  - cmd: nm -D {{binary}}
    note: 动态符号仍能给出部分真实入口，用来校正猜测出的边界
  procedure:
  - 先跑 r2 -q -c "aa; afl" {{binary}} 拿一版递归下降函数表，作为起点而不是最终答案。
  - 用 nm -D {{binary}} 列出动态符号，把已知入口与函数表对齐，对不上的区间标为待校正。
  - 对候选入口用 objdump -d {{binary}} 配合 grep 找 endbr64 锚点，注意它只对启用 IBT 的构建有效。
  - 人工检查以 jmp 收尾的函数，识别尾调用，避免把两个函数并成一个。
  - 对热冷分区与共用收尾的区间标注为不连续，不强行给出唯一归属。
  - 把无法归属的代码区间单独列清单，交给下一阶段而不是猜。
  pitfalls:
  - 尾调用以 jmp 转出，按返回指令切分会把两个函数并成一个
  - 编译器把冷代码拆到独立节区后，同一函数的片段在文件里并不相邻
  - 相邻函数共用一段收尾代码是链接器合并的结果，按 ret 切分必然出错
  - 无符号时没有可信的入口集合，只能靠异常表与调用点推断，必须承认存在不确定区间
- id: tech:xref-symbol-recovery
  name: 交叉引用与符号还原
  name_en: Cross-Reference & Symbol Recovery
  domain:
  - dom:re-static
  parent: dom:re-static
  def: 建立代码到数据、代码到代码的引用关系，为匿名函数与全局对象命名。难点是无符号时引用只能靠指令语义推断，间接寻址与表驱动会让引用链断开。
  detail: 场景是无符号样本里给匿名函数与全局对象命名，或确认某个字符串与常量到底被谁使用。与函数边界识别的区别是那里先切出函数，这里建立谁引用谁；与数据流的区别是 xref 只回答引用是否存在，数据流关心值沿路径怎么变。注意点：引用常指向拼接后的中间缓冲区；函数表与虚表里的引用在静态视图里表现为数据；位置无关代码经 GOT 中转；xref 的完整性还依赖工具是否分析过该段数据，漏扫的数据段会让引用凭空消失。
  principle: 引用在机器码里必须留下可计算的痕迹：直接调用是 call 后的相对立即数，直接数据访问是 mov 或 lea 里的相对与绝对地址，字符串引用多是把地址装进寄存器再传给库函数，因此按指令语义就能反推目标。断链的根源是间接性：虚表与函数指针表把目标存成数据，静态视图里只看到读了一个指针；位置无关代码经 GOT 中转，指令里出现的是槽地址而非最终函数；字符串还可能指向拼接后的缓冲区。所以查不到的引用只能标为间接来源，不能断言不存在。
  difficulty: 3
  prerequisites:
  - tech:function-boundary-identification
  artifacts:
  - art:pe64
  - art:elf64
  - art:so
  - art:apk
  outputs:
  - 交叉引用表
  - 匿名函数与全局变量的命名建议
  - 关键数据结构推断草稿
  - 字符串到代码的引用路径
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: r2 -q -c "aaa; axt @ sym.main" {{binary}}
    note: 查某地址被谁引用；aaa 会把数据引用一并分析
  - cmd: rabin2 -zz {{binary}}
    note: 列出字符串及其地址与引用线索，是给匿名函数命名最省力的入口
  - cmd: objdump -T {{binary}}
    note: 动态符号表保留导入名，可反推被调用的外部函数
  procedure:
  - 先用 rabin2 -zz {{binary}} 列出字符串与地址，挑出有语义的常量作为命名锚点。
  - 对每个锚点用 r2 -q -c "aaa; axt @ 目标地址" {{binary}} 查引用，aaa 会补上数据引用分析。
  - 回读命中点的上下文指令，确认是地址装入还是数据表里的裸指针。
  - 用 objdump -T {{binary}} 补动态符号，把 PLT 调用点对应回导入名。
  - 查不到的引用标成间接来源，如 vtable、GOT、拼接缓冲区，交给数据流分析处理。
  pitfalls:
  - 字符串引用常指向拼接后的中间缓冲区，看到常量不代表逻辑在那里
  - 函数表与虚表里的引用在静态视图里表现为数据，xref 查不出来
  - 位置无关代码的引用经 GOT 中转，直接读指令立即数会得到错误目标
  - 同名导入符号在 PLT 里被多个调用点共用，不代表调用语义相同
- id: tech:stack-frame-recovery
  name: 栈帧与局部变量布局
  name_en: Stack Frame & Local Variable Recovery
  domain:
  - dom:re-static
  parent: dom:re-static
  def: 还原参数、局部变量与返回地址在栈上的布局。难点是优化后不再保留帧指针，变量被寄存器瓜分，栈上只剩溢出临时区，偏移与变量不再一一对应。
  detail: 场景是要判断栈上缓冲区多大、参数从哪来、某个偏移到底是局部变量还是调用影子空间。与控制流图重建的区别是那里只关心控制流，这里关心数据在栈上的物理位置；与反编译的区别是反编译器给出变量名与类型，但在优化构建里那是它猜的。注意点：省略帧指针的构建里 rbp 已被当通用寄存器；一个偏移可能对应整个结构体；64 位 Windows 的调用影子空间属于被调函数；调试信息与异常帧在发布构建里常被剥离，缺了它们只能给区间结论。
  principle: 栈帧恢复的依据是调用约定与编译器生成的栈指针纪律：入口按 ABI 保存被调用者寄存器、成对调整栈指针，出口恢复，所以调整量给出局部区大小，参数在入口处位于固定寄存器或栈位置。优化会移除帧指针，变量从栈搬到寄存器，栈上只剩溢出临时区，偏移与变量不再一一对应；栈槽复用与结构体整体访问进一步模糊对应关系。之所以还能恢复，是因为保存与恢复的成对性不会消失，且异常帧记录展开规则，能反推 CFA 与寄存器保存位置。
  difficulty: 4
  prerequisites:
  - tech:function-boundary-identification
  artifacts:
  - art:pe64
  - art:elf64
  - art:elf32
  - art:mach-o
  outputs:
  - 栈帧布局与参数位置表
  - 局部变量的宽度与生命周期
  - 缓冲区对象大小推断
  - 与调试器实测结果的核对记录
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: gdb -q -batch -ex "disassemble /r main" {{binary}}
    note: 带原始字节看入口与收尾代码，确认是否省略帧指针
  - cmd: objdump -d --no-show-raw-insn {{binary}}
    note: 核对栈指针的成对调整，定位栈溢出临时区的大小
  - cmd: readelf --debug-dump=frames {{binary}}
    note: 有异常帧信息时可直接拿栈展开数据，比手工推更可靠
  procedure:
  - 先用 gdb -q -batch -ex "disassemble /r main" {{binary}} 看入口与收尾原始字节，确认有无标准序言。
  - 无帧指针时改用 objdump -d --no-show-raw-insn {{binary}} 找成对的栈指针调整，用调整量估局部区大小。
  - 跑 readelf --debug-dump=frames {{binary}}，有异常帧就直接取展开规则，优先于手工推断。
  - 按调用约定固定参数位置，是寄存器还是栈，再回看函数体对栈偏移的读写。
  - 一个偏移被多处复用时按生命周期拆成多个逻辑变量，不硬认成一个。
  - 最后到调试器实测一次栈内容，推断与实测对不上的位置标为不确定。
  pitfalls:
  - 省略帧指针的构建里该寄存器已被当通用寄存器用，按标准序言找变量必然错
  - 栈上一个偏移可能对应结构体整体，相邻两个偏移未必是两个独立变量
  - 64 位 Windows 的调用影子空间会被误认成局部变量，它实际属于被调函数
  - 编译器复用栈槽给生命周期不重叠的变量，一个偏移可能对应多个逻辑变量
- id: tech:control-flow-graph-recovery
  name: 控制流图重建
  name_en: Control Flow Graph Recovery
  domain:
  - dom:re-static
  parent: dom:re-static
  def: 把指令序列重建为基本块与有向边，还原分支与循环结构。难点是间接跳转与跳转表在静态下无法穷举目标，目标缺失会让图结构性断裂。
  detail: 场景是要在函数内部做数据流、找循环、判断异常出口，或给反编译器提供结构骨架。与反汇编的区别是反汇编给指令清单，这里给基本块与边；与函数边界识别的区别是那里定函数外部轮廓，这里定函数内部结构。注意点：跳转表目标只存在于数据段，边界算错就会解析到相邻数据；异常与信号处理也是控制流的一部分；寄存器与内存间接跳转在静态下无法穷举，图不闭合时应把缺失目标标成不确定边；不同工具对同一函数的块划分可能不同，跨工具比对前先统一入口与基址。
  principle: 控制流能重建，是因为编译器把分支实现为基本块与显式跳转：顺序执行到分支结束一个块，条件跳转产生两条边，循环留下回边，从入口做可达性遍历就能覆盖正常路径。断裂来自间接跳转：switch 常被编译成跳转表，目标地址存在数据段而不是指令流里，必须先把表边界与索引范围算出来才能枚举目标，算错就会把相邻数据当代码；虚调用与函数指针同理。异常与信号路径不经过普通分支，需要从异常表补边。
  difficulty: 4
  prerequisites:
  - tech:function-boundary-identification
  - tech:disassembly
  artifacts:
  - art:pe64
  - art:elf64
  - art:mach-o
  - art:elf32
  outputs:
  - 基本块与边列表
  - 间接跳转目标候选集
  - 循环与异常出口标注
  - 不可达块清单
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: radare2 -q -c "aaa; agfj @ sym.main" {{binary}}
    note: 输出函数级控制流图的 JSON，便于脚本统计基本块与边
  - cmd: r2 -q -c "aaa; pdf @ sym.main" {{binary}}
    note: 带分支标注的反汇编视图，人工核对间接跳转处的目标推测
  - cmd: objdump -d {{binary}} | grep -cE "^\s+[0-9a-f]+:"
    note: 粗算指令规模，用于估算图的复杂度与后续分析代价
  procedure:
  - 先跑 radare2 -q -c "aaa; agfj @ sym.main" {{binary}} 导出函数级控制流图 JSON，作为可脚本统计的基线。
  - 用 r2 -q -c "aaa; pdf @ sym.main" {{binary}} 人工核对每个间接跳转点，看工具推测的目标来自哪张表。
  - 对跳转表回到数据段确认起止与索引范围，边界不清就把目标标成候选集。
  - 用 objdump -d {{binary}} 的输出统计指令行数，粗算规模后评估是否值得继续细化。
  - 补上异常与信号处理路径的边，不只建正常分支。
  - 把无法解析的间接边显式标成不确定，输出块与边列表时保留该标记。
  pitfalls:
  - 跳转表目标只存在于数据段，边界算错就会把目标解析到相邻数据上
  - 异常与信号处理路径也是控制流的一部分，只建正常路径会漏掉整类边
  - 寄存器与内存间接跳转在静态下无法完全解析，图不闭合应标注为不确定边
  - 混淆器插入的垃圾块与永不执行块会让图虚胖，块数多不代表逻辑复杂
- id: tech:static-data-flow-analysis
  name: 静态数据流分析
  name_en: Static Data Flow Analysis
  domain:
  - dom:re-static
  parent: dom:re-static
  def: 沿定义使用链追踪数据的来源与去向，判定某个值是否受外部输入影响。难点是别名、指针传递与跨函数传播让事实集迅速膨胀，精度与收敛性必须取舍。
  detail: 场景是判断某个缓冲区是否受外部输入影响、追踪一个值从接收函数到危险调用的路径，为漏洞假设找证据。与交叉引用的区别是后者只回答谁引用了这个地址，数据流回答这个值从哪来、经过什么变换；与动态污点的区别是静态不执行，覆盖所有路径但可能不精确，动态只覆盖实际走过的一条。注意点：过程间分析在递归与虚调用处容易发散，必须设深度上限；别名与指针传递让目标集合爆炸；关闭外部库加载会切断跨库数据流；框架的架构识别与入口解析一旦出错，后续传播都建立在错误图上。
  principle: 数据流之所以成立，是因为值的传播在指令层面是显式的：每条指令读写固定的寄存器与内存位置，把源点标记后沿定义使用链做集合并集，就能算出哪些使用点可能受影响。精度损失来自间接性：指针与别名让同一个内存位置指向多个对象，分析只能取保守并集；过程间传播在递归与虚调用处没有有限上界，必须设深度上限或做摘要；优化后的寄存器复用会制造假依赖。所以结论本质是可能而非必然。
  difficulty: 4
  prerequisites:
  - tech:control-flow-graph-recovery
  - tech:xref-symbol-recovery
  artifacts:
  - art:pe64
  - art:elf64
  - art:so
  - art:jar
  outputs:
  - 定义使用链
  - 污点传播路径
  - 别名与指针目标集合
  - 分析不收敛的代码区域标注
  cost: high
  false_positive_risk: medium
  commands:
  - cmd: python3 -c "import angr,sys; p=angr.Project(sys.argv[1], auto_load_libs=False);
      print(p.arch, hex(p.entry))" {{binary}}
    note: 载入分析框架做符号化数据流；先确认架构与入口解析正确
  - cmd: r2 -q -c "aaa; afvd @ sym.main" {{binary}}
    note: 列出函数内变量与访问位置，作为手工构建定义使用链的底稿
  - cmd: objdump -d --no-show-raw-insn {{binary}}
    note: 工具结论有疑问时回落到指令层核对寄存器级传播
  procedure:
  - 先按 commands 里的 angr 命令载入样本，确认 p.arch 与 p.entry 解析正确，解析失败就别往下走。
  - 选定源点与汇点，把问题缩成一条具体的传播问句，避免全程序撒网。
  - 用 r2 -q -c "aaa; afvd @ sym.main" {{binary}} 列出函数内变量与访问位置，手工勾出定义使用链底稿。
  - 过程间传播前设深度上限，并记录是否关闭外部库加载，否则分析会发散或结论只在闭包内成立。
  - 对每条传播路径回到 objdump -d --no-show-raw-insn {{binary}} 核对寄存器级读写，剔除寄存器复用造成的假依赖。
  - 输出可能受影响的路径与不确定区域，不直接写成可利用。
  pitfalls:
  - 过程间分析在递归与虚调用处容易发散，必须设深度上限，否则跑不完
  - 把受输入影响直接等同于可利用，是从数据流跳到结论的典型越界
  - 优化后的寄存器复用会制造假依赖，同一个寄存器不等于同一个变量
  - 关闭外部库加载会切断跨库数据流，结论只在闭包内成立
- id: tech:compiler-provenance-identification
  name: 编译器与优化级别识别
  name_en: Compiler Provenance Identification
  domain:
  - dom:re-static
  parent: dom:re-static
  def: 从启动代码、库函数特征与代码生成风格判断编译器族与优化档位，据此预判语义被改写的程度。难点是定制工具链与多语言混编会模糊这些特征。
  detail: 场景是在深挖前预判语义被改写的程度，优化级别决定变量是否还在栈上、内联与向量化有多激进；也用于识别自带运行时的产物。与二进制元信息研判的区别是那里读头部与保护项，这里读代码生成风格与残留字符串；与反编译的区别是反编译恢复语义，这里先判断哪些语义已经不可信。注意点：版本字符串可被伪造或剥离，缺证据只能给区间；交叉编译会带宿主工具链痕迹；静态链接的第三方库保留自己的编译特征；Go 与 Rust 会在只读数据里留构建信息，不能只按 C/C++ 经验判断。
  principle: 编译器识别可行，是因为每种工具链在生成代码时留下稳定的指纹：启动代码的初始化顺序、栈展开的注册方式、标准库函数被内联后的指令形态、以及版本注释段与符号修饰规则。这些来自后端固定策略而非业务逻辑，所以跨样本一致。但优化档位会改变指纹形态，定制工具链与多语言混编会叠加多套指纹，因此结论只能是族、版本区间与优化倾向的组合，并靠多处证据互证。
  difficulty: 3
  prerequisites:
  - tech:binary-triage-metadata
  artifacts:
  - art:pe64
  - art:elf64
  - art:mach-o
  - art:so
  outputs:
  - 编译器族与版本区间推断
  - 优化档位判断
  - 可预期的语义改写清单
  - 需重点核对的代码区域
  cost: low
  false_positive_risk: medium
  commands:
  - cmd: strings -a {{binary}} | grep -iE "GCC:|clang version|Microsoft|Go build"
    note: 版本字符串是最直接的证据，但可能被剥离或加密
  - cmd: readelf -p .comment {{binary}}
    note: ELF 常保留编译器版本注释；被 strip 或二次处理后为空
  - cmd: nm -C {{binary}} | head -50
    note: 看符号修饰风格与内联库函数是否独立成符号，可反推工具链
  procedure:
  - 先跑 strings -a {{binary}} | grep -iE "GCC:|clang version|Microsoft|Go build" 找版本串，没有也不能判定无编译器。
  - 对 ELF 跑 readelf -p .comment {{binary}} 看注释段是否保留，为空说明被剥离或二次处理过。
  - 用 nm -C {{binary}} | head -50 看符号修饰风格与内联库函数是否独立成符号，反推工具链族。
  - 对照启动代码与标准库内联形态，印证优化档位是否激进。
  - 结论只写族、版本区间与优化倾向，并列出哪些语义改写需要重点核对。
  pitfalls:
  - 版本字符串可以被伪造或整体剥离，缺证据时只能给区间结论
  - 交叉编译产物会带宿主工具链痕迹，与实际运行平台无关
  - 静态链接的第三方库保留其原始编译特征，别算到主程序头上
  - 同一编译器不同优化档位的代码风格差异很大，一句话概括整个样本必错
