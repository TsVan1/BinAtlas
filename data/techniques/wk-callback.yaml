# BinAtlas 知识库 · 技术 · dom:wk-callback
# 规范：03-DATA-SCHEMA.md §2.2

- id: tech:process-thread-callback
  name: 进程线程通知回调
  name_en: Process & Thread Notification
  domain:
  - dom:wk-callback
  parent: dom:wk-callback
  def: 注册进程与线程创建退出的通知回调，在对象生命周期早期介入观测或拦截。难点是回调在父进程或初始化上下文里执行，此时目标对象尚未初始化完，阻塞等待极易造成自死锁。
  detail: 场景是把进程与线程的生死当成事件流用：谁起了新进程、由谁起、映像是什么；或者在恶意进程落地前就把它掐掉。与映像加载回调的区别是这里拿到的是对象与映像名，不是可解析的内存映像，一次创建只发一条；与句柄操作回调的区别是它管对象本身而不是访问权限，跑在调用方拿到句柄之前。注意点：创建通知发出时对象只被初始化了一部分，初始线程可能还没跑起来，按常规方式查状态会读到未填充字段；回调在创建方线程的上下文里同步执行，在这里等待新进程的任何进展都会把创建方一起卡住；注销接口返回前要与在途回调对齐，之后才能卸载映像。
  principle: 进程创建是一次同步的内核调用：创建方线程在内核里建好进程对象、把映像映射进来，之后才返回用户态。通知就插在这条路径上——对象已经存在，所以拿得到标识与映像名；执行流还没交给新进程，所以此时拒绝创建或记录初始状态都还有效。这也解释了两条约束：通知在创建方线程里跑，等新进程就等于等自己；它只保证对象存在，不保证对象已初始化完。卸载风险同理：登记表里存的是代码地址，注销要与在途调用对齐，否则卸载后的地址会在下次事件里被调用。
  difficulty: 4
  prerequisites:
  - tech:driver-entry-device-object
  artifacts:
  - art:driver
  - art:kernel-module
  - art:memory-dump
  outputs:
  - 回调注册与注销代码
  - 回调触发条件说明
  - 目标对象的早期状态观测结果
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: '!object \Callback'
    note: 查看回调对象命名空间；能否完整列出随系统版本而异，缺失不代表没注册
  - cmd: dt nt!_EX_CALLBACK*
    note: 通配匹配回调相关类型，先确认当前符号里存在哪些类型再解读
  - cmd: lm
    note: 核对回调注册方模块是否仍加载，残留回调常指向已卸载模块
  procedure:
  - 先用 !object \Callback 看回调对象命名空间，确认目标回调在不在；这个列表不完整，缺失不能当结论。
  - 再用 dt nt!_EX_CALLBACK* 通配确认当前符号里有哪些回调相关类型，避免拿别的类型名去解读地址。
  - 用 lm 核对回调注册方模块是否仍加载，模块已卸载却还留着登记项，就是一条等待触发的野指针。
  - 触发一次目标进程创建，在回调入口断下，确认断的是创建方线程而不是新进程自身的线程。
  - 在回调里查一次新进程的状态，确认读到的是未填充字段，据此把依赖状态的动作挪到后续事件。
  - 收尾时按注册的反序注销回调再卸载驱动，确认没有在途调用报错，再把这套注册与注销写进代码。
  pitfalls:
  - 在回调里同步等待新建进程的状态，会把父进程的创建路径拖成自死锁
  - 只注销部分回调，卸载后残留指针在下次事件触发时直接蓝屏
  - 创建回调拿到的是早期对象，用常规状态查询会读到尚未填充的字段
- id: tech:image-load-callback
  name: 映像加载回调
  name_en: Image Load Notification
  domain:
  - dom:wk-callback
  parent: dom:wk-callback
  def: 在可执行映像映射完成、入口执行之前收到通知，用基址与映像信息判断是否值得关注。难点是回调只给很少信息，需自行解析映像结构，而在这个阶段做重活会拖慢每一次进程启动。
  detail: 场景是在映像映射完成、尚未执行时截获它：判断某个模块是否被某进程加载、趁它没跑起来改内存或在入口落跳转。与进程创建回调的区别是粒度更细，一次进程启动会带出许多条映像事件，延迟加载的模块稍后还会再产生一条；与静态映像解析的区别是这里只有名字与基址，PE 结构要自己从内存读。注意点：回调只给映像全名、进程标识与基址大小，名字不保证是最终实体路径（符号链接、系统根目录写法、内存映像都会出现），要落盘判定必须自己再解析；内核映像的映射与初始化顺序随加载路径而异，不要假定自己先于它的初始化代码；每次进程启动都会过这里，做重活会直接摊到启动耗时上。
  principle: 映像加载分两步：先把映像映射成节、按映像头安放各段，再跳进去执行第一条指令。通知落在两步之间——映射已完成，所以按基址读到的就是将来要执行的那份字节；执行还没开始，所以此时改写内存、或在入口落跳转都还来得及，而映像自身尚未得到任何反制机会。这也解释了参数为什么少：通知的职责只是宣布映射完成，调用方给的只是一个名字与一段地址区间，PE 结构不在参数里。也解释了它不能当唯一依据：内核映像的映射与初始化顺序与用户态不同，名字还可能指向已删除或从未落盘的内存映像。
  difficulty: 4
  prerequisites:
  - tech:process-thread-callback
  artifacts:
  - art:driver
  - art:pe64
  - art:kernel-module
  outputs:
  - 映像加载事件流
  - 关键字段提取结果
  - 回调开销评估
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: '!object \Callback'
    note: 确认映像加载回调是否已注册
  - cmd: lmvm {{module}}
    note: 查看模块加载基址与时间戳，用于验证回调里取到的信息
  - cmd: '!lmi {{module}}'
    note: 检查模块符号与映像信息，辅助判断模块是否被替换
  procedure:
  - 先用 !object \Callback 确认映像加载回调已注册，没注册就退回加载器层面的观测，别在空回调上等。
  - 触发一次目标进程启动，在回调入口断下，记下映像全名、进程标识与基址大小。
  - 拿基址用 lmvm {{module}} 对照模块的加载基址与时间戳，确认回调记录与调试器解析的是同一个映像。
  - 用 !lmi {{module}} 看模块的符号与映像信息，判断这个名字背后是不是被替换或重定位过的映像。
  - 若判定要在入口处介入，就在回调里保存映像结构快照，而不是等映像卸载后再引用旧基址。
  - 最后把回调看到的名字与自己解析出的路径做一次比对，两者不一致时以内存里的映像头为准。
  pitfalls:
  - 在回调里做完整映像解析与路径匹配，进程启动密集时会叠加成整体卡顿
  - 映像可能已被换出或卸载后才去处理，先前保存的基址随之失效
  - 只按路径黑名单判断，改名或内存加载的映像直接绕过
- id: tech:registry-callback-filtering
  name: 注册表回调过滤
  name_en: Registry Callback Filtering
  domain:
  - dom:wk-callback
  parent: dom:wk-callback
  def: 在注册表操作前后收到通知，按键路径与操作类型决定放行、审计还是拒绝。难点是路径可能尚未规范化（重定向、符号链接、相对路径），而拒绝系统级写入会造成难以预期的连锁故障。
  detail: 场景是盯着注册表的写入与删除，判断一次改动是正常配置、系统组件启动还是持久化植入，并在关键键上直接拒绝。与文件回调的区别是注册表没有流与实例的概念，一次操作就是一次带路径与值的调用；与用户态钩挂注册表接口的区别是这里在配置管理器内部生效，绕过用户态接口的写入同样会被看到。注意点：回调拿到的路径可能还没解析完，重定向与符号链接会让同一次写入以两个路径各出现一次；返回值会原样成为调用方的错误码，拒绝系统级键会让组件停在半初始化状态，必须留白名单；系统启动早期的写入早于用户态服务就绪，此时任何依赖用户态决策的拦截都会拖住启动。
  principle: 注册表操作最终都汇到配置管理器这一处执行，回调就注册在它的操作入口上：前置通知在真正改 hive 之前发出，所以此时返回失败，写入根本不会发生，调用方拿到的是自己那次调用的失败，而不是事后被纠正；后置通知在操作完成后发出，能看到最终结果与状态码。这解释了它为什么比用户态钩子可靠——钩子只能拦住走该接口的调用方，而配置管理器是所有写入的必经之路。也解释了代价：回调在发起操作的线程上下文里运行，返回值直接变成调用方的返回值，一次错误的拒绝会把发起方拽进它没写过的错误分支。
  difficulty: 5
  prerequisites:
  - tech:process-thread-callback
  artifacts:
  - art:driver
  - art:kernel-module
  outputs:
  - 监控规则与命中记录
  - 路径规范化处理方案
  - 拦截副作用评估
  cost: high
  false_positive_risk: medium
  commands:
  - cmd: '!object \Callback'
    note: 查看注册表回调的注册情况
  - cmd: reg query <键路径>
    note: 在目标系统上核对键的真实值，与回调观测到的操作对照
  - cmd: dt nt!_EX_CALLBACK*
    note: 确认回调相关类型在当前符号里的定义，避免用错结构解读
  procedure:
  - 先用 !object \Callback 确认注册表回调已注册，记下注册方模块，后续异常先怀疑它。
  - 在回调入口下断，触发一次已知的写入，确认断在发起写入的线程上，而不是某个后台线程。
  - 用 reg query <键路径> 在目标系统上读同一个键的真实值，与回调看到的路径、操作类型对照。
  - 用 dt nt!_EX_CALLBACK* 确认当前符号里的类型定义，避免按旧布局去解析回调结构。
  - 对同一次写入出现两个路径的情形，按解析后的实体键合并计数，否则会把一次操作算成两次。
  - 决定拦截前先查白名单并返回最小必要的错误码，再复跑一遍依赖该键的启动流程确认没有连锁失败。
  pitfalls:
  - 只用原始路径匹配，重定向与符号链接会让同一次写入出现两个路径
  - 拦截时直接返回错误码，会让依赖该写入的系统组件停在半初始化状态
  - 启动早期触发的写入发生时，依赖的用户态服务还没就绪
- id: tech:handle-operation-callback
  name: 句柄操作回调
  name_en: Handle Operation Callback
  domain:
  - dom:wk-callback
  parent: dom:wk-callback
  def: 在句柄打开与复制路径上收到通知，可观测甚至缩减将授予的访问权限。难点是回调运行在任意进程线程上下文，必须避锁并控制开销，而权限位的改动会反过来影响调用方的后续行为。
  detail: 场景是削减进程与线程句柄的访问权限，让外部工具拿不到读写内存、创建线程这类能力，同时保留查询类权限；也可用来观测谁在什么时候打开谁。与句柄表枚举的区别是枚举只能看到已授予的结果，回调在授予之前介入并能改写掩码；与进程创建回调的区别是它不关心对象何时出生，只关心谁以什么权限打开它。注意点：只对注册了回调的对象类型生效，别的类型照样原样授予；清权限位要按用途逐位判断，清多了合法调用方会拿到意外失败；回调在任意进程线程里跑，可能正持有对象管理器的内部锁，等待与重入会直接死锁。
  principle: 句柄是一次授予的结果：对象管理器在把句柄写进调用方句柄表之前，先把将要授予的访问掩码交给挂在对象类型上的前置回调，回调可以清掉某些位，也可以让整次打开失败。介入点在授予之前，所以权限是从源头被削减的——调用方拿到的是一个天生权限更小的句柄，之后每次使用都受它约束，而不是事后去猜某个句柄有没有被滥用。这也划出边界：回调服务的是句柄创建与复制这两条路径，已存在的句柄不会因注册回调而变小；同一份权限还会经复制在多个句柄间流转，所以掩码必须每次重算，不能一次决策永久有效。
  difficulty: 5
  prerequisites:
  - tech:process-thread-callback
  - tech:token-privilege-inspection
  artifacts:
  - art:driver
  - art:kernel-module
  outputs:
  - 句柄操作事件流
  - 权限缩减效果验证
  - 开销与稳定性评估
  cost: high
  false_positive_risk: medium
  commands:
  - cmd: '!handle 0 f Process'
    note: 对照观察句柄与授予权限，验证回调是否真的改变了结果
  - cmd: '!object \Callback'
    note: 确认回调注册状态
  - cmd: dt nt!_OBJECT_TYPE
    note: 查看对象类型结构；对象操作类回调按类型挂在各自的回调链上，字段名以符号输出为准
  procedure:
  - 先用 !object \Callback 确认回调已注册并记下注册方模块，权限异常时先排除它。
  - 在回调入口下断，用目标工具打开一次进程，确认回调在句柄出现在目标进程之前触发。
  - 用 !handle 0 f Process 对比授予后的句柄与访问权限，验证回调是否真的改写了掩码。
  - 用 dt nt!_OBJECT_TYPE 读对象类型里的回调链字段，确认改动挂在正确的类型上，字段名以符号输出为准。
  - 复跑一次正常业务操作，确认缩减后的权限没有让合法调用失败；失败就只回收多清的那几位。
  pitfalls:
  - 在回调里获取会阻塞的锁，句柄操作极频繁，立刻表现为整机变慢
  - 盲目清除权限位会让合法调用方拿到意外失败，用户侧表现为莫名拒绝访问
  - 回调里保存对象指针却不加引用，对象释放后再使用即蓝屏
- id: tech:wfp-callout-filtering
  name: 网络过滤回调驱动
  name_en: Network Filtering Callouts
  domain:
  - dom:wk-callback
  parent: dom:wk-callback
  def: 在网络栈的分层上注册分类回调，对连接与数据包做检查或阻断。难点是分类函数运行在较高中断级别，既不能阻塞也不能做重活，它与用户态策略之间的同步还必须无锁可靠。
  detail: 场景是在连接建立与数据收发处做策略：按地址与端口的组合放行、阻断、重定向或限速，并把决策落在驱动里而不是用户态代理。与用户态代理或抓包工具的区别是它挂在协议栈内部，数据还没交给上层就能被丢弃，不存在「抓到了但已经送达」的时间差；与文件过滤驱动的区别是对象不同，这边管网络事件与包。注意点：分类函数运行在较高中断级别，不能等待也不能做大块分配，与用户态策略同步只能走无锁共享或缓存；同一段流量会依次经过多个层的分类，重复计数与重复拦截要自己去重；卸载前必须把过滤表清干净，否则网络栈会继续调用已卸载的代码。
  principle: 网络栈在每一层都有分类点：连接建立、端点事件、数据包到达时，过滤引擎把这次事件作为一次分类请求，按分层与权重挑出命中项，命中项若指定了回调，引擎就把控制权交给驱动注册的分类函数。所以驱动看到的粒度由它注册的层决定——连接层给的是流与端点，包层给的是帧；阻断之所以干净，是因为决策发生在分类返回之前，数据还没交给上层协议，一旦返回阻断，上层永远看不到它。这也解释了那条硬约束：分类函数处在协议栈的调用路径上、中断级别较高，在这里等待会卡住整条收发路径，策略只能预先缓存、当场做纯查表。
  difficulty: 5
  prerequisites:
  - tech:driver-entry-device-object
  artifacts:
  - art:driver
  - art:kernel-module
  outputs:
  - 过滤层与回调设计
  - 策略同步方案
  - 分类回调开销评估
  cost: high
  false_positive_risk: medium
  commands:
  - cmd: netsh wfp show state
    note: 导出当前过滤状态；输出到文件，参数与格式随系统版本略有差异
  - cmd: netsh wfp show filters
    note: 列出已注册过滤器，核对分层与权重是否符合设计
  - cmd: '!object \Device'
    note: 确认过滤组件相关设备对象是否创建成功
  procedure:
  - 先跑 netsh wfp show state 把当前过滤状态导出到文件再读，确认自己的过滤器在不在、在哪个层。
  - 用 netsh wfp show filters 列出已注册过滤器与权重，核对分层是否符合设计，层选错只会看到部分流量。
  - 用 !object \Device 确认过滤组件相关设备对象已创建，设备没出来先别怀疑分类逻辑。
  - 让一类已知流量过一遍，在分类函数入口断下，记录事件落在哪个层、带了哪些字段。
  - 把动作从放行改成阻断复跑同一流量，确认上层真的收不到数据，而不是只多了一条日志。
  - 收尾时先清过滤表再卸载，再跑一次同类流量确认没有残留调用。
  pitfalls:
  - 在分类回调里等待用户态决策，会把整条连接路径卡死
  - 过滤层选错只看到部分流量，结论会变成没有该流量而不是没看到
  - 卸载时未注销回调，网络栈继续调用已卸载代码
- id: tech:minifilter-development
  name: 微过滤驱动开发
  name_en: Minifilter Development
  domain:
  - dom:wk-callback
  parent: dom:wk-callback
  def: 以过滤管理器管辖的过滤单元介入文件操作，注册前置与后置回调并管理流、实例、文件三级上下文。难点是上下文生命周期与取消、卸载路径交织，任何一处引用没配平都会在压力下崩。
  detail: 场景是把文件 I/O 的观测与拦截做成可安装的过滤驱动：记录谁在读写哪个文件、对特定路径加密或拒绝、给备份与还原做一致性处理。与旧式文件系统过滤驱动的区别是不再自己附挂到卷设备上、也不必手写 I/O 转发，挂接、卸载与对象生命周期都交给过滤管理器；与过滤高度与顺序的区别是那边只做选型判定，这边真写代码与上下文管理。注意点：必须走管理器的注册与卸载接口，自行附挂会与它管理的链冲突；上下文按卷、流、文件三级分配，每次分配都要在对应回调里配平，否则卷下马时就是释放后使用；前置回调里再对同一文件发 I/O 必须判断重入，否则自己等自己；网络路径与远程卷的实例创建行为与本地卷不同，只测本地单卷会漏。
  principle: 过滤管理器把「怎么挂到文件系统栈上」从驱动里抽走了：驱动注册一个过滤单元，管理器按高度把它插进每个卷的过滤链，I/O 到达卷时依次流过链上的前置回调，再进文件系统，返回时按相反顺序走一遍后置回调。于是驱动只需声明在什么操作上被叫到，不必再造设备对象、转发 I/O、处理卷的到达与移除。真正的好处是生命周期：管理器替驱动跟踪卷、流、文件对象，把上下文绑在这些对象上，对象消亡前通知驱动释放，于是驱动拿到一个有明确边界的引用计数协议——难点也在这里，每一次获取与释放都要严格配对，漏一次就会在卸载路径上崩。
  difficulty: 5
  prerequisites:
  - tech:driver-entry-device-object
  - tech:driver-irp-dispatch
  artifacts:
  - art:driver
  - art:kernel-module
  - art:memory-dump
  outputs:
  - 过滤驱动骨架
  - 上下文生命周期设计
  - 回调注册与注销清单
  cost: high
  false_positive_risk: medium
  commands:
  - cmd: fltmc filters
    note: 列出已加载过滤器与高度值，确认目标过滤器在链上的位置
  - cmd: fltmc instances
    note: 查看过滤器在各卷上的实例，实例缺失说明挂载没成功
  - cmd: '!fltkd.filters'
    note: 调试器扩展查看过滤管理器侧状态；扩展命令随调试工具版本变化，不可用就退回 fltmc
  procedure:
  - 先用 fltmc filters 看目标过滤器是否已加载、高度落在哪个区间，顺序不对后面全白做。
  - 用 fltmc instances 确认它在目标卷上真的建了实例，没有实例说明挂载阶段就失败了。
  - 用 !fltkd.filters 从调试器侧交叉看过滤链，扩展不可用就只信前两条命令的结论。
  - 在文件回调入口下断，做一次读、一次写、一次创建，确认三种操作都进了前置回调再到后置回调。
  - 在回调里对同一文件再发 I/O 之前先加重入标记，复跑上一步确认不会自己等自己。
  - 等卷上句柄全部关闭后卸载过滤器，确认没有残留上下文报错，才算生命周期配平。
  pitfalls:
  - 上下文引用没配平，卷下马或卸载时触发已释放内存访问
  - 前置回调里对同一文件再发起 I/O 却不做重入判断，会自己等自己
  - 只测单卷单文件，多卷与网络路径下的实例创建失败不会被发现
- id: tech:filter-altitude-ordering
  name: 过滤高度与顺序
  name_en: Filter Altitude Ordering
  domain:
  - dom:wk-callback
  parent: dom:wk-callback
  def: 为过滤器选定高度值以决定它在链上的相对位置，并评估与加密、备份、防病毒类过滤器的相互影响。难点是高度在安装时确定且运行期不可调整，选错只能在部署之后才暴露冲突。
  detail: 场景是给一个新过滤器选高度，或在客户机上解释为什么同一份驱动在别人机器上行为不同、功能失效。与微过滤驱动开发的区别是这里不改代码，只在既有实现上调位置与兼容结论；与回调完整性审计的区别是那边看登记项有没有被摘，这边看链上顺序对不对。注意点：高度在安装时写进服务信息，运行期不可改，改高度必须卸载重装；不同机器上装的过滤器集合不同，同一个高度在客户机上得到的位置可能就不一样；高度相同或非常接近的过滤器之间，先后由管理器的约定裁定，不能假定自己一定先看到 I/O；加密、压缩、备份类产品通常占住特定区间，选高度前先列出客户机上已经有什么。
  principle: 过滤链是一张按高度排序的表，而 I/O 在链上的走法是双向的：前置回调从高往低走，进文件系统，后置回调再从低往高走回来。于是高度同时决定两件事——你在前置路径上排第几个，以及你看到的是别的过滤器处理前还是处理后的数据。这正是加密与防病毒产品相对位置会改变结论的机制：同一个读请求，排在上面看到的是明文，排在下面看到的是已被下层改写过的数据或还在加密态的内容；加密产品的位置还会决定别的过滤器拿到的长度与内容是否可信。高度在装载时一次性读入并排好序，运行期不再重排，所以选错只能靠卸载重装纠正，也无法在没有客户机过滤链清单时预判实际顺序。
  difficulty: 4
  prerequisites:
  - tech:minifilter-development
  artifacts:
  - art:driver
  - art:kernel-module
  outputs:
  - 高度选型依据
  - 链上顺序实测结果
  - 与既有过滤器的兼容结论
  cost: low
  false_positive_risk: medium
  commands:
  - cmd: fltmc filters
    note: 查看所有过滤器及高度，直接读出链上顺序
  - cmd: fltmc instances
    note: 查看实例状态，确认顺序结论不是建立在未挂载的过滤器上
  - cmd: '!fltkd.filters'
    note: 调试器侧交叉核对过滤器链；扩展不可用则只用 fltmc 的结论
  procedure:
  - 先用 fltmc filters 读出客户机上所有过滤器与高度，把链的顺序抄下来，这是唯一可靠的顺序依据。
  - 用 fltmc instances 确认这些过滤器的实例真的挂在目标卷上，否则清单里的一部分不在本次 I/O 路径上。
  - 用 !fltkd.filters 从调试器侧核对另一份视图，两边一致才把顺序当结论，扩展不可用就只用 fltmc。
  - 按顺序标出加密、压缩、备份类过滤器相对自己的位置，写明自己看到的是明文还是密文。
  - 在目标卷上做一次读写，验证数据形态与上一步的推断一致，不一致就回头核对实例与高度。
  - 交付前把选型依据与客户机过滤链清单一起归档，换机器时先重跑第一步再判定兼容性。
  pitfalls:
  - 高度值绑定在服务注册信息里，改高度必须卸载重装
  - 只在自己机器上看顺序，客户机器多一个过滤器就改变了实际行为
  - 高度相同或相近的过滤器之间，行为差异会被放大成兼容性问题
- id: tech:callback-integrity-audit
  name: 回调完整性审计
  name_en: Callback Integrity Audit
  domain:
  - dom:wk-callback
  parent: dom:wk-callback
  def: 对比回调注册集合与历史基线，发现被摘除或被替换的回调项，判断是合法卸载还是可疑篡改。难点是没有稳定的完整枚举接口，取到的集合本身可能已被篡改，必须多来源交叉印证。
  detail: 场景是在一台怀疑被植入的机器上判断安全产品的回调还在不在，或对比两台机器的回调集合找差异。与普通恶意样本扫描的区别是这里不找文件，只看内核里登记的回调与历史基线是否一致；与驱动加载审计的区别是驱动还在、回调却可能已被摘掉，两者结论可以相反。注意点：没有稳定的完整枚举接口，命名空间里只是其中一部分，缺失不能直接当结论；枚举读的是可能已被篡改的那份内存，单一来源的结论要打折；合法卸载与恶意摘除在结果上完全一致，必须结合模块是否仍加载与签名状态判断；基线必须取自一台干净机器，否则差集天然为空。
  principle: 回调注册的本质是往内核的全局表或对象类型的回调链上写一个函数指针，合法的摘除只有注册方注销这一条路，而恶意摘除通常是直接改链表把它剪掉。于是「基线上有、当前没有」这个差集就是信号，而且它不依赖文件特征：改链表的动作不会在磁盘上留下可扫描的样本。这个方法的上限也由机制决定：枚举接口走的就是那份被改过的内存，剪链者可以在读取路径上做手脚让枚举看起来完整；很多回调并不挂在命名空间可见的对象上，名单天然不全。所以只能拿几路互不相同的来源交叉——对象命名空间、全局表、模块加载与签名——任何单一来源都不足以支撑已被摘除的结论。
  difficulty: 5
  prerequisites:
  - tech:registry-callback-filtering
  - tech:handle-operation-callback
  artifacts:
  - art:kernel-module
  - art:driver
  - art:memory-dump
  outputs:
  - 回调快照与差异清单
  - 可疑摘除项结论
  - 多来源交叉印证证据
  cost: high
  false_positive_risk: high
  commands:
  - cmd: '!object \Callback'
    note: 取回调对象快照，与基线做差集
  - cmd: lm
    note: 核对快照里回调所属模块是否仍加载；未加载却仍有回调即为可疑
  - cmd: dt nt!_EX_CALLBACK*
    note: 通配确认类型集合，避免用错类型名解读
  procedure:
  - 先在干净机器上用 !object \Callback 取一份回调快照，连同模块列表一起归档成基线。
  - 在目标机器上取同格式快照，用 lm 核对每条回调所属模块是否仍加载，未加载却仍有回调即可疑。
  - 做差集：基线有而当前没有的列为可疑摘除，当前有而基线没有的列为新增，两者含义不同不要合并。
  - 用 dt nt!_EX_CALLBACK* 通配确认当前符号里的类型集合，避免因类型名变化把整组读空当成缺失。
  - 对每条可疑项查模块的签名与加载时间，把合法卸载与仍然加载却没有回调的情况分开。
  - 两条来源结论冲突时加一份内核内存快照离线比对，仍冲突就标为证据不足，不要直接判篡改。
  pitfalls:
  - 把列表里没有当成结论，很多回调不在命名空间可见，会大量漏报
  - 基线快照取自已可能被感染的机器，差集自然为空
  - 合法安全产品的卸载与恶意摘除结果一致，必须结合模块加载与签名判断
