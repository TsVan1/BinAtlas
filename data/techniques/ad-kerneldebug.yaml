# BinAtlas 知识库 · 技术 · dom:ad-kerneldebug
# 规范：03-DATA-SCHEMA.md §2.2

- id: tech:kernel-dual-machine-debugging
  name: 双机内核调试
  name_en: Dual-Machine Kernel Debugging
  domain:
  - dom:ad-kerneldebug
  parent: dom:ad-kerneldebug
  def: 用另一台主机通过串口或网络接管目标机的内核调试通道，在内核态下断与读结构。难点是启动早期的断点必须先把调试通道建立好。
  detail: 场景是目标机能稳定复现蓝屏、挂起或驱动初始化异常，而本机无法一边跑系统一边观察它，也用于必须在引导早期拦下加载流程的场合。与本地内核调试的区别是那一侧只有内存视图、不能真的让处理器停住，这里能断、能单步、能改执行流；与调试通道搭建的区别是那边只管参数怎么配，这里管会话怎么用起来并落到观察结论。注意点：目标机上的调试开关只在启动时读取，改完不重启等于未改；网络调试要按目标机视角能路由到宿主机来填地址，填错的现象是长时间静默而不是报错；虚拟机要在通道配好之后再打快照，否则回滚一次就得重配一次。
  principle: 为什么双机不可省：内核崩溃会带走本机调试器。调试器自身是跑在被调试内核之上的线程，一旦内核停在调试中断里，调度器不再推进，这些线程再也拿不到时间片，读内存与显示命令全部停摆，等于自己把自己锁死；换成外部主机才没有这层耦合，它的调度与被调试内核无关。串口与网卡调试之所以在这种状态下仍可用，是因为串口由串口芯片直接搬运字节，网卡调试走的是网卡自己的调试收发路径，两者都不经过被调试内核的正常驱动栈。另一层原因：崩溃现场是瞬时证据，寄存器、栈与被覆盖的内存会在重启或继续执行后立刻消失，只有已经挂上的外部调试器能把那一刻留住。
  difficulty: 5
  prerequisites: []
  artifacts:
  - art:driver
  - art:pe64
  - art:memory-dump
  outputs:
  - 可断下的内核调试会话
  - 目标机调试通道配置
  - 内核态结构读取结果
  cost: high
  false_positive_risk: low
  commands:
  - cmd: bcdedit /debug on
    note: 开启当前启动项的内核调试开关，重启后生效
  - cmd: bcdedit /dbgsettings serial debugport:1 baudrate:115200
    note: 把调试通道设为串口一，波特率必须与宿主机端完全一致
  - cmd: bcdedit /dbgsettings net hostip:192.168.1.10 port:50001 key:1.2.3.4
    note: 改用网络通道，端口与密钥需与宿主机侧一致，密钥四段每段不能为 0
  - cmd: windbg -k net:port=50001,key=1.2.3.4
    note: 宿主机侧按相同端口与密钥连接目标机
  procedure:
  - 先确认要调试的是哪个启动项，打开内核调试开关后暂时不要重启，把通道参数先定下来。
  - 按可用硬件二选一配置通道，串口写清端口号与波特率，网络写清宿主机地址、端口与密钥，并把这一组取值记下来。
  - 在宿主机按完全相同的参数发起连接，参数不一致的现象是长时间等待而不是报错，先回头核对上一步的取值。
  - 重启目标机，看宿主机能否在系统启动早期就断下，断不下说明开关或通道没生效，不要先去怀疑符号。
  - 会话建立后用类型打印读要查的结构，例如 dt nt!_EPROCESS，再按结构里的指针逐层展开。
  - 分析结束先在宿主机侧断开，再让目标机继续运行，别让目标机带着半开的通道进下一次启动。
  pitfalls:
  - 内核调试开关打开后系统超时与调度行为会改变，用这样的目标机测时延类行为会得到失真结论
  - 串口通道最容易踩波特率与流控不一致，表现是连接成功但完全没有输出
  references:
  - https://learn.microsoft.com/en-us/windows-hardware/drivers/debugger/
- id: tech:kernel-local-debugging
  name: 本地内核调试
  name_en: Local Kernel Debugging
  domain:
  - dom:ad-kerneldebug
  parent: dom:ad-kerneldebug
  def: 在同一台机器上用调试器直接读内核内存与结构，不需要第二台主机。难点是能力受限：不能在内核执行中下断，只能做运行时只读观察。
  detail: 场景是手边只有一台机器，或目标机不方便接串口与网络，需要快速看内核对象、驱动模块与全局变量的当前取值。与双机调试的区别是这里没有处理器执行控制权，只能读，不能下断、不能单步、不能改执行流，所以任何「停住看某一瞬间」的结论都不成立；与符号解析的关系是只读观察同样依赖符号，没有类型信息时连字段边界都对不上。注意点：模式切换要重启才生效；读的是活的运行时状态，两次读取之间对象可能已被释放或复用，跨结构的结论必须标注读取顺序；需要调试权限，权限不足表现为连上但读任何地址都失败。
  principle: 为什么本地模式能力受限：双机调试的本质是把处理器的执行控制权交给外部，调试器通过调试通道让目标处理器停在调试中断里；本地调试走的却是内核自己提供的调试读写接口，调用者与被观察者是同一个内核，没有任何一方能替它把处理器停住。控制权没有转移，断点就没有接收者——断点指令写进去之后，触发异常的仍是这个内核自己，而它正忙着处理这个异常，外面没有人能接住。于是只剩内存视图：能按类型解释当前字节，不能冻结时间。这也解释了为什么读到的数据会自相矛盾，没有停顿点，前后两次读取属于不同时刻，结构之间的引用关系可能已经变了。
  difficulty: 4
  prerequisites:
  - tech:kernel-dual-machine-debugging
  artifacts:
  - art:driver
  - art:pe64
  outputs:
  - 内核对象与驱动的现场快照
  - 内核符号解析结果
  - 受限能力的边界清单
  cost: medium
  false_positive_risk: low
  commands:
  - cmd: bcdedit /dbgsettings local
    note: 把调试配置切换成本地模式，重启后生效
  - cmd: windbg -kl
    note: 以本地内核调试方式连接，进入后只能观察而不能真正停住内核
  procedure:
  - 确认这台机器上没有别的调试器占着内核调试对象，上一轮双机会话要彻底断开。
  - 把调试配置切换成本地模式，然后重启，让新配置在启动时被读取。
  - 以本地内核调试方式启动调试器并连上，先用一次最小读取确认权限与连接都正常。
  - 用类型打印读取目标结构，例如 dt nt!_EPROCESS，只按结构内部做一层展开，不要跨结构拼结论。
  - 记下每次读取的先后顺序，把结论明确标成运行时快照，而不是某个瞬间的现场。
  - 需要验证动态行为时回到双机模式，本地会话不能当成能下断的环境。
  pitfalls:
  - 本地调试无法在内核执行流上下断点，动态行为验证必须回到双机模式
  - 同一时间只允许一个内核调试器连接，残留会话会占用调试对象导致新连接失败
- id: tech:kernel-symbol-resolution
  name: 内核符号解析
  name_en: Kernel Symbol Resolution
  domain:
  - dom:ad-kerneldebug
  parent: dom:ad-kerneldebug
  def: 为内核模块与驱动加载匹配的符号，让栈回溯与结构偏移可读。难点是版本与编译号必须精确对应，符号错配会让所有结构字段整体偏移。
  detail: 场景是拿到目标机或转储之后，要让栈显示函数名、结构显示字段名，判断故障落在哪个驱动、哪个例程。与双机调试的区别是通道只决定能不能停下来，符号决定停下来之后能看懂多少；与结构类型解读的区别是这里只保证字段可见，字段在业务上表达什么仍要另一步判断。注意点：公开符号只覆盖导出项，私有与未导出结构一律缺失，看到名字也不能当成完整信息；离线环境要提前把符号缓存下来，否则每加载一个模块都要等一次超时；自编译产物必须连同私有符号一起保存，事后无法从二进制反推；Linux 侧的符号来自带调试信息的内核映像与模块文件，与 Windows 侧从服务器取包是两条不同的来路。
  principle: 为什么符号决定可读性：调试器本身不含目标机的任何类型知识。它能显示某个结构的字段名，是因为符号文件里存着两张表，一张把地址对到函数名，一张记着类型的成员名、宽度与相对位置，调试器按后者把一段原始内存切成字段。缺了这张表，同一段字节只能按原始宽度打印，字段边界与含义全部丢失，分析退化成对着十六进制猜。为什么错配不是降级而是错位：符号与二进制靠构建标识做精确匹配，不匹配时字段位置整体偏移，每个字段读到的都是邻居的字节，显示上却仍然像样，所以错配最危险之处不是缺信息，而是给出可信外观的错误信息。
  difficulty: 3
  prerequisites:
  - tech:kernel-dual-machine-debugging
  artifacts:
  - art:driver
  - art:kernel-module
  outputs:
  - 可用的符号路径配置
  - 精确匹配的模块符号表
  - 结构体字段偏移
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: windbg -y "srv*C:\symbols*https://msdl.microsoft.com/download/symbols" -k
      net:port=50001,key=1.2.3.4
    note: 启动时指定符号服务器与本地缓存目录，避免连上后每个模块都缺符号
  - cmd: symchk /r {{driver}} /s srv*C:\symbols*https://msdl.microsoft.com/download/symbols
    note: 离线校验驱动的符号文件是否与二进制严格匹配，不匹配就不要继续分析
  - cmd: modinfo {{binary}} | grep vermagic
    note: Linux 模块核对编译版本串，与运行内核不一致时结构偏移会全部错位
  procedure:
  - 在启动调试会话之前就指定符号路径与本地缓存目录，把本地缓存排在前面、服务器排在后面。
  - 会话建立后确认目标模块的符号状态，区分拿到的是仅导出符号还是完整私有符号，这决定结论能细到哪一层。
  - 需要精确判断时用离线校验工具核对驱动的符号文件与二进制是否严格匹配，不匹配就不要继续读结构。
  - 对 Linux 模块先核对编译版本串与运行内核是否一致，不一致时结构偏移一律不可信。
  - 匹配确认后再用类型打印读结构，例如 dt nt!_EPROCESS，并逐个核对字段取值是否合理。
  - 把符号来源与匹配结论一并记录，事后才能解释某个字段为什么读成了那个值。
  pitfalls:
  - 符号与内核编译号差一位，字段偏移就全错，表现为读到看似合理但无意义的值
  - 网络受限时符号服务器超时会让会话启动极慢，应预先离线缓存符号文件
- id: tech:kernel-driver-load-breakpoints
  name: 驱动加载期断点
  name_en: Driver Load Breakpoints
  domain:
  - dom:ad-kerneldebug
  parent: dom:ad-kerneldebug
  def: 在驱动被加载的时刻中断，赶在其初始化完成前拿到控制权。难点是加载时机早于许多用户态组件就绪，错过就得等下一次重启。
  detail: 场景是要在驱动初始化之前拿到控制权，看清它注册了哪些设备对象、拿了哪些资源、依赖哪些模块，或在会破坏环境的初始化动作之前把它停住。与内核断点管理的区别是那里断在已知函数地址上，这里断在「模块刚被映射」这个一次性事件上，早于任何初始化代码执行；与崩溃转储分析的区别是转储只有事后现场，这里能在事故前介入。注意点：模块名参数不带扩展名，写错时不会立刻报错，只是永远不命中；同一驱动被卸载再加载会再次触发，重复命中要先确认已经是第几次加载；虚拟机里回滚快照重试的代价远低于反复重启真机，应优先在快照上做。
  principle: 为什么「模块加载」这个时刻可以断：映像被内核映射进地址空间是加载器路径上的一个明确事件，调试器挂上加载通知，就能在模块已经可以下断点、但入口代码还没执行的那一刻取得控制权，这正好是观察初始化行为的唯一窗口。为什么错过就要等重启：驱动初始化的机会只有一次，等系统跑起来、用户态调试器能介入时，初始化早已结束；让它重新发生只能靠卸载重载或整机重启。为什么命中后要立刻占位：加载通知的处理期间调试器自身会重入，此刻直接按已解析地址下断点可能落空，所以先挂一个未解析的断点，等模块映射完成再让它自然解析。
  difficulty: 4
  prerequisites:
  - tech:kernel-dual-machine-debugging
  - tech:kernel-symbol-resolution
  artifacts:
  - art:driver
  - art:pe64
  outputs:
  - 驱动入口处的停止现场
  - 加载顺序与依赖关系
  - 初始化阶段的参数与设备对象
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: sxe ld:{{driver}}
    note: 调试器会话内执行：指定模块加载时中断，模块名不带扩展名
  - cmd: driverquery /v /fo csv
    note: 先确认驱动的加载类型与启动方式，引导启动的驱动要改在引导调试阶段处理
  procedure:
  - 先在目标机上确认这个驱动的加载类型与启动方式，引导启动的要直接改走引导调试，别在这里耗时间。
  - 在调试器会话里设置模块加载时中断，模块名不带扩展名，设置好以后再去触发加载。
  - 重启目标机或让服务重新加载驱动，等调试器在加载事件上停下。
  - 停下后先确认这次是新加载还是重复加载，并核对模块基址与入口地址都已经解析。
  - 在入口处用一个尚未解析的断点占位，让它在模块映射完成后自然落到正确地址。
  - 继续执行并观察初始化过程，把注册的设备对象与资源记下来，结束时清理占位断点。
  pitfalls:
  - 引导阶段加载的驱动在系统启动早期就完成初始化，用户态调试器介入时早已错过
  - 断在加载路径里再下新断点可能因重入而失效，应在模块映射后立刻用未解析断点占位
- id: tech:kernel-breakpoint-management
  name: 内核断点管理
  name_en: Kernel Breakpoint Management
  domain:
  - dom:ad-kerneldebug
  parent: dom:ad-kerneldebug
  def: 在内核地址上布置软件与硬件断点并管理命中后的恢复。难点是内核代码页被完整性机制关注，断点残留会引发整机异常。
  detail: 场景是要在某个系统调用或驱动例程被调用时停下来读参数与对象，或要抓住对某个地址的读写。与驱动加载期断点的区别是那里用加载事件定位，这里用函数地址与命中条件定位；与本地内核调试的区别是断点必须建立在能真正停住处理器的会话里，只读观察的会话中断点不会生效。注意点：软件断点要改写内核代码页，目标代码受保护时这一改写会被判成篡改；硬件断点靠处理器内的地址比较器，槽位极少，多处理器上还要逐核设置，否则只在部分核上生效；命中可能落在中断上下文或持锁路径里，此时继续执行的代价很高；断点会放大暂停时间，超时与竞态类问题在断点下往往不再复现。
  principle: 为什么内核断点会让目标机假死：断点命中后整机停住，而对端与硬件看门狗并不停，心跳、超时与重置计数仍在继续走，等调试器放行时这些定时器早已判定超时，恢复的瞬间就触发复位或链路重同步。更隐蔽的一条是命中发生在持锁的中断上下文里，其他处理器仍在自旋等这把锁，调试期间没人会释放，恢复后要么卡在等待上，要么直接触发死锁检测。为什么软件断点能断：它把目标地址的指令换成一条必然触发异常的单字节指令，执行到那里时处理器转入异常处理并交给调试器；代价是这段字节被改了，任何校验代码页完整性的机制都能看到。硬件断点靠一个字节都不落内存的地址比较器实现，因此躲得过完整性检查，但槽位固定且要逐核设置。
  difficulty: 4
  prerequisites:
  - tech:kernel-symbol-resolution
  - tech:kernel-driver-load-breakpoints
  artifacts:
  - art:driver
  - art:kernel-module
  outputs:
  - 内核断点清单与命中记录
  - 断点对系统稳定性的影响评估
  - 结构体字段的实际取值
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: bp nt!NtCreateFile
    note: 调试器会话内执行：在系统调用入口下软件断点，命中后可读参数
  - cmd: ba e1 nt!NtCreateFile
    note: 调试器会话内执行：改为硬件执行断点，不写内核代码页，适合完整性敏感环境
  - cmd: bl
    note: 调试器会话内列出全部断点并核对状态，防止断点残留
  procedure:
  - 先列出当前已有的断点并核对状态，确认没有上一轮分析留下的残留，再考虑新增。
  - 在目标函数入口下软件断点，地址用符号解析而不是硬编码，例如 bp nt!NtCreateFile。
  - 命中后先看上下文与栈，再读参数指向的对象，读完不要急着改执行流。
  - 目标代码页受保护或被完整性校验关注时，改用硬件执行断点重设，并确认它在每个处理器上都已生效。
  - 观测清楚后逐条清除或禁用断点，不要留下会在正常使用时再次命中的断点。
  - 收尾再列一次断点清单，确认没有残留后才把机器交回正常使用。
  pitfalls:
  - 软件断点会把断点指令写进内核代码页，若目标环境有内核完整性校验，可能直接触发整机崩溃
  - 命中时若处于中断上下文或持有自旋锁，继续执行代价很高，容易引发超时或死锁
- id: tech:kernel-crash-dump-analysis
  name: 崩溃转储分析
  name_en: Kernel Crash Dump Analysis
  domain:
  - dom:ad-kerneldebug
  parent: dom:ad-kerneldebug
  def: 从整机或内核转储里还原崩溃现场，定位驱动与调用链。难点是转储只有内存没有符号，转储类型决定了能看到多少信息。
  detail: 场景是只拿到一份转储文件、目标机已经恢复或不方便再复现，需要靠它还原崩溃点、故障驱动与调用链，批量筛查多份转储时也用同一套流程。与双机调试的区别是这里没有活的系统可以观察，全部结论只能来自被捕获的那部分内存；与日志分析的区别是日志记录的是程序自己认为发生的事，转储保留的是机器实际的内存内容。注意点：在线抓取时机的不同会让同一故障得到完全不同的现场，抓取本身失败时文件能生成却只有头部；符号必须对应崩溃那一次的构建，同版本不同构建的符号看起来可用，结论却会自洽而错误；大转储的传输与打开都很慢，批量筛查要先按体积与故障码做分流。
  principle: 为什么转储能复现现场：崩溃处理路径在判定故障后，按配置的类型把内存写出到分页文件或专用文件，内容因此被冻结，之后可以离线按符号解释，不需要目标机再起来。为什么分析器能指出故障驱动：崩溃那一刻，处理路径把故障码、出错指令地址、处理器状态与出问题的上下文一并记下，分析器再按已加载模块的基址范围，把出错地址换算成「属于哪个模块的哪个偏移」，所以驱动归属是算出来的，不是猜的。为什么只解开一半：转储类型决定哪些页被写下来，没被捕获的堆与未落盘的页事后无法恢复，于是同一个崩溃在小转储里看得到栈、看不到分配来源，这就是必须改配更大转储重新复现的机制原因。
  difficulty: 3
  prerequisites:
  - tech:kernel-breakpoint-management
  artifacts:
  - art:memory-dump
  - art:driver
  outputs:
  - 崩溃点与故障指令
  - 涉及的驱动与调用链
  - 内存中的可疑对象
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: windbg -z {{binary}} -c "!analyze -v; q"
    note: 把转储文件当输入自动分析，命令跑完即退出，便于批处理
  - cmd: dumpchk {{binary}}
    note: 先校验转储文件是否完整，避免分析到一半才发现文件被截断
  procedure:
  - 先用完整性校验工具检查转储文件有没有被截断，文件不完整时后面的结论一律不可信。
  - 用调试器以文件为输入加载转储，让它自动执行分析后退出，便于批量筛查多份文件。
  - 先读故障码与故障指令位置，判断这是访问违例、断言还是主动崩溃。
  - 沿栈把出错地址归到具体模块，再用该模块的符号核对是不是真落在这个函数里，而不是被内联或尾调用的位置。
  - 对栈上可疑对象逐个用类型打印核对，例如 dt nt!_EPROCESS，取值与故障形态对不上的要排除。
  - 记录结论时同时写下转储类型与符号匹配情况，明确哪些判断受信息量限制。
  pitfalls:
  - 小内存转储只保留崩溃线程栈与少量对象，想看内核堆必须改配更大转储并复现
  - 转储里的模块基址与线上不一致（地址随机化与热补丁），按静态地址对符号会得到错误函数
- id: tech:linux-kgdb-remote-debugging
  name: Linux 内核远程调试
  name_en: Linux Kernel Debugging with kgdb
  domain:
  - dom:ad-kerneldebug
  parent: dom:ad-kerneldebug
  def: 通过串口或虚拟机调试桩把内核交给外部调试器，用内核映像符号断进函数。难点是断点会停住整机，网络与时钟随之冻结，判断窗口很窄。
  detail: 场景是排查 Linux 内核模块或内核自身的问题，需要在内核函数级别停下来看参数与结构，而用户态工具完全看不到这些路径。与内核动态追踪的区别是那边不停机、只记录，这里会让整机停住，因此能读一致性快照但会破坏时序；与 Windows 侧双机调试的区别是符号来源不同，这里靠带调试信息的内核映像与模块文件，而不是服务器上的符号包。注意点：调试桩要绑定到具体的串口或虚拟控制台，绑定时波特率与对端必须一致；触发后机器不再接受任何本地输入，恢复只能靠对端继续；远程控制如果走同一台机器的网络栈，会随整机一起失联，应准备好带外控制台。
  principle: 为什么整机冻结既是能力也是代价：调试桩在内核里保留一条断点与异常的接管路径，命中时当前处理器停在桩的轮询里不再前进，其余处理器收到专门的中断后被一并停住，于是所有处理器的内存视图停在同一时刻，读到的结构才是一致的，这是不停机的追踪做不到的。代价来自同一机制：时钟不再被推进，依赖时间流逝的定时器、网络与看门狗在冻结期间全部停摆，而对端硬件照常计时，所以恢复的瞬间这些子系统会同时发现已经过去太久，进而触发超时、重传或复位。判断窗口因此很窄：停下来能看，但看得越久，恢复后的系统离原始状态越远。
  difficulty: 5
  prerequisites: []
  artifacts:
  - art:kernel-module
  - art:firmware-image
  outputs:
  - 内核函数级断点现场
  - 内核数据结构取值
  - 整机冻结时的外设状态
  cost: high
  false_positive_risk: medium
  commands:
  - cmd: echo ttyS0,115200 > /sys/module/kgdboc/parameters/kgdboc
    note: 把内核调试桩绑到串口，波特率需与外部调试器一致
  - cmd: echo g > /proc/sysrq-trigger
    note: 主动让内核进入调试桩等待外部连接，执行后整机停住
  - cmd: gdb {{binary}} -ex "target remote /dev/ttyUSB0"
    note: 用带调试符号的内核映像作符号源，通过串口连接调试桩
  procedure:
  - 先确认手上有与运行内核严格对应、带调试信息的内核映像，没有它后面所有符号都是错的。
  - 把调试桩绑定到要用的串口并给出与外部一致的波特率，绑定后再继续。
  - 在实验机上关掉依赖时钟推进的看门狗与超时机制，避免恢复时立刻被重置。
  - 主动触发内核进入调试桩，执行后整机停住，本地输入全部失效。
  - 在外部以该映像作符号源、以串口设备为目标连上，确认读到的是目标内核的函数后再下断点。
  - 观测完成后让内核继续运行，随即检查整机有没有被看门狗或超时机制复位。
  - 每次实验结束都要解绑或复位调试桩，避免下一次启动带着上一轮的设置。
  pitfalls:
  - 断住内核时整机停摆，靠时钟推进的看门狗会在恢复后立刻触发，实验机应关掉这类定时器
  - 符号与运行内核版本不一致时函数地址全部错位，调试器只会给出看似正常的错栈
  references:
  - https://www.kernel.org/doc/html/latest/dev-tools/kgdb.html
- id: tech:linux-kernel-dynamic-tracing
  name: 内核动态追踪
  name_en: Linux Kernel Dynamic Tracing
  domain:
  - dom:ad-kerneldebug
  parent: dom:ad-kerneldebug
  def: 用内核自带的追踪设施挂探针观察函数与参数，不停机也不改目标代码。难点是探针有开销与数量上限，事件量过大时会丢样本。
  detail: 场景是在生产环境或难以重启的内核上观察某个函数的调用次数、参数取值与耗时分布，判断行为是否与预期一致。与远程调试的区别是那边会让整机停住，这里在运行中插桩，不停机也不改目标代码的语义；与内核日志的区别是日志要改代码重编，这里只在运行期挂探针。注意点：探针挂在函数入口与挂在返回处语义不同，入口处读不到返回值，要拿结果得另外配返回探针；追踪设施依赖调试文件系统已挂载且有足够权限，容器里还要额外放行；在正式环境使用前先在小流量路径上量一次开销，再决定要不要挂热路径。
  principle: 为什么不停机也能看到：探针的实现是把目标位置的那条指令临时换成一个会触发异常的入口，执行到此处时处理器转入内核的探针处理路径，处理函数把参数与时间戳写进环形缓冲区，随后单步执行被换下来的原指令并把现场恢复，所以被观察的代码仍在正常执行，只是每个命中多绕了一段异常路径。为什么必须收窄：每个命中都要走一次异常与一次缓冲区写入，热路径上这条额外成本会被放大成整体变慢；缓冲区是固定大小的环形结构，写入快于读取时最旧的事件被覆盖，丢样本是结构决定的，不是偶发故障。这也是过滤条件要下在探针上、而不是事后筛选的原因。
  difficulty: 3
  prerequisites:
  - tech:linux-kgdb-remote-debugging
  artifacts:
  - art:kernel-module
  - art:elf64
  outputs:
  - 内核函数调用与参数记录
  - 事件时间线与耗时分布
  - 无停机条件下的行为证据
  cost: low
  false_positive_risk: low
  commands:
  - cmd: echo "p:probe_open do_sys_open" >> /sys/kernel/debug/tracing/kprobe_events
    note: 注册一个内核探针事件，挂到指定内核函数入口
  - cmd: echo 1 > /sys/kernel/debug/tracing/events/kprobes/probe_open/enable
    note: 打开刚注册的事件，之后的行为都会记入追踪缓冲区
  - cmd: cat /sys/kernel/debug/tracing/trace_pipe
    note: 实时读取追踪输出，事件多时优先用管道而不是整份缓冲区
  procedure:
  - 先确认要观察的函数在运行内核的符号表里确实存在且没有被内联，名字对不上就不要继续。
  - 注册一个探针事件，把事件名与目标函数绑定，注册完先确认它已经出现在追踪目录里。
  - 打开这个事件，之后所有命中都会被记进追踪缓冲区。
  - 用实时管道读取输出，事件多时优先用管道而不是一次性读整份缓冲区。
  - 看到预期行为后收窄范围，加过滤条件或只保留关心的调用路径，避免拖慢系统。
  - 分析结束关闭事件并删除探针，确认目录里没有残留事件才算收尾。
  pitfalls:
  - 探针挂在热路径上会让系统整体变慢，输出量还会把环形缓冲区冲掉，必须用过滤条件收窄
  - 内核函数被内联或改名后探针注册失败，符号名要以运行内核的导出表为准
  references:
  - https://www.kernel.org/doc/html/latest/trace/kprobetrace.html
