# BinAtlas 知识库 · 技术 · dom:ad-armsrace
# 规范：03-DATA-SCHEMA.md §2.2

- id: tech:hardware-execution-breakpoint
  name: 硬件执行断点
  name_en: Hardware Execution Breakpoint
  domain:
  - dom:ad-armsrace
  parent: dom:ad-armsrace
  def: 用调试寄存器在指定地址触发执行断点，完全不改写目标代码。难点是可用槽位极少、状态按线程保存，新线程不会自动继承。
  detail: 场景是要在被完整性校验守着的、或只读可执行的代码页上拦下某条指令：代码段不能写，写进去的断点字节又会被校验抓到，只能用处理器自身的地址比对停下来。与软件断点的区别是那边必须先把断点指令写进代码页、还要先把页改成可写，这边一个字节都不动；与硬件数据观察点的区别是同一个槽位在控制字段里选了不同的监视类型，这边比对取指地址、命中停在该指令执行之前。注意点：调试寄存器属于线程上下文，随线程一起被保存与恢复，换线程就换一套，新线程创建时不会继承；槽位数量由架构固定且很少，设满后再设会被直接拒绝；线程被调度到哪个核都带着这套设置，但没设过的线程就是没有断点。
  principle: 为什么有效：断点的判定被从内存搬进了处理器。软件断点靠把 0xCC（int3）写进代码页、等执行到那里触发异常；执行断点是把地址与监视类型写进调试寄存器，取指时由处理器的地址比对器逐条比对，命中就在该指令执行前产生调试异常。整条链上代码页没有被写、没有从只读改成可写、也没有因写时复制与磁盘副本脱钩，靠内存校验、页属性扫描、代码段哈希做的自检看不到差异。它还省掉了软件断点那套恢复原字节、回退指令指针、单步、再写回的循环，而那个循环每次都留出一个代码字节与文件不一致的窗口，并行扫描的线程能抓到。
  difficulty: 4
  prerequisites:
  - tech:single-step-execution
  - tech:debug-register-clearing
  - tech:multithread-breakpoint-sync
  artifacts:
  - art:pe64
  - art:elf64
  outputs:
  - 无代码改写的断点现场
  - 每线程的断点配置
  - 槽位占用清单
  cost: medium
  false_positive_risk: low
  commands:
  - cmd: gdb -q -batch -p {{pid}} -ex "hbreak *$pc" -ex continue
    note: 在当前指令地址设硬件执行断点，不向目标代码写入断点指令
  - cmd: gdb -q -batch -p {{pid}} -ex "info breakpoints"
    note: 确认断点类型显示为硬件断点，软件断点会暴露为内存改写
  procedure:
  - 先确认目标页是否可写、有没有自检：只读或带校验的代码段不要试图用软件断点，直接选处理器侧断点。
  - 附加或启动目标后先看现有断点占用，确认监视槽位没被别的观察点占满，再决定把哪个地址放进哪个槽。
  - 用 hbreak 设执行断点，再回读断点列表确认类型是硬件断点而不是软件断点。
  - 命中后读状态寄存器判断是哪个槽触发，再取该线程寄存器与栈；此时目标代码字节应与磁盘副本一致。
  - 目标创建新线程时立刻补设，线程上下文里的监视寄存器是新建时的默认值，不补就等于该线程没有断点。
  - 收尾先清槽位与使能位、恢复线程上下文，再分离调试器，别把半开的监视留在活线程上。
  - 痕迹面清单：被动过又恢复的线程上下文里的调试寄存器值、调试器与被调试进程的关系（Linux 的 TracerPid、Windows 的调试对象与 BeingDebugged）、命中停住造成的计时与心跳空档、以及调试器进程自身的加载与命令行。
  pitfalls:
  - 调试器新创建的线程不会自动继承断点配置，必须在每个线程上重新设置
  - 每个线程只有四个槽位，用完后再设观察点会被直接拒绝
  references:
  - https://learn.microsoft.com/en-us/windows/win32/api/processthreadsapi/nf-processthreadsapi-getthreadcontext
- id: tech:hardware-data-watchpoint
  name: 硬件数据观察点
  name_en: Hardware Data Watchpoint
  domain:
  - dom:ad-armsrace
  parent: dom:ad-armsrace
  def: 用调试寄存器监视某地址的读写，捕获数据流而不改动内存。难点是地址必须按监视宽度对齐，监视范围还被限制在很窄的字节数内。
  detail: 场景是盯住一个变量或一个指针字段的读写：谁在改它、从哪条指令改、改成了什么，而目标内存与页表都不许动。与执行断点的区别是监视类型换成读写、被比对的是数据访问地址而不是取指地址，命中落在访问该地址的指令上；与页保护单步的区别是那边按整页放行、相邻数据都会触发，这边只认对齐的小窗口，事件干净但看得极窄。注意点：窗口宽度与访问类型由控制字段编码固定，越界或未对齐的地址会被拒绝或被静默调整；槽位按线程算，只在一个线程上设点会漏掉其他线程的访问；它最容易被与软件观察点混淆，后者靠单步加比较内存值模拟，性能与痕迹完全不同。
  principle: 为什么有效：监视由处理器的地址比对器在每次数据访问时完成，而不是由任何插进目标里的东西完成。控制字段里每个槽位有宽度与访问类型，比对器判断这次访问落在哪个槽的窗口内、方向是否匹配，命中就产生调试异常并在状态寄存器里标出是哪个槽触发，目标内存一个字节没改，页表权限没改，目标侧也没有多出代码、线程或句柄。与软件观察点的分界正在这里：后者只能靠每条指令单步后比较内存值来模拟，速度慢几个数量级，而单步本身又是留在执行流上的明显扰动。它的软肋是粒度，一个槽只能盯对齐的窄窗口，字段多于槽位时必须取舍。
  difficulty: 4
  prerequisites:
  - tech:hardware-execution-breakpoint
  artifacts:
  - art:pe64
  - art:elf64
  outputs:
  - 数据读写点与访问指令
  - 被监视变量的取值变化
  - 访问时序
  cost: medium
  false_positive_risk: low
  commands:
  - cmd: gdb -q -batch -p {{pid}} -ex "rwatch *(int*)$rsp" -ex continue
    note: 硬件读观察点，任何读取该地址的指令都会停下，用于追数据来源
  - cmd: gdb -q -batch -p {{pid}} -ex "info watchpoints"
    note: 确认观察点状态与命中次数，区分硬件观察点与靠单步实现的软件观察点
  procedure:
  - 先从反汇编或符号定下要监视的地址，同时确认访问宽度与对齐，宽度只有 1、2、4、8 字节四档，地址必须按宽度对齐。
  - 数一下还剩几个槽位，不够就先取舍：优先盯指针字段或计数器，别指望一个槽覆盖整个结构。
  - 按意图选读、写或读写监视设点，再回读确认它是硬件观察点而不是靠单步模拟的软件观察点。
  - 多线程时先弄清哪些线程会碰这个地址，或者在每个线程上各设一遍，只在主线程设会漏。
  - 命中后取访问指令地址与读写方向，把谁写的、写成什么记成一条，再决定下一次停不停。
  - 收尾清槽位、恢复上下文后再分离，别让监视跨会话留在活线程上。
  - 痕迹面清单：线程上下文里被动过的监视寄存器、调试关系本身、每次命中造成的停顿与时间累积、目标自己也用调试寄存器时的槽位冲突，以及槽位占满后被迫改用软件观察点会留下的单步痕迹。
  pitfalls:
  - 地址必须按监视宽度对齐，未对齐的地址在设置时就被拒绝或被静默调整
  - 监视宽度上限随架构不同，更宽的访问要拆成多个槽位，否则会漏掉一侧读写
- id: tech:page-guard-stepping
  name: 页保护单步
  name_en: Page Guard Stepping
  domain:
  - dom:ad-armsrace
  parent: dom:ad-armsrace
  def: 把目标页设为保护页或不可访问，靠访问异常实现近似单步，不写任何断点字节。难点是粒度是整页，且保护位触发后必须每次重设。
  detail: 场景是既不能改代码、也不想占调试寄存器时，用一次页权限变更换取访问告警：想知道某个页什么时候被碰、被谁碰。与硬件观察点的区别是粒度整页、事件量按页内全部访问计，必须在异常处理里按故障地址二次筛；与软件断点的区别是它改的是页权限而不是代码字节，命中之后还要额外把访问放行。注意点：在 Windows 上保护位是一次性的，异常送达时已经被清掉，不重设就再也不触发；Linux 上没有这种自动清除，处理者要自己恢复权限、单步、再设回去；保护只能加在已提交的页上，用它做单步会让时间尺度彻底失真。
  principle: 为什么有效：它把触发点从指令搬到了内存管理单元。取指或取数先查页表项权限，权限不满足就在访问完成前产生页错误，系统再把它翻译成用户态可见的异常，并把故障地址交给处理者。代码字节没动、调试寄存器没占，改的只是一条权限位，所以靠代码校验做的自检依旧干净。代价是这条权限位本身可观测：它出现在进程的内存描述里，也出现在页表差异里；而触发按页产生，处理者手里只有故障地址，是不是目标页的判断必须由软件补，这正是它误报率高于硬件观察点的原因，也是事件量会失控的原因。
  difficulty: 4
  prerequisites:
  - tech:hardware-data-watchpoint
  - tech:breakpoint-integrity-bypass
  - tech:exception-chain-takeover
  artifacts:
  - art:pe64
  - art:elf64
  outputs:
  - 页粒度的访问轨迹
  - 无需改写的单步序列
  - 保护位重设记录
  cost: high
  false_positive_risk: medium
  commands:
  - cmd: strace -f -e trace=mprotect -p {{pid}}
    note: 观察目标自身的页保护调用，确认保护位被谁、在何时重设
  - cmd: grep -E "^(---p|rw-p)" /proc/{{pid}}/maps
    note: 找出权限被改成不可访问的区间，那就是保护页所在的范围
  procedure:
  - 先定位目标所在的页与页内偏移，把「目标页 + 偏移」当判定条件，别把整页当目标。
  - 只对必需的页加保护，能少一页就少一页，否则相邻数据会把事件量冲垮。
  - 装好异常或信号处理并确认能取到故障地址与访问类型，取不到就无法二次筛。
  - 第一次命中时用故障地址核对是不是目标偏移，不是就放行，别在无关访问上停住。
  - 放行并推进：Windows 上让异常继续执行（保护位已经清掉），Linux 上先恢复可访问、单步、再加回不可访问。
  - 每次处理后立即重设保护位，忘了这一步，之后的所有访问都不会再被捕获。
  - 痕迹面清单：进程内存描述里的权限异样（maps 的权限列或虚拟地址描述的保护值）、页表项差异、异常处理者本身的位置（向量化处理链或信号处理函数就装在目标地址空间里）、以及命中与放行造成的耗时与事件计数暴涨。
  pitfalls:
  - 保护粒度是整页，相邻数据也会触发异常，事件量会远超实际目标点
  - 保护位触发一次后会被清除（由系统在异常分派时清除，不是硬件自动完成），忘记重设会让后续访问完全不被捕获，忘记重设会让后续访问完全不被捕获
  references:
  - https://learn.microsoft.com/en-us/windows/win32/api/memoryapi/nf-memoryapi-virtualprotect
- id: tech:hypervisor-introspection
  name: 虚拟机外部观察
  name_en: Hypervisor-Level Introspection
  domain:
  - dom:ad-armsrace
  parent: dom:ad-armsrace
  def: 把断点与内存读取放到虚拟机监控层，目标内存与页表完全不被改动。难点是外部视角拿不到进程内语义，符号与结构都要自己还原。
  detail: 场景是目标机既不能装调试器、也不能改它任何结构：恶意驱动、自校验内核，或必须整机取证的环境。与双机内核调试的区别是那边目标内核仍要参与调试协议、要开调试开关并重启，这边目标系统完全不知道有人在看；与页保护单步的区别是拦截装在目标看不见的二级页表里，目标自己的页表与代码段一个字节不动。注意点：外部视角只有物理内存与寄存器，没有进程与符号语义，看清结构要靠自己走页表还原；需要宿主侧硬件虚拟化支持，纯软件模拟虽能做但时序与指令行为会失真；目标侧仍能检测虚拟化本身，外部观察不等于隐身。
  principle: 为什么有效：观察者不在目标机里。断点不再由目标自己的代码或异常机制实现，而是把目标页在二级页表里标成不可执行，目标取指时由处理器直接陷入监控层，监控层记下命中的物理地址再放行。二级页表由监控层私有，目标操作系统的页表遍历看不到它，所以目标侧既没有断点字节、没有权限变更，也没有任何进程、驱动或系统调用参与调试。这就是透明的来源：一切自检只能看到自己的状态，而调试器根本不是那个状态的一部分。代价是语义断层，拿到的只是物理内存与寄存器，进程结构得自己重建。
  difficulty: 5
  prerequisites:
  - tech:page-guard-stepping
  - tech:kernel-dual-machine-debugging
  - tech:time-source-hooking
  artifacts:
  - art:memory-dump
  - art:driver
  - art:elf64
  outputs:
  - 目标机内部无改写的断点现场
  - 外部视角的内存快照
  - 虚拟机监控层可观测范围
  cost: high
  false_positive_risk: low
  commands:
  - cmd: qemu-system-x86_64 -s -S -kernel {{binary}}
    note: 以冻结方式启动并开放调试桩，启动后 CPU 停在第一条指令之前
  - cmd: gdb {{binary}} -ex "target remote :1234"
    note: 连到调试桩，所有断点都停在监控层，目标内存里不出现断点字节
  procedure:
  - 先把目标冻在可控点（暂停启动或打快照），确认宿主机侧能拿到监控层控制权。
  - 建立外部观察会话后先做一次最小读取，确认能按物理地址取到内容，再开始定位目标。
  - 从页表或已知结构走到目标所在的物理页，在二级页表里对它设执行拦截，而不是往目标里写任何东西。
  - 拿到第一次命中后按控制寄存器与物理内存重建上下文：当前页表基址、进程结构链、模块基址，逐一核对再下结论。
  - 需要单步时用监控层自己的单步机制推进，不要回落到目标内的单步异常。
  - 结束时撤掉二级页表拦截让目标继续，并核对目标侧没有任何结构被改动。
  - 痕迹面清单：目标侧仍能看到的虚拟化特征（CPUID 里的虚拟化标识位、MSR 与计时偏差）、拦截带来的异常时延、宿主机侧的观察进程与快照文件，以及调试通道端口。
  pitfalls:
  - 外部观察只能看到物理内存与寄存器，进程语义要靠自己重建，工作量常被低估
  - 目标侧可检测虚拟化痕迹（特性位与计时偏差），外部观察并不能做到完全隐身
- id: tech:kernel-callback-observation
  name: 内核回调与事件追踪
  name_en: Kernel Callback and Event Tracing
  domain:
  - dom:ad-armsrace
  parent: dom:ad-armsrace
  def: 用驱动回调或系统事件追踪设施观察进程与模块活动，不修改目标任何字节。难点是回调只在特定事件点触发，拿不到指令级细节。
  detail: 场景是把进程、线程、映像加载这类生命周期事件当流水看，同时不想让目标进程里出现调试器：事件由内核在既有发布点上发出。与用户态调试的区别是那边必须附加、会改目标地址空间并停住线程，这边目标照跑、地址空间不受影响；与内核动态追踪的区别是那边按函数与偏移下探针、要改内核代码字节，这边只登记回调。注意点：回调在事件发生时同步执行、处在调用方上下文里，在这里阻塞会连带卡住被观察的事件；事件追踪的缓冲区是环形的，写满就覆盖旧数据；回调与追踪会话都是系统里可见的对象，注册本身即留痕。
  principle: 为什么有效：这类观察不创造新观测点，只是去用内核原本就会调用的那些点。进程创建、映像加载这些路径在内核里本来就有从回调链分发的固定位置，登记回调只是让这条链多一个接收者；事件追踪用的是编译期就埋进内核与驱动的埋点。两者都不写目标代码、不改目标页表、不在目标进程里产生线程与句柄，所以无内存改写在结构上成立。矛盾也在这里：要让内核知道事件交给谁，接收者只能登记在内核结构里，回调链指针、会话对象与缓冲区全是系统状态，枚举它们就能反过来发现观察者。
  difficulty: 4
  prerequisites:
  - tech:kernel-driver-load-breakpoints
  - tech:kernel-dual-machine-debugging
  artifacts:
  - art:driver
  - art:pe64
  outputs:
  - 进程与模块事件时间线
  - 加载链与调用方
  - 无内存改写的观察证据
  cost: medium
  false_positive_risk: low
  commands:
  - cmd: wpr -start GeneralProfile -filemode
    note: 启动系统级事件追踪，进程、模块与文件活动都会被记录
  - cmd: xperf -on PROC_THREAD+LOADER -f trace.etl
    note: 只开进程与加载器事件，数据量小，便于看模块加载时序
  procedure:
  - 先明确要回答的问题属于哪类事件（进程生死、映像加载、文件与注册表访问），只开对应的事件源。
  - 用系统级追踪先跑一次小样本，确认事件确实出现在时间窗里，再决定要不要动内核回调。
  - 需要更细或需要拦截时才注册内核回调，注册后立刻查返回状态，被拒绝通常是签名或引用计数策略。
  - 采集时记住缓冲区是环形的，按估算的事件量决定采集时长，并在关键动作后立刻停止保存。
  - 分析时用事件里拿到的对象与映像名做主键，去和进程列表、模块列表对齐，别把事件顺序当成指令级因果。
  - 收尾注销回调并等它在途调用结束，再卸载任何观察模块。
  - 痕迹面清单：内核里的回调链指针、事件追踪会话对象与未保存的缓冲区、采集进程本身与它的命令行、落盘的追踪文件，以及模块加载事件本身。
  pitfalls:
  - 回调只能看到事件发生，看不到事件内部的参数与分支，定位到函数级就断了
  - 事件追踪的缓冲区会覆盖旧数据，长时间采集必须在合适时机停止并保存
- id: tech:ebpf-uprobe-tracing
  name: 内核探针无侵入追踪
  name_en: eBPF uprobe Tracing
  domain:
  - dom:ad-armsrace
  parent: dom:ad-armsrace
  def: 在内核侧挂用户态或内核函数探针收集参数与调用，不在目标进程里留调试器。难点是探针实现方式决定可被发现的程度，且拿不到完整控制流。
  detail: 场景是要拿到函数级调用与参数，但不想在目标旁边摆一个调试器进程、不想要附加关系。与附加调试的区别是这边没有调试器与被调试进程的父子关系，也没有目标线程被停住的时刻；与内核回调的区别是那边只能看事件，这边能按函数入口取参数与调用栈。注意点：用户态探针的实现在目标进程的映射里放的是断点指令，靠写时复制换页完成，磁盘文件不变但进程内存会变，内存级完整性校验能发现；挂载探针需要内核侧权限，挂载动作本身登记在内核里；只给函数级信息，分支与循环要另配跟踪。
  principle: 为什么有效：观察点在内核侧，执行流走到被标记的位置时控制先交给内核注册的处理程序，处理完再回来，目标进程里没有第二个调试器在跑。收益是真的：没有附加关系、没有为观察而停住的线程、参数与调用栈都在内核侧收集。但它不是无痕：内核必须知道到此该通知谁，这个谁只能登记在内核自己的结构里，探针表、被探测文件的登记项、程序与映射对象的句柄全是系统状态，枚举就能发现；用户态探针还要在目标地址空间放进一条断点指令，磁盘不动、内存变了。
  difficulty: 4
  prerequisites:
  - tech:linux-kernel-dynamic-tracing
  - tech:kernel-callback-observation
  artifacts:
  - art:elf64
  - art:so
  outputs:
  - 函数级调用与参数记录
  - 进程外部的观察证据
  - 探针自身的可见性评估
  cost: medium
  false_positive_risk: low
  commands:
  - cmd: bpftrace -l "uprobe:{{binary}}:*"
    note: 列出目标文件里可挂的用户态探针点，先确认符号与偏移可用
  - cmd: bpftrace -e "uprobe:{{binary}}:main { printf(\"hit\\n\"); }"
    note: 在目标函数入口挂探针，命中即打印，不需要把调试器附加到目标进程
  procedure:
  - 先列一遍目标文件里可挂的探针点，没有符号就先按偏移定位并用反汇编核对。
  - 判断接受哪种代价：内核函数探针会改动内核代码，用户态探针会改目标进程的映射，两者都不干净。
  - 先挂一个最小探针确认能命中，再扩到需要的函数，一次挂太多会让事件量失控。
  - 探针里只收集必要字段（参数、时间、调用栈），内核侧处理逻辑保持短小，别在热点函数里做重活。
  - 采集结束后按进程与函数聚合，把命中次序与静态反汇编对齐，再下控制流结论。
  - 撤掉探针并确认内核里的登记项已清干净，别把挂载点留在系统里。
  - 痕迹面清单：内核侧探针登记表与被探测文件的登记项、加载进来的程序与映射对象句柄、采集进程与其权限提升记录、目标进程映射里的断点指令，以及探针带来的函数入口耗时偏移。
  pitfalls:
  - 基于断点指令实现的探针仍会改写目标代码，完整性校验能发现；只有走函数入口跳板的实现才不写断点
  - 内核侧探针看不到用户态的控制流细节，分支与循环信息需要另配硬件跟踪
- id: tech:intel-pt-branch-tracing
  name: 处理器分支跟踪
  name_en: Processor Branch Tracing
  domain:
  - dom:ad-armsrace
  parent: dom:ad-armsrace
  def: 用处理器的分支记录能力离线还原执行路径，全程不写目标内存也不停住进程。难点是只有控制流没有数据，缓冲区溢出还会丢段。
  detail: 场景是要完整执行路径而不是抽样：样本只在特定分支上发作，抽样看不到，下断点又会改变时序。与断点类手段的区别是它不打断执行、也不修改任何内存或页表，记录由处理器自己在流水线里完成；与采样式性能剖析的区别是那种按时间抽点、只能看到热点，这边记录每次分支走向，路径可以还原。注意点：只有控制流没有数据，条件是否成立要靠反汇编里的比较与另配的数据观察点推断；记录缓冲是环形的，写满会丢段，长路径要先估算事件量；需要处理器支持该事件源与相应内核配置，虚拟化环境里可能不可用。
  principle: 为什么有效：记录发生在处理器执行侧，不发生在被调试的程序里。处理器把每条分支的结果写进事先约定的一块物理缓冲，取指与执行照常进行，不产生异常、不插入断点、不需要任何线程停下来等调试器。目标侧因此看不到三个常见痕迹：代码字节没变、页表权限没变、执行流里没有停顿。它与断点的根本差别是观测模型：断点是停下来看一个点，这里是把过程全记下来事后还原，所以能还原出断点还原不了的瞬时分支选择。代价是维度，只有走向没有数据，也没有断点那种停下来看寄存器的现场。
  difficulty: 5
  prerequisites:
  - tech:hardware-data-watchpoint
  artifacts:
  - art:elf64
  - art:pe64
  outputs:
  - 执行路径与分支序列
  - 热点与异常跳转点
  - 无停顿的观察证据
  cost: high
  false_positive_risk: medium
  commands:
  - cmd: perf record -e intel_pt//u -o pt.data -- {{binary}}
    note: 采集用户态分支跟踪数据，需要处理器与内核都支持该事件源
  - cmd: perf script --itrace=b -i pt.data | head -50
    note: 解析分支记录，确认解码出的执行路径与静态反汇编能对上
  procedure:
  - 先确认处理器与内核都支持该事件源，并核对采集范围是单进程还是整机，选错范围会混进大量无关记录。
  - 估算路径长度与分支频率，按估算给缓冲区定尺寸，宁大勿小，写满后旧记录会被覆盖。
  - 先用最小样本采一次，解析出前若干条分支，确认解码路径与静态反汇编对得上。
  - 正式采集只包住需要的那段执行，用起停边界把无关路径切掉。
  - 分析时把分支记录摊到反汇编上，标出异常跳转与没有走到的分支，再回到二进制里解释。
  - 需要数据值时另配硬件数据观察点或寄存器采样，别指望分支记录给出取值。
  - 痕迹面清单：内核侧可见的追踪事件与环形缓冲对象、落盘的跟踪文件、发起采集的进程与权限，以及缓冲区覆盖留下的路径空洞。
  pitfalls:
  - 分支记录不含数据值，判断条件是否成立仍需寄存器或内存信息配合
  - 缓冲区不足时旧记录会被覆盖，长路径分析必须先估算事件量
- id: tech:remote-channel-isolation
  name: 远程调试通道隔离
  name_en: Remote Debug Channel Isolation
  domain:
  - dom:ad-armsrace
  parent: dom:ad-armsrace
  def: 把调试器与目标分到不同主机，通过调试通道而非进程内组件完成观察。难点是用户态断点仍落在目标内存，真正无痕只能靠硬件与虚拟化手段。
  detail: 场景是必须调试却又不能把调试器摆在被调试机上：调试界面、符号与内存分析全在另一台主机。与本地附加调试的区别是目标机上不再有调试器进程去读内存、解析符号、渲染界面，只剩一个尽量瘦的传输端；与虚拟机外部观察的区别是目标仍是裸机或完整系统，靠的是它自带的调试传输路径而不是监控层。注意点：用户态远程调试的服务端仍是目标机上的一个进程，有进程号、有附加关系，断点字节也仍写在目标内存里；内核通道要在启动配置里开启并重启生效；网络通道要求目标机能路由到宿主机。
  principle: 为什么有效：把分析与被分析分成两台机器，目标侧最多只留传输。内核通道的调试流量由内核的调试传输模块经网卡或串口直接收发，走的是调试专用收发路径而不是应用层套接字，所以目标机里没有监听端口、没有已建立的连接、没有对应的套接字与进程，靠枚举端口、连接与进程做的网络侧检查看不到它；用户态通道同理把界面与符号处理移走。矛盾在于痕迹没有消失，只是换了位置：链路上的调试报文、被占用的网卡、启动配置里的开关、那个服务端进程，都留在原地。
  difficulty: 5
  prerequisites:
  - tech:hypervisor-introspection
  - tech:module-handle-hiding
  - tech:kernel-dual-machine-debugging
  - tech:ptrace-interception
  - tech:intel-pt-branch-tracing
  artifacts:
  - art:pe64
  - art:elf64
  - art:driver
  outputs:
  - 目标机上的调试器足迹清单
  - 通道配置与带宽评估
  - 剩余可检测面
  cost: high
  false_positive_risk: medium
  commands:
  - cmd: gdbserver --attach :1234 {{pid}}
    note: 让目标进程由独立进程接管并通过网络暴露调试通道，目标机内仍需服务进程
  - cmd: windbg -k net:port=50001,key=1.2.3.4
    note: 内核通道完全在目标机之外，宿主机只通过调试协议与目标交互
  procedure:
  - 先判断要的是内核通道还是用户态通道：内核通道要在目标机启动配置里开开关并重启，用户态通道要往目标机放服务端进程。
  - 内核通道按目标机视角填宿主机可达的地址与端口，两端密钥必须一致，填错的现象是长时间静默而不是报错。
  - 会话建立后先做一次最小读取，确认通道通、符号加载正常，再开始下断点。
  - 用户态通道要接受服务端进程留在目标机这一事实，把它算进痕迹预算，能放进临时系统或容器就更好。
  - 高速或关键路径别用会丢包的传输，改用串口这类有序可靠的通道。
  - 收尾先断开宿主机侧，再撤服务端进程或关掉通道开关，最后核对目标机恢复原状。
  - 痕迹面清单：目标机上的服务端进程（进程号、命令行、启动时间）、内核通道的启动配置开关、链路上连续的调试报文（可被镜像与流量分析抓到）、网卡被调试传输占用造成的异常状态，以及暂停执行造成的计时空档。
  pitfalls:
  - 远程通道只是把调试器界面移走，服务端进程与断点字节仍留在目标机上，痕迹并未归零
  - 网络调试在高负载下丢包会导致断点命中丢失，关键路径应改用串口这类可靠通道
