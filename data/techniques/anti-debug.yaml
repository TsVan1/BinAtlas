# BinAtlas 知识库 · 技术 · 调试与反调试
# 规范：03-DATA-SCHEMA.md §2.2（parent / commands / pitfalls / references）/ §6.1 字数口径
# 覆盖 5 个子领域：dom:ad-userdebug · dom:ad-kerneldebug · dom:ad-detect · dom:ad-bypass · dom:ad-armsrace
# 命令模板占位符只用 {{binary}} / {{pid}} / {{driver}}；标注「调试器会话内」的条目为调试器命令，不是 shell 命令

# ============================================================
# 一、用户态调试（dom:ad-userdebug）—— 分析者侧的调试craft
# ============================================================

- id: tech:user-mode-attach-freeze
  name: 用户态附加与冻结
  name_en: User-Mode Attach and Freeze
  domain: [dom:ad-userdebug]
  parent: dom:ad-userdebug
  def: 把调试器挂到已运行进程并暂停其线程，获得可控的静止现场。难点是附加窗口与目标的反调试初始化竞争，慢一步现场就已被改写。
  difficulty: 2
  prerequisites: []
  artifacts: [art:pe64, art:elf64]
  outputs:
  - 附加成功后的线程与寄存器快照
  - 目标当前的挂起范围
  - 附加被拒绝的原因判定
  cost: low
  false_positive_risk: low
  commands:
  - cmd: 'gdb -q -batch -p {{pid}} -ex "info threads" -ex "thread apply all bt"'
    note: '按 PID 附加后一次性打印全部线程与栈，批处理模式便于脚本化'
  - cmd: 'cat /proc/{{pid}}/status | grep -E "^(State|TracerPid)"'
    note: '确认进程是否已被其他调试器占用，TracerPid 非 0 表示已被跟踪'
  pitfalls:
  - '目标处于不可中断睡眠状态时 ptrace 附加会失败或长时间阻塞，需先让目标退出该状态'
  - '附加后目标 fork 出的子进程默认不被跟进，父进程冻结时子进程仍在运行，现场并不完整'

- id: tech:runtime-module-mapping
  name: 运行时模块映射
  name_en: Runtime Module Mapping
  domain: [dom:ad-userdebug]
  parent: dom:ad-userdebug
  def: 枚举目标已加载模块与段的实际基址，把静态地址换算成运行时地址。难点是地址随机化与重定位让同一函数每次落点不同，符号还常被剥离。
  difficulty: 2
  prerequisites:
  - tech:user-mode-attach-freeze
  artifacts: [art:pe64, art:elf64, art:so]
  outputs:
  - 模块基址与大小表
  - 静态地址到运行时地址的换算表
  - 关键函数在内存中的落点
  cost: low
  false_positive_risk: low
  commands:
  - cmd: 'cat /proc/{{pid}}/maps | grep -E "r-xp"'
    note: '取可执行映射区间，一个模块首个 r-xp 区间的起点通常就是基址'
  - cmd: 'gdb -q -batch -p {{pid}} -ex "info sharedlibrary"'
    note: '列出共享库及加载地址，输出里的起始地址列即基址'
  - cmd: 'readelf -l {{binary}} | grep -A1 LOAD'
    note: '静态查看段的虚拟地址与文件偏移，用于基址换算与映射对照'
  pitfalls:
  - '同一模块会出现在多个映射区间（可执行、只读、可写各一段），拿错区间起点算出的基址会整体偏移'
  - '位置无关映像要拿符号地址加基址，非位置无关可直接用静态虚拟地址，两种情形混用会把调用点算错'

- id: tech:memory-read-write-patch
  name: 运行时内存读写
  name_en: Runtime Memory Read/Write and Patching
  domain: [dom:ad-userdebug]
  parent: dom:ad-userdebug
  def: 在目标地址空间读结构体、改指令字节，验证对数据布局与分支条件的假设。难点是页权限与写时复制：只读页直接写会崩，改完还要处理校验。
  difficulty: 3
  prerequisites:
  - tech:runtime-module-mapping
  artifacts: [art:pe64, art:elf64, art:memory-dump]
  outputs:
  - 关键结构体的内存快照
  - 已验证的指令级补丁
  - 页权限变更记录
  cost: low
  false_positive_risk: medium
  commands:
  - cmd: 'gdb -q -batch -p {{pid}} -ex "x/16gx $rsp" -ex "info proc mappings"'
    note: '从栈指针附近读内存并对照映射，确认读的是有效页而不是野地址'
  - cmd: 'gdb -q -batch -p {{pid}} -ex "set *(unsigned char *)$rip = 0x90"'
    note: '把当前指令首字节改成空操作；写只读代码页前要先改页权限才能落笔'
  - cmd: 'objdump -d -M intel {{binary}} | head -50'
    note: '静态对照反汇编确认补丁点原始指令，避免改错字节位置'
  pitfalls:
  - '直接向可执行页写入会触发访问违例，Linux 下需借 ptrace 写入或先改保护，Windows 下需先改成可写'
  - '补丁不记录原始字节会导致无法还原，也会让按节区取校验和的检测立刻命中'

- id: tech:single-step-execution
  name: 单步执行跟踪
  name_en: Single-Step Execution Tracing
  domain: [dom:ad-userdebug]
  parent: dom:ad-userdebug
  def: 逐条执行指令并读寄存器与标志位，把模糊的控制流变成可核对的序列。难点是陷阱标志可被目标检测，单步开销还会让带超时的目标提前退出。
  difficulty: 2
  prerequisites:
  - tech:memory-read-write-patch
  artifacts: [art:pe64, art:elf64]
  outputs:
  - 逐指令执行轨迹
  - 关键寄存器变化记录
  - 条件分支的实际走向
  cost: low
  false_positive_risk: medium
  commands:
  - cmd: 'gdb -q -batch {{binary}} -ex "set disassemble-next-line on" -ex "starti" -ex "stepi 5" -ex "info registers rip rax"'
    note: '从入口单步五条指令并打印寄存器，适合脚本化确认入口分支条件'
  - cmd: 'gdb -q -batch -p {{pid}} -ex "si" -ex "x/i $pc"'
    note: '对已运行进程单步一条，并显示下一条待执行指令'
  pitfalls:
  - '单步遇到系统调用会直接执行到返回而不进入内核，想看内核侧行为必须改用系统调用追踪'
  - '每次停止都会清掉陷阱标志，连续单步要逐步重新进入，不能指望设置一次就一直生效'

- id: tech:call-stack-unwinding
  name: 运行时栈回溯
  name_en: Runtime Call Stack Unwinding
  domain: [dom:ad-userdebug]
  parent: dom:ad-userdebug
  def: 由栈内容与展开信息还原调用链，定位是哪个调用点触发了敏感操作。难点是优化后的代码没有帧指针，异常帧与尾调用会打断链条。
  difficulty: 3
  prerequisites:
  - tech:runtime-module-mapping
  artifacts: [art:pe64, art:elf64, art:memory-dump]
  outputs:
  - 调用链与返回地址列表
  - 可疑调用点定位
  - 栈布局推断
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: 'gdb -q -batch -p {{pid}} -ex "bt full"'
    note: '展开完整调用栈并打印局部变量，符号缺失时只能看到裸地址'
  - cmd: 'eu-stack -p {{pid}}'
    note: '用 elfutils 从 procfs 读栈并展开，适合目标没有调试符号的场景'
  pitfalls:
  - '代码以省略帧指针方式编译时，按栈基址链回溯会得到错位的调用链，需靠展开信息或栈扫描校正'
  - '栈上残留的旧返回地址会被误判成帧，深栈回溯必须与代码段地址范围交叉验证'

- id: tech:exception-dispatch-tracing
  name: 异常分发追踪
  name_en: Exception Dispatch Tracing
  domain: [dom:ad-userdebug]
  parent: dom:ad-userdebug
  def: 观察异常从产生到被处理器接管的路径，识别靠异常做控制流或做自检的代码。难点是首次与二次异常机会、信号传递与继续执行的语义各不相同。
  difficulty: 4
  prerequisites:
  - tech:call-stack-unwinding
  artifacts: [art:pe64, art:elf64]
  outputs:
  - 异常类型与触发指令
  - 处理器链与接管顺序
  - 控制流是否被异常改写
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: 'gdb -q -batch {{binary}} -ex "handle SIGSEGV stop print pass" -ex run'
    note: '在段错误处停下但仍把信号传给目标，用于区分异常控制流与真实崩溃'
  - cmd: 'cat /proc/{{pid}}/status | grep -E "^(SigCgt|SigBlk)"'
    note: '查看目标捕获与屏蔽的信号位图，未捕获的同步信号会直接终止进程'
  pitfalls:
  - '把信号设成不停止会让调试器错过异常点，而靠异常做控制流的代码正需要调试器看不见'
  - 'Windows 首次异常交给进程内处理器后不再上报调试器，只断在第二次机会会漏掉真正的触发点'

- id: tech:multithread-breakpoint-sync
  name: 多线程断点同步
  name_en: Multithread Breakpoint Synchronization
  domain: [dom:ad-userdebug]
  parent: dom:ad-userdebug
  def: 在断点命中时冻结全部线程并在恢复时重新布点，避免只停一个线程导致状态被并发改写。难点是线程创建与销毁时机不固定，新线程会漏掉断点。
  difficulty: 3
  prerequisites:
  - tech:user-mode-attach-freeze
  artifacts: [art:pe64, art:elf64]
  outputs:
  - 全线程停止点与栈快照
  - 并发状态一致性判定
  - 新建线程的断点补设记录
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: 'gdb -q -batch -p {{pid}} -ex "set scheduler-locking on" -ex continue'
    note: '只让当前线程推进、其余线程保持停止，观察窗口内不会被并发改写'
  - cmd: 'gdb -q -batch -p {{pid}} -ex "info threads" -ex "thread apply all bt"'
    note: '命中后一次性抓全部线程栈，确认是否有线程在窗口内继续推进'
  pitfalls:
  - '只停住命中线程时其余线程会继续改被观察的数据，结构体可能读到撕裂状态'
  - '运行期新建的线程不会继承断点与暂停状态，必须在创建后补设，否则会漏跟踪'

- id: tech:conditional-breakpoint-watch
  name: 条件断点与数据观察
  name_en: Conditional Breakpoints and Data Watchpoints
  domain: [dom:ad-userdebug]
  parent: dom:ad-userdebug
  def: 只在条件成立或某块内存被访问时中断，避免在热路径上反复停住。难点是条件表达式在目标上下文求值，写错会改状态或让目标卡死。
  difficulty: 3
  prerequisites:
  - tech:single-step-execution
  - tech:memory-read-write-patch
  artifacts: [art:pe64, art:elf64]
  outputs:
  - 命中条件与命中次数
  - 数据读写点与访问指令
  - 关键变量的取值变化
  cost: medium
  false_positive_risk: low
  commands:
  - cmd: 'gdb -q -batch {{binary}} -ex "break main if $rdi != 0" -ex run -ex "info registers"'
    note: '条件断点示例，只有条件成立才停，条件在目标上下文里求值'
  - cmd: 'gdb -q -batch -p {{pid}} -ex "watch -l *(long *)$rsp" -ex continue'
    note: '对被监视地址设写观察点，按地址定位而不是每次重新求值表达式'
  pitfalls:
  - '条件里调用函数会改变目标状态甚至再次触发被观察事件，条件应只读寄存器和内存'
  - '软件观察点靠单步实现，热路径上会把执行拖到超时，命中次数高时应改用硬件观察点'

# ============================================================
# 二、内核态调试（dom:ad-kerneldebug）
# ============================================================

- id: tech:kernel-dual-machine-debugging
  name: 双机内核调试
  name_en: Dual-Machine Kernel Debugging
  domain: [dom:ad-kerneldebug]
  parent: dom:ad-kerneldebug
  def: 用另一台主机通过串口或网络接管目标机的内核调试通道，在内核态下断与读结构。难点是启动早期的断点必须先把调试通道建立好。
  difficulty: 5
  prerequisites: []
  artifacts: [art:driver, art:pe64, art:memory-dump]
  outputs:
  - 可断下的内核调试会话
  - 目标机调试通道配置
  - 内核态结构读取结果
  cost: high
  false_positive_risk: low
  commands:
  - cmd: 'bcdedit /debug on'
    note: '开启当前启动项的内核调试开关，重启后生效'
  - cmd: 'bcdedit /dbgsettings serial debugport:1 baudrate:115200'
    note: '把调试通道设为串口一，波特率必须与宿主机端完全一致'
  - cmd: 'bcdedit /dbgsettings net hostip:192.168.1.10 port:50001 key:1.2.3.4'
    note: '改用网络通道，端口与密钥需与宿主机侧一致，密钥四段每段不能为 0'
  - cmd: 'windbg -k net:port=50001,key=1.2.3.4'
    note: '宿主机侧按相同端口与密钥连接目标机'
  pitfalls:
  - '内核调试开关打开后系统超时与调度行为会改变，用这样的目标机测时延类行为会得到失真结论'
  - '串口通道最容易踩波特率与流控不一致，表现是连接成功但完全没有输出'
  references:
  - https://learn.microsoft.com/en-us/windows-hardware/drivers/debugger/

- id: tech:kernel-local-debugging
  name: 本地内核调试
  name_en: Local Kernel Debugging
  domain: [dom:ad-kerneldebug]
  parent: dom:ad-kerneldebug
  def: 在同一台机器上用调试器直接读内核内存与结构，不需要第二台主机。难点是能力受限：不能在内核执行中下断，只能做运行时只读观察。
  difficulty: 4
  prerequisites:
  - tech:kernel-dual-machine-debugging
  artifacts: [art:driver, art:pe64]
  outputs:
  - 内核对象与驱动的现场快照
  - 内核符号解析结果
  - 受限能力的边界清单
  cost: medium
  false_positive_risk: low
  commands:
  - cmd: 'bcdedit /dbgsettings local'
    note: '把调试配置切换成本地模式，重启后生效'
  - cmd: 'windbg -kl'
    note: '以本地内核调试方式连接，进入后只能观察而不能真正停住内核'
  pitfalls:
  - '本地调试无法在内核执行流上下断点，动态行为验证必须回到双机模式'
  - '同一时间只允许一个内核调试器连接，残留会话会占用调试对象导致新连接失败'

- id: tech:kernel-symbol-resolution
  name: 内核符号解析
  name_en: Kernel Symbol Resolution
  domain: [dom:ad-kerneldebug]
  parent: dom:ad-kerneldebug
  def: 为内核模块与驱动加载匹配的符号，让栈回溯与结构偏移可读。难点是版本与编译号必须精确对应，符号错配会让所有结构字段整体偏移。
  difficulty: 3
  prerequisites:
  - tech:kernel-dual-machine-debugging
  artifacts: [art:driver, art:kernel-module]
  outputs:
  - 可用的符号路径配置
  - 精确匹配的模块符号表
  - 结构体字段偏移
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: 'windbg -y "srv*C:\symbols*https://msdl.microsoft.com/download/symbols" -k net:port=50001,key=1.2.3.4'
    note: '启动时指定符号服务器与本地缓存目录，避免连上后每个模块都缺符号'
  - cmd: 'symchk /r {{driver}} /s srv*C:\symbols*https://msdl.microsoft.com/download/symbols'
    note: '离线校验驱动的符号文件是否与二进制严格匹配，不匹配就不要继续分析'
  - cmd: 'modinfo {{binary}} | grep vermagic'
    note: 'Linux 模块核对编译版本串，与运行内核不一致时结构偏移会全部错位'
  pitfalls:
  - '符号与内核编译号差一位，字段偏移就全错，表现为读到看似合理但无意义的值'
  - '网络受限时符号服务器超时会让会话启动极慢，应预先离线缓存符号文件'

- id: tech:kernel-driver-load-breakpoints
  name: 驱动加载期断点
  name_en: Driver Load Breakpoints
  domain: [dom:ad-kerneldebug]
  parent: dom:ad-kerneldebug
  def: 在驱动被加载的时刻中断，赶在其初始化完成前拿到控制权。难点是加载时机早于许多用户态组件就绪，错过就得等下一次重启。
  difficulty: 4
  prerequisites:
  - tech:kernel-dual-machine-debugging
  - tech:kernel-symbol-resolution
  artifacts: [art:driver, art:pe64]
  outputs:
  - 驱动入口处的停止现场
  - 加载顺序与依赖关系
  - 初始化阶段的参数与设备对象
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: 'sxe ld:{{driver}}'
    note: '调试器会话内执行：指定模块加载时中断，模块名不带扩展名'
  - cmd: 'driverquery /v /fo csv'
    note: '先确认驱动的加载类型与启动方式，引导启动的驱动要改在引导调试阶段处理'
  pitfalls:
  - '引导阶段加载的驱动在系统启动早期就完成初始化，用户态调试器介入时早已错过'
  - '断在加载路径里再下新断点可能因重入而失效，应在模块映射后立刻用未解析断点占位'

- id: tech:kernel-breakpoint-management
  name: 内核断点管理
  name_en: Kernel Breakpoint Management
  domain: [dom:ad-kerneldebug]
  parent: dom:ad-kerneldebug
  def: 在内核地址上布置软件与硬件断点并管理命中后的恢复。难点是内核代码页被完整性机制关注，断点残留会引发整机异常。
  difficulty: 4
  prerequisites:
  - tech:kernel-symbol-resolution
  - tech:kernel-driver-load-breakpoints
  artifacts: [art:driver, art:kernel-module]
  outputs:
  - 内核断点清单与命中记录
  - 断点对系统稳定性的影响评估
  - 结构体字段的实际取值
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: 'bp nt!NtCreateFile'
    note: '调试器会话内执行：在系统调用入口下软件断点，命中后可读参数'
  - cmd: 'ba e1 nt!NtCreateFile'
    note: '调试器会话内执行：改为硬件执行断点，不写内核代码页，适合完整性敏感环境'
  - cmd: 'bl'
    note: '调试器会话内列出全部断点并核对状态，防止断点残留'
  pitfalls:
  - '软件断点会把断点指令写进内核代码页，若目标环境有内核完整性校验，可能直接触发整机崩溃'
  - '命中时若处于中断上下文或持有自旋锁，继续执行代价很高，容易引发超时或死锁'

- id: tech:kernel-crash-dump-analysis
  name: 崩溃转储分析
  name_en: Kernel Crash Dump Analysis
  domain: [dom:ad-kerneldebug]
  parent: dom:ad-kerneldebug
  def: 从整机或内核转储里还原崩溃现场，定位驱动与调用链。难点是转储只有内存没有符号，转储类型决定了能看到多少信息。
  difficulty: 3
  prerequisites:
  - tech:kernel-breakpoint-management
  artifacts: [art:memory-dump, art:driver]
  outputs:
  - 崩溃点与故障指令
  - 涉及的驱动与调用链
  - 内存中的可疑对象
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: 'windbg -z {{binary}} -c "!analyze -v; q"'
    note: '把转储文件当输入自动分析，命令跑完即退出，便于批处理'
  - cmd: 'dumpchk {{binary}}'
    note: '先校验转储文件是否完整，避免分析到一半才发现文件被截断'
  pitfalls:
  - '小内存转储只保留崩溃线程栈与少量对象，想看内核堆必须改配更大转储并复现'
  - '转储里的模块基址与线上不一致（地址随机化与热补丁），按静态地址对符号会得到错误函数'

- id: tech:linux-kgdb-remote-debugging
  name: Linux 内核远程调试
  name_en: Linux Kernel Debugging with kgdb
  domain: [dom:ad-kerneldebug]
  parent: dom:ad-kerneldebug
  def: 通过串口或虚拟机调试桩把内核交给外部调试器，用内核映像符号断进函数。难点是断点会停住整机，网络与时钟随之冻结，判断窗口很窄。
  difficulty: 5
  prerequisites: []
  artifacts: [art:kernel-module, art:firmware-image]
  outputs:
  - 内核函数级断点现场
  - 内核数据结构取值
  - 整机冻结时的外设状态
  cost: high
  false_positive_risk: medium
  commands:
  - cmd: 'echo ttyS0,115200 > /sys/module/kgdboc/parameters/kgdboc'
    note: '把内核调试桩绑到串口，波特率需与外部调试器一致'
  - cmd: 'echo g > /proc/sysrq-trigger'
    note: '主动让内核进入调试桩等待外部连接，执行后整机停住'
  - cmd: 'gdb {{binary}} -ex "target remote /dev/ttyUSB0"'
    note: '用带调试符号的内核映像作符号源，通过串口连接调试桩'
  pitfalls:
  - '断住内核时整机停摆，靠时钟推进的看门狗会在恢复后立刻触发，实验机应关掉这类定时器'
  - '符号与运行内核版本不一致时函数地址全部错位，调试器只会给出看似正常的错栈'
  references:
  - https://www.kernel.org/doc/html/latest/dev-tools/kgdb.html

- id: tech:linux-kernel-dynamic-tracing
  name: 内核动态追踪
  name_en: Linux Kernel Dynamic Tracing
  domain: [dom:ad-kerneldebug]
  parent: dom:ad-kerneldebug
  def: 用内核自带的追踪设施挂探针观察函数与参数，不停机也不改目标代码。难点是探针有开销与数量上限，事件量过大时会丢样本。
  difficulty: 3
  prerequisites:
  - tech:linux-kgdb-remote-debugging
  artifacts: [art:kernel-module, art:elf64]
  outputs:
  - 内核函数调用与参数记录
  - 事件时间线与耗时分布
  - 无停机条件下的行为证据
  cost: low
  false_positive_risk: low
  commands:
  - cmd: 'echo "p:probe_open do_sys_open" >> /sys/kernel/debug/tracing/kprobe_events'
    note: '注册一个内核探针事件，挂到指定内核函数入口'
  - cmd: 'echo 1 > /sys/kernel/debug/tracing/events/kprobes/probe_open/enable'
    note: '打开刚注册的事件，之后的行为都会记入追踪缓冲区'
  - cmd: 'cat /sys/kernel/debug/tracing/trace_pipe'
    note: '实时读取追踪输出，事件多时优先用管道而不是整份缓冲区'
  pitfalls:
  - '探针挂在热路径上会让系统整体变慢，输出量还会把环形缓冲区冲掉，必须用过滤条件收窄'
  - '内核函数被内联或改名后探针注册失败，符号名要以运行内核的导出表为准'
  references:
  - https://www.kernel.org/doc/html/latest/trace/kprobetrace.html

# ============================================================
# 三、反调试识别（dom:ad-detect）—— 每个条目都指向具体检测点
# ============================================================

- id: tech:peb-debug-flags-inspection
  name: 调试标志位读取
  name_en: PEB Debug Flag Inspection
  domain: [dom:ad-detect]
  parent: dom:ad-detect
  def: 读进程环境块里的调试标志与堆标志判断是否被调试。难点是这些字段既可能被合法工具改写，也可能被伪造，单看一处会误判。
  difficulty: 2
  prerequisites: []
  artifacts: [art:pe64, art:pe32]
  outputs:
  - 调试标志位取值
  - 堆标志异常判定
  - 是否被调试的初判
  cost: low
  false_positive_risk: medium
  commands:
  - cmd: 'cdb -p {{pid}} -c "dt ntdll!_PEB @$peb; q"'
    note: '附加后打印进程环境块，观察调试标志字节与全局标志字段'
  - cmd: 'objdump -d -M intel {{binary}} | grep -nE "gs:0x60|fs:0x30"'
    note: '在反汇编里找按段寄存器取环境块的固定偏移，定位标志位读取点'
  pitfalls:
  - '标志位被调试器之外的兼容层或注入运行时改过会造成误判，必须结合堆标志与调试对象一起看'
  - '偏移随位数不同，32 位从 fs 段取、64 位从 gs 段取，照抄偏移会读到无关字段'
  note: 与「调试标志位篡改」成对：识别侧读调试标志字节与全局标志字段，绕过侧原地写回同一字段。

- id: tech:debug-register-inspection
  name: 调试寄存器检查
  name_en: Debug Register Inspection
  domain: [dom:ad-detect]
  parent: dom:ad-detect
  def: 读线程上下文里的调试寄存器，判断是否有人设了硬件断点。难点是寄存器状态按线程保存，只看一个线程会漏。
  difficulty: 3
  prerequisites: []
  artifacts: [art:pe64, art:pe32]
  outputs:
  - 调试寄存器取值与断点配置
  - 硬件断点是否存在
  - 被监视地址范围
  cost: low
  false_positive_risk: low
  commands:
  - cmd: 'cdb -p {{pid}} -c "r dr0; r dr1; r dr2; r dr3; r dr6; r dr7; q"'
    note: '调试器会话内逐个读调试寄存器，前四个非零通常意味着有硬件断点'
  - cmd: 'strings -a {{binary}} | grep -c GetThreadContext'
    note: '静态确认目标是否导入线程上下文获取接口，这是读调试寄存器的前置调用'
  pitfalls:
  - '调试寄存器属于线程上下文，新创建线程默认为零，必须逐线程检查才不会漏'
  - '使能位与长度位有固定编码，按位判断错会把数据断点当成执行断点'
  note: 与「调试寄存器清零」成对：识别侧按线程读寄存器，绕过侧清空使能位并回读确认。

- id: tech:debug-port-object-inspection
  name: 调试端口与对象检查
  name_en: Debug Port and Debug Object Inspection
  domain: [dom:ad-detect]
  parent: dom:ad-detect
  def: 查询进程的调试端口、调试对象句柄与调试标志，判断是否被接管。难点是不同信息类返回值语义不同，零值与非零值都可能有歧义。
  difficulty: 3
  prerequisites:
  - tech:peb-debug-flags-inspection
  artifacts: [art:pe64]
  outputs:
  - 调试端口与对象句柄状态
  - 线程隐藏调试状态
  - 进程是否处于被调试状态
  cost: low
  false_positive_risk: low
  commands:
  - cmd: 'strings -a {{binary}} | grep -c NtQueryInformationProcess'
    note: '确认目标是否引用进程信息查询接口，这是查调试端口与调试对象的最短路径'
  - cmd: 'strings -a {{binary}} | grep -c NtSetInformationThread'
    note: '确认是否存在线程信息设置调用，主动隐藏调试状态就靠这个接口'
  pitfalls:
  - '调试端口在未附加时也可能非零，只凭非零值判定被调试会误报'
  - '线程级隐藏标志一旦设置不会自动清除，能发现主动隐藏行为，但无法区分调试器与其他工具'
  note: 与「调试对象解绑」成对：识别侧查端口、对象句柄与调试标志三类信息，绕过侧解除对象关联。

- id: tech:breakpoint-integrity-inspection
  name: 断点与完整性检查
  name_en: Breakpoint and Integrity Inspection
  domain: [dom:ad-detect]
  parent: dom:ad-detect
  def: 扫描代码段里的断点指令或比对节区校验和，发现内存被改写。难点是合法自修改代码与热补丁也会改字节，判定必须结合基线与范围。
  difficulty: 3
  prerequisites:
  - tech:memory-read-write-patch
  artifacts: [art:pe64, art:elf64]
  outputs:
  - 可疑断点指令位置
  - 节区校验和差异
  - 被改写字节的范围
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: 'r2 -q -c "/x cc" -c "q" {{binary}}'
    note: '在文件或进程映像里搜索断点指令字节，命中处需人工确认是否为真实断点'
  - cmd: 'readelf -S {{binary}} | grep -E "\.text|\.plt"'
    note: '先划定代码段边界，校验和覆盖范围不划清就会把数据段差异当成改写'
  pitfalls:
  - '合法自修改代码、热补丁与调试器断点留下的字节差异完全相同，单看差异无法归因'
  - '按节区取校验和时若把未初始化段与对齐填充也算进去，正常加载就会产生偏差'
  note: 与「断点完整性绕过」成对：识别侧扫断点字节与校验和，绕过侧回填原始字节或不落断点。

- id: tech:timing-delta-detection
  name: 时间差检测
  name_en: Timing Delta Detection
  domain: [dom:ad-detect]
  parent: dom:ad-detect
  def: 比较关键代码段的执行耗时判断是否被单步或断点拖慢。难点是合法调度与虚拟化本身就有抖动，阈值定得越紧误报越多。
  difficulty: 2
  prerequisites: []
  artifacts: [art:pe64, art:elf64]
  outputs:
  - 代码段耗时分布
  - 异常延时判定
  - 阈值与误报率关系
  cost: low
  false_positive_risk: high
  commands:
  - cmd: 'strace -f -tt -e trace=clock_gettime,gettimeofday -p {{pid}}'
    note: '观察目标读时钟的调用频率与时机，时间差检测必然高频读时钟'
  - cmd: 'perf stat -e task-clock,context-switches -p {{pid}} sleep 5'
    note: '统计目标的时间片与上下文切换，用于区分调试停顿与被调度抢占'
  pitfalls:
  - '虚拟机与容器里的时钟精度远低于物理机，同一阈值在虚拟化环境下必然误报'
  - '调度抢占、缺页与频率调节都会制造毫秒级抖动，只看单次测量不足以判定被调试'
  note: 与「时间源返回伪造」成对：识别侧测代码段耗时，绕过侧在时间接口层给出一致读数。

- id: tech:exception-trap-flag-detection
  name: 异常与陷阱标志检测
  name_en: Exception and Trap Flag Detection
  domain: [dom:ad-detect]
  parent: dom:ad-detect
  def: 用自抛异常、陷阱标志或未处理异常过滤器探测调试器是否接管了异常分发。难点是处理器顺序由系统决定，判定依赖对语义差异的理解。
  difficulty: 4
  prerequisites:
  - tech:exception-dispatch-tracing
  artifacts: [art:pe64, art:elf64]
  outputs:
  - 异常处理器链状态
  - 陷阱标志是否被吞
  - 调试器接管异常的判断
  cost: low
  false_positive_risk: medium
  commands:
  - cmd: 'strings -a {{binary}} | grep -E "SetUnhandledExceptionFilter|AddVectoredExceptionHandler"'
    note: '静态定位目标是否注册了异常处理器，这类调用是自检手法的前置'
  - cmd: 'gdb -q -batch -p {{pid}} -ex "info signals"'
    note: '查看各信号处置表，陷阱信号若被设为不停止，说明异常会被调试器静默吞掉'
  pitfalls:
  - '陷阱标志只对当前线程有效且执行一条指令后自动清除，跨线程或跨系统调用就不成立'
  - '未处理异常过滤器在被调试时不生效，这个差异可用来探测，但也可能被兼容层改变'
  note: 与「异常链接管」成对：识别侧看异常分发是否被接管，绕过侧插入处理器并给出期望返回值。

- id: tech:system-info-debug-query
  name: 系统调试状态查询
  name_en: System Debug State Query
  domain: [dom:ad-detect]
  parent: dom:ad-detect
  def: 查询系统级调试器存在标志与调试对象枚举，判断整机是否处于被调试状态。难点是这类接口返回全局状态，粒度粗且易受兼容层影响。
  difficulty: 3
  prerequisites:
  - tech:debug-port-object-inspection
  artifacts: [art:pe64, art:driver]
  outputs:
  - 内核调试开关状态
  - 调试对象枚举结果
  - 整机调试状态判定
  cost: low
  false_positive_risk: medium
  commands:
  - cmd: 'strings -a {{binary}} | grep -c NtQuerySystemInformation'
    note: '确认目标是否调用系统信息查询接口，这是查内核调试状态的最短路径'
  - cmd: 'bcdedit /enum {current}'
    note: '在分析机上核对调试配置，与目标报告的状态做对照'
  pitfalls:
  - '内核调试开关是启动期决定的全局值，用户态读到的共享数据页可能已被其他组件改写'
  - '调试对象枚举在海量句柄的机器上开销大，句柄权限不足时结果还不完整'
  note: 与「内核调试信息屏蔽」成对：识别侧查全局调试状态，绕过侧在更下层遮蔽同一批标志。

- id: tech:linux-ptrace-selfcheck
  name: ptrace 自附加检测
  name_en: ptrace Self-Attach Detection
  domain: [dom:ad-detect]
  parent: dom:ad-detect
  def: 用自我附加或读跟踪者字段判断是否已被调试，失败即说明有人先接管。难点是检测与调试器的抢占有时序，检测逻辑本身会改变进程状态。
  difficulty: 2
  prerequisites: []
  artifacts: [art:elf64, art:so]
  outputs:
  - 跟踪者进程标识
  - 自附加结果
  - 进程可调试性状态
  cost: low
  false_positive_risk: low
  commands:
  - cmd: 'grep TracerPid /proc/{{pid}}/status'
    note: '直接读跟踪者字段，非零即表示已被某进程跟踪'
  - cmd: 'strings -a {{binary}} | grep -E "ptrace|dumpable"'
    note: '静态确认目标调用了附加接口或可转储性设置，两者常被组合使用'
  - cmd: 'cat /proc/sys/kernel/yama/ptrace_scope'
    note: '查看系统的附加限制级别，取值不同会改变自附加与外部附加的可行性'
  pitfalls:
  - '自我附加成功后若不解脱，目标会一直处于被跟踪状态，后续正常调试反而无法附加'
  - '跟踪者字段由内核在附加时写入，用户态无法可靠伪造，绕过只能放到更下层'
  note: 与「ptrace 拦截与伪装」成对：识别侧读跟踪者字段与自附加结果，绕过侧在调用层拦截并伪造返回。
  references:
  - https://man7.org/linux/man-pages/man2/ptrace.2.html

- id: tech:debugger-artifact-enumeration
  name: 调试环境痕迹枚举
  name_en: Debugger Artifact Enumeration
  domain: [dom:ad-detect]
  parent: dom:ad-detect
  def: 枚举窗口类名、已加载模块、调试相关注册表值与父进程，从环境痕迹推断调试器存在。难点是痕迹来源多且都能被改写，单一痕迹不足定论。
  difficulty: 3
  prerequisites:
  - tech:peb-debug-flags-inspection
  - tech:debug-port-object-inspection
  artifacts: [art:pe64, art:elf64]
  outputs:
  - 可疑窗口与模块清单
  - 调试相关注册表项
  - 父进程与启动链判定
  cost: medium
  false_positive_risk: high
  commands:
  - cmd: 'cat /proc/{{pid}}/maps | grep -iE "dbg|debug|trace"'
    note: '在映射里找调试与追踪相关模块，注入式调试器都会留下映射'
  - cmd: 'ls -l /proc/{{pid}}/exe /proc/{{pid}}/cwd'
    note: '核对可执行体与工作目录，异常启动路径常暴露被包裹的调试会话'
  - cmd: 'grep -E "^(PPid|Name)" /proc/{{pid}}/status'
    note: '读取父进程号与进程名，启动链异常本身是一类痕迹'
  pitfalls:
  - '模块名可被改写的调试器完全避开关键词匹配，靠名字枚举会漏掉内嵌调试组件'
  - '同名窗口类与进程名在正常软件里也大量存在，按名字命中就下结论误报率极高'
  note: 与「模块与句柄遮蔽」成对：识别侧多路枚举痕迹，绕过侧把模块与句柄从枚举视图里摘掉。

# ============================================================
# 四、反调试绕过（dom:ad-bypass）—— 每个条目都指明下手层次
# ============================================================

- id: tech:peb-flags-rewrite
  name: 调试标志位篡改
  name_en: PEB Debug Flag Rewriting
  domain: [dom:ad-bypass]
  parent: dom:ad-bypass
  def: 在用户态直接改写进程环境块中的调试标志与堆标志，让读取方看到干净值。难点是改写点可能被二次校验，堆标志还牵涉堆管理器的一致性。
  difficulty: 2
  prerequisites:
  - tech:peb-debug-flags-inspection
  artifacts: [art:pe64, art:pe32]
  outputs:
  - 改写后的标志位取值
  - 需要恢复的原始值
  - 检测规避的生效范围
  cost: low
  false_positive_risk: medium
  commands:
  - cmd: 'cdb -p {{pid}} -c "eb @$peb+2 0; q"'
    note: '调试器会话内把调试标志字节写零，写入前先确认目标位数与字段偏移'
  - cmd: 'cdb -p {{pid}} -c "ed @$peb+0x68 0; q"'
    note: '32 位下清零全局标志字段；64 位偏移不同，写错会破坏相邻字段'
  - cmd: 'cdb -p {{pid}} -c "dt ntdll!_PEB @$peb; q"'
    note: '改写后回读结构确认字段已变，避免写到别名地址'
  pitfalls:
  - '只清零一处标志而堆标志仍带调试位，成套读取的检测照样命中'
  - '改写后不保留原始值，调试器自身依赖这些标志判断状态时会行为异常'
  note: 与「调试标志位读取」成对：识别侧读标志字节与全局标志字段，绕过侧原地写回同一字段并保留原值。

- id: tech:debug-register-clearing
  name: 调试寄存器清零
  name_en: Debug Register Clearing
  domain: [dom:ad-bypass]
  parent: dom:ad-bypass
  def: 清除线程上下文里的硬件断点配置，使读取调试寄存器的检测看到空值。难点是寄存器按线程保存，清掉后原有硬件断点立即失效。
  difficulty: 3
  prerequisites:
  - tech:debug-register-inspection
  artifacts: [art:pe64, art:pe32]
  outputs:
  - 清零后的寄存器状态
  - 失效的硬件断点清单
  - 恢复方案
  cost: low
  false_positive_risk: medium
  commands:
  - cmd: 'cdb -p {{pid}} -c "r dr0=0; r dr1=0; r dr2=0; r dr3=0; r dr7=0; q"'
    note: '调试器会话内逐个清零，控制寄存器清零会同时关掉所有使能位'
  - cmd: 'cdb -p {{pid}} -c "r dr6; r dr7; q"'
    note: '回读状态位确认清空生效，状态寄存器里残留的中断原因也要一并处理'
  pitfalls:
  - '清零只作用于当前线程上下文，其他线程的断点配置仍在，逐线程处理才完整'
  - '清控制寄存器会让原有硬件断点失效，关键路径必须改用不会暴露观察点的手段'
  note: 与「调试寄存器检查」成对：识别侧逐线程读寄存器，绕过侧清使能位并回读确认。

- id: tech:debug-object-detach
  name: 调试对象解绑
  name_en: Debug Object Detach
  domain: [dom:ad-bypass]
  parent: dom:ad-bypass
  def: 主动解除调试器与进程之间的调试对象关联，让调试端口与句柄查询回到未调试状态。难点是解绑后事件不再上报，断点与补丁要自行维护。
  difficulty: 4
  prerequisites:
  - tech:debug-port-object-inspection
  artifacts: [art:pe64]
  outputs:
  - 解绑后的调试对象状态
  - 需自行维护的断点与补丁清单
  - 事件上报中断的范围
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: 'cdb -p {{pid}} -c "x ntdll!NtRemoveProcessDebug; q"'
    note: '确认运行环境里解绑接口的地址，接口未导出时必须按序号或特征定位'
  - cmd: 'strings -a {{binary}} | grep -E "DebugActiveProcess|ContinueDebugEvent"'
    note: '静态确认目标自身是否使用调试接口，避免解绑与目标的调试逻辑冲突'
  pitfalls:
  - '解绑会终止调试事件循环，进程内已有的软件断点不会被自动摘除，残留断点会引发访问异常'
  - '解绑后重新附加会被目标检测到二次附加行为，比一次附加更可疑'
  note: 与「调试端口与对象检查」成对：识别侧查端口与对象句柄，绕过侧解除关联后自行维护断点。

- id: tech:breakpoint-integrity-bypass
  name: 断点完整性绕过
  name_en: Breakpoint Integrity Bypass
  domain: [dom:ad-bypass]
  parent: dom:ad-bypass
  def: 让运行时改写不被校验和与断点扫描发现，或干脆不写目标代码。难点是校验点可能在磁盘映像上做，此时内存补丁完全无效。
  difficulty: 4
  prerequisites:
  - tech:breakpoint-integrity-inspection
  - tech:conditional-breakpoint-watch
  artifacts: [art:pe64, art:elf64]
  outputs:
  - 校验和一致的内存状态
  - 未落地的观察点方案
  - 补丁点与校验范围对照
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: 'gdb -q -batch -p {{pid}} -ex "x/8xb $rip" -ex "set *(unsigned char *)$rip = 0xcc"'
    note: '落断点前先读原始字节，命中后必须回填，否则按节区取校验和会暴露改写'
  - cmd: 'readelf -S {{binary}} | grep -E "\.text"'
    note: '先划定代码段范围，确认校验覆盖哪些节，再决定补丁放在范围外还是回填'
  pitfalls:
  - '检测若对磁盘文件取哈希，内存里的回填毫无意义，必须改为不修改映像的观察方式'
  - '回填窗口期仍存在，检测只需在窗口内采样一次就能发现断点，时序要一并考虑'
  note: 与「断点与完整性检查」成对：识别侧扫断点字节与校验和，绕过侧回填原始字节或不写映像。

- id: tech:time-source-hooking
  name: 时间源返回伪造
  name_en: Time Source Hooking
  domain: [dom:ad-bypass]
  parent: dom:ad-bypass
  def: 在时间接口层拦截并返回一致的耗时，让时间差检测看不到停顿。难点是部分计时指令在用户态直接读硬件，接口层钩子根本拦不住。
  difficulty: 4
  prerequisites:
  - tech:timing-delta-detection
  artifacts: [art:pe64, art:elf64]
  outputs:
  - 被拦截的时间接口清单
  - 伪造后的耗时读数
  - 无法拦截的计时路径
  cost: medium
  false_positive_risk: high
  commands:
  - cmd: 'ltrace -e "clock_gettime+gettimeofday" -p {{pid}}'
    note: 'Linux 上观察目标实际调用哪个时间接口，钩子要落在真正的调用点上'
  - cmd: 'gdb -q -batch -p {{pid}} -ex "find /b $pc, $pc+0x400, 0x0f, 0x31"'
    note: '在代码里按字节搜计时指令的操作码，确认存在绕过接口层的计时路径'
  pitfalls:
  - '计时指令不经系统调用，用户态钩子对它无效，只能靠虚拟化层或改代码路径处理'
  - '时间返回被改成固定值后，目标自身的超时与轮询逻辑会一起失效，反而产生新的可观测异常'
  note: 与「时间差检测」成对：识别侧测代码段耗时，绕过侧在接口层给出一致读数。

- id: tech:exception-chain-takeover
  name: 异常链接管
  name_en: Exception Chain Takeover
  domain: [dom:ad-bypass]
  parent: dom:ad-bypass
  def: 抢占或改写目标的异常处理器链，让异常自检看到期望结果后继续执行。难点是处理器顺序由系统决定，插入位置错了就影响不到判定。
  difficulty: 4
  prerequisites:
  - tech:exception-trap-flag-detection
  artifacts: [art:pe64, art:elf64]
  outputs:
  - 接管后的处理器顺序
  - 自检的返回值
  - 异常继续执行的路径
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: 'strings -a {{binary}} | grep -E "UnhandledExceptionFilter|VectoredException"'
    note: '先定位目标注册了哪类处理器，向量化处理器优先级最高，接管要从它入手'
  - cmd: 'gdb -q -batch {{binary}} -ex "handle SIGSEGV nostop noprint pass" -ex run'
    note: '让调试器不介入而把信号交给目标自身处理器，观察目标的异常逻辑是否被满足'
  pitfalls:
  - '处理器返回值语义分继续执行与重新抛出，改写错了会把可控异常变成进程终止'
  - '接管只对走处理器链的异常有效，直接终止进程的异常类型不会经过这条路径'
  note: 与「异常与陷阱标志检测」成对：识别侧看分发是否被接管，绕过侧插入处理器并给出期望返回值。

- id: tech:kernel-info-masking
  name: 内核调试信息屏蔽
  name_en: Kernel Debug Information Masking
  domain: [dom:ad-bypass]
  parent: dom:ad-bypass
  def: 在内核层或查询接口层遮蔽调试器存在标志，让系统级检测读到未调试状态。难点是这些状态是多组件共享的全局值，局部改写会破坏一致性。
  difficulty: 5
  prerequisites:
  - tech:system-info-debug-query
  - tech:kernel-local-debugging
  - tech:kernel-crash-dump-analysis
  artifacts: [art:driver, art:pe64, art:memory-dump]
  outputs:
  - 屏蔽后的调试状态读数
  - 受影响组件清单
  - 全局一致性的代价评估
  cost: high
  false_positive_risk: high
  commands:
  - cmd: 'cdb -p {{pid}} -c "dd nt!KdDebuggerEnabled L1; q"'
    note: '调试器会话内读内核调试开关，改写前先确认符号与内存页属性'
  - cmd: 'windbg -kl -c "dt nt!_KDDEBUGGER_DATA64; q"'
    note: '本地内核调试下按结构体名读调试数据块，避免按固定偏移硬编码'
  pitfalls:
  - '内核调试开关所在共享页是只读的，强行改写需要先改页属性，处理不当会引发整机异常'
  - '不同编译号的内核结构偏移不同，按固定偏移改写会命中相邻字段并造成稳定性的隐蔽问题'
  note: 与「系统调试状态查询」成对：识别侧查全局调试标志，绕过侧在共享页或查询接口层遮蔽。

- id: tech:ptrace-interception
  name: ptrace 拦截与伪装
  name_en: ptrace Interception and Masquerading
  domain: [dom:ad-bypass]
  parent: dom:ad-bypass
  def: 拦截目标的自我附加调用或伪造跟踪者字段，让基于附加的自检通过。难点是跟踪者字段由内核写入，接口层伪造只对走库调用的路径有效。
  difficulty: 4
  prerequisites:
  - tech:linux-ptrace-selfcheck
  artifacts: [art:elf64, art:so]
  outputs:
  - 拦截生效的调用清单
  - 伪造后的自检返回值
  - 未覆盖的直接系统调用路径
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: 'cat /proc/sys/kernel/yama/ptrace_scope'
    note: '先确认系统的附加限制级别，限制过严时拦截与真实附加都会失败'
  - cmd: 'gdb -q -batch {{binary}} -ex "catch syscall ptrace" -ex run'
    note: '在附加系统调用上停住，确认自我附加发生的时机与返回值判断点'
  - cmd: 'objdump -d -M intel {{binary}} | grep -cE "syscall|int 0x80"'
    note: '统计直接系统调用点，静态链接或直接调用会绕过库层拦截'
  pitfalls:
  - '目标直接执行系统调用指令时库层拦截完全失效，必须改代码路径或在更下层拦截'
  - '跟踪者字段在附加后由内核维护，用户态伪造只骗过读文件的路径，不改变内核里的真实状态'
  references:
  - https://man7.org/linux/man-pages/man2/ptrace.2.html
  note: 与「ptrace 自附加检测」成对：识别侧读跟踪者字段，绕过侧拦调用并伪造返回值。

- id: tech:module-handle-hiding
  name: 模块与句柄遮蔽
  name_en: Module and Handle Hiding
  domain: [dom:ad-bypass]
  parent: dom:ad-bypass
  def: 让调试器注入的模块与相关句柄不出现在枚举结果里，降低环境痕迹的可信度。难点是枚举有多条路径，只断用户态链表时内核枚举照样看得见。
  difficulty: 5
  prerequisites:
  - tech:peb-flags-rewrite
  - tech:debug-object-detach
  - tech:kernel-info-masking
  - tech:debugger-artifact-enumeration
  artifacts: [art:pe64, art:driver]
  outputs:
  - 遮蔽后的模块与句柄视图
  - 未被覆盖的枚举路径
  - 稳定性回归结论
  cost: high
  false_positive_risk: medium
  commands:
  - cmd: 'cdb -p {{pid}} -c "lm; q"'
    note: '调试器会话内列出模块视图，遮蔽后回读这里确认目标侧枚举已看不到'
  - cmd: 'cat /proc/{{pid}}/maps | wc -l'
    note: '统计映射条目数作为基线，遮蔽前后条目变化能反映处理是否完整'
  pitfalls:
  - '从链表摘掉模块后若再卸载或释放，宿主会踩到已断开的指针，稳定性优先于隐蔽性'
  - '只处理用户态链表时，基于内核内存描述符的枚举仍能列出全部模块，遮蔽范围要如实评估'

# ============================================================
# 五、对抗演进与隐蔽调试（dom:ad-armsrace）
# ============================================================
  note: 与「调试环境痕迹枚举」成对：识别侧多路枚举痕迹，绕过侧从链表与句柄表里摘除。

- id: tech:hardware-execution-breakpoint
  name: 硬件执行断点
  name_en: Hardware Execution Breakpoint
  domain: [dom:ad-armsrace]
  parent: dom:ad-armsrace
  def: 用调试寄存器在指定地址触发执行断点，完全不改写目标代码。难点是可用槽位极少、状态按线程保存，新线程不会自动继承。
  difficulty: 4
  prerequisites:
  - tech:single-step-execution
  - tech:debug-register-clearing
  - tech:multithread-breakpoint-sync
  artifacts: [art:pe64, art:elf64]
  outputs:
  - 无代码改写的断点现场
  - 每线程的断点配置
  - 槽位占用清单
  cost: medium
  false_positive_risk: low
  commands:
  - cmd: 'gdb -q -batch -p {{pid}} -ex "hbreak *$pc" -ex continue'
    note: '在当前指令地址设硬件执行断点，不向目标代码写入断点指令'
  - cmd: 'gdb -q -batch -p {{pid}} -ex "info breakpoints"'
    note: '确认断点类型显示为硬件断点，软件断点会暴露为内存改写'
  pitfalls:
  - '调试器新创建的线程不会自动继承断点配置，必须在每个线程上重新设置'
  - '每个线程只有四个槽位，用完后再设观察点会被直接拒绝'
  references:
  - https://learn.microsoft.com/en-us/windows/win32/api/processthreadsapi/nf-processthreadsapi-getthreadcontext

- id: tech:hardware-data-watchpoint
  name: 硬件数据观察点
  name_en: Hardware Data Watchpoint
  domain: [dom:ad-armsrace]
  parent: dom:ad-armsrace
  def: 用调试寄存器监视某地址的读写，捕获数据流而不改动内存。难点是地址必须按监视宽度对齐，监视范围还被限制在很窄的字节数内。
  difficulty: 4
  prerequisites:
  - tech:hardware-execution-breakpoint
  artifacts: [art:pe64, art:elf64]
  outputs:
  - 数据读写点与访问指令
  - 被监视变量的取值变化
  - 访问时序
  cost: medium
  false_positive_risk: low
  commands:
  - cmd: 'gdb -q -batch -p {{pid}} -ex "rwatch *(int*)$rsp" -ex continue'
    note: '硬件读观察点，任何读取该地址的指令都会停下，用于追数据来源'
  - cmd: 'gdb -q -batch -p {{pid}} -ex "info watchpoints"'
    note: '确认观察点状态与命中次数，区分硬件观察点与靠单步实现的软件观察点'
  pitfalls:
  - '地址必须按监视宽度对齐，未对齐的地址在设置时就被拒绝或被静默调整'
  - '监视宽度上限随架构不同，更宽的访问要拆成多个槽位，否则会漏掉一侧读写'

- id: tech:page-guard-stepping
  name: 页保护单步
  name_en: Page Guard Stepping
  domain: [dom:ad-armsrace]
  parent: dom:ad-armsrace
  def: 把目标页设为保护页或不可访问，靠访问异常实现近似单步，不写任何断点字节。难点是粒度是整页，且保护位触发后必须每次重设。
  difficulty: 4
  prerequisites:
  - tech:hardware-data-watchpoint
  - tech:breakpoint-integrity-bypass
  - tech:exception-chain-takeover
  artifacts: [art:pe64, art:elf64]
  outputs:
  - 页粒度的访问轨迹
  - 无需改写的单步序列
  - 保护位重设记录
  cost: high
  false_positive_risk: medium
  commands:
  - cmd: 'strace -f -e trace=mprotect -p {{pid}}'
    note: '观察目标自身的页保护调用，确认保护位被谁、在何时重设'
  - cmd: 'grep -E "^(---p|rw-p)" /proc/{{pid}}/maps'
    note: '找出权限被改成不可访问的区间，那就是保护页所在的范围'
  pitfalls:
  - '保护粒度是整页，相邻数据也会触发异常，事件量会远超实际目标点'
  - '保护位触发一次后被硬件清除，忘记重设会让后续访问完全不被捕获'
  references:
  - https://learn.microsoft.com/en-us/windows/win32/api/memoryapi/nf-memoryapi-virtualprotect

- id: tech:hypervisor-introspection
  name: 虚拟机外部观察
  name_en: Hypervisor-Level Introspection
  domain: [dom:ad-armsrace]
  parent: dom:ad-armsrace
  def: 把断点与内存读取放到虚拟机监控层，目标内存与页表完全不被改动。难点是外部视角拿不到进程内语义，符号与结构都要自己还原。
  difficulty: 5
  prerequisites:
  - tech:page-guard-stepping
  - tech:kernel-dual-machine-debugging
  - tech:time-source-hooking
  artifacts: [art:memory-dump, art:driver, art:elf64]
  outputs:
  - 目标机内部无改写的断点现场
  - 外部视角的内存快照
  - 虚拟机监控层可观测范围
  cost: high
  false_positive_risk: low
  commands:
  - cmd: 'qemu-system-x86_64 -s -S -kernel {{binary}}'
    note: '以冻结方式启动并开放调试桩，启动后 CPU 停在第一条指令之前'
  - cmd: 'gdb {{binary}} -ex "target remote :1234"'
    note: '连到调试桩，所有断点都停在监控层，目标内存里不出现断点字节'
  pitfalls:
  - '外部观察只能看到物理内存与寄存器，进程语义要靠自己重建，工作量常被低估'
  - '目标侧可检测虚拟化痕迹（特性位与计时偏差），外部观察并不能做到完全隐身'

- id: tech:kernel-callback-observation
  name: 内核回调与事件追踪
  name_en: Kernel Callback and Event Tracing
  domain: [dom:ad-armsrace]
  parent: dom:ad-armsrace
  def: 用驱动回调或系统事件追踪设施观察进程与模块活动，不修改目标任何字节。难点是回调只在特定事件点触发，拿不到指令级细节。
  difficulty: 4
  prerequisites:
  - tech:kernel-driver-load-breakpoints
  - tech:kernel-dual-machine-debugging
  artifacts: [art:driver, art:pe64]
  outputs:
  - 进程与模块事件时间线
  - 加载链与调用方
  - 无内存改写的观察证据
  cost: medium
  false_positive_risk: low
  commands:
  - cmd: 'wpr -start GeneralProfile -filemode'
    note: '启动系统级事件追踪，进程、模块与文件活动都会被记录'
  - cmd: 'xperf -on PROC_THREAD+LOADER -f trace.etl'
    note: '只开进程与加载器事件，数据量小，便于看模块加载时序'
  pitfalls:
  - '回调只能看到事件发生，看不到事件内部的参数与分支，定位到函数级就断了'
  - '事件追踪的缓冲区会覆盖旧数据，长时间采集必须在合适时机停止并保存'

- id: tech:ebpf-uprobe-tracing
  name: 内核探针无侵入追踪
  name_en: eBPF uprobe Tracing
  domain: [dom:ad-armsrace]
  parent: dom:ad-armsrace
  def: 在内核侧挂用户态或内核函数探针收集参数与调用，不在目标进程里留调试器。难点是探针实现方式决定可被发现的程度，且拿不到完整控制流。
  difficulty: 4
  prerequisites:
  - tech:linux-kernel-dynamic-tracing
  - tech:kernel-callback-observation
  artifacts: [art:elf64, art:so]
  outputs:
  - 函数级调用与参数记录
  - 进程外部的观察证据
  - 探针自身的可见性评估
  cost: medium
  false_positive_risk: low
  commands:
  - cmd: 'bpftrace -l "uprobe:{{binary}}:*"'
    note: '列出目标文件里可挂的用户态探针点，先确认符号与偏移可用'
  - cmd: 'bpftrace -e "uprobe:{{binary}}:main { printf(\"hit\\n\"); }"'
    note: '在目标函数入口挂探针，命中即打印，不需要把调试器附加到目标进程'
  pitfalls:
  - '基于断点指令实现的探针仍会改写目标代码，完整性校验能发现；只有走函数入口跳板的实现才不写断点'
  - '内核侧探针看不到用户态的控制流细节，分支与循环信息需要另配硬件跟踪'

- id: tech:intel-pt-branch-tracing
  name: 处理器分支跟踪
  name_en: Processor Branch Tracing
  domain: [dom:ad-armsrace]
  parent: dom:ad-armsrace
  def: 用处理器的分支记录能力离线还原执行路径，全程不写目标内存也不停住进程。难点是只有控制流没有数据，缓冲区溢出还会丢段。
  difficulty: 5
  prerequisites:
  - tech:hardware-data-watchpoint
  artifacts: [art:elf64, art:pe64]
  outputs:
  - 执行路径与分支序列
  - 热点与异常跳转点
  - 无停顿的观察证据
  cost: high
  false_positive_risk: medium
  commands:
  - cmd: 'perf record -e intel_pt//u -o pt.data -- {{binary}}'
    note: '采集用户态分支跟踪数据，需要处理器与内核都支持该事件源'
  - cmd: 'perf script --itrace=b -i pt.data | head -50'
    note: '解析分支记录，确认解码出的执行路径与静态反汇编能对上'
  pitfalls:
  - '分支记录不含数据值，判断条件是否成立仍需寄存器或内存信息配合'
  - '缓冲区不足时旧记录会被覆盖，长路径分析必须先估算事件量'

- id: tech:remote-channel-isolation
  name: 远程调试通道隔离
  name_en: Remote Debug Channel Isolation
  domain: [dom:ad-armsrace]
  parent: dom:ad-armsrace
  def: 把调试器与目标分到不同主机，通过调试通道而非进程内组件完成观察。难点是用户态断点仍落在目标内存，真正无痕只能靠硬件与虚拟化手段。
  difficulty: 5
  prerequisites:
  - tech:hypervisor-introspection
  - tech:module-handle-hiding
  - tech:kernel-dual-machine-debugging
  - tech:ptrace-interception
  - tech:intel-pt-branch-tracing
  artifacts: [art:pe64, art:elf64, art:driver]
  outputs:
  - 目标机上的调试器足迹清单
  - 通道配置与带宽评估
  - 剩余可检测面
  cost: high
  false_positive_risk: medium
  commands:
  - cmd: 'gdbserver --attach :1234 {{pid}}'
    note: '让目标进程由独立进程接管并通过网络暴露调试通道，目标机内仍需服务进程'
  - cmd: 'windbg -k net:port=50001,key=1.2.3.4'
    note: '内核通道完全在目标机之外，宿主机只通过调试协议与目标交互'
  pitfalls:
  - '远程通道只是把调试器界面移走，服务端进程与断点字节仍留在目标机上，痕迹并未归零'
  - '网络调试在高负载下丢包会导致断点命中丢失，关键路径应改用串口这类可靠通道'
