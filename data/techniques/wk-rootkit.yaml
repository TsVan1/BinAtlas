# BinAtlas 知识库 · 技术 · dom:wk-rootkit
# 规范：03-DATA-SCHEMA.md §2.2

- id: tech:ssdt-hook-detection
  name: 服务分发表钩子检测
  name_en: Service Dispatch Table Hook Detection
  domain:
  - dom:wk-rootkit
  parent: dom:wk-rootkit
  def: 检测系统服务分发表被改写以重定向系统调用的手法，包括整表替换与表项替换。难点是表位于受保护结构里且合法安全产品也会改写，判断只能靠与干净映像比对，不能只看指针落在哪。
  detail: 场景是机器行为明显不对而用户态一切正常：系统调用返回的结果与参数对不上，怀疑入口在分发表这一层被换过，需要就地确认而不是只看谁注册了通知。与内联钩子的区别是那里改的是函数体开头的指令、表本身没动，本条盯的是入口地址的来源；与回调链隐藏的区别是本条不关心事件通知，只关心调用落到哪。
    注意点：这张表在 64 位构建里存的是相对表基址的位移而不是绝对地址，屏幕上不是指针，别按指针范围判真假；安全产品与热补丁同样会改表，单看条目有差异不能定恶意，必须有干净映像做基准；整表被换到别处时条目一个字节都没变，只比对代码差异会得出干净的错误结论。
  principle: 为什么改写之前必然先动页保护：这张表所在的页在初始化完成后被置为只读，处理器在写保护生效时对它的写入会直接引发异常，所以任何改写都绕不过两步，或先把这页的可写属性放开，或先关掉处理器的写保护开关。两条路径都不碰表里的字节，却都改动了别的状态：前者在页表上留下与常态不符的可写标记，不还原就一直挂着；后者是处理器级开关，生效范围覆盖全部核心，窗口期内本该只读的页都不再受保护。为什么只能靠镜像比对定性质：正常路径下这张表由映像一次性填好，此后的差异都来自运行时改写，而合法与恶意改写在字节上完全同形，只能靠有没有干净原始副本分开。
  difficulty: 4
  prerequisites:
  - tech:kernel-symbol-management
  artifacts:
  - art:kernel-module
  - art:memory-dump
  outputs:
  - 表项与映像的差异清单
  - 可疑重定向结论
  - 合法改写的排除依据
  cost: medium
  false_positive_risk: high
  commands:
  - cmd: '!chkimg nt'
    note: 对比内核映像的代码差异，用于发现被重定向的入口
  - cmd: '!object \ObjectTypes'
    note: 先确认对象类型基线，排除只是类型布局差异造成的误判
  - cmd: lm
    note: 核对系统模块加载范围，判断重定向目标落点
  procedure:
  - 先在调试器里用 lm 记下内核模块的加载范围，作为后面所有落点判定的坐标基线。
  - 用 !object \ObjectTypes 取对象类型基线，先排除因类型布局差异造成的假差异。
  - 用 !chkimg nt 比对内核映像的代码差异，把被改写的入口位置列出来。
  - 对每个差异点回到分发表，用 lm 确认表项指向的落点属于哪个模块。
  - 逐条与干净映像的同名表项对照，只有干净基准上不成立的差异才继续追。
  - 差异能由已知安全产品或热补丁解释的，标记为合法改写并记下依据，再交结论。
  pitfalls:
  - 表项地址落在内核映像范围外不一定是恶意，热补丁与安全产品也会这样
  - 只比对代码段差异，整表被替换到别处的做法不体现在差异里
  - 比对基准取自被感染的机器，差异自然是零
- id: tech:inline-hook-detection
  name: 内联钩子检测
  name_en: Inline Hook Detection
  domain:
  - dom:wk-rootkit
  parent: dom:wk-rootkit
  def: 检测函数序言被跳转指令覆盖的内联钩子，并还原被覆盖的原始指令。难点是必须有可信的原始副本做比对，而合法热补丁与安全产品同样会改写同一批函数，形态上几乎无法区分。
  detail: 场景是某个导出函数的行为被改了而调用照常成功，需要在函数入口这一层确认序言有没有被跳转覆盖，并把被吃掉的原始指令还原出来。与服务分发表钩子的区别是那条改的是入口地址的存放处，本条改的是入口地址指向的代码本身；与断点策略的区别是断点为了观测主动写字节，本条要判的是别人写的字节。
    注意点：必须有可信的原始副本，参考映像与目标机不一致时差异里混的全是版本噪声；同一批函数也是热补丁与安全产品的改写对象，形态上几乎同形；改写可能只在特定条件成立时生效，静态比对看到的是零差异。
  principle: 为什么内联钩子必然留下可比对的字节差：映像的代码段映射进内核后是只读的，要往函数开头写跳转就得让那一页变成可写，而映像的来源即磁盘上的文件始终没被改过，于是内存里的字节与文件里的字节必然不再相等，这正是比对能够成立的根据。为什么要复原指令边界：指令是变长的，覆盖序言时必须完整吃掉若干条整指令，边界算错会让后续指令流从中间被解码，反汇编结果直接崩坏。为什么形似不等于恶意：跳转与热补丁都在序言写入口，区别只在跳转目标归谁。
  difficulty: 4
  prerequisites:
  - tech:ssdt-hook-detection
  artifacts:
  - art:kernel-module
  - art:memory-dump
  - art:pe64
  outputs:
  - 被改写函数清单
  - 原始指令还原结果
  - 跳转目标归属判定
  cost: medium
  false_positive_risk: high
  commands:
  - cmd: u {{module}}!<函数名>
    note: 反汇编函数开头，确认序言是否被跳转覆盖
  - cmd: '!chkimg nt'
    note: 批量比对代码差异，比逐个函数反汇编快得多
  - cmd: dps <地址> L20
    note: 顺跳转目标查看附近指针，判断劫持去向
  procedure:
  - 先用 lm 确认目标函数所属模块与基址，保证要看的范围确实落在内核映像里。
  - 用 u {{module}}!<函数名> 反汇编函数开头，看序言是否以跳转收尾而不是正常的栈帧建立。
  - 抽出跳转目标，用 lm 判断它落回同一模块还是落到未知范围。
  - 用 !chkimg nt 批量拉出代码差异，比逐个函数反汇编覆盖得快。
  - 对每个差异点取原始副本对照，恢复被覆盖的指令并确认恢复后指令流能接续。
  - 用 dps <地址> L20 顺跳转目标看附近指针，判断劫持去向与是否还有后续链。
  - 把差异按安全产品、热补丁、未知三类归档，只把第三类写进结论。
  pitfalls:
  - 短跳转与热补丁都在序言写字节，形态相似，只看前几个字节会误判
  - 参考映像版本与被测机器不一致，差异里混入大量版本噪声
  - 改写可能只在特定条件成立时生效，静态比对看不到
- id: tech:idt-dpc-chain-audit
  name: 中断与 DPC 链审计
  name_en: Interrupt & DPC Chain Audit
  domain:
  - dom:wk-rootkit
  parent: dom:wk-rootkit
  def: 审计中断描述符与延迟过程调用链是否被替换或插入，识别在中断层介入的手法。难点是这些结构受完整性校验保护且按处理器分布，误报与漏报大多来自只看单个处理器。
  detail: 场景是怀疑介入点在中断层：事件照常发生但处理路径明显变慢或被改写，需要在中断描述符与延迟调用队列这一层取证。与内联钩子的区别是那里改的是被调用的函数，本条改的是中断到来时处理器直接跳到哪；与回调链隐藏的区别是中断层不经过任何注册接口，既没有对象也没有通知链。
    注意点：中断描述符寄存器与调用队列都是按处理器各自一份的，只扫一份等于只看到一个处理器；队列是动态的，抓取时机不同结果差异很大；处理例程落在第三方模块内不一定异常，安全与虚拟化产品会正当地介入这条路径。
  principle: 为什么中断层的改动照不到：中断到来时处理器不查任何对象、不做任何调度，直接按中断描述符寄存器指向的表项跳进处理例程，这一层既不注册对象也不挂通知，所有枚举接口都看不到它。为什么它仍然可查：描述符表在初始化后被固定并纳入完整性校验，改动只有两种做法——把入口换成另一个地址，该地址会落在任何已加载模块之外；或把处理例程本身改掉，代码页随之出现差异，两者都能靠逐项核对发现。为什么必须逐处理器：IDTR 是每 CPU 寄存器但通常全系统共用一张中断描述符表，真正按 CPU 分布的是 DPC 调用队列。
  difficulty: 5
  prerequisites:
  - tech:inline-hook-detection
  artifacts:
  - art:kernel-module
  - art:memory-dump
  outputs:
  - 中断描述符与处理例程对照表
  - 各处理器差异清单
  - 可疑插入项结论
  cost: high
  false_positive_risk: high
  commands:
  - cmd: '!idt'
    note: 列出中断描述符与处理例程，逐项核对是否落在系统模块范围内
  - cmd: '!dpcs'
    note: 查看当前处理器上的延迟过程调用队列；换处理器要先切换上下文，该扩展在不同调试器版本可用性不一
  - cmd: lm
    note: 核对处理例程落点所属模块
  procedure:
  - 先确认目标机上的处理器数量，把逐处理器的核对清单列出来，避免只扫一份。
  - 用 !idt 列出中断描述符与处理例程，逐项核对入口是否落在已加载模块范围内。
  - 对落在模块范围外的入口，用 lm 核对它所属模块，属于未加载模块的进候选。
  - 换处理器重复上一步，把每个处理器的中断视图取全后再做横向比对。
  - 用 !dpcs 看当前处理器上的延迟调用队列，记下队列项所属模块，再换处理器重复。
  - 对候选入口回到 !chkimg nt 确认代码段有没有对应差异，排除只是描述符读错的假象。
  - 隔一段时间再采一次队列，位置不变才是稳定插入，位置变化的只是瞬时排队。
  pitfalls:
  - 只查一个处理器，其他处理器上的改写会漏掉
  - 处理例程落在第三方模块内不一定异常，安全与虚拟化产品会介入中断路径
  - 队列是动态的，抓取时机不同结果差异很大
- id: tech:driver-object-chain-audit
  name: 驱动对象链审计
  name_en: Driver Object Chain Audit
  domain:
  - dom:wk-rootkit
  parent: dom:wk-rootkit
  def: 审计驱动对象与设备对象链的一致性，发现被摘链却仍能运行的驱动，或只有设备没有驱动记录的残留。难点是摘链后对象继续存活，单看任一链表都会得出干净的错误结论。
  detail: 场景是常规枚举里看不到可疑驱动，但机器行为说明内核层确实有东西在响应请求，需要在驱动对象与设备对象这一层做交叉取证。与模块链摘除的区别是那条追的是已加载模块链少了谁，本条追的是命名空间里的对象与模块记录对不上；摘链只是造成不一致的一种来源，卸载残留与未命名对象同样会造成。
    注意点：未命名对象天然不出现在命名空间里，把缺失当摘链会大量误报；驱动对象与模块加载是两套独立记录，改了一方另一方可能仍完好；卸载过程中的短暂不一致属正常，抓取要避开这个窗口。
  principle: 为什么对象链能反查驱动还在不在跑：驱动对象在加载时由对象管理器创建，它的分发表里存着该驱动全部 I/O 入口的函数地址，所以只要驱动还能响应请求，驱动对象就必须存在并指向自己的映像，对象的存活与代码可被调用是一件事的两面。为什么摘链会被发现：摘链只是从某一条链上撤掉条目，对象本身没有销毁，引用计数与句柄都还在，于是设备对象里的驱动指针、分发表里的代码地址仍指向它，「链上没有」与「实际还在」的矛盾就暴露出来。为什么要三方比对：单看任一链表都得不到矛盾。
  difficulty: 4
  prerequisites:
  - tech:object-manager-namespace
  - tech:object-reference-tracking
  artifacts:
  - art:kernel-module
  - art:memory-dump
  - art:driver
  outputs:
  - 驱动与设备对应表
  - 链间不一致项清单
  - 可疑残留结论
  cost: medium
  false_positive_risk: high
  commands:
  - cmd: '!object \Driver'
    note: 枚举驱动对象命名空间；未命名驱动不在其中
  - cmd: '!object \Device'
    note: 枚举设备对象，与驱动列表比对找无主设备
  - cmd: lm
    note: 与模块列表三方比对，三者不一致才是较可靠的信号
  procedure:
  - 用 lm 取模块加载基线，记下此刻系统认为存在的驱动映像。
  - 用 !object \Driver 枚举驱动对象命名空间，与模块基线互相比对，对不上的先记下。
  - 用 !object \Device 枚举设备对象，对每个设备回到它的驱动对象指针，找出没有驱动记录的设备。
  - 把反向的空缺也记下，有驱动对象却没有设备的同样要问一句为什么。
  - 对每个不一致项查该驱动映像是否仍在加载，还在说明是摘链，已不在说明是卸载残留。
  - 避开卸载窗口重采一次，两次结果一致才把该项写进结论。
  pitfalls:
  - 未命名对象天然不出现在命名空间里，把缺失当摘链会大量误报
  - 驱动对象与模块加载是两套记录，改了一方另一方可能仍正常
  - 卸载过程中的短暂不一致属正常，抓取时机要避开卸载窗口
- id: tech:module-unlink-detection
  name: 模块链摘除检测
  name_en: Module Unlink Detection
  domain:
  - dom:wk-rootkit
  parent: dom:wk-rootkit
  def: 检测驱动从已加载模块链被摘除后继续运行的手法，需靠内存扫描或回调引用反查隐藏模块。难点是被摘除模块不再出现在任何枚举接口里，只能靠残留指针与内存特征去捞，误报率天然偏高。
  detail: 场景是常规枚举反复给出干净结论，但机器的行为指向内核层有东西在跑，怀疑它已经从枚举用的那条链上被摘掉了。与驱动对象链审计的区别是那条在命名空间里做三方比对，本条的对手根本不在任何命名空间里，只剩内存里的残留与引用可以反查。
    注意点：内存里搜到的映像特征可能来自合法缓存或映射文件，必须结合可执行属性判断；摘除只影响一条链，其他记录里往往仍留痕；全内存反查要读大量数据，操作不当会把目标机直接拖死。
  principle: 为什么摘链之后代码照样能跑：模块链只是给枚举和查找用的一张双向链表，撤掉链上的条目既不改变映像的页表映射，也不影响已经建立的设备对象与函数指针，代码依旧可执行、请求依旧被分发，摘链抹掉的只有被枚举到这一件事。为什么换个入口就能看到它：链上节点被摘掉之后，驱动对象里的驱动指针与回调里登记的函数地址仍指着那片内存，这些引用不经过模块链，所以只查模块名单必然得出干净的错误结论。为什么必须判可执行属性：数据页与缓存里也可能有相同字节，只有页表上标着可执行且落在内核映像范围的才算候选。
  difficulty: 5
  prerequisites:
  - tech:driver-object-chain-audit
  artifacts:
  - art:memory-dump
  - art:kernel-module
  - art:driver
  outputs:
  - 隐藏模块候选清单
  - 捞取依据与证据
  - 与枚举结果的差异说明
  cost: high
  false_positive_risk: high
  commands:
  - cmd: lm
    note: 取当前枚举基线，作为应该看到什么的参照
  - cmd: '!poolused 2'
    note: 找异常增长的模块相关池占用，隐藏模块仍然占着内存
  - cmd: '!pte <候选基址>'
    note: 确认候选地址是否为有效可执行映射，排除把数据页当模块
  procedure:
  - 用 lm 取当前枚举基线，先明确正规接口应该看到什么。
  - 用 !poolused 2 找模块相关池占用的异常增长，把扫描范围缩小。
  - 在候选范围内按映像头特征扫描内存，把命中位置逐个记下。
  - 对每个命中用 !pte 确认该地址落在有效可执行映射上，排除把数据页当模块。
  - 对留下的候选看它的入口是否被其他结构引用，有引用的才是真的在跑。
  - 与 lm 结果做差集，差集里同时占着内存又有引用的，才进隐藏模块清单。
  pitfalls:
  - 内存里搜到的映像特征可能来自合法缓存或映射文件，需结合可执行属性判断
  - 摘除只影响一条链，其他记录里可能仍留痕迹，只查一条链必然漏
  - 反查要读大量内存，操作不当会把目标机直接拖死
- id: tech:callback-chain-concealment
  name: 回调链隐藏检测
  name_en: Callback Chain Concealment Detection
  domain:
  - dom:wk-rootkit
  parent: dom:wk-rootkit
  def: 检测回调注册链被摘除或伪造以隐藏自身的手法，判据是回调集合、模块加载状态与事件实际行为之间的矛盾。难点是合法卸载与恶意摘除在集合变化上完全一致，必须补行为侧证据。
  detail: 场景是某个通知事件本该被拦下却没有，或者反过来出现了没有任何注册者对应的行为，需要在回调注册这一层判是摘除还是伪造。与回调完整性审计的区别是那条先建基线再核对注册项，本条处理的是注册集合本身已被动手的情形，判据必须从集合转到行为；与模块链摘除的区别是那边抹掉的是枚举入口，这边抹掉的是事件分发的接收方。
    注意点：可枚举的回调集合本身就不全，列表里没有不能直接当隐藏；行为侧证据要主动触发事件，生产环境不宜反复触发；伪装成合法安全产品的回调，注册信息完全正常。
  principle: 为什么摘回调比摘模块更难发现：回调注册是若干条链，条目被摘掉后事件照常发生、系统照常工作，唯一的变化是某个本该被通知的组件没被通知，而少一次通知不产生任何日志。为什么集合与行为能对出矛盾：链决定谁会收到通知，任何实际收到通知的组件在链上必有对应记录，所以只要在某次事件里看到某组件被调用而链上查不到它，矛盾即成立；反过来链上有注册却从不被调用，说明那一条被换成了假条目。为什么缺失本身不是证据：枚举接口不全，看不到不等于被摘。
  difficulty: 5
  prerequisites:
  - tech:callback-integrity-audit
  artifacts:
  - art:kernel-module
  - art:memory-dump
  - art:driver
  outputs:
  - 回调集合差异结论
  - 行为与注册不符的证据
  - 隐藏手法判定
  cost: high
  false_positive_risk: high
  commands:
  - cmd: '!object \Callback'
    note: 取回调对象快照，与基线对比
  - cmd: dt nt!_EX_CALLBACK*
    note: 通配确认类型定义，避免用错结构解读
  - cmd: lm
    note: 核对回调所属模块是否仍加载
  procedure:
  - 用 dt nt!_EX_CALLBACK* 通配确认类型定义，先保证结构解读不会用错。
  - 用 !object \Callback 取回调对象快照，作为本次比对的注册基线。
  - 用 lm 核对每个回调所属模块是否仍加载，未加载的条目单独列出。
  - 在受控环境触发对应事件，记录实际被调用的组件，与链上注册集合求差。
  - 对「被调用却查不到注册」的项追来源，对「注册却从不被调用」的项追是否被替换。
  - 把结论按枚举缺陷、合法卸载、摘除或伪造三类归档，只留最后一类。
  pitfalls:
  - 回调集合本身枚举不全，列表里没有不能直接当隐藏
  - 行为侧证据要主动触发事件，生产环境不宜频繁触发
  - 伪装成合法安全产品注册的回调，注册信息本身完全正常
- id: tech:boot-stage-persistence-audit
  name: 引导级持久化审计
  name_en: Boot Stage Persistence Audit
  domain:
  - dom:wk-rootkit
  parent: dom:wk-rootkit
  def: 审计在内核加载之前介入的持久化位置：引导配置项、引导管理器组件与固件设置，识别绕过内核层检测的驻留。难点是这类改动在操作系统内看不到完整证据，必须靠启动配置与固件状态交叉核对。
  detail: 场景是操作系统内的各种检查反复得出干净结论，而机器的不正常表现又不像纯软件层能解释，需要往内核加载之前的位置找驻留。与模块链摘除的区别是那条处理已经进了内核的东西，本条处理的是根本还没等到内核接手就被装进去的东西；与完整性校验对抗代价的区别是那条评估内核层绕过的代价，本条只回答更早的位置有没有被动过。
    注意点：备用启动项与其他引导条目最容易被漏，改动常藏在不常用的那一项里；引导级改动可能同时改固件设置，只看操作系统侧必然不全；引导阶段的日志可能来不及落盘，缺失不等于没发生。
  principle: 为什么更早的位置能完全绕过内核层检测：内核层的所有手段都以「系统按正常路径起来了」为前提，模块链、回调、对象都是内核接管之后才有的东西；而在控制权交给内核之前执行的那一段，决定内核映像从哪里装载、按什么配置装载，任何在这一步被替换的组件都已经处在被检测方信任的起点上。为什么它仍然留得下痕迹：启动配置是持久化在磁盘上的数据，可以离线枚举并与同型机器逐项对照；固件设置是另一份独立记录，两者互为参照，只改一边就会出现两边说法不一致。
  difficulty: 5
  prerequisites:
  - tech:module-unlink-detection
  artifacts:
  - art:driver
  - art:kernel-module
  - art:pe64
  outputs:
  - 引导配置差异清单
  - 可疑引导组件
  - 固件层核对结论
  cost: high
  false_positive_risk: high
  commands:
  - cmd: bcdedit /enum all
    note: 导出全部启动项与引导配置，异常项常藏在不常用的条目里
  - cmd: '!sysinfo machineid'
    note: 在调试器里查看机器与固件标识，辅助确认引导方式
  - cmd: wevtutil qe System /c:50 /rd:true /f:text
    note: 读系统日志找引导阶段的异常记录
  procedure:
  - 用 bcdedit /enum all 导出全部启动项，不只看当前生效的那一个。
  - 把每条启动项里的引导组件路径与签名状态逐项核对，异常项单独记下。
  - 用 !sysinfo machineid 读机器与固件标识，确认引导方式与固件类型。
  - 用 wevtutil qe System /c:50 /rd:true /f:text 读系统日志，找引导阶段失败或降级的记录。
  - 把启动配置与固件设置对照，只有一边被改的通常就是改动点。
  - 对无法在系统内确认的部分改用离线方式核对引导组件的完整性与来源。
  pitfalls:
  - 只看当前启动项，备用启动项与其他引导条目里的改动会被忽略
  - 引导级改动可能同时修改固件设置，只在操作系统侧检查必然不全
  - 引导阶段日志可能来不及落盘，缺失记录不等于没发生
- id: tech:integrity-check-cost-analysis
  name: 完整性校验对抗代价
  name_en: Integrity Check Countermeasure Cost
  domain:
  - dom:wk-rootkit
  parent: dom:wk-rootkit
  def: 量化绕过周期性完整性校验要付的代价：需要同时处理校验器、受校验结构与校验时序，以及方案自身留下的痕迹。难点是任何绕过都扩大攻击面，而校验项与周期既不公开也不固定。
  detail: 场景是要回答一个内核层改动到底能活多久、代价有多大，需要一个可复算的评估而不是感觉上的很难被发现。与完整性校验机制本身的区别是那条讲校验器怎么工作，本条量化绕开它要动的全部面与这样做的可观测代价；与回调链隐藏的区别是那条是隐藏自身的具体手法，本条是从检测方视角给这类手法定价。
    注意点：校验节奏是随机化的，按固定周期推出的窗口会与实际差一个量级；结构校验与代码校验的触发条件不同，只处理一类等于只评估了一半；绕过方案必须常驻才生效，它自己就是新的可检测对象。
  principle: 为什么这类绕过的代价必然可观：校验器同时盯着两样东西，即受保护结构的内容与执行这套逻辑的代码，它不需要知道你打算怎么绕，只要求状态与原始值相符，所以任何改动都要在别处补上一处新的不一致。为什么代价会累加：要动到校验器本身、受校验的结构、以及校验的时序三个面，三者互相约束，处理一个会把另一个推到台面上。为什么痕迹消不掉：绕过必须常驻才能持续生效，而常驻意味着多一个模块、多一条回调或一张被改过属性的页表，这些正是检测方在看的东西，代价与可观测性成正比。
  difficulty: 5
  prerequisites:
  - tech:idt-dpc-chain-audit
  - tech:module-unlink-detection
  - tech:callback-chain-concealment
  - tech:patchguard-constraint-analysis
  - tech:exploit-behavior-detection
  artifacts:
  - art:kernel-module
  - art:memory-dump
  - art:driver
  outputs:
  - 代价与可行性评估
  - 可观测痕迹清单
  - 检测方视角的判据
  cost: high
  false_positive_risk: high
  commands:
  - cmd: '!analyze -v'
    note: 校验被触发时以固定错误码出现，据此确认对抗是否已被发现
  - cmd: '!chkimg nt'
    note: 确认内核代码段是否被改写
  - cmd: lm
    note: 核对加载模块，判断是否有额外组件参与校验
  procedure:
  - 先用 lm 与 !chkimg nt 确认内核代码段此刻有没有被改写，建立动没动过的事实。
  - 用 !analyze -v 读出校验被触发时的错误码与参数，先分清是被校验发现还是别的崩溃。
  - 从触发时刻的分布反推校验节奏，多次采样比对，不按固定周期推算可用窗口。
  - 把该机上实际观测到的异常逐条登记，例如多出来的模块与被改过属性的页。
  - 把每条异常折算成维持它要常驻什么、它本身有多显眼两栏，痕迹重的直接判不可行。
  - 对结构与代码两条线分别给结论，一条成立另一条不成立时按更严的那条算。
  pitfalls:
  - 用固定周期估算窗口，随机化让实际窗口与估算差一个量级
  - 只处理结构校验不管代码校验，两类校验触发条件不同
  - 绕过方案引入的组件本身成了新的可检测对象
