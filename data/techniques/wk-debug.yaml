# BinAtlas 知识库 · 技术 · dom:wk-debug
# 规范：03-DATA-SCHEMA.md §2.2

- id: tech:kernel-debug-transport-setup
  name: 内核调试通道搭建
  name_en: Kernel Debug Transport Setup
  domain:
  - dom:wk-debug
  parent: dom:wk-debug
  def: 建立宿主机与目标机的内核调试通道，选择串口、网络或虚拟机专用管道，让目标机在启动早期就进入可调试状态。难点是通道建立早于系统启动，配错时目标机侧只会静默停住或直接蓝屏。
  detail: 场景是刚接手一台能复现蓝屏或挂起的目标机，或要在驱动加载之前就拦住它，第一步永远是把调试通道打通，否则后面所有分析都无处落脚。与用户态调试的区别是这里调的不是某个进程而是整台机器，进程可以死了再起，内核停了整台机器一起停；与符号配置的区别是通道不通时符号配得再准也看不到任何输出。注意点：通道参数在启动时一次性读取，改完不重启等于没改；网络调试两侧密钥与端口必须完全一致，不一致的表现是长时间静默等待而不是报错；虚拟机快照要配好通道之后再打，否则每次回滚都要重做；宿主机侧防火墙拦掉调试端口时，现象是目标机已经停住而主机毫无输出，极易误判成通道没建立。
  principle: 为什么必须走独立通道：调试器要接管目标机的内核，而内核一旦停在调试中断里，本机的调度、I/O 与线程创建全部冻结，调试器自身作为被冻结对象也一起停摆，所以调试器不能与被调试内核共处同一个内核，双机是最小代价的隔离方式。串口与网络之所以可用，是因为它们的收发不依赖被调试内核的调度，由硬件与固件层独立完成搬运；而启动早期就崩溃的情形里，图形与存储栈都还没起来，只有这类通道在那时已经存在。通道真正决定的是「能不能停下来」，而停下来正是断点、单步、读内存全部能力的前提。
  difficulty: 4
  prerequisites: []
  artifacts:
  - art:driver
  - art:memory-dump
  outputs:
  - 可用的调试通道
  - 目标机启动配置
  - 连通性核对步骤
  cost: medium
  false_positive_risk: low
  commands:
  - cmd: bcdedit /debug on
    note: 为目标机当前启动项打开内核调试，重启后生效
  - cmd: bcdedit /dbgsettings
    note: 查看当前传输方式、端口与密钥，确认目标机侧参数与宿主机一致
  - cmd: .sympath srv*{{sympath}}*https://msdl.microsoft.com/download/symbols
    note: 在调试器里设置符号路径与本地缓存目录，路径顺序决定查找优先级
  - cmd: .reload /f
    note: 强制重载符号；改完符号路径必须执行一次，否则仍用旧缓存
  procedure:
  - 先在目标机确认当前启动项，打开内核调试开关，这一步不要顺手重启。
  - 读出当前的传输方式、端口与密钥并记录下来，它是之后两侧对齐的唯一依据。
  - 在宿主机按同一组参数发起连接，参数不一致的现象是长时间等待而不是报错，先回头核对上一步记录。
  - 重启目标机，看宿主机能否在启动早期就断下；断不下就说明通道没生效，不要急着去调符号。
  - 通道确认可用后，再在调试器里设置符号路径，指向符号服务器并给出本地缓存目录，路径顺序就是查找优先级。
  - 执行一次强制重载让符号立即生效，之后才判断可读性，并按需在目标机上复登通道状态核对。
  pitfalls:
  - 目标机没重启就以为通道已生效，内核调试开关只在启动时读取
  - 网络调试两侧密钥或端口不一致时表现是长时间等待而不是报错
  - 虚拟机快照要在配好调试通道之后再打，否则每次恢复都得重配
  - 宿主机防火墙拦掉调试端口，现象是目标机已停住但主机没有任何输出
- id: tech:kernel-symbol-management
  name: 内核符号与类型信息
  name_en: Kernel Symbol & Type Info
  domain:
  - dom:wk-debug
  parent: dom:wk-debug
  def: 让调试器能解析内核与驱动的函数名、全局变量和结构类型，来源是公开符号服务器、本地缓存与私有符号。难点是公开符号不含未导出语义：类型里看得到字段，仍需判断它到底在表达什么。
  detail: 场景是拿到一台目标机或一份转储后，要让栈能显示函数名、结构能显示字段名，否则全程只能对着裸地址与原始字节说话。与调试通道搭建的区别是通道决定能不能停下来，符号决定停下来之后能看懂多少；与结构类型解读的关系是这里只保证类型可见，某个字段到底在表达什么仍要另一步判断。注意点：公开符号只含导出项，未导出的内部函数与私有结构一律缺失，看到名字也不能当成完整信息；私有符号必须与目标二进制精确对应，错配时字段名看起来完全合理却指向错的成员；缓存目录不可写或被清理会静默退化成无符号调试，栈与类型一起变成纯地址，而调试器不会因此报错。
  principle: 为什么符号决定可读性：调试器本身不含任何目标机的类型知识，它能显示某个结构的字段名，是因为符号文件里存着该结构的成员表与各成员的相对位置，调试器再按这张表去解释原始内存；没有这份表，同一段字节只能按原始宽度打印，字段边界与含义全部丢失，这就是同一个地址在有无符号两种情形下给出截然不同结论的原因。而查找是按符号路径逐项命中的，本地缓存目录排在前面时先命中已校验过的文件，排在后面就会每次都去服务器往返，还可能拿到与当前二进制不匹配的一份。
  difficulty: 3
  prerequisites:
  - tech:kernel-debug-transport-setup
  artifacts:
  - art:driver
  - art:kernel-module
  - art:pe64
  outputs:
  - 符号路径与缓存配置
  - 目标模块符号加载状态
  - 关键结构类型清单
  cost: low
  false_positive_risk: low
  commands:
  - cmd: .sympath srv*{{sympath}}*https://msdl.microsoft.com/download/symbols
    note: 公开符号从官方符号服务器按需下载并缓存到本地目录
  - cmd: .reload /f {{module}}
    note: 只重载目标模块符号，比全量重载快得多
  - cmd: '!lmi {{module}}'
    note: 查看模块的符号类型与加载状态，判断是私有符号还是仅导出符号
  - cmd: dt nt!_EPROCESS
    note: 打印结构类型定义；字段随版本增删重排，一律以当前符号输出为准
  procedure:
  - 先在调试器里设置符号路径，公开符号服务器与本地缓存目录同时给上，并确认缓存目录可写。
  - 查看目标模块的符号状态，先判断拿到的是私有符号还是仅导出符号，这决定结论能细到什么程度。
  - 对需要解析的单个模块执行强制重载，不必全量重载，改了哪个模块就只重载哪个。
  - 重载后再确认一次符号类型与加载情况，确认这次真的换上了新符号而不是沿用旧缓存。
  - 用结构类型打印命令输出要读的结构，字段名与顺序一律以当前符号输出为准。
  - 读字段时用打印出的成员名取值，不要用自己记忆里的布局去推算位置。
  pitfalls:
  - 把旧版本的偏移硬编码进脚本，换构建就错位，必须每次从符号取
  - 符号缓存目录被清理或不可写会退化成无符号调试，栈与类型全变成裸地址
  - 私有符号版本与目标机二进制不匹配时，解析出的字段名是看着对的错
- id: tech:bugcheck-dump-triage
  name: 蓝屏转储归因
  name_en: Bugcheck Dump Triage
  domain:
  - dom:wk-debug
  parent: dom:wk-debug
  def: 从崩溃转储还原蓝屏现场：错误码与四个参数、出错线程栈、被引用的对象与池块。难点是崩溃点常是受害者而不是元凶，栈也常被破坏，必须靠参数含义与内存交叉验证才能指认真正原因。
  detail: 场景是拿到一份崩溃转储，要回答是哪个模块、在做什么的时候、踩到了什么，最终交出一份可复查的归因结论而不是一个模块名。与挂起诊断的区别是这里有崩溃现场与错误码，挂起那边什么都没有；与池内存取证的区别是这里先定方向，池分析是之后再用来验证方向的工具。注意点：小内存转储只保留崩溃线程的栈与少量内存，池块与对象内容缺失时必须换完整转储重做，不要勉强解读残片；崩溃点常常是被破坏之后的受害者，栈本身也可能被写坏，回溯结果要先自洽再用；错误码的四个参数含义逐码不同，先查参数语义再看栈，顺序反过来就会把受害者当元凶。
  principle: 为什么参数比栈可靠：错误码由内核在检测到违规的那一刻产生，四个参数是检测点直接填入的，它记录的是「内核发现了什么」，这件事发生在任何后续破坏之前；而栈是运行痕迹，崩溃之后还会被异常分发与本机清理继续改写，越往后越不可信。为什么崩溃点常是受害者：越界写与释放后使用都发生在别处，真正出错的那一刻可能毫无异常，直到被踩坏的对象后来被访问才触发检错，所以第一个报错的位置只是发现位置。归因因此要靠类型化对象与池块元数据交叉，把谁分配、谁释放、谁引用拼成时间线，才能把发现位置和出错位置分开。
  difficulty: 4
  prerequisites:
  - tech:kernel-debug-transport-setup
  - tech:kernel-symbol-management
  artifacts:
  - art:memory-dump
  - art:driver
  - art:kernel-module
  outputs:
  - 错误码与参数解读
  - 归因结论与证据链
  - 待验证的复现条件
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: .bugcheck
    note: 打印转储里的错误码与四个参数；先弄清参数含义，再看栈
  - cmd: '!analyze -v'
    note: 自动归因输出，把它给的模块名当线索而不是结论
  - cmd: kb
    note: 带参数的栈回溯，参数值常是判断访问了哪个地址的关键
  - cmd: '!pool <地址>'
    note: 对栈里出现的可疑地址查池块归属，区分已释放与越界
  procedure:
  - 先打印错误码与四个参数，把这四个值的含义查清并写在记录最前面，它是全部分析的锚点。
  - 再跑自动分析取一版模块名与函数名，只当线索，不要在这一步下结论。
  - 对崩溃线程做带参数的栈回溯，重点看参数指向的地址落在哪个对象或池块上。
  - 把栈里出现的可疑地址逐个查池块归属，区分是已释放、越界还是从未分配。
  - 用参数语义与池块结论互相印证，位置对不上就说明报错点只是受害者而不是起因。
  - 结论写成谁分配、谁释放、谁访问的时间线，并列出仍需复现才能确认的条件。
  pitfalls:
  - 直接采信自动分析给出的模块名，会把受害者驱动当成根因
  - 只看崩溃线程的栈，忽略同一池块被其他线程释放的时间线
  - 小内存转储不含全部内存，池与对象内容缺失时要换完整转储重来
- id: tech:kernel-breakpoint-strategy
  name: 内核断点策略
  name_en: Kernel Breakpoint Strategy
  domain:
  - dom:wk-debug
  parent: dom:wk-debug
  def: 在内核代码上选合适的断点类型与位置，并加命中条件以避免中断风暴。难点是软件断点会改写代码页并改变时序，既可能被完整性校验判定为篡改，也会让超时类问题直接不再复现。
  detail: 场景是要在驱动或内核例程的特定路径上停下来看状态，或要在某个变量被改写时抓住改写者。与运行时状态查看的区别是那里是暂停之后被动地读，这里要主动选择停在哪；与日志与计数器方案的区别是断点会改变时序而日志不会，所以判断超时与竞态类问题时应当优先考虑后者。注意点：软件断点要改写目标代码页，开着完整性校验的环境会把它判成篡改；硬件断点数量极少且受字节宽度限制，用完就得腾挪；高频路径上无条件断点会把整机拖成假死，必须先加条件或命中计数；断点本身会让竞态窗口消失，问题不复现并不代表它不存在。
  principle: 为什么软件断点会改变时序：它的实现是把目标指令换成一个必然触发异常的单字节指令，命中时处理器产生异常，内核把控制权交给调试器并让目标机停下，从命中到继续之间是一段真实存在的、被放大的暂停，任何按时间间隔判定的逻辑，包括超时、重试与看门狗，都会在这段暂停里被改写，所以超时类问题在断点下反而消失。为什么硬件断点不改代码：它靠处理器内的地址比较器在访存发生时触发，一个字节都不落进内存，因此完整性校验看不到它；代价是比较器数量固定，且只能监视有限宽度的区间。
  difficulty: 4
  prerequisites:
  - tech:kernel-debug-transport-setup
  - tech:kernel-symbol-management
  artifacts:
  - art:driver
  - art:kernel-module
  outputs:
  - 断点布置方案
  - 命中条件与过滤规则
  - 断点对时序影响的评估
  cost: low
  false_positive_risk: medium
  commands:
  - cmd: bp {{module}}!<函数名>
    note: 在指定函数入口下断；函数名先用符号确认，不要用猜出来的名字
  - cmd: ba w8 <地址>
    note: 硬件写断点监视指定地址，不改写代码页；数量有限且受字节宽度限制
  - cmd: bl
    note: 查看断点列表与命中计数，确认条件是否真的生效
  - cmd: g
    note: 继续运行；内核断点命中会让整机停住，无人值守时慎用
  procedure:
  - 先用符号确认目标函数名或地址，不使用猜出来的名字下断，名字错了断点会静默不命中。
  - 在函数入口下软件断点，只要看清调用关系就够了，不必一上来就进到函数内部。
  - 要抓某个变量被谁改写时改用硬件写断点，按变量的实际字节宽度设置监视范围。
  - 给断点补上命中条件或命中计数，先在低频路径验证条件确实生效再放到高频路径。
  - 用断点列表核对每个断点的状态与命中次数，条件没生效在这里能直接看出来。
  - 继续运行时明确当下是整个目标机暂停，无人值守场景先确认不会长时间停住。
  pitfalls:
  - 在高频路径上无条件断点会把系统拖成假死，务必先加条件或命中计数
  - 软件断点改写的代码页可能被完整性检查判为篡改，表现为另一种蓝屏
  - 断点让竞态窗口消失，问题不复现不代表不存在，应改用日志或计数器
- id: tech:live-kernel-state-inspection
  name: 运行时状态查看
  name_en: Live Kernel State Inspection
  domain:
  - dom:wk-debug
  parent: dom:wk-debug
  def: 在目标机暂停时枚举进程线程、句柄、对象与池的当前状态，用类型化视图代替裸内存读取。难点是所谓当前状态只是一个时间切片，必须结合等待链与引用关系才能判断系统卡在哪一环。
  detail: 场景是目标机还在跑但行为明显不对，要看清此刻有哪些进程线程、谁占着句柄、内存与池被谁啃掉，从而判断系统卡在哪一环。与池内存取证的区别是这里看总体占用与对象引用，追单个区块的归属是池分析的事；与调用栈回溯分析的区别是这里先定位可疑对象，栈分析用来解释它为什么停在那里。注意点：所谓当前状态只是一个时间切片，对象可能正在创建或正在销毁，读到的字段随时可能已经过期；多处理器上各处理器的暂停时机并不相同，有的线程栈会停在与问题完全无关的位置；句柄数量多不等于泄漏，必须看引用计数才能区分句柄泄漏与对象本身没被释放。
  principle: 为什么必须靠类型化视图：内核对象都是带类型头的结构，同一块内存按不同结构去解释会得到完全不同的字段，只有按类型打印才能保证字段边界与引用语义正确，这也是为什么枚举对象要先拿到结构地址再用类型打印，而不是直接按字节读。为什么快照只是切片：调试中断让各处理器停在各自当前的指令上，被停住的线程可能正卡在临界区入口，也可能在等一个马上就会满足的条件，所以单次采样看到的谁在等谁很可能只是瞬时状态。结论因此必须靠等待关系与引用计数互相印证，不能靠某一段的地址就下判断。
  difficulty: 3
  prerequisites:
  - tech:kernel-symbol-management
  artifacts:
  - art:memory-dump
  - art:kernel-module
  outputs:
  - 进程与线程快照
  - 句柄与对象引用关系
  - 资源占用与等待点清单
  cost: low
  false_positive_risk: medium
  commands:
  - cmd: '!process 0 0'
    note: 列出全部进程及结构地址与线程摘要，作为后续命令的地址来源
  - cmd: '!vm'
    note: 查看内核虚拟内存与池的总体占用，先分清是耗尽还是单点异常
  - cmd: '!handle 0 f Process'
    note: 列出进程类句柄及其引用计数，句柄泄漏常在这里显形
  - cmd: dt nt!_EPROCESS
    note: 查看结构定义，确认要读的字段在当前版本的确切名字
  procedure:
  - 先列出全部进程拿到结构与线程地址，把它们当作后续命令的地址来源，而不是结论本身。
  - 看内核虚拟内存与池的总体占用，先分清是整体耗尽还是单点异常放大。
  - 再按对象类型枚举句柄与引用计数，句柄数量异常的地方重点看计数有没有回落。
  - 用结构类型命令确认要读字段在当前符号里的确切名字，再按名字取值。
  - 把等待点与引用关系整理成表，标出哪些对象正在退出、哪些正在创建。
  - 结论只写这一时间切片内成立的关系，并注明哪些点需要用第二次采样复核。
  pitfalls:
  - 把一次快照当成稳定状态，会漏掉正在迁移或正在退出的对象
  - 只看句柄数量不看引用计数，分不清句柄泄漏与内核对象未释放
  - 多处理器上各处理器的暂停时机不同，线程栈可能停在与问题无关的位置
- id: tech:kernel-pool-forensics
  name: 池内存取证
  name_en: Kernel Pool Forensics
  domain:
  - dom:wk-debug
  parent: dom:wk-debug
  def: 通过池标签、区块头与分配大小还原内核动态内存的归属与生命周期，定位越界、重复释放与泄漏。难点是布局受验证选项与系统配置影响，已释放区块被复用后只能靠元数据与时间线反推。
  detail: 场景是怀疑驱动有越界写、重复释放或长期泄漏，需要回答某个地址属于谁、有多大、是什么时候被释放的。与运行时状态查看的区别是那里看总量与对象引用，这里追到单个区块的归属与生命周期；与蓝屏转储归因的区别是池分析通常发生在归因之后，用来把还停留在可能性上的结论钉到具体分配点。注意点：池标签由分配方自己指定，第三方复用通用标签会让归属判断直接失效；开着特殊池或验证选项时布局与生产环境不同，结论不能直接外推；已释放区块的头部很可能已被下一次分配覆盖，仍按旧值解读会得出完全错误的归属。
  principle: 为什么池块能反查归属：每次内核分配都会在区块前后写入元数据，标签、大小与所属池类型都在其中，释放时这些字段被改写并挂回空闲链，所以一个地址的元数据快照同时给出了「谁分配」与「是否已释放」两个事实，这也是池取证的立足点。为什么归属会失效：标签只是调用方传进来的普通字串，内核不做任何校验，通用标签被大量复用后标签就不再指向单一模块；区块释放后内存被下一次分配接手，头部换成新标签，此时读到的是新主人的信息。所以每条归属都必须带时间窗口，并与其他分配点的证据交叉后才能进结论。
  difficulty: 4
  prerequisites:
  - tech:kernel-symbol-management
  - tech:live-kernel-state-inspection
  artifacts:
  - art:memory-dump
  - art:kernel-module
  outputs:
  - 池块归属与大小结论
  - 泄漏或破坏的时间线
  - 可疑分配点清单
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: '!poolused 2'
    note: 按标签汇总池占用并排序，先找异常放大的标签
  - cmd: '!poolfind <标签>'
    note: 枚举指定标签的全部池块；标签须为四字符且大小写敏感
  - cmd: '!pool <地址>'
    note: 查看单个地址所属池块与相邻区块，判断越界还是已释放
  procedure:
  - 先按标签汇总池占用并排序，找出占用异常放大的标签，作为怀疑起点。
  - 对怀疑的标签枚举它的全部区块，写标签时注意大小写敏感且必须写满四个字符，写错会得到空结果。
  - 挑出可疑地址逐个查看所属区块与相邻区块，先判断是越界还是已被释放。
  - 对每个地址记录下当时的标签与大小，作为后续比对的时间窗口证据。
  - 把标签与模块的调用关系对上，标签可以随便指定，单独一个标签不足以定归属。
  - 结论中区分元数据直接支持与需要额外证据两类归属，后者不要写进最终归因。
  pitfalls:
  - 池标签可被分配方任意指定，第三方复用通用标签会让归属判断直接失效
  - 开着特殊池或验证选项时布局与生产环境不同，结论不能直接外推
  - 已释放区块头部被覆盖后仍强行解读，会得出完全错误的归属
- id: tech:kernel-stack-unwind-analysis
  name: 调用栈回溯分析
  name_en: Kernel Stack Unwind Analysis
  domain:
  - dom:wk-debug
  parent: dom:wk-debug
  def: 在缺少帧指针且被内联优化的内核代码上还原真实调用链，并区分线程上下文与中断上下文。难点是优化后栈帧不连续、参数也未必留在栈上，回溯结论必须由多处证据互相印证。
  detail: 场景是栈上只剩一串地址、看不出究竟是谁调用了谁，或要确认某段执行流此刻落在哪个上下文里。与运行时状态查看的区别是那里枚举对象，这里解释执行流；与蓝屏转储归因的区别是那边把栈当证据的一部分，这里专门处理栈本身已经不可信的情况。注意点：优化后帧指针常被拿去当通用寄存器，栈帧不再连续，按固定步长走必然错位；被内联的函数根本不会出现在栈上，按函数名归因会重复计数；中断与延迟过程调用会借用当前线程的栈，不先判定上下文就会读错帧；扫描栈得到的指针不都是返回地址，必须验证它指向的代码像不像调用点。
  principle: 为什么栈回溯会断：回溯依赖两张表，一张说明每个返回地址属于哪个函数的哪个位置、该位置用哪条规则恢复调用者的帧，另一张是栈上实际压着的返回地址序列；没有帧指针时前者来自展开信息，后者只能逐个槽位去猜，所以缺展开信息时只剩扫描一条路。为什么扫描不等于回溯：栈上同时存在局部变量、保存的寄存器与历史残留，任意一个值都可能恰好指向一段可执行内存，看起来就像返回地址；只有落在函数内部、且其紧邻的前一条指令确实是调用指令的地址才是合法候选。为什么必须先判定上下文：中断栈与线程栈共用同一片内存，交错之后按单一线程的规则展开必然错位。
  difficulty: 4
  prerequisites:
  - tech:kernel-symbol-management
  - tech:live-kernel-state-inspection
  artifacts:
  - art:memory-dump
  - art:kernel-module
  outputs:
  - 可信调用链
  - 上下文类型判定
  - 可疑栈帧与印证证据
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: kb
    note: 带前三个参数的栈回溯，先看参数是否合理再判断调用关系
  - cmd: dps @rsp L40
    note: 按指针宽度扫描栈区，用于回溯断裂处人工寻找返回地址；x64 栈指针为 rsp
  - cmd: .frame 1
    note: 切换到指定栈帧上下文，再观察该帧的局部状态
  procedure:
  - 先做带参数的常规回溯，看参数是否合理，参数明显不合理就说明这一帧已经错位。
  - 回溯在某一帧断裂时，按栈指针宽度扫描该处栈区，人工寻找返回地址候选。
  - 对每个候选核对它指向的代码位置，落在函数中部且前一条指令是调用的才保留。
  - 判定当前上下文，中断与延迟过程调用会借用线程栈，先定上下文再解读帧。
  - 切换到目标帧之后再观察该帧的局部状态，不要拿上一帧的变量解释这一帧。
  - 输出调用链时标注每一帧的证据来源，靠扫描补出来的帧单独标为不确定。
  pitfalls:
  - 把扫描到的任意指针当返回地址，会凭空造出一段不存在的调用链
  - 中断或延迟过程调用的栈与线程栈交织，不先判定上下文就会读错帧
  - 内联展开让同一逻辑函数出现在多处，按函数名归因会重复计数
- id: tech:kernel-hang-diagnosis
  name: 挂起与超时诊断
  name_en: Hang & Timeout Diagnosis
  domain:
  - dom:wk-debug
  parent: dom:wk-debug
  def: 系统不蓝屏但整体卡死或周期性停顿，需从等待链、锁持有者与中断占用找出卡点。难点是没有崩溃现场，只能靠谁在等谁的关系图与暂停时机推断，而暂停本身又会改变卡点表现。
  detail: 场景是用户报死机，机器完全不响应或隔一阵就卡一次，事件日志里却找不出崩溃记录，只能在没有任何崩溃现场的前提下用状态采样逼近卡点。与蓝屏转储归因的区别是这里没有错误码可依，全部靠谁在等谁的关系；与断点策略的区别是断点本身就会改变时序，诊断卡死时加断点常常把问题直接弄没。注意点：只在卡死瞬间取一次快照，分不清持锁线程是被抢占还是已经死锁，必须隔一段时间再采一次看位置是否变化；周期性停顿与完全卡死是两类问题，前者要往高频中断与延迟过程调用上想；调试器暂停所有处理器这件事本身就会改变调度，卡点可能在恢复运行后自行消失。
  principle: 为什么没有现场也能定位：卡死的本质是等待关系闭合成环，或者某个持有者正在等一个永远不会到来的事件，而这类关系在暂停时是可见的，因为每个线程等的对象与持有的锁都记在它自己的结构里，把全部线程按等待对象聚合就能看出是谁堆在同一处。为什么单次采样不够：一次采样无法区分正在等但马上会满足与根本等不到，两者的静态形态完全一样；两次采样之间位置不移动，才说明是真卡住。为什么暂停会改变现象：调试中断把所有处理器同时停下，等锁线程与持锁线程被一起冻住，原本会被抢占打断的临界区得以走完，于是恢复后系统自己活了过来。
  difficulty: 5
  prerequisites:
  - tech:bugcheck-dump-triage
  - tech:kernel-stack-unwind-analysis
  artifacts:
  - art:memory-dump
  - art:kernel-module
  - art:driver
  outputs:
  - 等待关系图
  - 卡点定位结论
  - 复现与验证方案
  cost: high
  false_positive_risk: high
  commands:
  - cmd: '!analyze -hang'
    note: 自动检测挂起类问题，输出被阻塞的线程与疑似持有者
  - cmd: '!stacks 2'
    note: 按调用栈聚合全部线程，一眼看出大量线程堆在同一处
  - cmd: '!locks'
    note: 列出内核锁及其持有者，确认是否存在锁竞争或死锁
  procedure:
  - 先跑挂起类的自动检测，拿到被阻塞线程与疑似持有者的第一版名单。
  - 按调用栈聚合全部线程，看是否有大量线程堆在同一处，堆叠点通常就是卡点。
  - 再列出内核锁及其持有者，确认是锁竞争还是某个持有者根本不运行。
  - 对可疑的持锁线程单独看它的栈，判断它是被抢占还是在等别的资源。
  - 隔一段时间重复采样一次，两次位置不变才认定为真卡死。
  - 结论区分死锁、活锁与单纯的高频占用，并给出验证是否复现的条件。
  pitfalls:
  - 只在卡死瞬间取一次快照，无法区分持锁线程被抢占与真正死锁
  - 把周期性停顿当成完全卡死，会漏掉高频中断或延迟过程调用这条线
  - 调试器暂停所有处理器本身会改变调度，卡点可能在恢复后自行消失
