# BinAtlas 知识库 · 技术 · dom:av-evasion-sandbox
# 规范：03-DATA-SCHEMA.md §2.2

- id: tech:virtualization-artifact-detection
  name: 虚拟化痕迹识别
  name_en: Virtualization Artifact Detection
  domain:
  - dom:av-evasion-sandbox
  parent: dom:av-evasion-sandbox
  def: 从设备型号、驱动、服务与固件信息判断当前是否运行在虚拟化或分析环境中。难点是同样的判据在云主机与低配真机上同样成立，误判会直接让样本在真实目标上失效。
  detail: 场景是判断当前是不是运行在虚拟化或分析环境里，一般在主体逻辑之前做一次。与硬件指纹校验的区别是那条读处理器与磁盘字段，本条读机型、固件与工具组件；与实验环境指纹清洗的区别是方向相反，那条是要让判据失效。注意云主机与实验室环境的痕迹高度重叠，按厂商串判定会大面积误伤；只看出存在虚拟化监控层也不等于被分析，很多企业终端本来就跑在虚拟化上；文本输出字段随版本变化，能取结构化字段就不要解析文本。
  principle: 这些痕迹是虚拟化层自己留下的产物，不是系统或样本的行为：机型、固件厂商串、设备标识由虚拟化软件在虚拟硬件描述里填好，客户机读到的就是这些固定值，因此判据在统计上有效——虚拟硬件的描述空间远小于真机。但有效性完全依赖虚拟化软件没有刻意修正这些字段，而厂商已能给它们赋值、云平台也常做去特征化，于是判据强度从确定退化为概率。可用性还要平衡：判据堆得越多，真机被误杀的几率越高，最后会在任何机器上拒绝执行。
  difficulty: 2
  prerequisites: []
  artifacts:
  - art:pe32
  - art:pe64
  - art:shellcode
  outputs:
  - 虚拟化特征命中清单
  - 各判据的误判率估计
  - 判据组合与阈值
  cost: low
  false_positive_risk: high
  commands:
  - cmd: systeminfo
    note: 一次看到系统型号、厂商、固件与内存，是判据里最基础的三个字段。
  - cmd: Get-CimInstance Win32_ComputerSystem | Select-Object Manufacturer,Model
    note: 取厂商与型号字符串做精确匹配，比模糊匹配关键词误报低。
  - cmd: reg query "HKLM\SOFTWARE\VMware, Inc.\VMware Tools"
    note: 查虚拟化工具组件是否安装；键不存在只说明未装工具，不代表不是虚拟机。
  procedure:
  - 先一次取出机型、厂商、固件与启动信息，看这几个字段是否出现虚拟化厂商串。
  - 再取结构化的厂商与型号做精确比对，不要用关键词模糊匹配，模糊匹配是误报主因。
  - 查虚拟化工具组件的注册位置，键不存在只能说明没装工具，不能反推成裸机。
  - 对每条命中的判据单独写出真机也可能出现的理由，先给出误报率估计。
  - 只在多条独立判据同时命中时才判定为虚拟化，并把阈值与例外条件写进结论。
  - 拿一台真机跑同一组判据复核，出现大面积误伤就回头删判据。
  pitfalls:
  - 云主机与虚拟化分析环境的特征高度重叠，按厂商名判定会大面积误伤。
  - 只查一个字符串极易被正常机器命中，判据必须组合使用。
  - 判据堆得越多，可用性越差，最后在任何机器上都拒绝执行。
- id: tech:hardware-fingerprint-check
  name: 硬件指纹校验
  name_en: Hardware Fingerprint Check
  domain:
  - dom:av-evasion-sandbox
  parent: dom:av-evasion-sandbox
  def: 读取处理器标识、磁盘序列号、显示适配器与内存容量，判断硬件是否为虚拟化设备或规格明显偏低。难点是虚拟机可以伪造大部分字段，云环境的硬件描述与真机差别很小。
  detail: 场景是在环境判定里补一层硬件层面的判据，读处理器标识、磁盘序列号、显示适配器与内存规格。与虚拟化痕迹识别的区别是那条读机型与工具组件，本条读设备字段；与运行时长校验的区别是那条看时间，本条看规格与序列号。注意新版系统上这条查询命令常常默认不安装，读不到要换结构化查询而不是当作无值；序列号可被虚拟化层写成任意值，按有没有序列号判断并不可靠；核数与内存偏低同样命中真实的老旧办公机，这是最大的误报来源。
  principle: 硬件字段是固件与驱动在枚举设备时填入设备属性、再经管理层暴露出来的，虚拟机里这些值由虚拟硬件模拟器回填；模拟器为保证兼容性往往填固定占位串，例如全零或固定长度的序列号、只有几个取值的适配器名称，于是取值集合很小本身就是特征。但这条链路的每一层都可被覆盖：虚拟化层能写任意值，驱动能改写属性，所以区分力来自取值分布而不是字段语义。规格类判据与低配真机不可区分，只能加权，不能作为否决条件。
  difficulty: 2
  prerequisites:
  - tech:virtualization-artifact-detection
  artifacts:
  - art:pe32
  - art:pe64
  outputs:
  - 硬件字段快照
  - 与常见虚拟化默认值的比对结果
  - 规格异常的置信度评估
  cost: low
  false_positive_risk: high
  commands:
  - cmd: wmic cpu get ProcessorId
    note: 取处理器标识；注意新版系统上 wmic 可能默认不存在，需改用 CIM 查询。
  - cmd: wmic diskdrive get SerialNumber,Model
    note: 取磁盘序列号与型号，虚拟磁盘常返回全零或固定占位串。
  - cmd: Get-CimInstance Win32_VideoController | Select-Object Name,AdapterRAM
    note: 虚拟机的显示适配器名称与显存值往往落在很窄的几个取值上。
  procedure:
  - 先取处理器标识，命令不存在就改用结构化查询读同一字段，不要把它记成无值。
  - 取磁盘序列号与型号，重点看是否全零、固定长度或明显占位串。
  - 取显示适配器名称与显存，比对常见虚拟适配器的取值是否落在窄区间里。
  - 把每个字段登记成值与是否落在虚拟化默认集合内两列，空值来源单独标注。
  - 区分权限不足导致的空值与设备本身无值，两者含义完全不同。
  - 只用多个字段的联合分布做判定，任何单字段都不作为否决条件。
  - 在老旧的低配真机上复核一次，校准规格类判据的阈值。
  pitfalls:
  - 序列号可被虚拟化层伪装成任意值，按「有没有序列号」判断并不可靠。
  - 核数与内存偏低同样会命中真实的老旧办公机，这是最大的误报来源。
  - 部分字段需要管理员权限才能读，权限不足时的空值不能当成特征。
- id: tech:network-environment-check
  name: 网络环境验证
  name_en: Network Environment Validation
  domain:
  - dom:av-evasion-sandbox
  parent: dom:av-evasion-sandbox
  def: 检查出口地址、DNS 解析结果、代理设置与连通性，判断网络是否被整体重定向或仿真。难点是仿真的网络越来越完整，单一判据不可靠，而多判据又会增加失败面。
  detail: 场景是判断出网是否被整体重定向或仿真，通常和环境判定一起做。与硬件指纹校验的区别是那条读本机设备字段，本条读网络配置与真实响应；与运行时长校验的区别是那条看时间源，本条看对端。注意断网不等于沙箱，大量真实终端本来就不通外网；代理来自组策略时本地读数一切正常，实际流量仍被转发，要以真实连接的对端为准；仿真网络的响应可能很完整，单看解析结果会被骗过，必须补一次完整连接测试。
  principle: 要控制被测代码的出网，分析方必须在客户机的网络路径上插入一个中间点：改域名解析、改网关、设代理，或在虚拟网络层直接拦截。这个中间点必然改变谁回答了什么——解析结果来自非预期地址、网关与解析服务器落在固定内网段、多个域名解析到同一地址、完整连接的对端与解析结果不一致。改动发生在配置与响应两层，所以既要读配置也要测真实连接：只读配置会被透明转发骗过，只测连接则分不清解析被劫持与端口被封。
  difficulty: 2
  prerequisites:
  - tech:virtualization-artifact-detection
  artifacts:
  - art:pcap
  - art:pe32
  outputs:
  - 出口与解析结果快照
  - 代理与连通性状态
  - 仿真网络特征命中情况
  cost: low
  false_positive_risk: high
  commands:
  - cmd: ipconfig /all
    note: 看网卡型号、网关与 DNS 配置；仿真网络的网关与 DNS 常指向固定内网段。
  - cmd: Get-DnsClientServerAddress
    note: 取按接口组织的 DNS 服务器列表，比解析结果更早暴露被统一接管。
  - cmd: Test-NetConnection -ComputerName example.com -Port 443
    note: 测一次完整外联；只测 DNS 或只测 ICMP 都无法区分「解析被劫持」与「出网被封」。
  procedure:
  - 先取完整的网络配置，看网卡型号、网关与解析服务器是否落在固定内网段。
  - 按接口取解析服务器列表，确认是否所有接口都被指向同一地址。
  - 做一次完整的外联连接测试，用来区分解析被劫持与端口被封这两种情况。
  - 对多个不同域名各解析一次，若全部落到同一地址，这是仿真网络区分度最高的特征。
  - 记录代理配置的来源，本地读数正常时以真实连接的对端为准。
  - 结合环境用途下结论，断网本身不算特征，只有配置被统一接管才算。
  pitfalls:
  - 断网环境不等于沙箱，大量真实终端本来就不通外网。
  - DNS 被劫持到固定地址反而是最容易识别的特征，但需要多次解析比对。
  - 代理来自组策略时本地读数正常，实际流量仍被转发，要看真实对端。
- id: tech:uptime-and-timing-check
  name: 运行时长与时序校验
  name_en: Uptime and Timing Check
  domain:
  - dom:av-evasion-sandbox
  parent: dom:av-evasion-sandbox
  def: 用系统启动时长、指令计数差与被快进的延时判断执行环境是否被加速或是刚启动。难点是真机也会休眠与挂起，阈值定得越紧，误判概率越高。
  detail: 场景是判断环境是否刚启动、是否被时间加速，常用于在主体逻辑之前加一道低成本筛选。与执行延迟预算的区别是那条用延时把执行推后，本条只测量环境；与硬件指纹校验的区别是那条读设备字段，本条读时间源。注意休眠与快照恢复都会让开机时长异常，不能单独作为依据；虚拟化层的时间同步会把时钟拉回，算出来的时间差可能为负；单次测量抖动很大，要重复取中位数，阈值用本机基准而不是写死。
  principle: 分析方为了吞吐会缩短等待，做法无非三类：跳过延时、快进系统时钟、从快照恢复。三类手法各自留下可测的物理量：延时被跳过时挂钟时间与请求的时长不匹配；时钟被快进时相邻两次取时的差值与真实耗时不一致，甚至倒退；从快照恢复时开机时刻与设备枚举、系统文件时间彼此矛盾。这些量都能从用户态读到，而且来自内核的不同时间源，所以多源互相不一致比任何单值阈值都可靠，单值阈值会被低配真机直接命中。
  difficulty: 2
  prerequisites:
  - tech:virtualization-artifact-detection
  artifacts:
  - art:pe32
  - art:pe64
  outputs:
  - 启动时长与延时实测值
  - 加速判定阈值建议
  - 误判场景清单
  cost: low
  false_positive_risk: high
  commands:
  - cmd: systeminfo
    note: 输出里带系统启动时间，配合当前时间可直接算出运行时长。
  - cmd: Get-CimInstance Win32_OperatingSystem | Select-Object LastBootUpTime
    note: 取结构化的启动时间字段，比解析文本输出稳定。
  - cmd: Measure-Command { Start-Sleep -Milliseconds 1000 }
    note: 实测一秒睡眠的真实耗时，明显偏短说明存在时间加速或时钟被篡改。
  procedure:
  - 先取结构化的开机时刻，不要解析文本输出里的那一行，格式随版本会变。
  - 用当前时刻减去开机时刻得到运行时长，记下来备用。
  - 用计时命令包住一次固定时长的等待，测真实耗时，重复几次取中位数。
  - 实际耗时明显偏短就是延时被跳过；落在抖动范围内则标为未发现。
  - 连续取两次当前时刻做差并与外部耗时比对，出现负值说明时钟被同步或篡改。
  - 把休眠与快照恢复列为例外条件，命中例外时不要用时长下结论。
  - 阈值以本机实测中位数为基准，不写死成固定值。
  pitfalls:
  - 休眠与快照恢复都会让开机时长异常，不能单独作为判定依据。
  - 虚拟化层的时间同步会把时钟拉回，时间差可能为负。
  - 阈值写成硬编码，在慢速真机上必然误判，需要自适应基准。
- id: tech:analysis-tool-trace-detection
  name: 分析工具痕迹识别
  name_en: Analysis Tool Trace Detection
  domain:
  - dom:av-evasion-sandbox
  parent: dom:av-evasion-sandbox
  def: 枚举进程、窗口、服务与监听端口，识别调试器、监控器、抓包与自动化工具的存在。难点是通用枚举本身就要调用高危接口，频繁枚举反而比工具痕迹更可疑。
  detail: 场景是在主体逻辑前确认现场有没有调试器、监控器、抓包与自动化工具，同时评估这些枚举本身有多显眼。与虚拟化痕迹识别的区别是那条判环境，本条判工具；与交互门槛设计的区别是那条要外部输入，本条只读系统状态。注意按进程名匹配既会被改名绕过，也会误伤同名正常程序；模块遍历在受保护进程上会失败，失败本身也是线索；枚举的频次与时机比枚举内容更容易被关联，短时间多次全量枚举在遥测里非常突出。
  principle: 分析工具要起作用就必须挂到被测对象上，而挂载会留下可枚举的系统状态：调试器要打开目标进程并建立调试关系，抓包工具要绑定网卡或开固定端口，监控器要往目标进程注入模块或加载自己的驱动。这些状态是工具自己造成的，样本只需查询系统已有的数据结构就能看到，成本极低。但查询动作走的是同一套系统调用，会被挂钩记录，所以收益与暴露成正比：一次全量枚举留下的痕迹，往往比它要找的痕迹更明显。
  difficulty: 2
  prerequisites:
  - tech:virtualization-artifact-detection
  artifacts:
  - art:pe32
  - art:pe64
  outputs:
  - 可疑进程与端口清单
  - 枚举动作自身的可观测事件
  - 判据优先级建议
  cost: low
  false_positive_risk: high
  commands:
  - cmd: Get-Process | Select-Object Name,Id
    note: 取进程名与 PID 做匹配；按名字匹配会被改名绕过，也会误伤同名正常程序。
  - cmd: tasklist /m
    note: 列出进程加载的模块，监控类工具常带特征明显的注入模块。
  - cmd: Get-NetTCPConnection | Select-Object LocalPort,State,OwningProcess
    note: 看监听端口与所属进程，抓包与调试服务往往有固定端口。
  procedure:
  - 先固定时间与会话基线，把系统自身进程排除掉，避免把自己的枚举结果算成痕迹。
  - 取进程名与标识清单，名字匹配只作初筛，不作为结论。
  - 看每个进程加载的模块，模块路径异常比进程名可靠；受保护进程的失败要单独记。
  - 取监听端口并按所属进程归位，识别调试与抓包服务的固定端口。
  - 给每条判据标注误报来源，例如同名正常程序或可改名的工具。
  - 统计本轮枚举的次数与间隔，评估这些动作本身在遥测里有多突出。
  - 只在多条判据同时命中时下结论，单条一律标为线索。
  pitfalls:
  - 按进程名匹配会被改名绕过，也会误伤同名的正常程序。
  - 遍历模块列表在受保护进程上会失败，失败本身也能被当作特征。
  - 枚举的频次与时机比枚举内容更容易被关联，短时间多次全量枚举非常突出。
- id: tech:user-interaction-gating
  name: 交互门槛设计
  name_en: User Interaction Gating
  domain:
  - dom:av-evasion-sandbox
  parent: dom:av-evasion-sandbox
  def: 要求外部交互信号（可见窗口、鼠标移动、前台焦点）满足后才继续，让无人值守的分析停在无害分支。难点是分析平台已能模拟交互，而门槛本身又是所有手法里最显眼的可疑特征。
  detail: 场景是让主体逻辑只在有人真的操作过之后继续，使无人值守的自动分析停在无害分支。与执行延迟预算的区别是那条用时间推后，本条用外部输入门槛；与分析工具痕迹识别的区别是那条读现场工具，本条要求输入事件。注意自动分析平台普遍能模拟鼠标与窗口焦点，单纯等点击拦不住；只在交互后才执行会让静态结论与动态结论完全脱节，反而更可疑；门槛条件写成明文比较时，最容易被静态规则直接抓住。
  principle: 无人值守的分析环境里没有交互式会话，也没有桌面上的真实输入事件，所以要求一次点击或焦点变化的判据会一直等不到——实现成本极低而区分度不错，这是它有效的原因。但上限同样清楚：模拟输入只需向会话桌面投递消息，成本同样低，一旦分析方注入输入，门槛立刻失效。而且等待交互会表现为窗口接口与循环的组合，在静态分析里相当显眼，被识别后门槛本身就成了标签，所以它是成本手段而不是隔离手段。
  difficulty: 3
  prerequisites:
  - tech:analysis-tool-trace-detection
  artifacts:
  - art:pe32
  - art:pe64
  - art:script
  outputs:
  - 交互判据与阈值
  - 无人值守环境下的停留行为
  - 门槛本身的静态特征
  cost: low
  false_positive_risk: medium
  commands:
  - cmd: Get-Process | Where-Object MainWindowTitle
    note: 筛出有可见窗口标题的进程，用来判断当前是否处在有桌面交互的会话里。
  - cmd: query session
    note: 列会话状态；只有交互式会话存在时，鼠标与焦点类判据才有意义。
  - cmd: Get-CimInstance Win32_Process | Select-Object ProcessId,Name
    note: 取进程快照用于前后比对，判断交互期间是否有新进程被拉起。
  procedure:
  - 先确认是否存在交互式会话，没有就直接停在无害分支。
  - 看有没有带标题的可见窗口，判断桌面上是否真的有人在用。
  - 取前后两次进程快照，比对交互期间是否出现新进程。
  - 把会话、窗口、进程三条判据组合成门槛，任一不满足就继续等待而不是退出。
  - 在无人值守环境实测一次，确认停留行为符合预期且进程数量没有异常增长。
  - 检查门槛代码自身的静态形态，评估被规则直接命中的概率。
  - 设定超时兜底，避免在无交互环境永久驻留，反而拉长被采样的时间。
  pitfalls:
  - 自动分析平台普遍能模拟鼠标与窗口焦点，单纯等点击拦不住。
  - 仅在交互后执行会让静态结论与动态结论完全脱节，反而更可疑。
  - 门槛条件写成明文比较，最容易被静态规则直接抓住。
- id: tech:execution-delay-budget
  name: 执行延迟预算
  name_en: Execution Delay Budget
  domain:
  - dom:av-evasion-sandbox
  parent: dom:av-evasion-sandbox
  def: 用长延时或外部条件把主体执行推到分析窗口之外，同时控制延迟幅度不至于过分离谱。难点是长时间静默与定时唤醒本身就是沙箱的重点标记对象，延迟越长暴露面越大。
  detail: 场景是把主体执行推到自动分析窗口之外，通常和交互门槛配合使用。与运行时长与时序校验的区别是那条测量环境时间，本条安排自己的时间；与交互门槛设计的区别是那条等外部输入，本条只等时间或条件。注意分析窗口的长短不由样本决定，多数情况下远长于单样本能接受的延迟；睡眠与挂起期间定时器不推进，唤醒时刻会严重偏移；延时期间进程仍常驻，静默不等于隐身。
  principle: 延时有效的理由是自动分析给每个样本的执行预算有限，超预算就结束采集并出报告，把主体推到预算之外，窗口内就只剩无害行为。但这条收益有硬上限：窗口长度由分析方决定，靠延时跨过去只能赌对方窗口短；更关键的是静默期间进程依然存在、内存依然可被扫描与采样，延时买到的是行为缺失而不是不可见。一旦分析方延长窗口或监控定时唤醒，收益迅速归零，所以它只能算预算的一部分，不能当隔离手段。
  difficulty: 2
  prerequisites:
  - tech:uptime-and-timing-check
  artifacts:
  - art:pe32
  - art:pe64
  - art:shellcode
  outputs:
  - 延迟策略与总耗时
  - 唤醒方式与可观测事件
  - 真实机器上的可接受度评估
  cost: low
  false_positive_risk: medium
  commands:
  - cmd: Measure-Command { Start-Process -FilePath {{binary}} -Wait }
    note: 测端到端耗时，确认延迟叠加后仍在真实用户能接受的范围。
  - cmd: Get-Date
    note: 记录起止时刻，用外部时间戳复核进程内部自算的延迟是否一致。
  procedure:
  - 先记下起始时刻，作为外部时间基准。
  - 用计时命令包住一次带等待的启动，测端到端耗时，确认延迟叠加后仍在可接受范围。
  - 按目标窗口估算需要的延迟量级，明显超过真实用户可接受度就下调。
  - 选定唤醒方式，并记录它会产生的可观测事件。
  - 在各段延迟前后各取一次时间，确认内部自算的延迟与外部时间戳一致。
  - 在挂起与休眠场景复测一次，确认唤醒时刻没有严重偏移。
  - 汇总总耗时与静默时长，评估静默期被采样的暴露面是否可接受。
  pitfalls:
  - 定时器在睡眠与挂起期间不推进，唤醒时刻与预期差很远。
  - 延时期间进程常驻，反而给采集器更多采样机会，静默不等于隐身。
  - 分析窗口通常远长于常见延时，单靠延时很少能真正跨过去。
- id: tech:environment-fingerprint-cleaning
  name: 实验环境指纹清洗
  name_en: Lab Environment Fingerprint Cleaning
  domain:
  - dom:av-evasion-sandbox
  parent: dom:av-evasion-sandbox
  def: 在自有实验机上移除虚拟化工具的痕迹与常见分析软件残留，避免验证手法时被环境判定提前拦下。难点是清洗不彻底会留下更强特征（缺失的设备、异常驱动），虚拟化层也无法真正抹掉。
  detail: 场景是在自有实验机上移除虚拟化工具痕迹与分析软件残留，避免验证手法时被环境判定提前拦下。与虚拟化痕迹识别的区别是方向相反，那条找痕迹，本条清痕迹；与驱动与内存完整性核查的区别是那条读策略，本条改环境。注意清洗不彻底比不清洗更显眼，删掉驱动会留下未知设备与加载失败记录；虚拟化层本身抹不掉，处理器与固件层面的特征不受客户机控制；改完必须复测，只看删了哪些项不足以说明环境已经变了。
  principle: 清洗能起作用，是因为多数环境判定读的是客户机内部可见的产物：服务、卸载项、驱动、设备名。删掉这些产物，基于它们的判据就失效了，这是清洗的全部原理。但机器身份由更底层的东西决定——处理器暴露的虚拟化存在标志、固件表、设备的枚举标识，以及虚拟化层对硬件描述的填充，都不在客户机可控范围内，所以清洗改变的是上层痕迹的分布，不是是否处于虚拟化这个事实。副作用还不对称：删服务与驱动会留下未知设备与加载失败记录，统计上比原痕迹更突出。
  difficulty: 2
  prerequisites:
  - tech:virtualization-artifact-detection
  artifacts:
  - art:pe32
  - art:pe64
  outputs:
  - 清洗项清单与执行顺序
  - 清洗后残留特征评估
  - 环境差异说明
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: Get-Service | Where-Object Name -like "*VM*"
    note: 列出虚拟化相关服务，作为清洗项的第一版清单。
  - cmd: reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall" /s /f
      "VMware"
    note: 递归搜卸载项里的厂商关键字，找残留的驱动与工具安装记录。
  - cmd: Get-CimInstance Win32_ComputerSystem | Select-Object Manufacturer,Model
    note: 清洗后复测厂商与型号，确认改动真的生效而不是只删了注册表项。
  procedure:
  - 先列出虚拟化相关服务，只列不删，作为第一版清洗清单。
  - 递归搜卸载项里的厂商关键字，补齐工具与驱动的安装记录。
  - 按服务、驱动、卸载项、设备的顺序逐项停用并移除，每步后复测一次。
  - 复测厂商与型号读数，确认改动真的生效，而不是只删了注册表项。
  - 检查设备状态，把新出现的未知设备记进残留清单。
  - 对每项残留评估比原痕迹更显眼还是更弱，明显更显眼的回滚。
  - 在结论里标注环境来源，说明哪些底层差异无法清洗。
  pitfalls:
  - 删掉驱动会让依赖它的设备变成未知设备，异常比原来更明显。
  - 只改注册表不动驱动等于没改，读数与实际行为会对不上。
  - 清洗后的环境与真实目标仍有底层差异，任何结论都要标注环境来源。
