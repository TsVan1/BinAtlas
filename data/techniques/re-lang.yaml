# BinAtlas 知识库 · 技术 · dom:re-lang
# 规范：03-DATA-SCHEMA.md §2.2

- id: tech:dotnet-metadata-recovery
  name: 托管元数据与指令还原
  name_en: Managed Metadata & IL Recovery
  domain:
  - dom:re-lang
  parent: dom:re-lang
  def: 还原托管程序集的类型、方法与中间语言指令，进入字节码层理解逻辑。难点是元数据表可被篡改或整体加密，条目错乱会让反编译只出一半。
  detail: 场景是 PE 里带 CLI 头、托管入口的程序集要按类型与方法粒度读逻辑而不进汇编；也用于判断「反编译只出一半」是保护还是引用缺失。与原生反汇编的区别是不处理指令集与调用约定，处理的是中间语言与元数据表；与托管混淆归一化的区别是那条专治可读性，这条只求把真实结构还原出来、名字难看也接受。注意点：.NET Framework 与 .NET 5+ 的程序集头结构不同，单文件发布要先从原生宿主里抽出内嵌程序集；中间语言是抽象栈机器，没有寄存器与栈帧，别按原生调用约定套；混合模式程序集的原生部分要另走原生技术。
  principle: 托管程序集的类型定义、方法签名、字段布局与指令体不是编译器私有产物，而是元数据表——加载时要按这些表定位方法体、解析引用并做即时编译，删掉或破坏它们程序集就跑不起来。这是托管产物比原生产物好还原的根因：元数据是运行时的必需输入，不是可选的调试信息。反编译器只把表读成语法树，不做指令语义推断，所以名字、签名与继承关系往往完整可读。反过来，元数据被整体加密后运行时自己也读不了，保护方必须挂一个加载前解密的模块，那个模块就成了新的锚点。
  difficulty: 2
  prerequisites:
  - tech:binary-triage-metadata
  artifacts:
  - art:pe-dotnet
  - art:jar
  outputs:
  - 类型与方法清单
  - 可读的中间语言或反编译源码
  - 元数据异常项清单
  - 需进一步还原的入口点
  cost: low
  false_positive_risk: low
  commands:
  - cmd: monodis --output={{out}} {{binary}}
    note: 导出完整中间语言；不依赖符号即可用，适合先拿全貌
  - cmd: ilspycmd -o {{out}} {{binary}}
    note: 直接出工程级源码，比读中间语言快；失败通常说明元数据被动过
  - cmd: python3 -c "import sys;d=open(sys.argv[1],\"rb\").read();print(d.find(b\"BSJB\"))"
      {{binary}}
    note: 找元数据签名，确认托管头存在且元数据区位置正常
  procedure:
  - 先用 python3 探文件里的 BSJB 签名，确认 CLI 头与元数据根都在、偏移正常，找不到就别急着反编译。
  - 再用 monodis --output 导出完整中间语言，这一步不依赖符号，先拿到类型与方法全貌。
  - 接着用 ilspycmd -o 出工程级源码，可读性好的部分直接当业务逻辑读。
  - 两边对照：ilspycmd 只出空壳或半截时，回 monodis 看是表项缺失还是方法体为空。
  - 对半截的条目查引用来源，缺外部程序集就补依赖，缺表项就按元数据被篡改处理。
  - 遇到混合模式或单文件发布，先定位内嵌程序集与原生部分，分两条线各自还原。
  pitfalls:
  - 保护方案会加密元数据，反编译器只输出空壳类，问题在元数据不在指令
  - 混合模式程序集的原生部分不在中间语言里，只看托管层会漏关键逻辑
  - 混淆后类型名可能是不可见字符，别按名字判断用途
  - 单文件发布把程序集打包进原生宿主，直接反编译宿主得不到业务代码
- id: tech:dotnet-obfuscation-normalization
  name: 托管混淆归一化
  name_en: Managed Obfuscation Normalization
  domain:
  - dom:re-lang
  parent: dom:re-lang
  def: 消除标识符重命名、字符串加密与控制流平坦化，恢复可读的托管代码。难点是多种混淆可叠加，且部分保护会主动破坏反编译器的元数据解析。
  detail: 场景是程序集能反编译但标识符是乱码、字符串是密文、控制流被摊平，需要先归一化再读逻辑；也用于判断样本用了哪一家保护。与元数据还原的区别是那条解决「能不能读出结构」，这条解决「读出来能不能看懂」；与原生脱壳的区别是不处理整个映像的压缩加密，只处理托管层改写。注意点：这类工具默认覆盖当前目录同名文件，先备份原件；处理后的程序集强命名签名失效，依赖签名校验的加载会直接失败；字符串解密依赖运行期初始化的密钥时，静态手段拿不到全部明文。
  principle: 托管混淆的手法都受一个约束：产物仍要被运行时正常加载执行。所以它只能改名字、加解密字符串、重排控制流，不能破坏元数据表的合法性——表结构一旦非法，加载器直接拒绝加载。这给了归一化一个稳定立足点：产物仍是合法程序集，结构一定读得出，缺的只是语义。于是分三层做，可靠程度不同。名字层把标识符映射回可读串即可，纯静态且无损；字符串层必须在受控环境里让解密函数自己跑，因为密钥常由静态构造或模块初始化在运行期算出，静态分析拿不到输入；控制流层要按指令块重建后继关系，属于重建而不是还原。
  difficulty: 3
  prerequisites:
  - tech:dotnet-metadata-recovery
  artifacts:
  - art:pe-dotnet
  outputs:
  - 去混淆后的程序集
  - 解密出的字符串表
  - 混淆器与手法清单
  - 无法自动恢复的残留项
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: de4dot {{binary}}
    note: 自动识别并去除常见混淆；产物默认写在当前目录，先备份原件
  - cmd: ilspycmd -o {{out}} {{binary}}
    note: 每轮处理后重新反编译，对比可读性变化判断是否真有效
  - cmd: python3 -c "import sys;d=open(sys.argv[1],\"rb\").read();print([s for s in
      [b\"ConfusedBy\",b\"Babel\"] if s in d])" {{binary}}
    note: 在文件里找混淆器残留标识，作为选路线的依据
  procedure:
  - 先在文件里搜 ConfusedBy、Babel 一类残留标识，判断是哪家保护，再决定走自动还是手工。
  - 备份原件后用 de4dot 跑一遍；它默认写回当前目录同名文件，别拿唯一的一份样本做试验。
  - 用 ilspycmd -o 重新反编译产物，与原件输出逐项对比，确认改名与字符串真的变了。
  - 内容没变说明该变体没被识别，转手工：定位字符串解密函数并按调用点批量还原。
  - 控制流平坦化有残留时按分发块重建真实后继，先还原主干再补分支。
  - 处理完复核强命名与加载，签名失效的程序集在依赖校验场景会直接加载失败，需另行处理。
  pitfalls:
  - 去混淆失败时工具仍可能输出文件，看起来成功但内容没变，必须复核
  - 某些混淆把指令改成不可验证形式，处理后仍需手工修才能反编译
  - 字符串解密常依赖运行期初始化的密钥，静态处理拿不到全部明文
  - 处理过的程序集签名失效，强命名校验场景下加载会直接失败
- id: tech:symbol-demangling
  name: 符号修饰还原
  name_en: Symbol Demangling
  domain:
  - dom:re-lang
  parent: dom:re-lang
  def: 把编译器生成的修饰名还原成可读的命名空间、类与函数签名。难点是不同编译器与语言的修饰规则不同，残缺或截断的修饰名无法唯一反解。
  detail: 场景是带符号的原生产物要从修饰名反推命名空间、类与完整签名，用于判断编译器族、语言以及是否混编；也用于把同名不同实现的符号去重。与 Go 产物符号还原的区别是那条靠运行时元数据表、符号表没了一样能做，这条处理的正是符号表本身；与 Rust 产物识别的区别是那条要在几乎没有符号时判语言，这条是有符号之后的解读。注意点：修饰规则随编译器与 ABI 演化，解码器版本旧会解出错名；修饰名被截断成前缀后不存在唯一解；strip 过的产物上这些命令只会输出空。
  principle: 修饰名不是装饰，而是把签名编码进一个合法标识符的方案。链接器只认扁平的名字空间，重载、命名空间、模板实参与函数类型都必须压平成唯一字符串，否则同名不同签名的符号会互相覆盖；编译器于是按固定文法把类型写进名字，Itanium C++ ABI 用 _Z 前缀加长度前缀的嵌套名，MSVC 用 ? 前缀加类型码。解码器只是按同一文法做逆运算，所以它确定且无损——前提是字符串完整、文法匹配。一旦被截断或压缩，文法不再成立，任何解码都只能是猜测，这也是它失效的唯一原因。
  difficulty: 2
  prerequisites:
  - tech:binary-triage-metadata
  artifacts:
  - art:elf64
  - art:pe64
  - art:so
  outputs:
  - 还原后的可读符号名
  - 编译器族与语言推断
  - 无法反解的残缺修饰名清单
  - 同名不同实现的去重结果
  cost: low
  false_positive_risk: low
  commands:
  - cmd: nm -C {{binary}}
    note: 多数工具链可直接还原修饰名，先看能还原多少
  - cmd: nm {{binary}} | c++filt
    note: 显式过一遍该类解码器，能处理未覆盖的变体
  - cmd: nm {{binary}} | rustfilt
    note: 另一种语言的修饰名需要专门解码器，混编产物里两种都要试
  procedure:
  - 先用 nm -C 出一遍，多数工具链自带解码能力，看能还原多少、哪些仍是原始修饰名。
  - 对没解出来的变体用 nm 管道接 c++filt 过一遍解码器，覆盖内置未支持的规则。
  - 混编产物再跑一遍接 rustfilt 的版本，另一种语言的修饰名需要专门解码器。
  - 检查缺前缀或长度字段与实际不符的条目，这类是截断，直接标为不可解，不要强行还原。
  - 把还原后的签名与调用点交叉核对，模板实例会展开成多个变体，按签名而非名字去重。
  - 若符号表整体为空说明被 strip，转到靠运行时元数据表的路线，别在本条上继续投入。
  pitfalls:
  - 修饰名被截断成前缀后无法唯一反解，强行还原会得到错误签名
  - 不同编译器对同一符号生成的修饰名不同，按格式判定语言并不可靠
  - 模板实例展开后名字极长，可读性提升不代表找到了对应源码
  - 混淆器会生成形似修饰名的假名字，看起来像合法命名但并不符合规则
- id: tech:go-symbol-recovery
  name: Go 产物符号与结构还原
  name_en: Go Artifact Symbol Recovery
  domain:
  - dom:re-lang
  parent: dom:re-lang
  def: 利用运行时元数据表恢复函数名、类型信息与包路径，重建调用关系。难点是符号被剥离后元数据仍在，但要按运行时版本定位其结构。
  detail: 场景是已判定为 Go 产物后要恢复函数名、包路径与调用关系，尤其是符号被剥离或程序被加壳后仍想拿到结构；也用于快速读依赖模块与构建模式。与符号修饰还原的区别是那条解码编译器压平的修饰名，这条靠语言运行时自己留下的表；与 Rust 产物识别的区别是剥离后两者残留量级不同，这边保留的可执行元数据多得多。注意点：各版本元数据表布局不同且重构过，解析器必须按版本选；泛型实例化后名字带类型参数修饰；插件与多模块产物会带多份模块表。
  principle: Go 运行时自己在依赖这些信息：调度、垃圾回收与取调用栈都要在任意时刻从返回地址反查「属于哪个函数、源码第几行」，于是 gopclntab 保存了地址到函数与行号的映射，函数名直接内联在表里，模块表再把各段串起来。这两张表只有运行时能生成，删掉它们崩溃回溯与异常处理就全废，所以常见剥离只去掉符号表与调试信息，不会动它们。剥离后名字仍在，按版本知道表结构就能整批恢复。它比 C/C++ 好办的原因也在这里：语言运行时强制保留了自己的符号体系，而这不是可选项。
  difficulty: 3
  prerequisites:
  - tech:binary-triage-metadata
  artifacts:
  - art:elf64
  - art:pe64
  - art:mach-o
  outputs:
  - 恢复的函数名与包路径清单
  - 类型与方法信息
  - 运行时版本判定
  - 调用关系草图
  cost: low
  false_positive_risk: low
  commands:
  - cmd: go version -m {{binary}}
    note: 直接读出构建信息与依赖模块，是最省力也最可靠的入口
  - cmd: go tool nm {{binary}} | head -50
    note: 符号表即使被处理过也可能有残留，先确认还有没有名字
  - cmd: strings -a {{binary}} | grep -E "^go1\.[0-9]+" | head
    note: 版本字符串决定元数据布局，版本不同表结构不同
  procedure:
  - 先用 go version -m 读构建信息，拿到版本、依赖模块与构建参数，这一步不依赖符号表。
  - 再用 strings -a 定位版本串，确认元数据布局该用哪一套解析规则。
  - 接着用 go tool nm 看符号表还有没有名字残留，有就直接用，别过度加工。
  - 符号为空时按已判定的版本找 gopclntab，用对应版本的解析器整批导出函数名与行号映射。
  - 泛型与闭包产生的名字带类型参数与后缀修饰，按包路径前缀归并，别做完整名字精确匹配。
  - 用恢复出的函数名与字符串里的恐慌信息、模块路径交叉验证，最后画调用关系草图。
  pitfalls:
  - 这类产物通常不剥离符号，一旦剥离常连带删掉元数据，只能靠特征串恢复
  - 版本差异导致元数据布局不同，用错版本的解析器会读出乱码名字
  - 泛型实例化后函数名带类型参数修饰，直接按包名检索容易漏
  - 内联与闭包改写会让符号对应的函数体与源码形态差异较大
- id: tech:rust-artifact-identification
  name: Rust 产物识别与符号还原
  name_en: Rust Artifact Identification
  domain:
  - dom:re-lang
  parent: dom:re-lang
  def: 从恐慌字符串、修饰名与内存布局特征确认语言产物并还原符号。难点是默认发布构建剥离符号且大量内联，可用的语言特征只剩间接痕迹。
  detail: 场景是在没有符号的裸产物上判断是否为 Rust 编译、发布还是调试构建、用了哪些依赖，并尽量还原模块路径；也用于解释「为什么这个产物几乎没有可读名字」。与符号修饰还原的区别是那条假定符号完整、只做解码，这条先解决符号几乎不存在时的判断；与 Go 产物符号还原的区别是那边有运行时必需的元数据表，Rust 没有等价物。注意点：发布构建大量内联且常整片剥离符号，判语言只能给概率结论；静态链接 C 运行库后底层特征与 C 产物重合；部分构建配置下恐慌信息与构建路径也会被裁掉。
  principle: Rust 的泛型在编译期单态化：每个具体类型组合各生成一份机器码，为了链接名唯一，编译器把模块路径、泛型实参与 trait 信息一起修饰进符号。但名字不在运行期被消费——没有虚机，栈展开靠恐慌机制与展开表，符号只用于打印回溯，所以整片剥离不影响执行。剩下的证据都是产出物而非运行时必需：恐慌格式化字符串把源文件路径与行号写死成字面量嵌在只读数据里供原样打印，构建期的依赖路径被写进产物，单态化又留下大量重复的实例代码形状。三者都稀疏，因此结论只能是概率的。
  difficulty: 4
  prerequisites:
  - tech:binary-triage-metadata
  - tech:symbol-demangling
  artifacts:
  - art:elf64
  - art:pe64
  - art:mach-o
  outputs:
  - 语言与构建模式判定
  - 还原的函数路径与模块名
  - 依赖库推断
  - 不可恢复区域说明
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: strings -a {{binary}} | grep -Ei "panicked at|cargo/registry|rustc" | head
    note: 恐慌信息与构建路径是最常见的语言指纹
  - cmd: nm -C {{binary}} | head -50
    note: 带修饰名的符号可直接看出模块路径，未剥离时优先用这个
  - cmd: nm {{binary}} | rustfilt | head -50
    note: 用专用解码器还原修饰名，比手工解析可靠
  procedure:
  - 先用 strings -a 搜恐慌信息、依赖路径、编译器名三类串，命中任意一类才继续按 Rust 处理。
  - 用 nm -C 看符号表还在不在，未剥离时优先靠它直接读模块路径，跳过指纹推断。
  - 符号被剥时用 nm 管道接 rustfilt 处理残余修饰名，比手工解析可靠。
  - 按恐慌串里的源文件路径还原模块划分，能定位到 crate 一级，别指望还原函数边界。
  - 核对恐慌串、依赖路径与内联后的代码形状三者是否一致，一致再判语言，单项命中只算线索。
  - 结论按概率表述并标注不可恢复区域：泛型实例与内联代码没有任何名字可依。
  pitfalls:
  - 两类语言的修饰名形态不同但都可被截断，符号残缺时无法反解
  - 剥离符号后差异只剩恐慌路径与展开结构，结论只能是概率判断
  - 泛型与迭代器链会展开成巨量内联代码，函数级边界极难划定
  - 静态链接 C 运行库后无法按依赖区分语言，别把运行库特征算成语言特征
- id: tech:e-language-recovery
  name: 易语言产物还原
  name_en: E-Language Artifact Recovery
  domain:
  - dom:re-lang
  parent: dom:re-lang
  def: 识别国内某类中文编程语言的编译产物，还原其运行库依赖与特有调用形态。难点是公开资料少且编译特征弱，多数判断依赖字符串与库调用模式。
  detail: 场景是遇到国内中文编程语言的 PE 产物，要确认语言、列出支持库依赖、还原关键子程序；也用于这类语言之间的差异判定。与符号修饰还原的区别是它的名字不走标准修饰规则，现成解码器无从下手；与脚本产物字节码还原的区别是它编译成原生 PE，不是解释器宿主加字节码。注意点：字符串以宽字符为主，只跑单字节提取会漏掉大半内容；加壳后支持库名被加密，看不到名字不能反证不是该语言；国内同类语言特征相近，判定必须多项证据叠加。
  principle: 这类语言的编译器把「支持库」当作事实上的运行库：内建命令、窗口控件与常用算法都在支持库模块里，编译产物自己只留调度代码和对支持库的导入。所以判断语言与其看代码形态，不如看导入了哪些库——代码段与普通原生程序本就无异。同时它的字面量习惯按宽字符存放，编译器把常量以宽字符编码写进 PE，单字节扫描只能看到散落的 ASCII 碎片。这两点解释了它为什么既难判又容易被误判：特征几乎全在数据与导入表里，而同一个支持库也可以被其他工具链调用，导入关系不是专属指纹。
  difficulty: 4
  prerequisites:
  - tech:binary-triage-metadata
  artifacts:
  - art:pe32
  - art:pe64
  outputs:
  - 产物判定依据
  - 依赖的支持库清单
  - 关键子程序与调用关系
  - 不确定项说明
  cost: medium
  false_positive_risk: high
  commands:
  - cmd: strings -el {{binary}} | head -60
    note: 该语言的字符串多为宽字符编码，用宽字符模式提取才看得到
  - cmd: rabin2 -zz {{binary}} | grep -Ei "krnln|fnr|e\.lib" | head
    note: 支持库名与扩展库文件名是最强的判定依据
  - cmd: objdump -d --no-show-raw-insn {{binary}} | grep -c "call"
    note: 粗看调用密度；大量经运行时库转发时调用形态偏单一
  procedure:
  - 先用 strings -el 按宽字符模式提取，可读文本量通常远高于单字节提取，先建立全貌。
  - 再用 rabin2 -zz 全量扫字符串并筛支持库名，这类库名是最强的判定依据。
  - 用 objdump -d 统计调用数量与形态，调用密度偏单一说明大量经运行时库转发，与该语言形态吻合。
  - 把导入表与支持库清单对齐，没导入支持库却形似该语言产物，要怀疑是伪装或被加壳。
  - 加壳场景先脱壳再重复上一步，壳内看不到库名不能作为否证。
  - 结论写成多条证据的加权判断，并明确列出不确定项，不要给单一结论。
  pitfalls:
  - 宽字符与单字节字符串混杂，只用单字节提取会漏掉大部分可读信息
  - 加保护后支持库名会被加密，静态看不到名字不代表不是该语言产物
  - 国内同类语言产物特征相近，仅凭字符串判定容易误判
  - 该语言调用惯例与常见约定不同，按标准约定还原参数会整体错位
- id: tech:managed-native-interop-mapping
  name: 托管原生互操作映射
  name_en: Managed-Native Interop Mapping
  domain:
  - dom:re-lang
  parent: dom:re-lang
  def: 还原托管层与原生层的边界：声明、导出绑定与数据封送方式。难点是边界处类型被双向转换，参数形态在两侧并不一致。
  detail: 场景是逻辑在托管层、危险操作落到原生层，需要把两侧绑定关系与封送方式对上；也用于移动侧判断原生库注册了哪些托管方法。与托管元数据还原的区别是那条在托管层内部读逻辑，这条专门处理跨层边界；与符号修饰还原的区别是那条处理单侧名字，这里要做两侧对照。注意点：动态注册的绑定不出现在导出表里，只能搜注册调用；封送会改参数宽度与生命周期，两侧签名不能逐字对照；同一导出可被多个托管声明共用，绑定不是一对一。
  principle: 跨语言调用不能直接发生：托管运行时的类型系统与原生 ABI 的内存模型不一致，所以绑定必须先被声明出来，运行时再按声明在调用点插入转换桩或完成注册。这给两侧各留了一个稳定锚点：托管侧必然有声明元数据，写明目标库、入口名、字符集与封送约定；原生侧必然有对应的导出或被注册的目标。于是还原只看「声明与实现是否成对」，不必先懂两侧逻辑。它失效的场景同样明确：绑定在运行期才注册时声明为空，名字被抹改时导出对不上号，此时只能从注册函数的参数反推。
  difficulty: 3
  prerequisites:
  - tech:dotnet-metadata-recovery
  artifacts:
  - art:pe-dotnet
  - art:so
  - art:dex
  - art:apk
  outputs:
  - 托管到原生的绑定表
  - 封送类型与宽度对照
  - 原生侧实现入口清单
  - 边界处的数据转换说明
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: monodis --method {{binary}} | grep -i "pinvokeimpl"
    note: 外部调用声明会带标记，直接给出目标原生函数名
  - cmd: rabin2 -i {{apk}}
    note: 移动侧先看原生库与导入，绑定注册在原生库导出里能找到线索
  - cmd: nm -D {{binary}}
    note: 原生库侧看导出名，与托管侧声明对齐
  procedure:
  - 先用 monodis --method 筛出外部调用声明，把目标库名、入口名与封送约定列成表。
  - 移动侧改用 rabin2 -i 看原生库的导入导出，定位绑定注册落在哪个原生库里。
  - 用 nm -D 在原生库侧拉导出名单，与托管侧声明的入口名对齐，先覆盖静态绑定那一部分。
  - 对不上号又确认存在调用的条目按动态注册处理，搜注册函数的调用点而不是找导出名。
  - 抽一两个关键调用点核对封送：参数宽度、字符集与谁负责释放，按实际转换而非声明字面判断。
  - 同名导出被多个声明共用时按调用点区分，不要建立一对一映射。
  pitfalls:
  - 动态注册的绑定方法不出现在导出表里，只能搜注册函数调用
  - 封送会改变参数宽度与生命周期，两侧签名不能直接对照
  - 同名导出可能被多个托管声明共用，绑定关系不是一对一
  - 混淆后原生方法名被抹改，按名字匹配会全部落空
- id: tech:interpreter-bytecode-recovery
  name: 脚本产物字节码还原
  name_en: Script Artifact Bytecode Recovery
  domain:
  - dom:re-lang
  parent: dom:re-lang
  def: 从打包后的解释器程序中提取业务字节码并还原到源码级可读形态。难点是解释器可能被定制或加密，标准反编译工具对不上版本。
  detail: 场景是打包成单文件可执行的脚本程序，要把业务字节码取出来还原到源码级逻辑；也用于确认内嵌解释器与版本。与直接分析脚本源码的区别是这里先要解决「程序在哪」；与原生脱壳的区别是脱的不是通用压缩壳，而是打包器自己的归档格式。注意点：打包器与提取工具必须版本匹配，否则取出的字节码不能反编译；字节码可能被二次加密，提取成功不等于能反编译；单文件把依赖一起塞进去，按签名猜边界容易切坏。
  principle: 这类打包器不编译业务代码，而是三件事拼起来：一个用原生语言写的启动器当宿主，真正的解释器连字节码与依赖按它自己的归档格式追加在宿主末尾。程序要跑起来，宿主启动时必须定位并解包这段归档，所以归档魔数与目录索引一定留在文件里、结构可预测——这是它抹不掉的自证，PYZ 与 MEI 一类标记就属此类。因此提取走「按格式解析」而不是「按字节猜边界」，格式对上就是精确切分。但字节码到源码还隔着反编译一层：解释器版本变了字节码版本也变，指令集被定制过的解释器会让标准反编译器静默产出错误指令。
  difficulty: 4
  prerequisites:
  - tech:binary-triage-metadata
  artifacts:
  - art:script
  - art:elf64
  - art:pe64
  - art:document
  outputs:
  - 提取出的字节码或脚本片段
  - 解释器与版本判定
  - 还原后的源码级逻辑
  - 版本不匹配点说明
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: strings -a {{binary}} | grep -Ei "python|PyInstaller|lua|autoit" | head
    note: 先确认内嵌的是哪种解释器及其版本线索
  - cmd: binwalk {{binary}}
    note: 按签名切出内嵌归档或压缩段，再单独处理
  - cmd: python3 -c "import sys;d=open(sys.argv[1],\"rb\").read();print(d.find(b\"PYZ\"),
      d.find(b\"MEI\"))" {{binary}}
    note: 定位打包产物的归档区偏移，是提取字节码的第一步
  procedure:
  - 先用 strings -a 搜 python、PyInstaller、lua、autoit 一类关键字，确认内嵌的是哪种解释器及其版本线索。
  - 用 binwalk 按签名看文件构成，确认宿主之后是否跟着归档或压缩段，记下候选偏移。
  - 用 python3 探 PYZ 与 MEI 标记的偏移，标记落在文件里说明是打包器归档，可按其结构解析。
  - 按归档格式先解析目录索引再逐条提取，条目之间会粘连，照签名给的边界切容易切坏。
  - 提取出的字节码先核对魔数与版本号，与第一步判定的解释器版本一致才进入反编译。
  - 反编译失败时区分两种原因：字节码被二次加密，还是定制解释器的指令集被改过。
  pitfalls:
  - 打包工具与提取工具版本必须匹配，版本不符时提取出的字节码无法反编译
  - 字节码可能被二次加密，提取成功不等于能反编译
  - 单文件打包会把依赖一起塞进去，切分边界靠签名猜容易切坏
  - 定制解释器的指令集被改过，标准反编译器会静默输出错误指令
