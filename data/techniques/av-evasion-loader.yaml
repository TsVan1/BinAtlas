# BinAtlas 知识库 · 技术 · dom:av-evasion-loader
# 规范：03-DATA-SCHEMA.md §2.2

- id: tech:reflective-module-loading
  name: 反射式模块加载
  name_en: Reflective Module Loading
  domain:
  - dom:av-evasion-loader
  parent: dom:av-evasion-loader
  def: 在进程内手工完成映像映射、重定位与导入解析，使模块不经过系统加载器也不在文件系统留痕。难点是 TLS 回调、异常表与控制流保护注册都要手工补齐，缺一项即崩。
  detail: 场景是需要让模块不经过系统加载器、也不在文件系统落盘就能运行，从而不在模块表与磁盘留痕时使用；也用于把已加密或已改形的映像直接在内存还原。与跨进程执行的区别是那只解决「在哪个进程跑」，这条解决「怎么把完整映像装进来」；与模块映像覆盖的区别是后者借用已加载模块，这里凭空映射一个新映像。注意点：TLS
    回调、异常表与异常处理注册都要手工补齐，缺一项就是崩溃；异常目录缺失时任何异常都会直接终止进程；映像不在模块链表里这件事本身就是强异常。
  principle: 系统加载器的职责是把文件变成可执行映像：按节对齐映射、应用重定位、解析导入、注册异常表与 TLS、最后登记进模块链表。反射加载把这套流程搬进进程内自己实现，于是内存布局与加载器产出几乎一致，却绕过了登记环节——文件没落盘，模块链表里也没有它。有效性来自「检测依赖加载器留下的产物」：路径、文件句柄与模块表项都由加载器创建，手工映射不产生这些。但同一份布局也暴露它：有完整
    PE 结构却不属于任何模块，正是扫描器要找的形状。
  difficulty: 5
  prerequisites:
  - tech:pe-section-reshape
  - tech:import-table-concealment
  artifacts:
  - art:pe32
  - art:pe64
  - art:shellcode
  - art:memory-dump
  outputs:
  - 内存映像的段布局与基址
  - 重定位与导入解析完成度
  - 与系统加载结果的差异清单
  cost: high
  false_positive_risk: low
  commands:
  - cmd: dumpbin /headers {{binary}}
    note: 先确认映像的节对齐、重定位目录与异常目录是否齐全，缺目录的手法必须另行处理。
  - cmd: pe-sieve64.exe /pid {{pid}}
    note: 扫进程里不在模块链表中却有 PE 头的内存，反射加载的痕迹通常在这里被标出。
  - cmd: procdump -ma {{pid}} {{out}}
    note: 抓全量转储，用于离线复核映像基址、节布局与是否残留磁盘路径。
  procedure:
  - 先用 dumpbin /headers 读节对齐、重定位目录与异常目录，确认映像结构是否齐全。
  - 缺重定位目录的先决定按固定基址处理，缺异常目录的先补上，否则后续必崩。
  - 在内存中按节对齐映射各节，再从模块自身取得基址，完成重定位。
  - 逐个解析导入与延迟导入并把地址填进导入表，再从入口开始补 TLS 与异常表。
  - 用 pe-sieve64.exe /pid 扫一遍，确认「有 PE 头却不在模块链表」的区域是否被标出。
  - 用 procdump 抓全量转储，离线复核基址、节布局与是否残留磁盘路径。
  - 最后走一次异常路径，确认异常表已生效，再决定是否扩大功能范围。
  pitfalls:
  - 未注册异常表时任何 C++ 异常都会直接终止进程，表现在首次出错就无栈退出。
  - 忽略 TLS 回调会漏掉初始化，功能在少数路径上失效且极难定位。
  - 系统维护的模块链表里没有这个映像，这件事本身就是强异常信号。
- id: tech:position-independent-stub
  name: 位置无关执行桩
  name_en: Position-Independent Stub
  domain:
  - dom:av-evasion-loader
  parent: dom:av-evasion-loader
  def: 把载荷组织成不含绝对地址与导入表的机器码，由桩自行定位所需系统函数。难点是每种架构的指令编码与调用约定都要单独处理，且桩必须自己解决内存可执行权限。
  detail: 场景是需要一段不含绝对地址、不依赖导入表的机器码，落到任意地址都能执行时使用；也用于把载荷转成可嵌入其他宿主的形式。与反射加载的区别是那个加载的仍是完整映像、保留
    PE 结构，这里是没有头部、只靠自身寻址的裸代码；与网络分阶段加载的区别是那只解决分阶段取回，不解决代码形态。注意点：反汇编裸机器码必须显式给出架构与输入格式，否则指令边界全错；桩必须自己解决内存可执行权限；各架构没有等价指令，同一逻辑在别的架构上要重写而不是改寄存器名。
  principle: 位置无关代码的前提是不在指令里写死地址：跳转用相对位移，数据访问要么相对寻址、要么运行时先算出自身位置再按偏移取。这样同一份机器码映射到任何基址都能正确执行，重定位这一环被整个省掉。导入表本质是一份地址清单，位置无关代码不申请清单，改为运行时自行定位所需函数——把地址获取从加载期推迟到执行期。有效性来自「没有可被改写的地址」：没有重定位项、没有导入项，静态判据直接少两个输入面。
  difficulty: 3
  prerequisites:
  - tech:compiler-artifact-shaping
  artifacts:
  - art:shellcode
  - art:pe32
  - art:pe64
  outputs:
  - 无重定位的机器码段
  - 桩与载荷的寄存器与栈约定
  - 各架构下的等价实现清单
  cost: medium
  false_positive_risk: low
  commands:
  - cmd: objdump -D -b binary -m i386:x86-64 {{payload}}
    note: 反汇编裸机器码必须显式指定架构与输入格式，否则地址与指令边界全部错位。
  - cmd: xxd -l 64 {{payload}}
    note: 看开头几十字节，确认没有残留的绝对地址或调用约定外的前置字节。
  procedure:
  - 先用 xxd 看开头几十字节，确认没有残留绝对地址或多余的前置字节。
  - 用 objdump 显式指定架构与裸二进制格式反汇编，拿到可信的指令边界。
  - 检查反汇编里是否还有绝对寻址的跳转，逐处改成相对位移或运行时计算。
  - 把地址获取改为运行时自行定位，先只取一个函数验证调用约定，再逐步扩展。
  - 确认桩在内存里自行完成权限切换，并且能执行到载荷的第一条指令。
  - 把同一份字节换一个基址重放，确认没有依赖固定地址的行为。
  - 换架构时重写实现并重跑反汇编核对，不要靠改寄存器名移植。
  pitfalls:
  - 反汇编裸机器码不指定架构就得不到可信的指令边界，读出来的全是错的。
  - 桩与载荷之间的寄存器状态没约定清楚，参数会在第一跳就丢失。
  - 各架构没有等价指令，同一份逻辑在 ARM64 上需要完全重写而不是改寄存器名。
- id: tech:network-stage-fetch
  name: 网络分阶段加载
  name_en: Network Staged Loading
  domain:
  - dom:av-evasion-loader
  parent: dom:av-evasion-loader
  def: 磁盘上只保留体积极小、功能单一的引导器，主体在运行时经网络取回并直接在内存执行。难点是网络取回与内存执行叠加后遥测密度骤增，域名与流量特征也是最先被拦的一环。
  detail: 场景是需要让磁盘上的落地文件体积极小、功能单一，主体在运行时才取回并直接在内存执行时使用；也用于把静态检测面压到最小。与资源承载载荷的区别是那个把载荷留在本地文件里，体积与熵都还在静态面上，这条把主体移出文件；与加密驻留的区别是那只改变内容形态，不改变交付方式。注意点：网络取回与内存执行叠加后遥测密度骤增；域名信誉往往就是首跳阻断点，新注册域名本身已足够可疑；短会话加大体积下载的组合非常突出；TLS
    指纹与系统默认客户端不一致时，不解密也能被识别。
  principle: 静态检测的输入是文件本身，文件里没有载荷就没有可匹配的特征面，体积与熵也回到同类文件的区间——这是把检测面从磁盘推到运行时的核心收益。代价整体转移到网络：取回动作必然产生一次外联，而外联在遥测里是低噪声高信号的类别，域名信誉、流量形态与
    TLS 客户端指纹都是不解密就能取到的判据。所以这不是变得更隐蔽，而是把证据从「看得见的内容」换成「看得见的连接」，后者只是需要更多上下文才能定性。
  difficulty: 3
  prerequisites:
  - tech:position-independent-stub
  artifacts:
  - art:shellcode
  - art:pcap
  - art:pe32
  outputs:
  - 分阶段边界与各阶段体积
  - 外联时序与流量特征
  - 首跳失败时的降级路径
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: tshark -r {{out}} -Y "http.request"
    note: 从抓包里过滤出 HTTP 请求，核对取回阶段的时序、Host 与请求路径特征。
  - cmd: tshark -r {{out}} -T fields -e ip.dst -e tcp.dstport
    note: 只导出目的地址与端口，快速看连接分布是否存在明显的单点集中。
  procedure:
  - 先定分阶段边界：落地文件只保留取回与加载所需的最小逻辑，其余移到远端。
  - 用 tshark 过滤 http.request，核对取回阶段的时序、Host 与请求路径是否自然。
  - 用 tshark 只导目的地址与端口，看连接是否集中在单一目的地。
  - 若明显集中，先把取回拆成多次并分散目的地，再重抓一次看分布。
  - 确认首跳失败时的降级路径确实可用，不要在无网络环境下直接崩掉。
  - 复测流量形态，短会话加一次性大体积下载的组合要尽量避免。
  - 对照系统默认客户端的 TLS 指纹，确认不会被直接识别成异常客户端。
  pitfalls:
  - 首次外联的域名信誉往往就是阻断点，域名新注册本身已足够可疑。
  - 短会话加大体积下载的组合非常突出，正常软件很少这样拉取内容。
  - TLS 指纹与系统默认客户端不一致时，不解密也能被识别出异常。
- id: tech:cross-process-execution
  name: 跨进程执行
  name_en: Cross-Process Execution
  domain:
  - dom:av-evasion-loader
  parent: dom:av-evasion-loader
  def: 借助系统提供的跨进程内存操作与执行机制，让载荷在另一个进程的上下文里运行。难点是每一步都对应明确的遥测事件（进程句柄、内存写入、线程或回调创建），组合即被检出。
  detail: 场景是需要让载荷在另一个进程的上下文里运行、借用目标进程的权限或网络身份时使用；也用于评估整条流程里每一步各自留下什么记录。与回调机制执行的区别是那条讲选哪种触发器，这条讲「拿句柄、写内存、让它执行」整套流程；与模块映像覆盖的区别是后者改写已有模块，这里写入的是新申请的内存。注意点：完整性级别限制使低权限进程写不进高权限进程，选错目标直接失败；目标进程架构必须一致，跨位数会在首条指令就崩；被写入进程异常退出会把载荷一并带走。
  principle: 跨进程执行不是单一动作，而是一串各自有埋点的操作：打开目标进程、分配内存、写入内容、改变权限、让目标执行。每一步都在进程边界处被系统记录，所以即使最后那步换了形式，前面的边界事件仍然存在——这就是「组合即被检出」的原因。收益来自上下文：载荷继承目标进程的权限、令牌与网络身份，行为归因指向目标进程而不是加载器。代价是要额外处理完整性级别与位数匹配，并且把载荷生命周期绑在别人的进程上。
  difficulty: 4
  prerequisites:
  - tech:reflective-module-loading
  artifacts:
  - art:pe32
  - art:pe64
  - art:memory-dump
  outputs:
  - 目标进程选择依据
  - 每一步对应的遥测事件
  - 失败点与回滚路径
  cost: medium
  false_positive_risk: low
  commands:
  - cmd: wevtutil qe Microsoft-Windows-Sysmon/Operational /q:"*[System[(EventID=10)]]"
      /c:20 /rd:true /f:text
    note: 查进程句柄访问事件，拿到目标进程这一步就有记录，是最先暴露的环节。
  - cmd: pe-sieve64.exe /pid {{pid}}
    note: 扫目标进程里不属于任何磁盘模块的可执行内存，判断载荷是否已落进去。
  procedure:
  - 先按目标进程的权限与位数筛候选，确认能打开且架构一致，再往下走。
  - 用 wevtutil 拉进程句柄访问事件，确认「打开进程」这一步已被记录，作为基线。
  - 在目标进程内申请内存并写入载荷，写入完成之前不要动执行那一步。
  - 分步设置内存权限，避免一次就给出可写可执行的组合。
  - 在目标进程内触发执行，用 pe-sieve64.exe /pid 扫，确认载荷落在非模块内存里。
  - 复核失败点：句柄打不开多是完整性级别，执行即崩多是位数不一致。
  - 记录载荷与目标进程的绑定关系，确认目标退出时不会带出未处理的崩溃。
  pitfalls:
  - 完整性级别限制使低权限进程无法写入高权限进程，选错目标直接失败。
  - 目标进程架构必须一致，32 位载荷进 64 位进程会在首条指令就崩。
  - 被写入进程异常退出会把载荷一并带走，持久性远低于直觉。
- id: tech:module-hollowing
  name: 模块映像覆盖
  name_en: Module Image Overwrite
  domain:
  - dom:av-evasion-loader
  parent: dom:av-evasion-loader
  def: 借一个已加载的合法模块占位，再改写其内存映像，使模块列表与实际内容不一致。难点是内存与磁盘映像的哈希比对足以发现，且原始入口被覆盖后进程稳定性很差。
  detail: 场景是需要一个在模块列表里看起来合法、实际内容已被替换的执行位置时使用；也用于把载荷藏在某个已加载模块的名义下。与反射加载的区别是那个凭空映射、不在模块表里，这里借用现成的模块表项，模块看起来正常；与跨进程执行的区别是这里改写的是已有映像，不是新申请的内存。注意点：内存副本与磁盘副本不一致是首要检测点，任何覆盖都逃不过这一比；覆盖后重定位与导入仍指向原模块，调用外部函数会直接崩；模块卸载或进程退出时的清理会触碰被改写的数据，表现为退出即崩。
  principle: 模块表记录的只是「这个模块从这里加载、占这么大」，它不保证内存里的字节仍是文件里的字节，于是留下一个缺口：表项合法而内容可被替换。覆盖的做法是借一个已加载模块的地址空间占位，把它的映像区段改写成载荷，执行时以原模块的名义进入。有效性依赖「检测以模块表为准」：只看表项与路径，看到的就是一个正常模块。但这个缺口有确定的堵法——把内存页与磁盘文件逐段比对，一致性检查一开，覆盖立刻显形。
  difficulty: 4
  prerequisites:
  - tech:cross-process-execution
  - tech:reflective-module-loading
  artifacts:
  - art:pe32
  - art:pe64
  - art:memory-dump
  outputs:
  - 被覆盖模块与原始哈希
  - 内存与磁盘映像的差异区段
  - 稳定性与清理行为记录
  cost: high
  false_positive_risk: low
  commands:
  - cmd: pe-sieve64.exe /pid {{pid}}
    note: 重点看「模块映像与磁盘不一致」这一类结果，覆盖手法在这里最难藏。
  - cmd: Get-FileHash -Algorithm SHA256 {{binary}}
    note: 磁盘副本哈希；与内存中同名模块比对，不一致就是覆盖的直接证据。
  - cmd: procdump -ma {{pid}} {{out}}
    note: 抓转储后离线比对节内容，定位被改写的是代码段还是仅改了入口。
  procedure:
  - 先选一个已加载、体积足够且不关键的模块作为占位目标，记下它的磁盘路径。
  - 用 Get-FileHash 记下该模块磁盘副本的哈希，作为一致性比对的基准。
  - 把载荷写入目标模块的映像区段，尽量保持原有节布局与页权限。
  - 修正入口与必要的重定位，确认调用外部函数时仍指向原模块的导入。
  - 用 pe-sieve64.exe /pid 扫，重点看「模块映像与磁盘不一致」这一类结果。
  - 用 procdump 抓转储离线比对节内容，确认被改的是代码段还是仅改了入口。
  - 走一次正常退出流程，确认清理阶段不会触碰被改写的数据而崩溃。
  pitfalls:
  - 内存副本与磁盘副本不一致是首要检测点，任何覆盖都逃不掉这一比。
  - 覆盖后重定位与导入仍指向原模块，调用外部函数会直接崩。
  - 模块被卸载或进程退出时的清理流程会触碰已被改写的数据，表现为退出即崩。
- id: tech:encrypted-payload-residency
  name: 加密载荷驻留
  name_en: Encrypted Payload Residency
  domain:
  - dom:av-evasion-loader
  parent: dom:av-evasion-loader
  def: 让载荷在磁盘与内存中长期保持加密态，只在执行前的短窗口内解密，缩小可被内存扫描捕获的时间。难点是解密瞬间的明文页与解密循环仍是确定性证据，密钥分发也要单独解决。
  detail: 场景是载荷在磁盘与内存中长期保持加密态、只在执行前短窗口内解密，用来缩小被扫描到的窗口时使用；也用于降低静态与内存扫描的命中面。与资源承载载荷的区别是那个只改变位置，内容仍明文，体积与熵的异常直接可见；与内存权限时序控制的区别是那条改属性时序，这条改内容的可见性。注意点：解密后必须落到可执行页，页属性与内存来源同时暴露；转储里出现的明文会永久留痕，一次误转储等于全程曝光；密钥硬编码在文件里等于把加密降级成编码，静态一眼可还原。
  principle: 扫描器能匹配的前提是读到明文——静态扫描读文件，内存扫描读进程页，两者都要求内容处于可识别形态。让载荷长期保持加密态，就把可匹配的时间窗压到解密到执行之间那一小段；窗口越短，按周期采样的扫描越难落在里面。有效性来自采样是离散而非连续的。但边界同样明确：解密后必须变成可执行页才能跑，而「可执行私有页」本身就是扫描目标，不依赖内容；解密循环与密钥同样在进程里，静态上仍是确定性代码。
  difficulty: 4
  prerequisites:
  - tech:self-decrypting-stub
  artifacts:
  - art:shellcode
  - art:memory-dump
  - art:pe32
  outputs:
  - 加密态与明文态的驻留时长
  - 内存中明文页的可捕获窗口
  - 密钥来源与更新方式
  cost: high
  false_positive_risk: medium
  commands:
  - cmd: procdump -ma {{pid}} {{out}}
    note: 抓转储，复核解密窗口内是否有明文页留在内存里。
  - cmd: vol -f {{out}} windows.malfind
    note: 从转储反查可执行私有页，解密产物最终一定会落成这样的页。
  - cmd: strings -n 8 {{out}}
    note: 在转储里找明文特征串，判断解密后的内容是否已写入可被转储的区域。
  procedure:
  - 先把载荷加密存放，确认静态扫描拿不到明文，并记下文件体积与熵的正常区间。
  - 设计解密时机：只在执行前解密，解密范围尽量小，解完立刻转入执行。
  - 用 procdump 抓转储，确认解密窗口之外的内存里没有残留明文页。
  - 用 vol 的 malfind 从转储反查可执行私有页，判断解密产物是否已落成这样的页。
  - 用 strings 在转储里找明文特征串，确认解密内容没有写进可被转储的区域。
  - 若明文仍可捕获，缩短解密到执行之间的窗口后重测，对比两次结果。
  - 检查密钥来源，硬编码即视为失败，需改为外部提供并确认可以更新。
  pitfalls:
  - 解密后必须落到可执行页，页属性与内存来源同时暴露，缩短窗口不等于消除证据。
  - 内存转储里出现的明文会永久留痕，一次误转储就等于全程曝光。
  - 密钥硬编码在文件里，等于把加密降级成编码，静态一眼可还原。
- id: tech:resource-payload-carrier
  name: 资源承载载荷
  name_en: Resource Payload Carrier
  domain:
  - dom:av-evasion-loader
  parent: dom:av-evasion-loader
  def: 把载荷作为资源或附加数据嵌入宿主文件，加载器运行时自行读取并还原。难点是资源目录的结构完整性必须保证，体积与熵的异常也会直接触发静态判定。
  detail: 场景是需要把载荷塞进一个外观正常的宿主文件、又不新增节区时使用，资源目录与文件尾部附加数据是两种常见去处。与网络分阶段加载的区别是那个把主体移出文件，这里仍留在文件里；与节区重构的区别是这里不动节表结构，只改资源目录或尾部数据。注意点：资源段体积异常与高熵比明文载荷更显眼，藏得越整齐越容易被统计规则挑出；附加数据挂在文件尾部，改动任何更靠前的头部偏移都可能让它失效；资源目录被改坏后文件照常启动，取载荷时却静默失败，排查方向极易跑偏。
  principle: 宿主文件本来就有可容纳任意字节的位置：资源目录里的自定义类型，或文件末尾对齐之外的附加数据。系统加载器只按头部声明的偏移与大小映射文件，不校验这段内容的语义，所以载荷可以随正常文件一起过静态检查——不新增节区、导入表不变、入口点不动，静态判据的多数输入面保持原样。有效性来自「结构合法即可交付」。代价是体积与资源段熵会偏离同类文件的分布，而这两个统计量本身就在打分体系里。
  difficulty: 3
  prerequisites:
  - tech:pe-section-reshape
  artifacts:
  - art:pe32
  - art:pe64
  - art:document
  outputs:
  - 资源目录结构与载荷位置
  - 文件体积与熵的异常评估
  - 读取失败时的降级行为
  cost: low
  false_positive_risk: medium
  commands:
  - cmd: wrestool -l {{binary}}
    note: 列资源树，确认载荷挂在哪个类型与 ID 下，以及资源目录是否仍然合法。
  - cmd: dumpbin /headers {{binary}}
    note: 核对资源目录的 RVA 与大小；改坏目录后文件仍能运行，但读取会静默失败。
  - cmd: python3 -c "import pefile; pe=pefile.PE('{{binary}}'); print(hex(pe.get_overlay_data_start_offset()))"
    note: 取附加数据起点；返回 0 或空说明没有尾部数据，载荷一定在资源里。
  procedure:
  - 先用 wrestool -l 列资源树，确认载荷挂在哪个类型与 ID 下，以及目录是否仍然合法。
  - 用 dumpbin /headers 核对资源目录的 RVA 与大小，确认偏移与大小自洽。
  - 用 python3 调 pefile 取附加数据起点，判断载荷在资源里还是在尾部；返回空说明没有尾部数据。
  - 按上一步结论选定去处，写入后重新核对资源目录与相关头部偏移是否仍自洽。
  - 重新列一次资源树并启动一次，确认宿主正常且取载荷不会静默失败。
  - 检查体积与熵是否已偏离同类文件，偏离就换更小的载荷或分摊到多处。
  - 若改过更靠前的头部偏移，重测尾部数据是否仍可定位，失效就回退该改动。
  pitfalls:
  - 资源段体积异常与高熵比明文载荷更显眼，藏得越整齐越容易被统计规则挑出。
  - 附加数据挂在文件尾部，改动任何更靠前的头部偏移都可能让它失效。
  - 资源目录被改坏后文件照常启动，但取载荷时静默失败，排查方向极易跑偏。
- id: tech:loader-failure-diagnostics
  name: 加载失败定位
  name_en: Loader Failure Diagnostics
  domain:
  - dom:av-evasion-loader
  parent: dom:av-evasion-loader
  def: 把内存执行失败定位到具体阶段：映射、重定位、导入解析、TLS 还是入口，再逐个复现排除。难点是失败常表现为无栈的直接崩溃，而附加调试器又会改变内存布局与时序。
  detail: 场景是内存执行失败、表现为无栈直接崩溃时，用来把失败定位到映射、重定位、导入解析、TLS 或入口这几个阶段之一；也用于确认某次失败是环境问题还是手法本身的问题。与遥测基线测量的区别是那个量「看得见什么」，这条答「为什么没跑起来」；其余加载类手法都靠这一步收尾。注意点：失败常表现为无栈崩溃，转储里没有任何调用栈；附加调试器会改变内存布局与时序，依赖时序的崩溃会消失；位数不匹配的转储用错调试器会得到误导性结论。
  principle: 内存执行的每个阶段都依赖前一阶段的产物，于是失败地址的归属就是阶段标签：落在未映射区间说明映射或重定位没做完，落在已映射但内容不对的位置说明导入或入口解析错了。无栈崩溃时没有调用关系可读，判定只能靠「这个地址属于哪个内存区」反推阶段。有效性来自地址空间本身带标签——属于哪个模块、是否已提交、什么权限，都是转储里可读的确定性信息。而调试器会改变布局与时序，所以对照必须来自不附加调试器的现场。
  difficulty: 3
  prerequisites:
  - tech:reflective-module-loading
  artifacts:
  - art:memory-dump
  - art:pe32
  - art:pe64
  outputs:
  - 失败阶段判定
  - 崩溃地址与所属内存区
  - 各阶段最小复现用例
  cost: medium
  false_positive_risk: low
  commands:
  - cmd: procdump -ma {{pid}} {{out}}
    note: 在无调试器附加的情况下抓崩溃现场，避免调试器把时序问题掩盖掉。
  - cmd: cdb -z {{out}} -c "!analyze -v; q"
    note: 直接分析转储给结论，重点看崩溃地址落在哪个模块或哪个未映射区间。
  - cmd: dumpbin /headers {{binary}}
    note: 回头核对映像头里的重定位与异常目录是否真的存在，很多失败源于目录为空。
  procedure:
  - 先在无调试器附加的情况下复现失败，用 procdump 抓崩溃现场，保住原始时序。
  - 用 cdb 直接分析转储，先看崩溃地址属于哪个模块或哪个未映射区间。
  - 按地址归属判断阶段：未映射指向映射与重定位，已映射但内容异常指向导入与入口。
  - 用 dumpbin /headers 回查映像头，确认重定位目录与异常目录确实存在且非空。
  - 对疑似阶段做最小复现：只做到该阶段为止，看是否仍崩，再逐步加回后续阶段。
  - 若加上调试器后崩溃消失，保留两份现场对照，按时序问题而不是逻辑错误处理。
  - 拿位数不匹配的转储时用对应版本的调试器打开，避免跨位数误判。
  pitfalls:
  - 崩溃地址落在未映射区间时转储里没有任何调用栈，只能靠内存区归属反推。
  - 调试器会让依赖时序的崩溃消失，必须保留一份不带调试器的对照。
  - 32 位与 64 位转储要用对应版本的调试器打开，混用会得到误导性结论。
