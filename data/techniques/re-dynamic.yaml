# BinAtlas 知识库 · 技术 · dom:re-dynamic
# 规范：03-DATA-SCHEMA.md §2.2

- id: tech:debugger-attach-and-breakpoint
  name: 调试器附加与断点布置
  name_en: Debugger Attach & Breakpoint Placement
  domain:
  - dom:re-dynamic
  parent: dom:re-dynamic
  def: 附加到目标进程并在关键位置暂停，观察寄存器与内存的真实状态。难点是附加行为本身可被探测，且断点改变时序会让依赖时间的逻辑走偏。
  detail: 场景是需要取一次运行中的真实状态：解密函数刚返回、校验分支即将判定、崩溃前一刻，或要给后续插桩与转储选定锚点。与运行时调用追踪的区别是这里只关心停下来看寄存器与内存，不记录调用序列；与内存扫描的区别是不主动搜数据，而是让程序自己走到目标点。注意点：附加依赖
    ptrace 配置与权限，容器与受限系统里常直接失败；附加时机越晚，早期初始化里的行为越拿不到；软件断点会改写代码字节，目标若在别处读自身代码就会露馅；暂停期间的时间类逻辑与实际运行有偏差。
  principle: 断点有效的机制是：调试器把目标地址的指令首字节换成陷阱指令，CPU 执行到该地址触发异常，内核把控制权交给调试器，调试器再临时还原原字节并单步执行一次。所以断点本质是改了一个字节加接管一次异常，两个动作都可被观测：代码段与磁盘副本比对能看出改写，异常与信号的时序也能被探测。硬件断点靠调试寄存器在取指时匹配地址，不写内存，但可用数量有限。附加本身通过跟踪接口挂到目标上，该状态对目标进程可见。
  difficulty: 2
  prerequisites:
  - tech:binary-triage-metadata
  artifacts:
  - art:pe64
  - art:elf64
  - art:mach-o
  - art:so
  outputs:
  - 可控的暂停点与执行流
  - 断点处的寄存器与栈快照
  - 附加痕迹与被检测风险说明
  - 关键分支的实测走向
  cost: low
  false_positive_risk: low
  commands:
  - cmd: gdb -q -p {{pid}}
    note: 附加到运行中的进程；部分系统需先放开 ptrace 限制或具备相应权限
  - cmd: gdb -q -batch -ex "info sharedlibrary" -ex "info registers" -p {{pid}}
    note: 非交互采集模块加载与寄存器快照，适合脚本化多次采样
  - cmd: lldb -p {{pid}} -o "thread backtrace all" -o "detach" -o "quit"
    note: Apple 平台侧等价操作；必须显式 detach，否则进程会一直停住
  procedure:
  - 用 gdb -q -p {{pid}} 附加到目标，先确认能正常停住；附加失败就查 ptrace 限制与权限，不要继续后续步骤。
  - 只读代码段上优先用硬件断点；必须用软件断点时先确认该页可写，否则断点根本设不上。
  - 停住后立刻用 info sharedlibrary 与 info registers 采样，把模块基址与寄存器一起记下，便于换算绝对地址。
  - 用 thread backtrace all 核对停在预期线程与预期调用链上，别让别的线程撞上同一个断点。
  - 采样完显式 detach 再退出，别把目标留在暂停状态被心跳或超时逻辑判死。
  - 每次只改一个断点位置重复采样，把行为差异归因到单一变量。
  pitfalls:
  - 附加会留下调试器痕迹，目标可据此改变行为而不是被拦住
  - 软件断点改写指令字节，基于校验和的完整性检查会发现它
  - 暂停时间过长会触发心跳与超时逻辑，看到的行为不是原程序的正常行为
  - 只读代码段写入软件断点可能失败，需改用硬件断点或先改页权限
- id: tech:runtime-api-tracing
  name: 运行时调用追踪
  name_en: Runtime API Tracing
  domain:
  - dom:re-dynamic
  parent: dom:re-dynamic
  def: 记录目标对系统与第三方库的调用序列，还原其真实交互面。难点是静态链接与内联封装会绕开可拦截的库调用，追踪结果只覆盖一部分行为。
  detail: 场景是快速摸清陌生程序的交互面：读了哪些文件、连了谁、调了哪些加解密与内存函数，用一条命令换取行为轮廓，适合在深挖前建立假设，也用于验证静态结论。与系统调用追踪的区别是它落在用户态库边界，能看到库函数参数，但下不到内核；与原生层运行时插桩的区别是这里只被动记录，没有改写返回值的能力。注意点：库调用追踪依赖动态符号，静态链接或内联包装后几乎无输出；通配规则过宽会淹掉关键调用；目标若检测到注入会改变行为，记录为空不等于没有行为。
  principle: 库调用追踪的机制来自动态链接本身：可执行文件对共享库的调用要经过过程链接表跳到真实地址，追踪工具把目标函数入口换成自己的记录代码，参数就按调用约定从寄存器与栈上取。所以只要有动态符号就能记录，一旦函数被静态链接或内联展开，调用点不再经过可拦截地址，机制就失效。系统调用侧则是唯一的稳定边界：任何落到内核的操作都必须过这层，代价是用户态内部逻辑完全不可见，两侧记录必须对照才有意义。
  difficulty: 2
  prerequisites:
  - tech:debugger-attach-and-breakpoint
  artifacts:
  - art:elf64
  - art:pe64
  - art:so
  - art:mach-o
  outputs:
  - 库调用时序记录
  - 文件与注册表访问清单
  - 库依赖的真实使用情况
  - 未被覆盖的行为盲区
  cost: low
  false_positive_risk: medium
  commands:
  - cmd: ltrace -f -o {{out}} {{binary}}
    note: 跟踪库函数调用；对静态链接或内联封装的程序几乎无效
  - cmd: strace -f -o {{out}} {{binary}}
    note: 跟踪系统调用，覆盖一切落到内核的行为，但看不到用户态内部逻辑
  - cmd: frida-trace -p {{pid}} -i "recv*" -i "send*"
    note: 按通配拦截指定函数，适合只看网络相关调用；需目标允许注入
  procedure:
  - 先用 strace -f -o {{out}} {{binary}} 拿系统调用全貌，确定程序大致在做什么、有没有子进程。
  - 再用 ltrace -f -o {{out}} {{binary}} 补库函数层，两份记录对照就能分清哪些行为在库层、哪些直接落内核。
  - 关注面收窄到网络或某个模块后，改用 frida-trace -p {{pid}} -i "recv*" -i "send*" 只挂相关函数。
  - 通配从宽到窄逐级收紧，每次只加一条规则，避免一次挂上百个函数导致输出不可读。
  - 对记录里出现、静态导入表里却没有的调用，回到静态侧确认是否走运行时解析取址。
  - 把命中的调用与磁盘文件、网络连接对应起来形成交互面清单，并标注因静态链接而不可见的部分。
  pitfalls:
  - 只跟踪系统调用时，程序内部的加密与封装逻辑一行都看不到
  - 静态链接程序没有可拦截的动态符号，结果为空不代表没有库调用
  - 通配过宽会产生巨量噪音，关键调用被淹掉，必须先缩小到具体模块
  - 带反调试的目标检测到跟踪后可能直接退出，记录会是空的
- id: tech:syscall-tracing
  name: 系统调用追踪
  name_en: System Call Tracing
  domain:
  - dom:re-dynamic
  parent: dom:re-dynamic
  def: 在内核边界记录系统调用与参数，识别被刻意隐藏的文件、网络与进程操作。难点是参数在内核入口处才确定，缓冲区内容需额外读取才能还原。
  detail: 场景是怀疑程序用直接系统调用或非常规路径隐藏行为时，以及需要把文件、套接字、进程操作按时间排成一条可复读的序列时。与运行时调用追踪的区别是它只有内核边界这一层，用户态内部逻辑看不到，但覆盖率高，参数在内核入口处才好取。注意点：必须跟随子进程，否则真实行为常在子进程里发生；默认字符串截断长度会切掉长路径；被拦截重定向的调用看到的是重定向后的路径；时间戳与真实先后对不上时，先怀疑是批量写入造成的偏移。
  principle: 系统调用是用户态进内核的唯一通道，文件、网络、进程、内存映射最终都在这里带着参数出现。追踪工具用 ptrace 让目标在每次进出内核时被停住，所以看到的是调用发生那一刻的参数；指针指向的缓冲区要另行读取才能还原内容，这是默认只显示字符串的原因。绕过库函数直接发起的调用同样要经过这条边界，因此这一层覆盖率高于库层追踪，代价是看不到调用之前的用户态判断，只能从调用序列反推意图。
  difficulty: 3
  prerequisites:
  - tech:runtime-api-tracing
  artifacts:
  - art:elf64
  - art:pe64
  - art:so
  - art:driver
  outputs:
  - 系统调用序列与时间戳
  - 被访问的路径与套接字
  - 可疑的直接系统调用点
  - 参数内容的还原结果
  cost: medium
  false_positive_risk: low
  commands:
  - cmd: strace -f -tt -s 256 -o {{out}} {{binary}}
    note: 带时间戳并放大字符串截断长度，避免关键路径被截断
  - cmd: strace -f -e trace=openat,open,connect,execve -o {{out}} {{binary}}
    note: 只留高价值调用，输出量可控
  - cmd: gdb -q -batch -ex "catch syscall" -ex run -ex "info registers" {{binary}}
    note: 在调试器里停于系统调用入口，可配合寄存器还原参数
  procedure:
  - 用 strace -f -tt -s 256 -o {{out}} {{binary}} 跑一遍完整记录，先看全貌，注意有没有子进程。
  - 从记录里挑出 openat、connect、execve 这类高价值调用，用 -e trace= 只留这几类重跑，把输出降到可读。
  - 对只出现一次且路径或地址异常的调用，回看该时间点前后的调用序列，判断是正常初始化还是隐藏行为。
  - 要看参数指向的内容时，用 gdb -q -batch -ex "catch syscall" -ex run -ex "info registers" {{binary}}
    停在同一调用上按调用约定读缓冲区。
  - 用导入表对照，把没有对应库函数的调用单独标出，这些就是直接系统调用点。
  - 按进程与时间排序重建实际执行顺序，再与静态控制流对照，差异处即需要深挖的位置。
  pitfalls:
  - 不加跟随子进程的选项会漏掉子进程，实际行为常在子进程里发生
  - 默认字符串截断长度会切掉长路径，必须显式放大
  - 直接系统调用不经过库函数，只在系统调用侧可见，库调用侧为空
  - 调用被拦截重定向时，看到的是重定向后的路径，不是程序里写的那个
- id: tech:callstack-and-backtrace-analysis
  name: 调用栈回溯
  name_en: Call Stack & Backtrace Analysis
  domain:
  - dom:re-dynamic
  parent: dom:re-dynamic
  def: 沿栈帧还原当前执行点的调用链，定位谁调用了谁。难点是帧指针被省略或栈被破坏后，回溯会静默给出错误的调用链而不是报错。
  detail: 场景是卡死、崩溃或停在断点时，先确定当前执行点由谁一路调过来；也用于核对一段可疑代码是被哪个入口触发的。与静态交叉引用分析的区别是回溯拿的是运行时的真实链，包含通过函数指针与回调发起的调用，而这些静态侧常常还原不出来。注意点：编译优化省略帧指针后回溯改走展开信息，信息缺失时退化为启发式扫描，可能给出看似合理的错误链；信号处理上下文里直接回溯看到的是处理器函数；栈被越界写过后，相邻函数的返回地址会被误当成本层的。
  principle: 回溯的正确性依赖一个前提：返回地址在栈上的位置已知。编译器保留帧指针时，调试器沿帧指针链逐层取返回地址即可；省略帧指针后只能按展开信息计算每帧的栈指针与偏移，信息缺失就退化为扫描栈上任何像代码地址的值，于是给出连贯但错误的链。这也是错误栈不报错只误导的原因：它看起来完全合理。返回地址被篡改或栈被越界写后，读到的是相邻函数地址，必须用栈快照与展开信息交叉验证才能判为可信。
  difficulty: 3
  prerequisites:
  - tech:stack-frame-recovery
  - tech:debugger-attach-and-breakpoint
  artifacts:
  - art:pe64
  - art:elf64
  - art:mach-o
  - art:memory-dump
  outputs:
  - 调用链与返回地址列表
  - 栈被破坏的判断依据
  - 展开信息缺失时的替代方法
  - 各层参数的实际取值
  cost: low
  false_positive_risk: medium
  commands:
  - cmd: gdb -q -batch -ex "thread apply all bt full" -p {{pid}}
    note: 一次拿全部线程的完整回溯，是判断卡在哪的最快手段
  - cmd: gdb -q -batch -ex "x/40gx $sp" -p {{pid}}
    note: 回溯不可信时直接读栈内存，手工找出可信的返回地址
  - cmd: readelf --debug-dump=frames {{binary}}
    note: 有异常帧信息时可查展开规则，判断回溯是否按正确规则进行
  procedure:
  - 用 gdb -q -batch -ex "thread apply all bt full" -p {{pid}} 一次取全部线程完整回溯，先确定卡住或停在哪个线程。
  - 核对首帧地址是否落在预期模块的预期函数里，落在系统库里先判断是正常回调还是误报。
  - 回溯层数异常短或明显跳变时，用 x/40gx $sp 直接读栈，人工找出可信的返回地址再与回溯对照。
  - 有异常帧信息时用 readelf --debug-dump=frames 查展开规则，确认工具是按正确规则走的。
  - 记录每层参数的实际取值，与静态调用约定对照，确认读的是本层而不是错位的上一层。
  - 结论里显式标注栈是否可信；不可信时改用保留帧指针的样本，或在函数入口下断点重取。
  pitfalls:
  - 无帧指针时回溯走启发式扫描，可能给出看起来合理但完全错误的栈
  - 返回地址被篡改或栈被越界写后，回溯会读到相邻函数的地址
  - 信号处理上下文里直接回溯看到的是信号处理函数，需先切到被中断上下文
  - 展开信息缺失且栈不可读时，回溯结果必须标注为不可信，不能当证据
- id: tech:native-runtime-instrumentation
  name: 原生层运行时插桩
  name_en: Native Runtime Instrumentation
  domain:
  - dom:re-dynamic
  parent: dom:re-dynamic
  def: 在进程内注入钩子，读写函数参数、返回值与内存，观察静态得不到的真实数据流。难点是 ABI 与运行时差异会让钩子取错寄存器，造成静默错值。
  detail: 场景是静态看不出某个函数到底收到什么参数、返回什么、被调多少次时，直接在进程内挂钩读取；也用于在加解密函数返回处直接拿明文，省去还原算法。与调试器附加的区别是不需要反复暂停，钩子可以长期在线并统计频率；与运行时调用追踪的区别是能改参数与返回值，而不只是记录。注意点：参数读取必须与目标
    ABI 一致，32 位与 64 位寄存器宽度不同，读错会静默得到截断值；注入本身可被检测；被内联的函数挂不上；多线程下读共享缓冲区有竞态。
  principle: 钩子有效的机制是把目标函数入口的头几条指令改写为跳转，控制流先进入自己的处理函数，在那里按 ABI 从寄存器与栈上取参数，执行完原逻辑后再取返回值。改写必须保留原指令语义，否则被钩函数的行为会变。参数正确性完全由调用约定决定：哪个寄存器传第几个参数、返回值放在哪里都有规定，宽度或类型读错就会静默拿到错值。内联目标挂不上的原因也在这里：调用点已经不再经过那个地址，改写入口对已展开的代码没有意义。
  difficulty: 4
  prerequisites:
  - tech:debugger-attach-and-breakpoint
  - tech:calling-convention-recovery
  artifacts:
  - art:so
  - art:elf64
  - art:pe64
  - art:mach-o
  outputs:
  - 关键函数的真实入参与返回值
  - 解密后的内存数据
  - 调用频率与调用者分布
  - 钩子失效点清单
  cost: medium
  false_positive_risk: medium
  note: 与既有 tech:mobile-runtime-instrumentation 的边界：那条针对移动应用运行时与加固对抗，这条面向桌面与服务端的原生程序，钩子机制与
    ABI 假定不同。
  commands:
  - cmd: frida -p {{pid}} -l hook.js
    note: 注入脚本挂函数；脚本里必须显式声明参数类型与 ABI
  - cmd: frida-trace -p {{pid}} -i "AES_*" -i "EVP_*"
    note: 按通配批量挂加密相关函数，先看调用序列再决定深挖哪个
  - cmd: gdb -q -batch -ex "info symbol $pc" -p {{pid}}
    note: 确认当前停在哪个符号上，避免在错误位置下钩子
  procedure:
  - 用 gdb -q -batch -ex "info symbol $pc" -p {{pid}} 确认目标函数在内存里的地址与符号，别挂错位置。
  - 用 frida-trace -p {{pid}} -i "AES_*" -i "EVP_*" 批量挂加密相关函数，先只看调用序列与频率，选出要深挖的点。
  - 对选中函数写钩子，用 frida -p {{pid}} -l hook.js 挂载，脚本里显式声明参数类型、位宽与调用约定。
  - 在钩子里同时记录入参、返回值与关键缓冲区内容，输出到单一文件便于按调用序对齐。
  - 对照多次运行结果，检查有无因内联、多线程或钩子失效造成的缺失，缺失点单独列出。
  - 需要调用者信息时补一次栈回溯，把调用频率与调用者分布一起记下，再决定是否扩大挂钩范围。
  pitfalls:
  - 32 位与 64 位寄存器宽度不同，参数读取用错宽度会得到截断值
  - 注入本身可被检测，目标会改变行为或退出而不是被拦住
  - 多线程下读全局缓冲区有竞态，可能拿到改写前或半写入的数据
  - 钩住被内联的函数无效，因为调用点已经不再经过该地址
- id: tech:memory-scan-and-patch
  name: 内存扫描与热补丁
  name_en: Memory Scanning & Live Patching
  domain:
  - dom:re-dynamic
  parent: dom:re-dynamic
  def: 在运行态搜索特定值或指令特征并就地修改，绕开一次性校验。难点是写入前必须改页权限，且补丁长度不等长会破坏相邻指令。
  detail: 场景是某个校验每次都要过、静态改文件又会被完整性检查发现时，改为在运行态改内存；也用于快速验证「把这里改成恒真会怎样」这类假设，验证完再决定要不要落到磁盘。与内存转储的区别是这里要写回去而不是只读出来；与导入表重建的区别是不改结构只改字节。注意点：代码段默认只读，写入前必须改页权限；补丁长度与目标指令长度不一致会把后续指令拆坏；地址随机化下搜到的地址下次运行就失效；补丁后不重置校验和会被校验回路发现。
  principle: 热补丁能绕开校验，是因为校验读的往往是磁盘文件或另一份副本，而执行读的是被改过的内存页；只要修改落在内存里且不再经过文件读取路径，磁盘侧校验就看不到。写入前必须改页权限：代码段在页表里通常是只读的，直接写会触发访问异常，这不是限制而是保护机制。补丁长度必须与目标指令对齐，因为机器码没有对齐约束，一条指令被截断后，后面的字节会被重新解释成完全不同的指令。
  difficulty: 3
  prerequisites:
  - tech:debugger-attach-and-breakpoint
  artifacts:
  - art:memory-dump
  - art:pe64
  - art:elf64
  - art:so
  outputs:
  - 目标地址定位结果
  - 可复现的补丁字节序列
  - 补丁前后的行为差异
  - 完整性校验触发情况
  cost: low
  false_positive_risk: medium
  commands:
  - cmd: gdb -q -batch -ex "find /b 0x0, 0xffffffffffff, 0x48, 0x8b" -p {{pid}}
    note: 按字节特征搜指令序列；范围要给合理上界，全地址空间搜索极慢
  - cmd: gcore -o {{out}} {{pid}}
    note: 先落一份内存快照再离线分析，避免反复附加扰动目标
  - cmd: gdb -q -batch -ex "set {char}[0x401000] = 0x90" -p {{pid}}
    note: 就地改写单个字节；代码段只读时必须先改页权限
  procedure:
  - 先用 gcore -o {{out}} {{pid}} 落一份内存快照，地址换算与校验都在快照上做，别反复附加扰动目标。
  - 用 find /b 按指令特征或字符串搜索目标地址，搜索范围给合理上下界，全地址空间搜索极慢。
  - 命中后反汇编核对前后指令边界，确认要改的字节数与指令长度一致。
  - 目标在代码段就先改页权限为可写，再执行写入；只读段直接写会抛异常。
  - 用 set {char}[0x401000] = 0x90 这类就地写法打补丁，长度选择要能完整覆盖原指令。
  - 改完立刻验证分支走向与返回值，再重跑一次完整性校验，确认补丁没有被校验回路发现。
  - 把补丁的地址与字节序列记下来，地址随机化下用它重新定位。
  pitfalls:
  - 代码段默认只读，直接写会失败或触发访问异常
  - 用 1 字节补丁替换 5 字节指令会把后续指令拆坏
  - 运行期数值会变，搜到的地址下次运行就失效，地址随机化下更明显
  - 补丁后不重置校验和会被完整性检查发现，行为与预期不同
- id: tech:concolic-execution
  name: 动态符号执行
  name_en: Dynamic Symbolic Execution
  domain:
  - dom:re-dynamic
  parent: dom:re-dynamic
  def: 在实际执行轨迹上做符号化求解，逐个翻转分支约束以覆盖深层判断。难点是路径爆炸与环境交互建模，外部依赖缺口会让求解失去意义。
  detail: 场景是校验逻辑由多层条件组合而成、手工构造输入找不到路径时，用求解器逐个翻转分支约束；也用于判断某段深层逻辑究竟可不可达。与纯静态符号执行的区别是它从一条真实执行轨迹出发，天然排除大量不可达路径；与模糊测试的区别是不靠随机变异，而是按约束定向生成输入。注意点：路径爆炸是常态，必须设探索上限；外部调用与系统交互建模不全时，求解结果没有意义；反调试与自修改代码会让轨迹失真；求解出的输入只满足约束，不等于真实业务可用。
  principle: 动态符号执行把一条真实轨迹上的输入值替换成符号，沿途收集分支条件形成路径约束，再用约束求解器反解出让另一个分支成立的输入。它比纯静态符号执行有效，是因为真实轨迹本身就排除了大量不可达路径；代价是每条路径都要一次求解，路径爆炸与外部调用建模是主要瓶颈。所谓没解出来，只说明求解器在该约束下超时或不可满足，并不意味着该分支在真实语义下不可达，结论必须写清这个边界。
  difficulty: 5
  prerequisites:
  - tech:static-data-flow-analysis
  - tech:debugger-attach-and-breakpoint
  artifacts:
  - art:pe64
  - art:elf64
  - art:shellcode
  - art:so
  outputs:
  - 可达路径与已覆盖分支
  - 满足条件的输入约束
  - 未解与超时路径清单
  - 环境依赖缺口说明
  cost: high
  false_positive_risk: medium
  commands:
  - cmd: python3 -c "import angr,sys; p=angr.Project(sys.argv[1], auto_load_libs=False);
      print(p.arch, hex(p.entry))" {{binary}}
    note: 建立初始状态前先确认加载正确，架构与入口解析错则后续全废
  - cmd: r2 -q -c "aaa; afl" {{binary}}
    note: 先枚举函数与分支，选出值得符号化的目标，不要盲跑整个程序
  - cmd: strace -f -s 128 -e trace=read -o {{out}} {{binary}}
    note: 目标读取长度决定符号化输入的维度，先量清楚再建状态
  procedure:
  - 用 r2 -q -c "aaa; afl" {{binary}} 枚举函数与分支，只挑承载校验逻辑的几个，不要对整个程序做符号化。
  - 确认加载参数：架构、位数、入口与基址，用最小脚本打印核对，解析错则后续全废。
  - 用 strace -f -s 128 -e trace=read -o {{out}} {{binary}} 量清目标读取的输入长度与方式，定下符号化输入的维度与格式。
  - 以真实执行轨迹为起点建立初始状态，把输入区标记为符号，先跑一次得到可达路径。
  - 对关键分支逐个翻转约束，求解后喂回程序验证，只记录真的走到新路径的输入。
  - 设探索上限与超时，把未解与超时路径单独列出，注明是求解失败还是不可达。
  - 结论里区分求解给出的输入与真实可用的输入，后者必须在原始环境复验。
  pitfalls:
  - 只覆盖它探索到的路径，没解出来不等于不可达
  - 求解得到的输入是满足约束的一组值，不等于真实业务场景下的可用输入
  - 反调试与自修改代码会让轨迹失真，可达结论可能在实际运行中走不到
  - 路径爆炸是常态，必须设探索上限并把超时路径明确列出
- id: tech:environment-and-time-emulation
  name: 时间与环境模拟
  name_en: Time & Environment Emulation
  domain:
  - dom:re-dynamic
  parent: dom:re-dynamic
  def: 操纵时钟、网络可达性与设备标识，让依赖环境的逻辑走到被隐藏的分支。难点是改环境本身会成为可检测信号，真实依赖也难以完全模拟。
  detail: 场景是程序根据日期、证书有效期、网络可达性或设备信息选择行为分支时，把环境改成目标期望的样子以看到被隐藏的分支；也用于验证某个行为是否只在特定环境下出现。与内存补丁的区别是不改程序逻辑，只改它读到的输入；与模拟执行的区别是仍在真实系统上运行，外部交互真实但被裁剪。注意点：时间跳跃与断网都是可检测信号，目标会交叉比对多个来源；主机名、用户目录、磁盘容量这类环境差异同样会被读到；一次只改一个维度，否则差异无法归因。
  principle: 环境模拟有效的机制是在取数接口这一层改输入：程序拿到的当前时间几乎都来自少数几个库调用或系统调用，把返回值改写，依赖日期与期限的判断就会走向另一条分支；网络命名空间则把套接字操作放进一个没有出口的隔离环境，连接失败与成功两种结果都能稳定复现。代价是改动本身是信号：多个时间源相互比对、返回值不连续、隔离环境里缺失的网络设施，反过来都能暴露分析环境，所以模拟要追求内部一致而不是单点造假。
  difficulty: 3
  prerequisites:
  - tech:debugger-attach-and-breakpoint
  - tech:runtime-api-tracing
  artifacts:
  - art:pe64
  - art:elf64
  - art:so
  - art:script
  outputs:
  - 被隐藏分支的触发条件清单
  - 环境依赖点与替换记录
  - 模拟前后的行为差异
  - 未覆盖的环境维度
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: faketime "2020-01-01 00:00:00" {{binary}}
    note: 用时间包装器模拟指定时钟；仅在支持预加载拦截的环境可用
  - cmd: frida -p {{pid}} -l time.js
    note: 在进程内改写取时函数，比外部包装更难绕过，同样也可被检测
  - cmd: unshare -n {{binary}}
    note: 在无网络命名空间里运行，观察目标在断网时的分支走向
  procedure:
  - 先确认目标依赖哪个维度：时间、网络、设备标识还是主机信息，别把所有维度一起改。
  - 用 faketime "2020-01-01 00:00:00" {{binary}} 整体推进时钟，看行为是否改变；仅支持预加载拦截的环境可用。
  - 若目标绕开外部包装，用 frida -p {{pid}} -l time.js 在进程内改写取时函数，把多个时间源改成一致值。
  - 用 unshare -n {{binary}} 断网运行，区分哪些分支由网络可达性触发、哪些只是重试与退避。
  - 每次只改一个维度，记下改动前后的行为差异；两个维度一起改会让归因失效。
  - 把差异整理成触发条件清单，标注仍未覆盖的环境维度。
  pitfalls:
  - 时间跳跃本身是可检测信号，目标会交叉比对多个时间源是否一致
  - 只改一个取时接口无效，程序可能同时用多个来源互相校验
  - 断网后目标会走重试与退避分支，那并不是无网络时的原始逻辑
  - 环境差异（主机名、用户目录、磁盘容量）同样会被检测到
