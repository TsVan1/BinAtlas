# BinAtlas 知识库 · 技术 · dom:ad-bypass
# 规范：03-DATA-SCHEMA.md §2.2

- id: tech:peb-flags-rewrite
  name: 调试标志位篡改
  name_en: PEB Debug Flag Rewriting
  domain:
  - dom:ad-bypass
  parent: dom:ad-bypass
  def: 在用户态直接改写进程环境块中的调试标志与堆标志，让读取方看到干净值。难点是改写点可能被二次校验，堆标志还牵涉堆管理器的一致性。
  detail: 场景是目标用最原始的一手读法判断调试状态：直接从线程环境块取到进程环境块，读里面的调试标志字节与全局标志字段，两处都干净才继续运行。与「调试寄存器清零」的区别是这里动的是内存里的结构体字段、不是 CPU 的线程状态，读内存的检测会被骗，必须走上下文接口才能看到的寄存器状态完全不受影响；与「调试对象解绑」的区别是本条只改目标读到的值，内核里的调试连接仍在，凡直接查调试端口或调试对象句柄的检测照样命中。注意点：调试标志字节在 32 位与 64 位环境块里位置一致，全局标志字段的偏移却不同（32 位在 0x68 附近、64 位在 0xBC 附近），照抄偏移会写坏相邻字段；全局标志的调试位是几个位合起来的取值，只清一位等于没清；堆标志挂在另一条结构链上、偏移随系统版本变化，不宜硬编码；64 位系统上的 32 位进程存在两份环境块，写错那一份时目标读到的仍是原值。
  principle: 下手点在用户态内存。检测方取到进程环境块只需要两步：按段寄存器（32 位 fs、64 位 gs）拿到线程环境块，再取其指针字段；之后读的是偏移固定的普通字段，一块没有任何读保护的可写内存。所以在这个层上完成改写，任何按同一偏移来读的代码都只能读到干净值——它读的不是内核状态，而是这块内存此刻的内容。这让有效范围变得很明确：只要检测方还走「读同一块内存」这条路径就绕得过去，一旦它改走调试端口、调试对象句柄或线程上下文接口，读的是内核对象与 CPU 线程状态，内存改写对它没有任何作用，必须换到对应的层。
  difficulty: 2
  prerequisites:
  - tech:peb-debug-flags-inspection
  artifacts:
  - art:pe64
  - art:pe32
  outputs:
  - 改写后的标志位取值
  - 需要恢复的原始值
  - 检测规避的生效范围
  cost: low
  false_positive_risk: medium
  commands:
  - cmd: cdb -p {{pid}} -c "eb @$peb+2 0; q"
    note: 调试器会话内把调试标志字节写零，写入前先确认目标位数与字段偏移
  - cmd: cdb -p {{pid}} -c "ed @$peb+0x68 0; q"
    note: 32 位下清零全局标志字段；64 位偏移不同，写错会破坏相邻字段
  - cmd: cdb -p {{pid}} -c "dt ntdll!_PEB @$peb; q"
    note: 改写后回读结构确认字段已变，避免写到别名地址
  procedure:
  - 先在反汇编里按段寄存器的固定偏移定位取值点，确认目标读的是内存字段还是查询接口，前者才落在这一层。
  - 用调试器打印环境块结构，记下调试标志字节与全局标志字段的当前值作为基线，写完要按这份基线核对。
  - 按目标位数确认全局标志字段的偏移，记录原始值后清零调试标志字节，并把全局标志里的调试位组合一起清掉。
  - 回读同一结构，确认两处都已是期望值且相邻字段未被波及；偏移写错会在这里立刻显形，比等到目标行为异常更早暴露。
  - 让目标自己的检测逻辑跑一遍，观察它是否走「未调试」分支；验证的是目标读到了什么，而不是调试器看到了什么。
  - 对照基线恢复原值，或明确记录本次会话内不再恢复；调试器自身也依赖这些字段判断状态，长期不恢复会出现行为异常。
  pitfalls:
  - 只清零一处标志而堆标志仍带调试位，成套读取的检测照样命中
  - 改写后不保留原始值，调试器自身依赖这些标志判断状态时会行为异常
  note: 与「调试标志位读取」成对：识别侧读标志字节与全局标志字段，绕过侧原地写回同一字段并保留原值。
- id: tech:debug-register-clearing
  name: 调试寄存器清零
  name_en: Debug Register Clearing
  domain:
  - dom:ad-bypass
  parent: dom:ad-bypass
  def: 清除线程上下文里的硬件断点配置，使读取调试寄存器的检测看到空值。难点是寄存器按线程保存，清掉后原有硬件断点立即失效。
  detail: 场景是目标用上下文接口把线程的调试寄存器读出来，看有没有人用硬件断点在自己身上设了观察点：前四个地址寄存器非零、或控制寄存器的使能位被置起，就判定被调试。与「调试标志位篡改」的区别是这一层不在内存里而在 CPU 的线程状态里，改内存字段无效；与「断点完整性绕过」的区别是那条路处理软件断点留下的字节痕迹，本条处理硬件断点留下的寄存器痕迹，两者痕迹位置毫无重叠。注意点：调试寄存器由内核按线程保存、在每次线程切换时装载，清零只对当前线程生效，多线程目标必须逐线程处理；硬件执行断点只有四个槽位，清零等于把观察点全撤掉，关键路径要换成不占槽位的手段；调试寄存器是特权寄存器，用户态只能经上下文接口写入，直接读写会在用户态触发异常；虚拟化环境下宿主可能占用这些寄存器实现自身功能，写入行为以运行环境为准。
  principle: 下手点在线程上下文。调试寄存器既不是普通内存也不是通用寄存器，而是一组由内核按线程保存、线程切换时装载的特权寄存器：四个地址寄存器给出监视地址，控制寄存器里的使能位与长度位决定是否启用以及按什么宽度监视，状态寄存器记录最近一次中断的原因。目标在用户态读它们只有一条路——取线程上下文，内核把该线程的保存值拷进上下文返回。既然读必经这条路，写也走同一条：把上下文结构里的地址寄存器清零、把控制寄存器的使能位一并清掉再设置回去，内核下次装载该线程时 CPU 里就是空的，目标读到的自然也是空的。边界是它只骗得过读上下文接口的一方：若检测方在内核里直接读任务的保存区，或用硬件虚拟化观测，这一层改不到。
  difficulty: 3
  prerequisites:
  - tech:debug-register-inspection
  artifacts:
  - art:pe64
  - art:pe32
  outputs:
  - 清零后的寄存器状态
  - 失效的硬件断点清单
  - 恢复方案
  cost: low
  false_positive_risk: medium
  commands:
  - cmd: cdb -p {{pid}} -c "r dr0=0; r dr1=0; r dr2=0; r dr3=0; r dr7=0; q"
    note: 调试器会话内逐个清零，控制寄存器清零会同时关掉所有使能位
  - cmd: cdb -p {{pid}} -c "r dr6; r dr7; q"
    note: 回读状态位确认清空生效，状态寄存器里残留的中断原因也要一并处理
  procedure:
  - 先确认目标的读取路径，静态看它是否导入了取线程上下文与设置上下文的接口，只有存在设置接口时才谈得上在这一层改写。
  - 读一遍全部调试寄存器并记录，前四个地址寄存器的取值与控制寄存器的使能位是判定依据，这份记录同时是后续恢复的依据。
  - 先清控制寄存器里的使能位，再清四个地址寄存器；顺序反了会留下使能位仍开而地址已归零的中间状态，CPU 会按旧使能位继续匹配。
  - 把改好的上下文设置回线程，然后立刻回读，看到地址寄存器全为零、控制寄存器使能位全为零，才算清零生效。
  - 顺带核对状态寄存器：它记录上一次中断的原因位，残留非零同样会被当成存在硬件断点，按检测的读法决定是否一并清零。
  - 让目标的检测逻辑跑一遍，观察它是否走非调试分支；再单步执行一条指令后回读状态寄存器，确认没有新的中断原因被记下。
  - 收尾时按记录把原值写回并再次回读核对；不恢复的话，依赖硬件断点的后续分析步骤会静默失效，表现为断点再也不命中。
  pitfalls:
  - 清零只作用于当前线程上下文，其他线程的断点配置仍在，逐线程处理才完整
  - 清控制寄存器会让原有硬件断点失效，关键路径必须改用不会暴露观察点的手段
  note: 与「调试寄存器检查」成对：识别侧逐线程读寄存器，绕过侧清使能位并回读确认。
- id: tech:debug-object-detach
  name: 调试对象解绑
  name_en: Debug Object Detach
  domain:
  - dom:ad-bypass
  parent: dom:ad-bypass
  def: 主动解除调试器与进程之间的调试对象关联，让调试端口与句柄查询回到未调试状态。难点是解绑后事件不再上报，断点与补丁要自行维护。
  detail: 场景是目标不读自己进程里的内存字段，而是用进程信息查询接口直接问：我有没有调试端口、有没有调试对象句柄、线程的隐藏调试状态是什么——这类查询走的是内核对象而不是可写内存。与「调试标志位篡改」的区别是那条路只改目标读到的值，内核里的调试连接还在，走查询接口的检测一眼穿透；与「模块与句柄遮蔽」的区别是那条路让痕迹看不见，本条让连接不存在，前者是视图层面、后者是事实层面。注意点：解绑需要由一个仍在调试会话中的一方执行，第三方注入去解绑要先拿到足够的进程权限；解绑之后调试事件不再上报，目标的异常、线程创建与模块加载都不会再通知分析者，断点与补丁的维护责任整体转到分析者身上；同一进程反复附加解绑会在系统侧留下多次附加与解绑记录，比一次干净的附加更显眼。
  principle: 下手点在内核里那条调试连接上。附加的实现在内核：调试器请求内核为目标进程建立调试对象，内核在进程结构里挂上调试端口，此后目标产生的所有调试事件都从这条端口上报。目标侧能观察到的「被调试」事实，无论以调试端口、调试对象句柄还是线程隐藏调试状态的形式出现，最后都归结到这条连接是否存在以及端口是否被设置。所以在这一层解绑，是把事实本身拿掉而不是把读数改掉：查询接口返回零或对象不存在，是因为对象真的没了，任何一条查询路径都自洽。这也划出它与内存改写类手法的分界——那条路只要检测方换一条读取路径就露馅，这条路不挑路径，代价是断点与补丁得自己接管。
  difficulty: 4
  prerequisites:
  - tech:debug-port-object-inspection
  artifacts:
  - art:pe64
  outputs:
  - 解绑后的调试对象状态
  - 需自行维护的断点与补丁清单
  - 事件上报中断的范围
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: cdb -p {{pid}} -c "x ntdll!NtRemoveProcessDebug; q"
    note: 确认运行环境里解绑接口的地址，接口未导出时必须按序号或特征定位
  - cmd: strings -a {{binary}} | grep -E "DebugActiveProcess|ContinueDebugEvent"
    note: 静态确认目标自身是否使用调试接口，避免解绑与目标的调试逻辑冲突
  procedure:
  - 先用进程信息查询把三类读数各取一次：调试端口、调试对象句柄与线程隐藏调试状态，这份组合作为基线。
  - 静态确认目标自身是否也在用调试接口，附加别人或操纵自己的调试状态；两种逻辑同时存在时，解绑会与目标的行为冲突。
  - 在持有调试权的一方执行解绑调用；解绑只能解除调用方自己建立的那条连接，从外部替换成别的调用方不会生效。
  - 重新查询同样的三类读数，看到调试端口归零、对象句柄返回对象不存在的错误状态，才算解绑真正生效。
  - 检查进程内残留的软件断点字节并回填原值：解绑不会替你摘除已写进内存的断点，不回填会让目标执行到该处时触发访问异常。
  - 触发一次本应上报的事件（例如让目标抛一个异常），确认调试器已收不到通知，而目标自身仍能继续执行。
  - 之后不再重复附加，需要长期观察就换成不建立调试连接的观察手段，避免二次附加这一更显眼的痕迹。
  pitfalls:
  - 解绑会终止调试事件循环，进程内已有的软件断点不会被自动摘除，残留断点会引发访问异常
  - 解绑后重新附加会被目标检测到二次附加行为，比一次附加更可疑
  note: 与「调试端口与对象检查」成对：识别侧查端口与对象句柄，绕过侧解除关联后自行维护断点。
- id: tech:breakpoint-integrity-bypass
  name: 断点完整性绕过
  name_en: Breakpoint Integrity Bypass
  domain:
  - dom:ad-bypass
  parent: dom:ad-bypass
  def: 让运行时改写不被校验和与断点扫描发现，或干脆不写目标代码。难点是校验点可能在磁盘映像上做，此时内存补丁完全无效。
  detail: 场景是目标读自己的代码段字节做比对，或按节区取校验和，发现内存里出现断点指令或被改写的字节就退出。这一条不是一个手法，而是按检测的取证面选层：检测读进程内存，可以用「命中即回填」把可见窗口压到一瞬间；检测读磁盘文件取哈希，回填毫无意义，只能换成不在映像上留字节的观察方式。与「调试寄存器清零」的区别是那条路对付寄存器痕迹、本条对付代码字节与校验和痕迹；与「异常链接管」的区别是那条路在分发层让自检得到期望结果，本条在字节与页的层面回避取证。注意点：回填窗口期内检测只要采样一次就会发现，时序必须一起设计；把代码页改成可写会在页属性上留下私有化痕迹，按页类型比对的检测看得出来；补丁也可以只落在不被校验的节区或校验范围之外，先划清范围再决定放在哪。
  principle: 下手点在内存页与字节可见性这一层。检测取证只有两个面：一是读进程自己的内存映像，映像节页本来与文件共享，一旦为写断点把它改成可写，内核会把该页复制成进程私有页，字节改动只存在于这份私有副本里；二是读磁盘文件或重新映射同一文件，那条路径上的页面缓存从头到尾没被改过，看到的永远是原始字节。绕过方式因此分成两条：要么在命中的瞬间把原始字节回填，让私有副本与被校验的基线在采样时刻一致；要么根本不写字节，用不占内存的观察手段在页层拿命中，让映像保持原样。页属性本身也是可观测面——把只读映像页改成可写，页的类型标记跟着变，这是这一层必须计入的代价。
  difficulty: 4
  prerequisites:
  - tech:breakpoint-integrity-inspection
  - tech:conditional-breakpoint-watch
  artifacts:
  - art:pe64
  - art:elf64
  outputs:
  - 校验和一致的内存状态
  - 未落地的观察点方案
  - 补丁点与校验范围对照
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: gdb -q -batch -p {{pid}} -ex "x/8xb $rip" -ex "set *(unsigned char *)$rip
      = 0xcc"
    note: 落断点前先读原始字节，命中后必须回填，否则按节区取校验和会暴露改写
  - cmd: readelf -S {{binary}} | grep -E "\.text"
    note: 先划定代码段范围，确认校验覆盖哪些节，再决定补丁放在范围外还是回填
  procedure:
  - 先划清校验范围：取节区表确定代码段边界，并确认检测是读自身内存、读磁盘文件，还是两者都做，这决定后面能走哪条路。
  - 若只做内存比对，落断点前先读出目标位置的原始字节并保存，这份副本是回填与后续核对的唯一依据。
  - 写入断点指令并触发一次命中，确认观察点确实生效；命中后立刻回填原始字节，把可见窗口压到最小。
  - 按检测同样的方式重新算一次校验和或字节比对，结果与基线一致，才算回填成功。
  - 若检测会读磁盘文件取哈希，放弃回填路线，改用硬件断点或页保护这类不改映像字节的手段，并确认映像字节全程未变。
  - 检查代码页属性与页类型是否已被改成私有页，检测若按页类型或映射类型比对，暴露点就在这里。
  - 记录命中次数与命中时刻，确认在采样窗口之外也没有留下可被采到的痕迹。
  pitfalls:
  - 检测若对磁盘文件取哈希，内存里的回填毫无意义，必须改为不修改映像的观察方式
  - 回填窗口期仍存在，检测只需在窗口内采样一次就能发现断点，时序要一并考虑
  note: 与「断点与完整性检查」成对：识别侧扫断点字节与校验和，绕过侧回填原始字节或不写映像。
- id: tech:time-source-hooking
  name: 时间源返回伪造
  name_en: Time Source Hooking
  domain:
  - dom:ad-bypass
  parent: dom:ad-bypass
  def: 在时间接口层拦截并返回一致的耗时，让时间差检测看不到停顿。难点是部分计时指令在用户态直接读硬件，接口层钩子根本拦不住。
  detail: 场景是目标在关键代码段前后各取一次时间，用两次的差值判断有没有被单步或断点拖慢；这类检测只信自己读到的读数，不看任何标志位。与「调试标志位篡改」的区别是这里要伪造的不是某个状态而是时间序列，改标志完全无效；与「异常链接管」的区别是异常自检看的是分发行为，本条看的是数值本身。注意点：读时间有多条实现路径——库函数转系统调用、库函数直接读用户态共享页、程序直接执行计时指令，钩在库函数上只能覆盖第一条；把读数改成固定值会让目标自身的超时、轮询与退避逻辑一起失效，反而制造出新的可观测异常，正确的伪造是保持单调、只钳制增量；虚拟化环境下时钟精度本就低于物理机，钳制阈值必须在同一环境里取基线，否则绕过自身就会露馅。
  principle: 下手点在接口层。检测方的取证是同一段代码前后两次读数之差，它之所以能相信这个差值，是因为在源码里读时间就是一次函数调用，编译后变成对导入函数的调用，而导入表里的目标可以被改。钩子把控制流截到自己的处理函数上，返回一个单调递增、但相邻差被钳制在上限以内的读数，按差值下判断的检测只会得出「没有停顿」。这一层的边界由读取路径决定：只有真正经过库函数的调用才可能被截；库函数若把读取实现放在用户态共享页里，调用就只是读一块映射内存，钩函数改得了返回给调用者的值、改不了共享页本身；程序若直接执行计时指令，连函数调用都没有，钩子完全够不着。所以先确认读取路径，再决定钩在哪一层或者下移到页层与内核层。
  difficulty: 4
  prerequisites:
  - tech:timing-delta-detection
  artifacts:
  - art:pe64
  - art:elf64
  outputs:
  - 被拦截的时间接口清单
  - 伪造后的耗时读数
  - 无法拦截的计时路径
  cost: medium
  false_positive_risk: high
  commands:
  - cmd: ltrace -e "clock_gettime+gettimeofday" -p {{pid}}
    note: Linux 上观察目标实际调用哪个时间接口，钩子要落在真正的调用点上
  - cmd: gdb -q -batch -p {{pid}} -ex "find /b $pc, $pc+0x400, 0x0f, 0x31"
    note: 在代码里按字节搜计时指令的操作码，确认存在绕过接口层的计时路径
  procedure:
  - 先确定目标真正的读取路径：动态跟踪看它调用了哪个时间接口，静态在代码里按操作码找计时指令，两条都做才不漏。
  - 在同一环境里用同一接口取一组基线读数，算出目标所测代码段的正常耗时分布，作为钳制阈值的依据。
  - 在真正的调用点落钩，只对目标实际使用的那几个接口生效，返回单调递增且增量被钳制的读数。
  - 在自己的进程里同时调用被钩接口与直接计时指令各取一次，看到前者被钳制、后者仍是真实值，即确认钩子只覆盖了接口层这一条路径。
  - 让目标的耗时检测跑一遍观察它是否通过；同时看目标的超时与轮询逻辑是否仍在正常工作，固定读数会让它们静默失效。
  - 把拦不住的路径（直接计时指令、用户态共享页读取）写清楚，注明其中哪些只能靠下移到页层或虚拟化层处理。
  pitfalls:
  - 计时指令不经系统调用，用户态钩子对它无效，只能靠虚拟化层或改代码路径处理
  - 时间返回被改成固定值后，目标自身的超时与轮询逻辑会一起失效，反而产生新的可观测异常
  note: 与「时间差检测」成对：识别侧测代码段耗时，绕过侧在接口层给出一致读数。
- id: tech:exception-chain-takeover
  name: 异常链接管
  name_en: Exception Chain Takeover
  domain:
  - dom:ad-bypass
  parent: dom:ad-bypass
  def: 抢占或改写目标的异常处理器链，让异常自检看到期望结果后继续执行。难点是处理器顺序由系统决定，插入位置错了就影响不到判定。
  detail: 场景是目标故意制造一个可控异常、或置起单步标志，观察谁来接管、返回值是什么，据此判断异常分发是否已被调试器接走。与「断点完整性绕过」的区别是那条路在字节与校验和层面回避取证，本条在分发层直接给出期望结果；与「ptrace 拦截与伪装」的区别是那条路在调用边界伪造返回值，本条要真的进入异常处理流程并改变它的走向。注意点：分发顺序由系统决定、不在目标手里，用户态处理器之前还有调试器，调试器在场时会先一步消费异常，自检因此看不到「无人接管」，接管必须配合让调试器不介入；处理器返回值分继续执行与重新抛出两种语义，写错会把可控异常变成进程终止；单步标志只对当前线程有效且执行一条指令后自动清除，跨线程或跨系统调用就不成立。
  principle: 下手点在异常分发层。异常由 CPU 陷阱或显式抛出产生后，由内核按固定顺序交给各处理器：内核侧处理器、用户态调试器（若存在）、进程注册的向量化处理器、结构化异常展开、最后是未处理异常过滤器。谁排在前面谁先看到，也能决定要不要把异常继续往下传。于是「有没有被调试」在这个层上表现为顺序差：调试器在场时异常在更靠前的位置被消费，目标自己注册的处理器拿不到，自检据此判定被调试。绕过就是在更靠前的位置插入处理器并返回「继续执行」，让自检看到它期望的顺序；但若调试器仍排在前面，就必须同时调整调试器对该异常类别的处理策略（不停下、直接转交），否则插进去的处理器根本没有被调用的机会。
  difficulty: 4
  prerequisites:
  - tech:exception-trap-flag-detection
  artifacts:
  - art:pe64
  - art:elf64
  outputs:
  - 接管后的处理器顺序
  - 自检的返回值
  - 异常继续执行的路径
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: strings -a {{binary}} | grep -E "UnhandledExceptionFilter|VectoredException"
    note: 先定位目标注册了哪类处理器，向量化处理器优先级最高，接管要从它入手
  - cmd: gdb -q -batch {{binary}} -ex "handle SIGSEGV nostop noprint pass" -ex run
    note: 让调试器不介入而把信号交给目标自身处理器，观察目标的异常逻辑是否被满足
  procedure:
  - 先静态定位目标注册了哪几类处理器，向量化处理器优先于结构化展开，接管要从优先级更高的那一类入手。
  - 用调试器查看各异常与信号的处置表，确认当前哪些类别会被调试器自己消费；被消费的那些目标根本看不到。
  - 调整处置策略让调试器对这些类别不停下、直接转交，再确认目标侧确实收到了异常通知。
  - 注册或替换处理器并给出期望的返回值，让执行流在异常处理之后继续往下走。
  - 制造一次同类异常，同时确认三件事：处理器被调用、返回值被采纳、进程仍存活，三者同时满足才算接管生效。
  - 让目标自身的异常自检逻辑跑一遍，确认它得出「未被调试」的结论，而不只是进程没有崩溃。
  - 把覆盖不到的分支记下来：直接终止进程的异常类型不走处理器链，需要从产生异常的那一侧另行处理。
  pitfalls:
  - 处理器返回值语义分继续执行与重新抛出，改写错了会把可控异常变成进程终止
  - 接管只对走处理器链的异常有效，直接终止进程的异常类型不会经过这条路径
  note: 与「异常与陷阱标志检测」成对：识别侧看分发是否被接管，绕过侧插入处理器并给出期望返回值。
- id: tech:kernel-info-masking
  name: 内核调试信息屏蔽
  name_en: Kernel Debug Information Masking
  domain:
  - dom:ad-bypass
  parent: dom:ad-bypass
  def: 在内核层或查询接口层遮蔽调试器存在标志，让系统级检测读到未调试状态。难点是这些状态是多组件共享的全局值，局部改写会破坏一致性。
  detail: 场景是目标不只查自己进程的状态，而是查系统级调试标志与调试对象枚举，判断整机是否处在被调试环境；这类读数一处来自内核维护的全局变量，一处来自内核里的对象枚举。与「调试标志位篡改」的区别是那条路只影响单个进程内的内存字段，系统级查询根本读不到那份内存；与「模块与句柄遮蔽」的区别是本条遮蔽调试状态、那条遮蔽模块痕迹，两者覆盖面不同、常配合使用。注意点：这类全局值是多个组件共享的，只改一处就会出现「一个接口说没在调试、另一个接口说在调试」的自相矛盾，反而比不改更可疑；共享数据页是只读映射，改写要先处理页属性，处理不当会引发整机异常；不同编译号的内核结构偏移不同，必须靠符号定位而不能按固定偏移硬写；这类改动只在当前会话有效。
  principle: 下手点在内核层，而不是任何用户态接口。系统级检测之所以可信，是因为它读的东西目标进程改不到：内核把调试状态维护在全局变量里，并通过一块只读共享数据页映射给所有进程，用户态读它只是读内存，没有任何接口能写；调试对象枚举更要遍历内核对象。因此在用户态伪造查询接口的返回值只能骗过走该接口的调用者，凡是直接读共享页或自己做枚举的检测全会穿透。要让这类检测统一看到「未调试」，必须把事实改到内核里那份唯一的存储上——共享页背后的变量或其映射源，使所有读取者读到同一份值。这也是这一层代价最高的原因：一致性由你负责，改一处漏一处都会被交叉比对抓出来。
  difficulty: 5
  prerequisites:
  - tech:system-info-debug-query
  - tech:kernel-local-debugging
  - tech:kernel-crash-dump-analysis
  artifacts:
  - art:driver
  - art:pe64
  - art:memory-dump
  outputs:
  - 屏蔽后的调试状态读数
  - 受影响组件清单
  - 全局一致性的代价评估
  cost: high
  false_positive_risk: high
  commands:
  - cmd: cdb -p {{pid}} -c "dd nt!KdDebuggerEnabled L1; q"
    note: 调试器会话内读内核调试开关，改写前先确认符号与内存页属性
  - cmd: windbg -kl -c "dt nt!_KDDEBUGGER_DATA64; q"
    note: 本地内核调试下按结构体名读调试数据块，避免按固定偏移硬编码
  procedure:
  - 先用符号定位内核调试状态变量，而不是按固定偏移推算，并记录当前取值与调试连接状态作为基线。
  - 核对同一状态在共享数据页里的映射位置，确认用户态检测读到的确实来自这块页，而不是另一份缓存。
  - 处理页属性：只读页先改成可写，写回后恢复原属性；属性不一致本身就是新的可观测痕迹。
  - 写入期望值后逐项读回，共享页与内核变量两处取值一致才算改对。
  - 从用户态按检测方的方式各查一遍（系统信息查询、共享页直读），两条路径都给出未调试状态才算遮蔽完整。
  - 交叉验证一致性：检查内核里调试连接是否仍在工作；连接还在而状态被改成未调试，这种矛盾正好是多路检测要抓的目标。
  - 评估并记录影响面：受影响组件清单与恢复方式必须写清，这类改动跨重启失效，且可能引发整机异常。
  pitfalls:
  - 内核调试开关所在共享页是只读的，强行改写需要先改页属性，处理不当会引发整机异常
  - 不同编译号的内核结构偏移不同，按固定偏移改写会命中相邻字段并造成稳定性的隐蔽问题
  note: 与「系统调试状态查询」成对：识别侧查全局调试标志，绕过侧在共享页或查询接口层遮蔽。
- id: tech:ptrace-interception
  name: ptrace 拦截与伪装
  name_en: ptrace Interception and Masquerading
  domain:
  - dom:ad-bypass
  parent: dom:ad-bypass
  def: 拦截目标的自我附加调用或伪造跟踪者字段，让基于附加的自检通过。难点是跟踪者字段由内核写入，接口层伪造只对走库调用的路径有效。
  detail: 场景是目标在启动早期对自己发起附加，附加失败就判定已被调试；或在运行中读跟踪者字段看是谁在跟。与「调试对象解绑」的区别是那条路拆除 Windows 上的调试连接，本条处理 Linux 上的附加语义，两者机制不同、不能互相替代；与「异常链接管」的区别是异常自检看分发行为，本条看调用的成功与失败。注意点：能否附加由系统的附加限制级别决定，限制过严时真实附加与拦截后的假成功都失去意义，应先确认这个级别；拦截只能覆盖经库函数发出的调用，静态链接或直接执行系统调用指令的目标会穿透到内核；跟踪者字段由内核在附加时写入、解除时清除，用户态只能伪造读它的那条路径，改不了内核里的真实值；容器与命名空间里的进程视图未必等于宿主视图，读文件与枚举的落点要一并确认。
  principle: 下手点在库函数与系统调用的边界。检测的判据是「自附加是否失败」：内核在任何进程已被跟踪时拒绝第二次附加并返回权限错误，于是失败本身等于「有人先接管了」。这个判据依赖一次调用，而调用在用户态是可拦的——把库函数入口改成自己的处理函数，对附加类请求直接返回成功并跳过真正的系统调用，检测方赖以成立的失败判据就不存在了。同一层也能伪装跟踪者字段的读取，因为读它同样表现为一次文件读取调用。边界由「调用是否真的下发到内核」决定：一旦目标绕过库函数直接执行系统调用，钩子够不到；内核里该进程的跟踪状态从头到尾没被改动，任何从内核侧取数或由内核代为判断的检测，看到的仍是真相。
  difficulty: 4
  prerequisites:
  - tech:linux-ptrace-selfcheck
  artifacts:
  - art:elf64
  - art:so
  outputs:
  - 拦截生效的调用清单
  - 伪造后的自检返回值
  - 未覆盖的直接系统调用路径
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: cat /proc/sys/kernel/yama/ptrace_scope
    note: 先确认系统的附加限制级别，限制过严时拦截与真实附加都会失败
  - cmd: gdb -q -batch {{binary}} -ex "catch syscall ptrace" -ex run
    note: 在附加系统调用上停住，确认自我附加发生的时机与返回值判断点
  - cmd: objdump -d -M intel {{binary}} | grep -cE "syscall|int 0x80"
    note: 统计直接系统调用点，静态链接或直接调用会绕过库层拦截
  procedure:
  - 先确认系统的附加限制级别，并记录目标当前的跟踪者标识，这份标识代表真实状态，是后面判断有没有骗过的基准。
  - 动态跟踪附加调用，确认自附加发生的时机、请求类型以及目标如何判断返回值。
  - 统计直接系统调用点，判断是否存在绕过库层的路径；存在时这一层拦截注定不完整，要在结论里写明覆盖范围。
  - 在库函数入口落拦截，对附加类请求返回成功且不下发系统调用，让目标的失败判据失效。
  - 复核真实状态：再读一次跟踪者标识，取值未变，说明改的只是目标看到的返回，内核状态没有被改动过。
  - 让目标的自检跑一遍，观察它是否走正常分支；同时确认没有真实的附加侧效应，目标并没有真的被任何人跟踪。
  - 把拦不住的直接系统调用路径与更下层的处理方式记录下来，写明本层拦截的适用范围。
  pitfalls:
  - 目标直接执行系统调用指令时库层拦截完全失效，必须改代码路径或在更下层拦截
  - 跟踪者字段在附加后由内核维护，用户态伪造只骗过读文件的路径，不改变内核里的真实状态
  references:
  - https://man7.org/linux/man-pages/man2/ptrace.2.html
  note: 与「ptrace 自附加检测」成对：识别侧读跟踪者字段，绕过侧拦调用并伪造返回值。
- id: tech:module-handle-hiding
  name: 模块与句柄遮蔽
  name_en: Module and Handle Hiding
  domain:
  - dom:ad-bypass
  parent: dom:ad-bypass
  def: 让调试器注入的模块与相关句柄不出现在枚举结果里，降低环境痕迹的可信度。难点是枚举有多条路径，只断用户态链表时内核枚举照样看得见。
  detail: 场景是目标不只读状态位，还枚举自己进程里加载了哪些模块、持有哪些可疑句柄，从环境痕迹反推是否被注入式调试。与「调试标志位篡改」的区别是那条路改状态读数，本条改枚举结果本身；与「内核调试信息屏蔽」的区别是那条路动系统级状态，本条动进程内的枚举视图，层次与代价都不同。注意点：痕迹枚举还包括窗口类名、父进程与注册表值，本条只处理模块与句柄两类，剩下几类要另算；枚举有多条独立路径——进程环境块里的模块链表、装载器的模块哈希桶、按地址空间逐段查询、内核侧枚举，只摘链表时后几条照样能列出模块；被摘掉的模块其代码页仍映射在地址空间里，按页查询依然命得中；摘链要在等价的装载器锁保护下做，摘错指针会在后续卸载或释放时踩到已断开的链。
  principle: 下手点在用户态枚举视图。进程看「自己加载了什么」靠的是一组由装载器维护的双向链表与哈希桶，这些结构就在自己的可写内存里，因此可以按需摘除节点，让遍历它们的代码看不到被摘掉的模块；而同一批模块在内核里另有一份由内存描述符维护的记录，摘链表改不了那份记录。所以这一层的有效性完全取决于检测走哪条路：走链表与哈希桶骗得过，按地址空间逐段查询、或从内核侧枚举就会穿透。句柄同理——句柄表在内核里，用户态只能改查询接口返回的结果，改不了表本身。这就是为什么遮蔽必须按「覆盖了哪几条路径」来记账，而不是按「藏住了几个模块」来记账。
  difficulty: 5
  prerequisites:
  - tech:peb-flags-rewrite
  - tech:debug-object-detach
  - tech:kernel-info-masking
  - tech:debugger-artifact-enumeration
  artifacts:
  - art:pe64
  - art:driver
  outputs:
  - 遮蔽后的模块与句柄视图
  - 未被覆盖的枚举路径
  - 稳定性回归结论
  cost: high
  false_positive_risk: medium
  commands:
  - cmd: cdb -p {{pid}} -c "lm; q"
    note: 调试器会话内列出模块视图，遮蔽后回读这里确认目标侧枚举已看不到
  - cmd: cat /proc/{{pid}}/maps | wc -l
    note: 统计映射条目数作为基线，遮蔽前后条目变化能反映处理是否完整
  procedure:
  - 先建立基线：分别用模块链表遍历与地址空间逐段查询两条路径各列一遍，记下条目数与差异，作为遮蔽前后的对照。
  - 确认目标模块在各类结构里的位置：链表节点、哈希桶，以及它在地址空间里的映射记录。
  - 在持有等价装载器锁保护的时机内摘链，先修正前后节点的指针再移除节点，避免遍历者读到半更新的链表。
  - 按同一批路径重新枚举并对比基线，链表与哈希桶里查不到、其余路径仍在，才是如实的遮蔽范围。
  - 按地址空间逐段查询验证：被摘掉的模块其代码页仍可命中，据此判断是否需要下移到内核层处理映射记录。
  - 跑稳定性回归：让宿主卸载或释放相关资源，确认没有踩到已断开的指针；这一步优先于隐蔽性。
  - 句柄侧单独核对并写明结论：句柄表在内核里，用户态只能对查询接口的返回做文章，能做到什么程度要如实记录。
  pitfalls:
  - 从链表摘掉模块后若再卸载或释放，宿主会踩到已断开的指针，稳定性优先于隐蔽性
  - 只处理用户态链表时，基于内核内存描述符的枚举仍能列出全部模块，遮蔽范围要如实评估
  note: 与「调试环境痕迹枚举」成对：识别侧多路枚举痕迹，绕过侧从链表与句柄表里摘除。
