# BinAtlas 知识库 · 技术 · dom:ad-detect
# 规范：03-DATA-SCHEMA.md §2.2

- id: tech:peb-debug-flags-inspection
  name: 调试标志位读取
  name_en: PEB Debug Flag Inspection
  domain:
  - dom:ad-detect
  parent: dom:ad-detect
  def: 读进程环境块里的调试标志与堆标志判断是否被调试。难点是这些字段既可能被合法工具改写，也可能被伪造，单看一处会误判。
  detail: 场景：目标刚起来、还没跑到高风险分支时，先用一次最便宜的内存读取拿初判；也让程序给自己做守卫，判断此刻有没有人挂着。与调试端口与对象检查的区别是那一步进内核问调试对象，这一步不产生任何系统调用，只读自己地址空间里的一个字段，代价低但同样可被改写；与异常与陷阱标志检测的区别是那一步靠行为推断，这一步靠状态取值。注意点：进程能写自己的环境块，调试器也能在附加后把标志清掉，单看一处必错；堆标志的字段偏移随系统版本与位数变化，按固定偏移硬读会在新系统上读到无关字段；32 位与 64 位取环境块用的段寄存器与偏移都不同；兼容层、注入运行时同样会改这些字段，所以结论只能当初判，必须与端口、对象类证据互证。
  principle: 检测点落在用户态可读的进程环境块这一层：这块结构由内核在创建进程时建立，但映射在进程自己的用户地址空间里，读它不经过任何安全检查，所以「自己问自己是否被调试」在实现上只是一次普通内存读。它有效是因为附加的副作用由内核写进这块结构：调试子系统在建立调试会话时置上调试标志位，而当进程是在调试器下被创建时，全局标志里还会多出一组堆检查位，堆管理器据此换用调试堆路径，堆头里的标志与强制标志随之不同，这些都是内核与堆管理器的动作，不是调试器的自觉行为。它不可全信同样出于这一层：同一块内存对读取方与写入方权限相同，绕过方原地写回同一字节即可，且堆标志只记录创建那一刻的状态，附加在后的进程堆头不会变。
  difficulty: 2
  prerequisites: []
  artifacts:
  - art:pe64
  - art:pe32
  outputs:
  - 调试标志位取值
  - 堆标志异常判定
  - 是否被调试的初判
  cost: low
  false_positive_risk: medium
  commands:
  - cmd: cdb -p {{pid}} -c "dt ntdll!_PEB @$peb; q"
    note: 附加后打印进程环境块，观察调试标志字节与全局标志字段
  - cmd: objdump -d -M intel {{binary}} | grep -nE "gs:0x60|fs:0x30"
    note: 在反汇编里找按段寄存器取环境块的固定偏移，定位标志位读取点
  procedure:
  - 先确认目标位数与取环境块的方式：32 位走 fs 段、64 位走 gs 段，偏移抄错会直接读到别的字段。
  - 读环境块里开头的调试标志字节，取值为 1 记为可疑；为 0 不能收工，因为调试器可以把它清掉。
  - 读全局标志字段，看是否带那组堆检查位，带则说明进程是在调试器下被创建的，这比附加更早也更难伪造。
  - 顺着进程堆指针读堆头的标志与强制标志，两者偏离净值即命中；这两个偏移随系统版本变化，必须按结构体布局取。
  - 把三处结果并排看：三处同时指向被调试才算命中，只有一处异常时记为需复核，不要单独下结论。
  - 对可疑进程再用端口与对象类查询做交叉，两类证据同向才算确认，因为环境块这一层可以被同权限的写入改掉。
  pitfalls:
  - 标志位被调试器之外的兼容层或注入运行时改过会造成误判，必须结合堆标志与调试对象一起看
  - 偏移随位数不同，32 位从 fs 段取、64 位从 gs 段取，照抄偏移会读到无关字段
  note: 与「调试标志位篡改」成对：识别侧读调试标志字节与全局标志字段，绕过侧原地写回同一字段。
- id: tech:debug-register-inspection
  name: 调试寄存器检查
  name_en: Debug Register Inspection
  domain:
  - dom:ad-detect
  parent: dom:ad-detect
  def: 读线程上下文里的调试寄存器，判断是否有人设了硬件断点。难点是寄存器状态按线程保存，只看一个线程会漏。
  detail: 场景：怀疑对方没用软件断点、一个字节都没写目标内存，而是用四个硬件槽位盯住关键地址或关键数据时用；也用于自查，确认自己的线程有没有被人设了数据断点偷看。与断点与完整性检查的区别是那一步比对代码字节，硬件断点不改字节，扫内存永远扫不出来；与调试端口与对象检查的区别是端口只说明有人接管，调试寄存器说明接管者具体盯了哪几个地址、监视多宽。注意点：这组值按线程保存，内核在每次线程切换时随上下文存取，新创建的线程默认干净，只查发起检测的那一个线程必然漏；用户态不能用指令直接读这些寄存器，只能经系统调用取内核保存的那份快照，读到的是切换时存下的值而不是此刻 CPU 里的值；槽位数量固定且调试器自己也要占，常见情形是槽位被调试器的私用断点占着而不是目标地址；使能位与长度位是编码，按位判错会把数据断点当成执行断点。
  principle: 检测点在 CPU 与线程上下文之间那一层：调试寄存器是 CPU 物理寄存器，用户态无权用指令读，只能由内核在切换线程时存进线程上下文，再经取上下文的调用交给调用方，所以「读得到」本身就说明这组值被当作线程状态在保存。它有效是因为硬件断点的实现与软件断点相反：把地址写进比较寄存器、把使能位与长度位写进控制寄存器，之后由 CPU 在每次取指或访存时拿地址与四个槽位比对，命中才产生调试异常；目标内存一字节没变，字节比对与校验和完全看不出，只有寄存器状态留下痕迹。强度上限也在同一层：这组值由内核保存，而清零同样走设置上下文的调用，识别与绕过共用同一个接口，胜负只取决于谁先读到，要占优得下沉到内核直接读物理寄存器。
  difficulty: 3
  prerequisites: []
  artifacts:
  - art:pe64
  - art:pe32
  outputs:
  - 调试寄存器取值与断点配置
  - 硬件断点是否存在
  - 被监视地址范围
  cost: low
  false_positive_risk: low
  commands:
  - cmd: cdb -p {{pid}} -c "r dr0; r dr1; r dr2; r dr3; r dr6; r dr7; q"
    note: 调试器会话内逐个读调试寄存器，前四个非零通常意味着有硬件断点
  - cmd: strings -a {{binary}} | grep -c GetThreadContext
    note: 静态确认目标是否导入线程上下文获取接口，这是读调试寄存器的前置调用
  procedure:
  - 先确认查的是线程而不是进程：拿到全部线程句柄，逐个取上下文，只查主线程等于没查。
  - 读四个比较寄存器与状态、控制寄存器，四个比较寄存器全零且控制寄存器使能位全零才算干净。
  - 对非零的槽位解码：使能位为 1 表示该槽启用，配合 RW 与长度编码判断是执行断点还是数据断点、监视范围多宽。
  - 命中判据是「比较寄存器非零」且「对应使能位为 1」两件事同时成立；比较地址残留但使能位为 0 是调试器用过又关掉的痕迹，记为可疑而不是命中。
  - 新线程出现后要重新取一次上下文，因为线程创建时这组值被初始化为零，之前那一轮检查覆盖不到它。
  - 把命中的地址与代码段、数据段边界对照，落在关键校验或密钥访问路径上的才算实证，落在调试器自身私用地址上的只记为调试器在场。
  pitfalls:
  - 调试寄存器属于线程上下文，新创建线程默认为零，必须逐线程检查才不会漏
  - 使能位与长度位有固定编码，按位判断错会把数据断点当成执行断点
  note: 与「调试寄存器清零」成对：识别侧按线程读寄存器，绕过侧清空使能位并回读确认。
- id: tech:debug-port-object-inspection
  name: 调试端口与对象检查
  name_en: Debug Port and Debug Object Inspection
  domain:
  - dom:ad-detect
  parent: dom:ad-detect
  def: 查询进程的调试端口、调试对象句柄与调试标志，判断是否被接管。难点是不同信息类返回值语义不同，零值与非零值都可能有歧义。
  detail: 场景：需要在目标进程内部问「我这个进程有没有被别人接管」，而不是从外面看的时候用。同一族查询用不同信息类给出三件事：调试端口、调试对象句柄、调试标志，三者读的是同一份内核状态的不同投影。与调试标志位读取的区别是那一步读用户态结构体、自己就能改，这一步问内核对象、用户态改不了。与系统调试状态查询的区别是那一步问整机有没有内核调试器，这一步只问本进程有没有被用户态调试器接管，粒度不同不可互替。注意点：三个信息类的返回值语义彼此相反，不能套同一个判据：对象句柄类在无人附加时返回的是一个「端口未设置」的状态码而不是零，把失败当零会把「没人附加」和「查询失败」混为一谈；标志类的取值方向与另外两类相反，被调试时返回零，照抄非零即为真的套路会整体判反；端口非零只证明存在调试端口，制造这个值的不一定是常规调试器，必须三类同看。
  principle: 检测点在内核对象这一层：调试会话在内核里表现为一个调试对象，被调试进程的进程结构里挂着一个指向该对象的端口指针；端口、对象句柄、标志三种查询读的是这同一份内核状态的不同投影，所以进程即使把环境块改干净，这条路仍答得出来。它有效是因为这三个值只在建立或拆除调试会话时由内核写入，用户态要伪造一个「看起来像调试端口」的东西，得先真的创建调试对象并完成附加，而这一步本身会在别处留下痕迹。它必须三类交叉的原因也在这层：每类的空值含义不同，对象句柄类缺的是错误状态而不是零，标志类的取值方向相反，单看一类就会在「从未附加」「附加后被解绑」「查询本身失败」三种情形之间混淆，而这三种情形对反调试的结论完全相反。
  difficulty: 3
  prerequisites:
  - tech:peb-debug-flags-inspection
  artifacts:
  - art:pe64
  outputs:
  - 调试端口与对象句柄状态
  - 线程隐藏调试状态
  - 进程是否处于被调试状态
  cost: low
  false_positive_risk: low
  commands:
  - cmd: strings -a {{binary}} | grep -c NtQueryInformationProcess
    note: 确认目标是否引用进程信息查询接口，这是查调试端口与调试对象的最短路径
  - cmd: strings -a {{binary}} | grep -c NtSetInformationThread
    note: 确认是否存在线程信息设置调用，主动隐藏调试状态就靠这个接口
  procedure:
  - 先取调试端口，读到非零记为可疑；读不到或返回失败先确认是权限还是语义问题，别急着当成零。
  - 再取调试对象句柄，返回句柄即命中；返回「端口未设置」类状态码才算没有调试会话，这一步必须按状态码判而不是按返回值真假判。
  - 接着取调试标志，按取反理解：值为零表示被调试，非零表示没有被调试，与前面两类的判读方向相反。
  - 命中判据是三类中至少两类同向指向被调试；只有端口非零而对象句柄与标志均干净时，判为端口残留或来源不明，不下结论。
  - 对判为可疑的进程回读一次：附加与解绑都要经过内核，如果两次采样之间结论翻转，说明有工具在实时拆装调试会话。
  - 把结论落到「本进程被接管」这一粒度上，整机状态另行查询，两类结论不可互相替代。
  pitfalls:
  - 调试端口在未附加时也可能非零，只凭非零值判定被调试会误报
  - 线程级隐藏标志一旦设置不会自动清除，能发现主动隐藏行为，但无法区分调试器与其他工具
  note: 与「调试对象解绑」成对：识别侧查端口、对象句柄与调试标志三类信息，绕过侧解除对象关联。
- id: tech:breakpoint-integrity-inspection
  name: 断点与完整性检查
  name_en: Breakpoint and Integrity Inspection
  domain:
  - dom:ad-detect
  parent: dom:ad-detect
  def: 扫描代码段里的断点指令或比对节区校验和，发现内存被改写。难点是合法自修改代码与热补丁也会改字节，判定必须结合基线与范围。
  detail: 场景：怀疑对方用软件断点在最关键的校验指令或密钥比对上动手，也就是往目标地址写进一个单字节断点指令；也用于发现运行期补丁与内联钩子这类「内存与磁盘不一致」的改动。与调试寄存器检查的区别是硬件断点一个字节都不改，用这一步永远扫不出来；反过来这一步能抓硬件断点抓不到的东西，任何对代码字节的改写都会留下差异。与运行时内存读写的区别是那一步负责改和读，这一步负责判定「该不该是现在这样」。注意点：判定基准是磁盘上的原始副本，所以范围必须先划清：代码段边界、对齐填充、未初始化段，范围划错就会把正常差异算成改写；合法自修改代码、运行期热补丁、加载器对绝对地址的重定位都会制造同样的字节差异；只扫单字节断点特征还会漏掉多字节断点编码，不同体系结构的断点指令字节互不相同，特征不能跨架构共用；按节区取校验和时若把填充与未初始化部分也算进去，正常加载就会产生稳定偏差。
  principle: 检测点在「进程内存里的字节」与「磁盘副本里的字节」之间：软件断点把目标地址上的指令首字节换成单字节断点指令，CPU 取指到那里产生断点异常把控制权交给调试器，调试器再把原字节写回、把指令指针退回去；只要断点还挂着，内存里就必然有一个与磁盘副本不同的字节。它有效是因为这个替换必须发生在将被执行的那条指令上，不能像硬件断点那样把比对交给 CPU，否则它根本不会停下，所以「内存字节不同于磁盘字节」是软件断点的必要条件，而校验和是发现差异最省事的办法。盲区同在此层：它只回答「字节变了」，不回答「谁改的」，自修改代码与热补丁改的是同一批字节，因此结论要落到哪一段被改、改成什么、是否可执行，而不是有没有差异。
  difficulty: 3
  prerequisites:
  - tech:memory-read-write-patch
  artifacts:
  - art:pe64
  - art:elf64
  outputs:
  - 可疑断点指令位置
  - 节区校验和差异
  - 被改写字节的范围
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: r2 -q -c "/x cc" -c "q" {{binary}}
    note: 在文件或进程映像里搜索断点指令字节，命中处需人工确认是否为真实断点
  - cmd: readelf -S {{binary}} | grep -E "\.text|\.plt"
    note: 先划定代码段边界，校验和覆盖范围不划清就会把数据段差异当成改写
  procedure:
  - 先从可执行文件的节头划出参与比对的代码段范围，只比代码段，不复核填充与未初始化段。
  - 以节内容算基线校验和或摘要，同时在内存里对同一范围算一份，两份不一致即进入定位。
  - 不一致时逐字节比对找出偏移，再看该位置的字节是不是断点指令特征；单字节断点指令只是其中一种，务必也考虑多字节断点编码。
  - 命中判据是「偏移落在代码段」且「字节等于断点特征」且「与磁盘副本不同」三条同时成立；只有校验和差异找不到断点字节的，记为改写而不是断点。
  - 对命中的地址反查符号或交叉引用，落在校验、反调试判定或密钥比较路径上才算实证。
  - 周期性重复比对并保留每一轮的差异集：差异集随运行变化说明是对端在动态下断，固定不变说明是启动前的静态改写。
  - 换架构时整体替换断点特征，不能沿用上一套的特征字节。
  pitfalls:
  - 合法自修改代码、热补丁与调试器断点留下的字节差异完全相同，单看差异无法归因
  - 按节区取校验和时若把未初始化段与对齐填充也算进去，正常加载就会产生偏差
  note: 与「断点完整性绕过」成对：识别侧扫断点字节与校验和，绕过侧回填原始字节或不落断点。
- id: tech:timing-delta-detection
  name: 时间差检测
  name_en: Timing Delta Detection
  domain:
  - dom:ad-detect
  parent: dom:ad-detect
  def: 比较关键代码段的执行耗时判断是否被单步或断点拖慢。难点是合法调度与虚拟化本身就有抖动，阈值定得越紧误报越多。
  detail: 场景：标志位、端口、寄存器都被抹平之后，用时间这个最难完全抹平的维度做交叉验证；也用于发现单步跟踪，因为单步会把每条指令都拖成一次与调试器的往返，量级差异最大。与其他手段的区别是那些读的是状态，状态可以被写成假的，这一手读的是代价，要伪造代价就得把真实执行也一起伪造。与时间源返回伪造是攻防的同一个面：这一步测的是墙钟与执行流的关系，绕过方也只能在时间接口这一层动手。注意点：阈值必须按环境标定，虚拟机、容器与开了频率调节的机器跟物理机差一个量级，同一阈值换个环境就从从不误报变成全部误报；单次测量没有意义，要看分布与多次采样的稳定性；测量代码自身不能引入系统调用、首次访问缺页这些开销，否则测到的是自己的成本；涉及跨核迁移与时间源切换时，读数本身会跳。
  principle: 检测点在「代码执行流」与「时间源」的交界处：被调试的进程暂停时线程不再参与调度，一条指令也不执行，而墙钟与单调时钟由内核和硬件时钟源继续走，所以这段暂停对进程不可见，只表现为两次读时钟之间的巨大跳变。它有效是因为暂停、断点命中与单步都要把控制权交回调试器进程，往返发生在内核调度层，被调试线程全程处于停止状态；单步更极端，每条指令都要走异常、通知、等待继续的流程，开销比正常执行高几个数量级，抹平它远比伪造一个标志位贵。它的可靠上限也在同一层：调度抢占、缺页、频率变化同样让线程不在跑而墙钟照走，这些与调试暂停在时间上不可区分，只能靠分布、多次采样与切换计数区分，所以它是中等强度证据，不宜单独立论。
  difficulty: 2
  prerequisites: []
  artifacts:
  - art:pe64
  - art:elf64
  outputs:
  - 代码段耗时分布
  - 异常延时判定
  - 阈值与误报率关系
  cost: low
  false_positive_risk: high
  commands:
  - cmd: strace -f -tt -e trace=clock_gettime,gettimeofday -p {{pid}}
    note: 观察目标读时钟的调用频率与时机，时间差检测必然高频读时钟
  - cmd: perf stat -e task-clock,context-switches -p {{pid}} sleep 5
    note: 统计目标的时间片与上下文切换，用于区分调试停顿与被调度抢占
  procedure:
  - 先选一段边界清晰、依赖少的被测区域，并在区域内避免系统调用与首次访存，否则耗时里混进的是别的开销。
  - 在区域两端读同一个单调时钟源，连做多轮采样，保留完整分布而不是只看平均值。
  - 取未在调试下的同一份基线分布，比较两者的中位数与上尾；中位数明显右移且上尾出现成簇的毫秒级台阶才算命中。
  - 命中判据是「可重复的成簇长延时」而不是「某一次很慢」：单次超标只记为抖动，重复出现且台阶量级稳定才判被调试。
  - 同时统计同一时段的上下文切换次数，切换次数没变而耗时大幅上升，说明线程是被外部暂停而不是被调度抢占。
  - 对疑似单步的情形把被测区域缩到只剩几条指令，若单条指令的耗时也成倍上升，就是每条指令一次陷入的典型特征。
  - 换环境必重标阈值，跨机器、跨虚拟化平台直接沿用旧阈值等于放弃这一步。
  pitfalls:
  - 虚拟机与容器里的时钟精度远低于物理机，同一阈值在虚拟化环境下必然误报
  - 调度抢占、缺页与频率调节都会制造毫秒级抖动，只看单次测量不足以判定被调试
  note: 与「时间源返回伪造」成对：识别侧测代码段耗时，绕过侧在时间接口层给出一致读数。
- id: tech:exception-trap-flag-detection
  name: 异常与陷阱标志检测
  name_en: Exception and Trap Flag Detection
  domain:
  - dom:ad-detect
  parent: dom:ad-detect
  def: 用自抛异常、陷阱标志或未处理异常过滤器探测调试器是否接管了异常分发。难点是处理器顺序由系统决定，判定依赖对语义差异的理解。
  detail: 场景：要问的不是「有没有人挂着」，而是「挂着的那个人有没有真正接管异常分发」。自己抛一个异常再看处理器有没有被调用，比读任何状态位都更贴近调试是否真实生效；只做了轻量注入或调试器把异常放过时，前一类证据为真而这一手为假，两者结论并不总一致。与其他手段的区别是那些读状态，这一手读行为。注意点：陷阱标志是线程级的，只影响当前线程，且执行一条指令后就被清除，跨线程或跨系统调用都传不过去；未处理异常过滤器在被调试时不被调用，所以命中信号是「我的过滤器没被调用」，而「被调用了」并不能反证没被调试，因为处理器链里可能有人先一步接管；异常与信号在两套系统上的分发路径不同，语义照搬会判反。
  principle: 检测点在异常分发链上：异常由内核产生后先交给调试端口，调试器是第一顺位消费者，它选择继续后异常才回到用户态分发，依次是向量化处理器、结构化处理器、未处理异常过滤器。所以「我注册的处理器是否被调用」直接反映这一环有没有被截胡。它有效是因为系统自己固化了这个差异：未处理异常过滤器在被调试时不生效，分发路径先查进程是否被调试，是则跳过过滤器把异常交给调试器；目标抛一个无人处理的异常再看过滤器有没有跑过，答案不依赖调试器的自觉。不能单独立论也在这层：处理器链与信号处置表都能被注入代码改掉，自己注册的处理器可能被更早的接管者挤掉，判据必须落在「期望被调用的处理器是否被调用」，而不是「异常有没有发生」。
  difficulty: 4
  prerequisites:
  - tech:exception-dispatch-tracing
  artifacts:
  - art:pe64
  - art:elf64
  outputs:
  - 异常处理器链状态
  - 陷阱标志是否被吞
  - 调试器接管异常的判断
  cost: low
  false_positive_risk: medium
  commands:
  - cmd: strings -a {{binary}} | grep -E "SetUnhandledExceptionFilter|AddVectoredExceptionHandler"
    note: 静态定位目标是否注册了异常处理器，这类调用是自检手法的前置
  - cmd: gdb -q -batch -p {{pid}} -ex "info signals"
    note: 查看各信号处置表，陷阱信号若被设为不停止，说明异常会被调试器静默吞掉
  procedure:
  - 先注册一个只在检测里使用的处理器，把「我跑过了」记进一个进程内可读的标志，再抛一个自己不打算正常处理的异常。
  - 看标志是否被置上：置上说明异常回到了用户态分发，没人截胡；没置上说明异常被调试器吃掉了，这是命中。
  - 做对照：同一段代码在不抛异常时把标志清掉，确认标志只会由处理器置位，否则命中判据不成立。
  - 换用陷阱标志做第二种测法：给当前线程置上单步标志再执行一条无害指令，看自己的处理器有没有收到单步异常。
  - 命中判据是「两种测法同向」：自抛异常没回到过滤器、且单步异常没回到自己的处理器，才算调试器真正接管了分发。
  - 只在当前线程做陷阱标志测法并做完立刻清掉，跨线程测会把标志带到别的执行流上。
  pitfalls:
  - 陷阱标志只对当前线程有效且执行一条指令后自动清除，跨线程或跨系统调用就不成立
  - 未处理异常过滤器在被调试时不生效，这个差异可用来探测，但也可能被兼容层改变
  note: 与「异常链接管」成对：识别侧看异常分发是否被接管，绕过侧插入处理器并给出期望返回值。
- id: tech:system-info-debug-query
  name: 系统调试状态查询
  name_en: System Debug State Query
  domain:
  - dom:ad-detect
  parent: dom:ad-detect
  def: 查询系统级调试器存在标志与调试对象枚举，判断整机是否处于被调试状态。难点是这类接口返回全局状态，粒度粗且易受兼容层影响。
  detail: 场景：要判断的是整机有没有处在调试之下，而不是某个进程有没有被附加。这两件事经常被混为一谈，实际粒度完全不同：前者往往意味着整个分析环境在被监控，后者只说明一个进程被接管。与调试端口与对象检查的区别就是粒度，本机没有进程被附加也不代表没有内核调试器在场，两类结论不能互相替代。注意点：这类接口返回全局状态，权限与开销都是问题，枚举全系统调试对象要足够权限，句柄表大的机器上开销可观且结果可能不完整；开关类信息其实有两个独立的量，一个表示是否启用调试支持，一个表示调试器是否不在场，只看第一个会把「允许调试但没人连」当成正在被调试，这是这一步最常见的误判；这类状态在启动期就定了，运行中改动要重启，所以它反映的是环境怎么配的，不是此刻有没有人在看。
  principle: 检测点在内核的调试配置与调试会话这一层：内核在启动时按启动配置决定是否装载调试支持，并把「是否启用」与「调试器是否已连接」分别记账；用户态查询读到的是这两个布尔量的镜像，另一条路径读的是映射在只读页里的同一批副本。它有效是因为开关由启动配置决定、连接状态由内核在调试器接入时改写，两者都不是目标进程能左右的东西，进程即使把环境块、异常链、时间读数全部伪装，也没法让内核改口说没有调试器。它的效力边界也在这层：它回答整机问题，与本进程有没有被用户态调试器附加无关；那份副本位于共享数据页，可被更下层的组件改写，所以「读到未启用」是弱结论，「读到已启用且调试器在场」才是强结论，两侧强度不对称。
  difficulty: 3
  prerequisites:
  - tech:debug-port-object-inspection
  artifacts:
  - art:pe64
  - art:driver
  outputs:
  - 内核调试开关状态
  - 调试对象枚举结果
  - 整机调试状态判定
  cost: low
  false_positive_risk: medium
  commands:
  - cmd: strings -a {{binary}} | grep -c NtQuerySystemInformation
    note: 确认目标是否调用系统信息查询接口，这是查内核调试状态的最短路径
  - cmd: bcdedit /enum {current}
    note: 在分析机上核对调试配置，与目标报告的状态做对照
  procedure:
  - 先读启动配置里的调试开关，确认这台机器在启动期就允许了调试，这一步只给出前提，不做结论。
  - 再查系统信息里的调试器状态，拿到两个量：是否启用、调试器是否不在场。
  - 命中判据是「启用为真且调试器不在场为假」两条同时成立；启用为真而不在场为真只是允许调试但没人连接，不算命中。
  - 需要确认是一台机器还是几个进程时，转做调试对象枚举，按对象类型筛选而不是按进程名匹配。
  - 枚举结果为空而前面的开关为真，判为权限不足或结果被裁过，不要当成没有调试器。
  - 把结论标注为整机级，与进程级检测分开记录，两类结论不合并成一个总判定。
  pitfalls:
  - 内核调试开关是启动期决定的全局值，用户态读到的共享数据页可能已被其他组件改写
  - 调试对象枚举在海量句柄的机器上开销大，句柄权限不足时结果还不完整
  note: 与「内核调试信息屏蔽」成对：识别侧查全局调试状态，绕过侧在更下层遮蔽同一批标志。
- id: tech:linux-ptrace-selfcheck
  name: ptrace 自附加检测
  name_en: ptrace Self-Attach Detection
  domain:
  - dom:ad-detect
  parent: dom:ad-detect
  def: 用自我附加或读跟踪者字段判断是否已被调试，失败即说明有人先接管。难点是检测与调试器的抢占有时序，检测逻辑本身会改变进程状态。
  detail: 场景：这类系统上没有那套调试对象，最直接的问题是「内核认为谁在跟踪我」。进程可以读自己的跟踪者字段，也可以试着对自己或对父进程发起附加，用系统调用是否被拒绝得到答案。与调试端口与对象检查的区别是那边问的对象在内核里叫调试对象，这边只有跟踪者指针，语义更窄但更硬。注意点：读跟踪者字段是纯读、没有副作用；自我附加会真的改变进程状态，成功后自己就成了被跟踪方，不显式解脱的话后续正常调试反而附加不上，所以能读就别附加。能否附加由系统策略决定，发行版常限制为只允许跟踪自己的后代，这个限制会让自我附加在正常环境下也失败，把策略拒绝当成有人跟踪就会误报；策略文件在未启用该机制的内核上并不存在，缺失本身不代表无限制。可转储性也参与权限判定，进程改变身份后可能变成不可附加。
  principle: 检测点在内核的进程跟踪状态这一层：内核为每个进程记一个跟踪者指针，附加时指向跟踪方，分离时清空；procfs 里的跟踪者字段就是把这个指针按号打印出来，读它是普通文件读，内容由内核填，进程改不了。它有效是因为附加必须先过内核的权限与策略检查，并且在同一时刻只能有一个跟踪者，已经被跟踪的进程再被附加会被拒绝，所以「附加失败」与「跟踪者非零」指向同一件事，而「附加成功」是排他性证明：从这一刻起别人再附加都会失败。弱点也在这层：策略层与调用层都可能被更下层改写，内核模块、劫持读取的预加载库、抢先附加的父进程，都能让读到的字段与真实状态不一致，所以这条证据强在内核记账，弱在记账之前那次调用有没有被拦。
  difficulty: 2
  prerequisites: []
  artifacts:
  - art:elf64
  - art:so
  outputs:
  - 跟踪者进程标识
  - 自附加结果
  - 进程可调试性状态
  cost: low
  false_positive_risk: low
  commands:
  - cmd: grep TracerPid /proc/{{pid}}/status
    note: 直接读跟踪者字段，非零即表示已被某进程跟踪
  - cmd: strings -a {{binary}} | grep -E "ptrace|dumpable"
    note: 静态确认目标调用了附加接口或可转储性设置，两者常被组合使用
  - cmd: cat /proc/sys/kernel/yama/ptrace_scope
    note: 查看系统的附加限制级别，取值不同会改变自附加与外部附加的可行性
  procedure:
  - 先读目标进程的跟踪者字段，非零即说明已被跟踪，命中并记下跟踪者标识。
  - 为零时再确认这项能力是否可用：读策略文件，文件不存在说明该机制未启用，判定退回到按用户与可转储性判断。
  - 读策略取值：允许任意同用户进程附加时自我附加可行，限制为只能跟踪后代时自我附加从父进程发起才可行，更强取值下直接判定不可附加。
  - 需要主动求证时向父进程发起一次附加，被拒绝表示已有跟踪者，返回成功表示无人跟踪；成功后必须立刻分离，否则自己变成被跟踪方。
  - 命中判据是「跟踪者非零」或「附加被拒绝且原因不是策略限制」两者之一；因策略被拒绝不能记成命中，那是环境限制。
  - 附加成功后回读跟踪者字段，看到它等于调试方标识才算真的拿到控制权，这一步同时是排他性证明。
  pitfalls:
  - 自我附加成功后若不解脱，目标会一直处于被跟踪状态，后续正常调试反而无法附加
  - 跟踪者字段由内核在附加时写入，用户态无法可靠伪造，绕过只能放到更下层
  note: 与「ptrace 拦截与伪装」成对：识别侧读跟踪者字段与自附加结果，绕过侧在调用层拦截并伪造返回。
  references:
  - https://man7.org/linux/man-pages/man2/ptrace.2.html
- id: tech:debugger-artifact-enumeration
  name: 调试环境痕迹枚举
  name_en: Debugger Artifact Enumeration
  domain:
  - dom:ad-detect
  parent: dom:ad-detect
  def: 枚举窗口类名、已加载模块、调试相关注册表值与父进程，从环境痕迹推断调试器存在。难点是痕迹来源多且都能被改写，单一痕迹不足定论。
  detail: 场景：进程内的检测全被绕过之后，退到外面看环境。调试器本身是一个独立进程，它的窗口、它拉起的启动链、它注入到目标里的模块、以及系统在无人值守时用来接管崩溃的注册项，都在目标进程之外留下痕迹。与其他手段的区别是那些都在目标进程内部读状态、可以随进程一起被伪造，这一步读的是系统视图，篡改成本更高但可解释性更差，同一个痕迹常常有很多无关来源。注意点：所有痕迹都能改，模块名与路径可以替换，窗口类名可以伪造，父进程可以借壳，注册表项可以删掉；按名字匹配是最大的误报来源，因为正常软件里同名模块、同名窗口类大量存在；跨系统可用痕迹差异极大，一套系统的枚举清单套到另一套上等于瞎猜。结论必须落到多路痕迹互证与启动链能否自洽，而不是任何单条命中。
  principle: 检测点在进程内部状态之外的系统环境这一层：调试器要拿到控制权就必然在系统里占据一些外部位置：可枚举的窗口、把目标作为子进程拉起的启动链、注入进目标的模块、系统在无人值守时用来接管崩溃的注册项。这些位置都不在被调试进程的可写内存里，进程内那些「把字段写回原值」的手段够不到。它有效是因为枚举接口读的是系统维护的全局视图，要改这些视图得先有注入、句柄操作或注册表写的能力，而这些动作本身又成为新痕迹，攻防在这里是被抬上一层而不是消失。最弱的原因也在这层：视图是环境不是事实，名字、路径、父进程号都能被合法或非法的理由改变，痕迹与正在被调试之间只有概率关系，所以它只能当加权证据，多路独立痕迹同向才成立。
  difficulty: 3
  prerequisites:
  - tech:peb-debug-flags-inspection
  - tech:debug-port-object-inspection
  artifacts:
  - art:pe64
  - art:elf64
  outputs:
  - 可疑窗口与模块清单
  - 调试相关注册表项
  - 父进程与启动链判定
  cost: medium
  false_positive_risk: high
  commands:
  - cmd: cat /proc/{{pid}}/maps | grep -iE "dbg|debug|trace"
    note: 在映射里找调试与追踪相关模块，注入式调试器都会留下映射
  - cmd: ls -l /proc/{{pid}}/exe /proc/{{pid}}/cwd
    note: 核对可执行体与工作目录，异常启动路径常暴露被包裹的调试会话
  - cmd: grep -E "^(PPid|Name)" /proc/{{pid}}/status
    note: 读取父进程号与进程名，启动链异常本身是一类痕迹
  procedure:
  - 先列目标的模块与映射，按路径与签名筛而不是按名字关键词筛，落在外来目录且无签名的最可疑。
  - 再看启动链：父进程是谁、可执行体路径与工作目录是否自洽，父进程是被调试器而非常规外壳就是一条强痕迹。
  - 枚举系统里可见的窗口类与调试相关注册项，作为旁证，不作为定论，因为同名类与遗留项在正常机器上大量存在。
  - 命中判据是「至少两路彼此独立的痕迹同向」：例如外来模块加异常父进程，或调试注册项加窗口类，单路命中只记为待复核。
  - 对候选痕迹逐一给出合理解释，能被正常软件解释掉的剔除，剩下无法解释的才进入结论。
  - 跨平台时整体换一份痕迹清单，不要沿用另一套系统的枚举项。
  pitfalls:
  - 模块名可被改写的调试器完全避开关键词匹配，靠名字枚举会漏掉内嵌调试组件
  - 同名窗口类与进程名在正常软件里也大量存在，按名字命中就下结论误报率极高
  note: 与「模块与句柄遮蔽」成对：识别侧多路枚举痕迹，绕过侧把模块与句柄从枚举视图里摘掉。
