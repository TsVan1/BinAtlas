# BinAtlas 知识库 · 领域（含子领域，parent 指向上级）
# 规范：03-DATA-SCHEMA.md §2.1

- id: dom:malware-analysis
  name: 恶意软件分析
  name_en: Malware Analysis
  def: 判定样本的意图、能力与家族归属，产出可复用的检测特征与 IOC。核心难点是分析对象主动对抗：反调试、加壳、环境感知与延时触发，使"没观察到某行为"无法等同于"样本没有该能力"。
  artifacts:
  - art:pe32
  - art:pe64
  - art:pe-dotnet
  - art:document
  - art:shellcode
  - art:memory-dump
  entry_difficulty: 3
  coverage: partial
  note: 难度 3 指的是"入门线"：跑隔离环境看行为、读字符串就能出初判，1-2 天可达。 但对抗样本脱壳与家族归因实际在 4-5 档，入门线与专业线差距大是本领域固有特征，
    entry_difficulty 只记入门线，专业难度见各 technique 的 difficulty。
- id: dom:av-evasion
  name: 免杀与对抗技术
  name_en: AV Evasion
  def: 在保持恶意行为可执行的前提下，绕过杀毒与 EDR 的静态特征与动态行为检测。核心难点是检测方持续演进，任何具体手法都有存活窗口。
  artifacts:
  - art:pe32
  - art:pe64
  - art:shellcode
  entry_difficulty: 5
  coverage: partial
- id: dom:av-evasion-static
  name: 静态免杀
  name_en: Static Evasion
  def: 改写二进制特征使其不被特征库命中。难点是改完不能破坏原有功能，且要防止哈希与熵特征暴露。
  artifacts:
  - art:pe32
  - art:pe64
  - art:shellcode
  entry_difficulty: 4
  coverage: partial
  parent: dom:av-evasion
- id: dom:av-evasion-dynamic
  name: 动态行为免杀
  name_en: Dynamic Evasion
  def: 规避运行时行为监控，包括 API 调用链隐藏、内存权限切换与直接系统调用。难点是行为链一旦被完整记录就无法隐藏。
  artifacts:
  - art:pe32
  - art:pe64
  - art:shellcode
  entry_difficulty: 5
  coverage: partial
  parent: dom:av-evasion
- id: dom:av-evasion-loader
  name: 加载器与内存执行
  name_en: Loader & In-Memory Execution
  def: 把载荷从磁盘或网络载入内存并执行，避免落地文件被扫描。难点是内存扫描与反射式注入检测。
  artifacts:
  - art:pe32
  - art:pe64
  - art:shellcode
  entry_difficulty: 4
  coverage: partial
  parent: dom:av-evasion
- id: dom:av-evasion-edr
  name: EDR 与 AV 绕过
  name_en: EDR/AV Bypass
  def: 针对具体产品的检测点做定向规避，如钩子摘除、ETW 关闭、回调卸载。难点是每家的检测点与版本都不同。
  artifacts:
  - art:pe32
  - art:pe64
  - art:shellcode
  entry_difficulty: 5
  coverage: partial
  parent: dom:av-evasion
- id: dom:av-evasion-sandbox
  name: 沙箱与环境对抗
  name_en: Sandbox Evasion
  def: 识别分析环境并延迟或改变行为，让样本在沙箱里表现无害。难点是过度对抗本身会成为可疑信号。
  artifacts:
  - art:pe32
  - art:pe64
  - art:shellcode
  entry_difficulty: 4
  coverage: partial
  parent: dom:av-evasion
