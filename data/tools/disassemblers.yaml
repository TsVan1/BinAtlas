  source:
    - https://github.com/radareorg/radare2
    - https://www.radare.org/
  verified_at: 2026-11-13
  headless: yes
  ai_ready: mcp
  tldr: >-
    解决嵌入式与冷门架构上要纯命令行做完分析的问题：只用 shell 就能完成定位函数、跟踪引用、打补丁与格式解析，打包进固件镜像或容器里也不挑环境。
    适合固件批量扫描、无 GUI 的服务器侧分析、以及要把反汇编步骤写进自动化脚本的流水线。
    短板是命令体系陡峭且参数组合难记，反编译能力弱于 IDA/Ghidra，深度 C++ 分析常需回退到人工读汇编。
  note: r2pipe 提供稳定的 Python/JS 绑定；radareorg 官方维护 radare2-mcp，可让 LLM 直接调用 r2 命令。
