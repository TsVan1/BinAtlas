  tldr: >-
    解决编码套娃与算法识别只能靠临时脚本的问题：把 Base64、异或、RC4、AES、gzip 等上百种变换拖成操作链，边看中间产物边试，几步就能剥开混淆层级。
    适合脚本样本的混淆还原、移动样本里配置字符串的解密试错，以及把一段可复现的解密链固化成可交付的操作链。
    短板是只管一次性数据变换、不做批量调度与结论管理；链一长就难读，复杂算法仍需回到代码层验证参数与密钥来源。
  note: 官方提供 Node 侧 API（npm 包），可把操作链当代码复用；无 MCP。
