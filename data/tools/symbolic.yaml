  tldr: 解决"要自动找出触发某段代码的输入"的问题：把二进制提升到 VEX 中间表示后做符号执行，用约束求解生成满足校验条件的按键或协议报文。 适合固件里单函数级的口令校验绕过、CTF
    类逆向题的自动化求解、以及恶意样本配置解密路径的批量探索。 短板是符号执行路径爆炸严重，中等规模函数就可能算不动，环境依赖与库调用需手工建模打桩；结论可靠性受建模假设限制，不适合直接当作漏洞证据。
  note: 官方另有 angr-management GUI；无官方 MCP，Python API 是唯一稳定入口。
