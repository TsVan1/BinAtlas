# BinAtlas 知识库 · 技术（试点批次）
# 规范：03-DATA-SCHEMA.md §2.2

- id: tech:malware-static-triage
  name: 样本静态研判
  name_en: Static Malware Triage
  domain:
  - dom:malware-analysis
  def: 不运行样本，用结构、导入函数、字符串、熵与规则匹配给出初判与家族线索。难点是加壳混淆后静态信号几乎归零，必须判断哪些字段仍可信——最常见错误是把壳的特征当成样本能力。
  detail: 适用场景是样本刚到手、决定要不要进沙箱之前，用文件自身信息给出能力初判与优先级；也用于告警复核和批量分诊。与行为动态分析的区别是全程不执行代码，结论来自结构、常量与规则匹配，加壳或混淆后大量判据失效；与家族归因的区别是这里只给候选线索，不承担同源证明。环境注意点：先分清原生 PE 与 .NET，后者应看元数据与 IL 而不是导入表；文档与脚本没有统一结构，规则覆盖面明显小于 PE；编译时间戳与版本信息都可由作者改写，不能单独用来判断新旧；能力规则与 YARA 规则集版本不同会给出不同结论，报告里要写明所用规则集。
  principle: 静态研判之所以有效，是因为文件必须留下运行所需的线索：导入表记录程序准备调用哪些系统服务，字符串与配置记录通信目标和持久化位置，节区布局与熵记录代码有没有被压缩或加密，编译与链接过程留下稳定的结构。检测引擎不理解样本意图，它把这些输入面按组合打分：高危导入共现、硬编码地址、可疑节权限、已知壳特征。把每个输入面分别复现，就能定位是哪一层触发了判定；而加壳与混淆会整体替换这些输入，结论只能限定在该形态下成立。
  difficulty: 2
  prerequisites: []
  artifacts:
  - art:pe32
  - art:pe64
  - art:pe-dotnet
  - art:document
  - art:script
  outputs:
  - 样本初判与家族线索
  - 可疑能力清单
  - 加壳与混淆判定
  - 下一步分析建议
  cost: low
  false_positive_risk: medium
  commands:
  - cmd: rabin2 -I {{binary}}
    note: 先确认文件类型、架构与是否 .NET，这一步决定后面用原生 PE 判据还是元数据与 IL 判据。
  - cmd: python3 -c "import pefile; pe=pefile.PE('{{binary}}'); print([(s.Name, round(s.get_entropy(), 2), s.SizeOfRawData, s.Misc_VirtualSize) for s in pe.sections])"
    note: 逐节算熵并对比原始大小与虚拟大小；熵接近 8 且原始数据明显小于虚拟大小，基本可判加壳或加密。
  - cmd: strings -n 6 {{binary}}
    note: 拉明文基线，找 URL、注册表路径、互斥量与命令片段；加壳样本这里通常几乎是空的。
  - cmd: capa -v {{binary}}
    note: 用能力规则把导入与代码特征映射到行为族，看样本在规则视角下具备哪些能力；加壳样本命中会很少。
  procedure:
  - 先用 rabin2 -I 确认文件类型、架构与是否 .NET，把后续判据的适用范围定下来。
  - 用 pefile 脚本逐节算熵、对比原始大小与虚拟大小，先判断是否加壳。
  - 加壳的直接转脱壳流程，未加壳的再用 strings -n 6 拉明文，收集 URL、路径与互斥量。
  - 用 capa -v 跑能力规则，把命中的行为族与明文线索对齐，整理成可疑能力清单。
  - .NET 样本改看元数据与 IL，不要拿原生导入表的结论套上去。
  - 每条结论标注观察条件（是否加壳、所用规则集），没证据的能力写「未观察到」而不是「不存在」。
- id: tech:behavioral-dynamic-analysis
  name: 行为动态分析
  name_en: Behavioral Dynamic Analysis
  domain:
  - dom:malware-analysis
  def: 在隔离环境中运行样本，采集进程、文件、注册表与网络行为以还原真实能力。难点是样本会检测分析环境并延时触发，"没观察到"不能等同于"没有该行为"，结论必须标注观察条件。
  detail: 适用场景是静态看不出能力、或需要拿到真实网络与持久化 IOC 时，在隔离环境里运行样本，观察它实际做了什么；也用于验证静态推断的行为是否真的发生。与静态研判的区别是那边读文件、这边读执行，加密配置只在运行时展开；与商业沙箱的区别是自建环境可以控制系统版本、网络回包与观察时长，适合定向复现。注意点：虚拟化痕迹、分析工具进程、用户名与时区都会让样本改变行为甚至不执行；样本普遍延时触发或等待用户交互，观察窗口要覆盖足够长的静置期；网络必须可记录且能回包，否则样本走不到后续阶段；没观察到只代表这次没触发，结论要写清环境与时长。
  principle: 动态分析有效，是因为代码只有真正执行才会产生行为：解密配置、解析回连地址、落文件、写注册表、注入进程。这些动作在运行时必然经过操作系统的可观测点——文件系统过滤驱动、注册表回调、进程与线程创建通知、网络栈，采集器挂在上述路径上，样本很难在不被记录的情况下完成它们。代价是观测完全依赖执行路径：样本一旦检测到分析环境或等待特定条件就不动作，采集点为空。干净的结果只证明该次运行没有触发，必须换环境与参数重复，才能把推断变成结论。
  difficulty: 3
  prerequisites:
  - tech:malware-static-triage
  artifacts:
  - art:pe32
  - art:pe64
  - art:script
  - art:memory-dump
  - art:pcap
  outputs:
  - 行为时序记录
  - 网络与文件 IOC
  - 持久化与提权手法清单
  - 环境感知判据
  cost: medium
  false_positive_risk: medium
  commands:
  - cmd: procmon /Quiet /Minimized /BackingFile trace.pml
    note: 后台记录文件、注册表、进程与线程事件；结束时用 /Terminate 停抓，避免后续操作混进日志。
  - cmd: tcpdump -i any -s 0 -w {{pcap}}
    note: 全量抓包保留 DNS、HTTP 与自定义协议；样本不走代理时，这是拿到原始请求的唯一位置。
  - cmd: pe-sieve64.exe /pid {{pid}}
    note: 扫运行中的进程，看注入、替换与被改写的模块；这些内容在文件系统日志里看不到。
  - cmd: Get-WinEvent -LogName Microsoft-Windows-Sysmon/Operational | Export-Csv {{out}}
    note: 导出 Sysmon 事件做时间线，与 procmon 的进程树和抓包记录交叉核对。
  procedure:
  - 从干净快照启动隔离虚拟机，把网络切成可记录且能回包的模式，先确认采集器本身工作正常。
  - 同时启动 procmon 与 tcpdump，记下开始时间，再运行样本，让三类记录共用同一条时间基准。
  - 不做任何交互，静置到预设窗口结束；样本常先检查环境与用户活动，过早下结论会漏掉延时行为。
  - 用 pe-sieve64 扫样本进程，补上文件系统与注册表记录不到的注入和内存模块。
  - 用 Sysmon 事件导出时间线，与 procmon 的进程树、tcpdump 的连接逐条对齐，还原行为链。
  - 换一套环境参数重跑一次，两次一致才算稳定行为，不一致先排查环境检测而不是改结论。
  - 还原快照，把行为结论连同环境参数与观察时长一起归档，没触发的项单独标注。
- id: tech:executable-unpacking
  name: 可执行体脱壳
  name_en: Executable Unpacking
  domain:
  - dom:malware-analysis
  def: 还原加壳样本的原始代码与导入表：定位原始入口点后转储内存镜像，修复重定位与导入。难点是自研壳与虚拟化壳没有标准恢复路径，转储物常缺节区信息，需反复校正才能反编译。
  detail: 适用场景是静态看到高熵节、导入项极少、入口落在非常规节，需要还原原始代码与导入表才能反编译、做特征或复用分析结论时使用。与静态研判的区别是那边只判断是否加壳，这边负责把壳拆开；与一般逆向的区别是脱壳只还原形态，不解释逻辑。注意点：自研壳与虚拟化壳没有通用路径，转储出来的映像常缺节区与重定位信息，必须手工校正；转储时机很关键，太早拿到的是壳，太晚原始代码可能已被改写或释放；导入表重建依赖有效的 IAT 与 thunk 数据，缺失时只能按调用点逐个补；32 位与 64 位、不同加载器下的入口与栈形态不同，工具选错会直接失败。
  principle: 脱壳有效，是因为壳只负责启动阶段：它解密或解压原始映像，填入导入，然后把控制权交给原始入口点。此刻内存里已经是一份完整可执行的映像，磁盘文件仍是壳。把内存中的映像按节转储、修正头部与入口、重建导入表，就能得到接近原始产物的文件。定位原始入口点靠壳的固定结构：引导段尾部必有一次跨节跳转，目标是候选入口。难点不在转储而在修复——壳自己的导入会覆盖原始导入，只有等壳填完、程序跑起来之后，IAT 里才是真实的函数地址，导入表要据此反向重建。
  difficulty: 4
  prerequisites:
  - tech:malware-static-triage
  - tech:behavioral-dynamic-analysis
  artifacts:
  - art:pe32
  - art:pe64
  - art:shellcode
  outputs:
  - 可反编译的还原体
  - 修复后的导入表与重定位
  - 壳类型判定与解壳路径记录
  cost: high
  false_positive_risk: medium
  commands:
  - cmd: rabin2 -I {{binary}}
    note: 确认文件类型、架构与整体形态，32 位与 64 位要走不同的调试与转储路径。
  - cmd: objdump -d -M intel {{binary}}
    note: 从入口点往下读引导段，找末尾那次跨节跳转，跳转目标就是候选原始入口。
  - cmd: pe-sieve64.exe /pid {{pid}}
    note: 转储进程里被替换、注入或后来加载的 PE；壳就地解压主映像时，主映像要在调试器里手动转储。
  - cmd: rabin2 -i {{out}}
    note: 检查修复后的转储文件导入表；只剩壳自己的导入或空表，说明 IAT 没重建好。
  procedure:
  - 先用 rabin2 -I 记录文件类型与架构，确认是原生 PE 还是 .NET，再决定调试与转储方式。
  - 用 objdump -d 从入口点读引导段，标出末尾的跨节跳转，作为候选原始入口。
  - 在调试器里让壳跑完引导段、停在候选入口，确认该处是正常函数序言而不是壳的循环。
  - 用 pe-sieve64 转储进程里被替换或注入的 PE；主映像没有命中就在调试器里按节手动转储。
  - 用 Scylla 这类工具按 IAT 重建导入表，同时修正入口点、节区与重定位，缺 thunk 时按调用点补。
  - 用 rabin2 -i 检查转储文件的导入项，再用反编译器加载，确认函数能被正常识别。
  - 若节区熵仍偏高或入口仍指向壳，回到第 2 步重新定位，不要继续在错误转储上修表。
- id: tech:detection-signature-authoring
  name: 检测特征编写
  name_en: Detection Signature Authoring
  domain:
  - dom:malware-analysis
  def: 把分析结论固化成可批量扫描的特征规则（字节串、结构约束、行为组合）。难点是特征取舍：过泛误报成灾，过窄一次版本更新即失效，必须用良性与同族样本做双向回归才敢上线。
  detail: 适用场景是把分析结论固化成可批量扫描的判据，用于样本库回溯、日常检测和同类变种的快速判定；也用于把家族画像落成可执行的规则。与静态研判的区别是那边对单样本下结论，这边要求同一段判断在多个同族样本上成立、且能通过回归；与行为检测的区别是规则看不到运行，只覆盖落盘形态，两者互补。注意点：特征太短或落在公共库代码里，误报会成灾；太长或写死文件偏移，一次重编译就失效；加壳样本必须先脱壳再提特征，否则拿到的是壳的字节；不同引擎对通配与跳转范围的限制不同，同一规则换引擎可能不编译；上线前必须用同族与良性样本双向回归，并记录命中率与误报样本。
  principle: 特征规则有效，是因为代码复用让同一家族的样本共享一段几乎不变的字节：错误提示、配置键、加密表初值、互斥量前缀。这些内容与功能无关，编译器重排和版本迭代都不容易动到，于是成为稳定指纹。扫描引擎把全部规则编译成自动机，一次遍历就能匹配所有模式，成本远低于逐样本分析。但复用同时意味着共享：公共库、通用壳与打包器会让不同家族命中同一条规则。所以规则的强度来自独有且稳定——同一段字节要在同族里普遍存在、在良性集里完全不出现，两端都验证过才成立。
  difficulty: 3
  prerequisites:
  - tech:malware-static-triage
  - tech:executable-unpacking
  artifacts:
  - art:pe32
  - art:pe64
  - art:pe-dotnet
  - art:document
  - art:script
  outputs:
  - 特征规则集
  - 误报与漏报回归结果
  - 规则适用范围与失效条件
  cost: medium
  false_positive_risk: high
  commands:
  - cmd: rabin2 -zz {{sample}}
    note: 抽取全部字符串（含宽字符），找家族独有的错误提示、互斥量前缀与配置键作为候选特征。
  - cmd: strings -t x -n 8 {{sample}}
    note: 带偏移看候选字符串落在哪个节；偏移只用于定位，写规则时尽量用节内相对位置或不带偏移。
  - cmd: yara -s rules/malware.yar {{sample}}
    note: 在同族样本上测试规则，-s 会列出命中的字符串，方便判断是哪个特征在起作用。
  - cmd: yarac rules/malware.yar rules/malware.compiled
    note: 提交前编译一次，暴露语法与正则问题；目标引擎能否加载以实际环境为准。
  procedure:
  - 从已确认同族的样本里提取字符串与字节片段，优先选错误提示、配置键与异常表这类与功能无关的常量。
  - 用 rabin2 -zz 补扫宽字符与非常规编码，避免只按窄字符提特征漏掉一半样本。
  - 用 strings -t x 看候选字符串的偏移与所在节，确认它落在稳定的只读数据里而不是会被重排的位置。
  - 把候选写成带通配与长度约束的规则，通配范围尽量窄，不要用超长跳转盖住无关字节。
  - 用 yara -s 跑同族全部样本，命中不齐就回到第 1 步换特征，不要放宽规则凑命中。
  - 用同一条规则扫良性集与常见壳样本，出现误报就收紧条件或改成结构加行为的组合。
  - 用 yarac 编译确认规则可加载，把适用范围、失效条件与回归结果写进交付说明。
- id: tech:malware-family-attribution
  name: 家族归因与聚类
  name_en: Malware Family Attribution & Clustering
  domain:
  - dom:malware-analysis
  def: 用代码复用、配置结构、基础设施与行为签名把样本聚成家族并追踪演进。难点是"相似不等于同源"——共享代码与租用基础设施在黑产里极常见，结论需要可证伪的证据链而非直觉。
  detail: 适用场景是拿到一批样本后判断它们是否同源、属于哪个已知家族、与历史样本是什么关系；也用于统一命名、补充别名与关联情报。与静态研判的区别是那边描述单个样本的能力，这边回答它们是不是一家人；与检测特征的区别是规则只回答像不像，归因要求证据链能站住并能被证伪；与情报平台的区别是外部标签必须回到本地样本上核实。注意点：共享代码、公共加载器与租用基础设施在黑产里极普遍，相似不等于同源；配置结构、互斥量、PDB 路径与加密常量比回连地址更接近作者习惯；各厂商命名不统一，同一家族常有多个别名；版本演进会让特征漂移，聚类阈值要按时间分层看。
  principle: 归因有效，是因为同一作者或同一代码库的产物会在与功能无关的地方留下稳定痕迹：配置格式与字段顺序、互斥量命名、PDB 路径、加密算法与密钥派生方式、错误提示、编译工具链与节区布局。这些选择没有功能压力，改动成本高，在版本迭代中比回连地址稳定得多。模糊哈希与相似度度量把局部相同变成可比较的分数，使批量聚类可行。但共享组件会把不同家族连在一起，所以证据要分层加权：代码级复用强于基础设施共用，基础设施又强于字符串巧合，反例能同时解释时不能下结论。
  difficulty: 4
  prerequisites:
  - tech:malware-static-triage
  - tech:behavioral-dynamic-analysis
  artifacts:
  - art:pe32
  - art:pe64
  - art:memory-dump
  - art:document
  - art:script
  outputs:
  - 家族聚类结果
  - 同源证据链
  - 版本演进时间线
  - 命名与别名映射建议
  cost: medium
  false_positive_risk: high
  commands:
  - cmd: ssdeep {{sample}}
    note: 算模糊哈希，先和语料库比对找近似样本；相似度只是线索，不能直接当同源结论。
  - cmd: capa -v {{sample}}
    note: 用能力画像做行为层聚类，代码改写但能力集合不变的样本会在这里聚到一起。
  - cmd: strings -n 8 {{sample}}
    note: 挖 PDB 路径、互斥量、配置标记与错误提示，这些比回连地址更稳定。
  - cmd: python3 -c "import pefile; pe=pefile.PE('{{sample}}'); print(hex(pe.OPTIONAL_HEADER.AddressOfEntryPoint), [(s.Name, round(s.get_entropy(), 2)) for s in pe.sections], pe.FILE_HEADER.TimeDateStamp)"
    note: 对比入口、节区布局与编译时间戳，同一代码库的产物在这几项上高度相似；时间戳可被篡改，只作辅助。
  procedure:
  - 先对单个样本做静态研判，拿到能力、配置与字符串基线，不要一上来就聚类。
  - 用 ssdeep 与语料库比对，列出近似样本，把它们当作候选而不是结论。
  - 用 capa 对比候选样本的能力集合，能力差异大的即使哈希相近也要单独判断。
  - 用 strings 挖 PDB 路径、互斥量前缀与配置标记，按作者习惯与基础设施两类分开记录。
  - 用 pefile 对比入口、节区布局与编译时间戳，把差异按时间排成版本演进线。
  - 对每条同源证据找反例：公共库、共用加载器或租用基础设施能不能同样解释这条相似。
  - 证据分层加权后给出归属与置信度，附别名映射，并写清什么新证据能推翻这个结论。
