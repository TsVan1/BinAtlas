# BinAtlas 知识库 · 技术
# 规范：03-DATA-SCHEMA.md §2.2
# 本批为试点：3 领域 × 5 条 = 15 条

- id: tech:firmware-extraction
  name: 固件提取与解包
  name_en: Firmware Extraction & Unpacking
  domain:
  - dom:firmware
  def: 从整包镜像中定位分区与文件系统边界并还原目录树。难点是私有封装头、加密段和无 magic 的定制格式，边界往往只能靠熵分布与交叉引用手工推断；解包失败会让后续分析全部阻塞。
  difficulty: 3
  prerequisites: []
  typical_artifacts:
  - art:firmware-image
  - art:rtos-image
  - art:elf32
  - art:script
  outputs:
  - 分区布局与偏移表
  - 还原的文件系统目录树
  - 启动脚本与配置清单
  - 架构与字节序清单
  cost: low
  false_positive_risk: low
- id: tech:firmware-emulation
  name: 固件仿真
  name_en: Firmware Emulation
  domain:
  - dom:firmware
  def: 在宿主机上模拟固件内的服务进程，使其可被接口测试与模糊测试。难点是外设、NVRAM 与启动脚本依赖缺失，需逐个补齐桩函数或转发系统调用，才能让目标服务真正起来。
  difficulty: 4
  prerequisites:
  - tech:firmware-extraction
  typical_artifacts:
  - art:firmware-image
  - art:elf32
  - art:elf64
  - art:so
  outputs:
  - 可交互的仿真服务实例
  - 缺失依赖与桩函数清单
  - 可复现的启动配置
  - 仿真保真度评估
  cost: high
  false_positive_risk: medium
- id: tech:uefi-firmware-analysis
  name: UEFI 固件分析
  name_en: UEFI Firmware Analysis
  domain:
  - dom:firmware
  def: 解析主板固件的固件卷与文件结构，取出各引导阶段的驱动与 NVRAM 变量并审其安全配置。难点是厂商私有模块与签名链耦合，改一处就可能触发启动校验失败，验证成本高。
  difficulty: 4
  prerequisites:
  - tech:firmware-extraction
  typical_artifacts:
  - art:uefi-bios
  - art:firmware-image
  outputs:
  - 固件卷与模块清单
  - 引导链各阶段组件
  - 安全启动与写保护配置结论
  - 可疑持久化模块
  cost: medium
  false_positive_risk: low
- id: tech:hardcoded-credential-mining
  name: 硬编码凭据挖掘
  name_en: Hardcoded Credential Mining
  domain:
  - dom:firmware
  def: 在解包后的文件系统中批量找私钥、口令、令牌与默认账户，并判定其可达性。难点是误报极高：示例配置、占位符与公钥的形态和真凭据相似，且"存在"不等于"可被远程使用"。
  difficulty: 2
  prerequisites:
  - tech:firmware-extraction
  typical_artifacts:
  - art:firmware-image
  - art:script
  - art:elf32
  outputs:
  - 凭据候选清单
  - 逐个候选的可达性判定
  - 触发路径与影响面说明
  cost: low
  false_positive_risk: high
- id: tech:firmware-diffing
  name: 固件版本差分
  name_en: Firmware Differential Analysis
  domain:
  - dom:firmware
  def: 对比同一产品相邻版本固件，把补丁改动反向定位到漏洞点。难点是编译差异、地址漂移与函数重排会淹没真实语义变化，须先做函数级匹配，再判断哪处差异才是安全修复。
  difficulty: 3
  prerequisites:
  - tech:firmware-extraction
  typical_artifacts:
  - art:firmware-image
  - art:rtos-image
  - art:elf32
  outputs:
  - 函数级匹配结果
  - 变更函数清单
  - 疑似被修漏洞点与语义对比
  - 未修复的同源函数清单
  cost: medium
  false_positive_risk: medium
- id: tech:mobile-app-static-analysis
  name: 移动应用静态分析
  name_en: Mobile App Static Analysis
  domain:
  - dom:mobile
  def: 在不运行应用的前提下还原逻辑：清单与权限、字节码控制流、原生库与第三方 SDK。难点是商业混淆把标识符与控制流打散，调用图只能靠契约检查和反射调用点手工重建。
  difficulty: 3
  prerequisites: []
  typical_artifacts:
  - art:apk
  - art:dex
  - art:ipa
  - art:mach-o
  - art:so
  - art:jar
  outputs:
  - 权限与组件清单
  - 可疑 API 调用点
  - 第三方 SDK 与域名清单
  - 混淆点与待动态验证项
  cost: medium
  false_positive_risk: medium
- id: tech:mobile-runtime-instrumentation
  name: 移动端运行时插桩
  name_en: Mobile Runtime Instrumentation
  domain:
  - dom:mobile
  def: 在应用进程内挂接方法调用，读写入参、返回值与内存，观察静态看不到的真实分支与数据流。难点是各系统版本的运行时结构频繁变化，且加固应用会针对注入痕迹主动检测并退出。
  difficulty: 4
  prerequisites:
  - tech:mobile-app-static-analysis
  typical_artifacts:
  - art:apk
  - art:dex
  - art:so
  - art:ipa
  outputs:
  - 真实调用参数与返回值
  - 解密后的明文字节码
  - 关键判断分支及其绕过点
  - 反注入检测点清单
  cost: medium
  false_positive_risk: low
- id: tech:mobile-app-unpacking
  name: 移动应用加固脱壳
  name_en: Mobile App Unpacking
  domain:
  - dom:mobile
  def: 还原加固方案保护的真实字节码与原生库：定位自解密点，或从内存抽取已解密段。难点是多段加密与反注入使转储产物结构残缺，须手工修复方法表与重定位后才能反编译。
  difficulty: 4
  prerequisites:
  - tech:mobile-runtime-instrumentation
  typical_artifacts:
  - art:apk
  - art:dex
  - art:so
  outputs:
  - 结构修复后的完整字节码
  - 解密后的原生库
  - 加固方案判定与解壳路径记录
  cost: high
  false_positive_risk: medium
- id: tech:network-traffic-interception
  name: 移动流量拦截
  name_en: Mobile Traffic Interception
  domain:
  - dom:mobile
  def: 通过代理与信任链改造截获应用 HTTP(S) 流量，还原接口、参数与协议结构。难点是证书固定与双向认证会让连接直接失败，且私有二进制协议没有字段边界，只能靠样本差异推断。
  difficulty: 3
  prerequisites: []
  typical_artifacts:
  - art:apk
  - art:pcap
  outputs:
  - 接口与参数清单
  - 请求响应样本
  - 私有协议字段推断草稿
  - 固定/双向认证的绕过记录
  cost: low
  false_positive_risk: low
  note: 抓包本身无硬前置；仅当目标启用证书固定或双向认证时，才需要配合 tech:mobile-runtime-instrumentation 绕过。与 dom:network-protocol
    的协议逆向边界待划清。
- id: tech:android-component-surface-audit
  name: Android 组件暴露面审计
  name_en: Android Component Surface Audit
  domain:
  - dom:mobile
  def: 枚举导出组件与 intent 处理路径，构造跨应用调用以验证越权、重定向与 PendingIntent 劫持。难点是静态可见的导出声明与实际生效的权限保护常不一致，每条调用链都要实机验证。
  difficulty: 3
  prerequisites:
  - tech:mobile-app-static-analysis
  typical_artifacts:
  - art:apk
  - art:dex
  outputs:
  - 导出组件与保护级别清单
  - 可复现的调用链 PoC
  - 越权影响面判定
  - 无效声明清单
  cost: medium
  false_positive_risk: medium
- id: tech:malware-static-triage
  name: 样本静态研判
  name_en: Static Malware Triage
  domain:
  - dom:malware-analysis
  def: 不运行样本，用结构、导入函数、字符串、熵与规则匹配给出初判与家族线索。难点是加壳混淆后静态信号几乎归零，必须判断哪些字段仍可信——最常见错误是把壳的特征当成样本能力。
  difficulty: 2
  prerequisites: []
  typical_artifacts:
  - art:pe32
  - art:pe64
  - art:pe-dotnet
  - art:document
  - art:script
  outputs:
  - 样本初判与家族线索
  - 可疑能力清单
  - 加壳与混淆判定
  - 下一步分析建议
  cost: low
  false_positive_risk: medium
- id: tech:behavioral-dynamic-analysis
  name: 行为动态分析
  name_en: Behavioral Dynamic Analysis
  domain:
  - dom:malware-analysis
  def: 在隔离环境中运行样本，采集进程、文件、注册表与网络行为以还原真实能力。难点是样本会检测分析环境并延时触发，"没观察到"不能等同于"没有该行为"，结论必须标注观察条件。
  difficulty: 3
  prerequisites:
  - tech:malware-static-triage
  typical_artifacts:
  - art:pe32
  - art:pe64
  - art:script
  - art:memory-dump
  - art:pcap
  outputs:
  - 行为时序记录
  - 网络与文件 IOC
  - 持久化与提权手法清单
  - 环境感知判据
  cost: medium
  false_positive_risk: medium
- id: tech:executable-unpacking
  name: 可执行体脱壳
  name_en: Executable Unpacking
  domain:
  - dom:malware-analysis
  def: 还原加壳样本的原始代码与导入表：定位原始入口点后转储内存镜像，修复重定位与导入。难点是自研壳与虚拟化壳没有标准恢复路径，转储物常缺节区信息，需反复校正才能反编译。
  difficulty: 4
  prerequisites:
  - tech:malware-static-triage
  - tech:behavioral-dynamic-analysis
  typical_artifacts:
  - art:pe32
  - art:pe64
  - art:shellcode
  outputs:
  - 可反编译的还原体
  - 修复后的导入表与重定位
  - 壳类型判定与解壳路径记录
  cost: high
  false_positive_risk: medium
- id: tech:detection-signature-authoring
  name: 检测特征编写
  name_en: Detection Signature Authoring
  domain:
  - dom:malware-analysis
  def: 把分析结论固化成可批量扫描的特征规则（字节串、结构约束、行为组合）。难点是特征取舍：过泛误报成灾，过窄一次版本更新即失效，必须用良性与同族样本做双向回归才敢上线。
  difficulty: 3
  prerequisites:
  - tech:malware-static-triage
  - tech:executable-unpacking
  typical_artifacts:
  - art:pe32
  - art:pe64
  - art:pe-dotnet
  - art:document
  - art:script
  outputs:
  - 特征规则集
  - 误报与漏报回归结果
  - 规则适用范围与失效条件
  cost: medium
  false_positive_risk: high
- id: tech:malware-family-attribution
  name: 家族归因与聚类
  name_en: Malware Family Attribution & Clustering
  domain:
  - dom:malware-analysis
  def: 用代码复用、配置结构、基础设施与行为签名把样本聚成家族并追踪演进。难点是"相似不等于同源"——共享代码与租用基础设施在黑产里极常见，结论需要可证伪的证据链而非直觉。
  difficulty: 4
  prerequisites:
  - tech:malware-static-triage
  - tech:behavioral-dynamic-analysis
  typical_artifacts:
  - art:pe32
  - art:pe64
  - art:memory-dump
  - art:document
  - art:script
  outputs:
  - 家族聚类结果
  - 同源证据链
  - 版本演进时间线
  - 命名与别名映射建议
  cost: medium
  false_positive_risk: high
